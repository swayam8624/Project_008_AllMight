   <g id="text_14">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(551.561178 136.650185)">Sequence: 10¹⁶, then 10,000 ones, then −10¹⁶</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(551.561178 152.252724)"/>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(551.561178 167.856279)">Binary64 arithmetic; evaluation order is fixed.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(551.561178 183.458818)"/>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(551.561178 199.062372)">Compensation helps, but does not promise exactness:</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(551.561178 214.665927)">Kahan([10¹⁶, 1, −10¹⁶]) = 0</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(551.561178 230.269482)">Neumaier gives 1 for this counterexample.</text>
   </g>
  </g>
