   <g id="text_16">
    <text style="font-size: 13.2px; font-family: 'DejaVu Sans'; text-anchor: middle" x="280.600843" y="36.031986" transform="rotate(-0 280.600843 36.031986)">Equirectangular rows are not equal-area</text>
