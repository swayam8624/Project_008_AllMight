   <text style="font-weight: 700; font-size: 17px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #18354c" x="504" y="15.917584" transform="rotate(-0 504 15.917584)">Image coordinates need a sampling-measure conversion</text>
  </g>
