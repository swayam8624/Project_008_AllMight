  <g id="axes_2">
   <g id="text_17">
    <text style="font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2463a6" x="538.311401" y="80.007023" transform="rotate(-0 538.311401 80.007023)">A pixel footprint also carries a measure</text>
   </g>
   <g id="text_18">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(538.311401 141.819644)">On a sphere: dω = cos(latitude) dλ dφ.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(538.311401 157.422183)"/>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(538.311401 173.025738)">Equal image area is not equal solid angle.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(538.311401 188.628277)"/>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(538.311401 204.231832)">For normalized ray direction d(x,y):</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(538.311401 219.892261)">dω ≈ |∂d/∂x × ∂d/∂y| dx dy.</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(538.311401 235.4948)"/>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(538.311401 251.098355)">Use a local differential only where the camera</text>
    <text style="font-size: 13px; font-family: 'DejaVu Sans'" transform="translate(538.311401 266.70191)">map is smooth; seams and invalid rays need care.</text>
   </g>
  </g>
