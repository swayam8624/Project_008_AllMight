name: Apply Phase 18 Bible narrative repair

on:
  push:
    branches:
      - allmight/closure-and-narrative-20261112
    paths:
      - "tools/patches/phase18_coupled_contact_fragment.md"
      - "tools/patches/apply_phase18_bible_patch.py"
      - "tools/labs/two_point_contact_block_lab.cpp"
      - ".github/workflows/bible-phase18-canonical-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-canonical-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: allmight/closure-and-narrative-20261112
          fetch-depth: 0

      - name: Apply deterministic canonical patch
        run: python3 tools/patches/apply_phase18_bible_patch.py

      - name: Compile and run the two-point contact witness
        run: |
          c++ -std=c++20 -O2 -Wall -Wextra -Wpedantic -Werror \
            tools/labs/two_point_contact_block_lab.cpp -o /tmp/two_point_contact
          /tmp/two_point_contact

      - name: Verify the exact inline witness and Markdown contracts
        run: python3 tools/check_continuous_code_sync.py

      - name: Commit canonical narrative update
        shell: bash
        run: |
          set -Eeuo pipefail
          if git diff --quiet; then
            echo "Canonical Phase-18 patch already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            "Continuous Notes/Game Engine - From First Frame to Living Worlds.md" \
            tools/check_continuous_code_sync.py
          git commit -m "Apply Phase 18 Bible reconstruction to canonical Engine volume"
          git push origin HEAD:allmight/closure-and-narrative-20261112
