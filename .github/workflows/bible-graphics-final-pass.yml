name: Bible graphics final pass

# Validate the committed reading surface. Authoring patches never publish from CI.
on:
  push:
    branches: [main, allmight/closure-and-narrative-20261112]
    paths:
      - 'Continuous Notes/**'
      - 'tools/labs/**'
      - 'tools/patches/**'
      - 'tools/note_integrity.py'
      - 'tools/check_continuous_code_sync.py'
      - 'tools/check_patch_idempotence.py'
      - '.github/workflows/bible-graphics-final-pass.yml'
  pull_request:
    paths:
      - 'Continuous Notes/**'
      - 'tools/labs/**'
      - 'tools/patches/**'
      - 'tools/note_integrity.py'
      - 'tools/check_continuous_code_sync.py'
      - 'tools/check_patch_idempotence.py'
      - '.github/workflows/bible-graphics-final-pass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-committed-teaching:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete code and comments inside the books
        run: python3 tools/check_continuous_code_sync.py
      - name: Check authoring patches without modifying the checkout
        run: python3 tools/check_patch_idempotence.py
      - name: Install numerical test dependency
        run: python3 -m pip install --disable-pip-version-check numpy
      - name: Execute XR and neural-rendering witnesses
        run: |
          python3 tools/labs/xr_planar_vio_ekf_lab.py
          python3 tools/labs/xr_3d_imu_preintegration_lab.py
          python3 tools/labs/nerf_volume_rendering_lab.py
