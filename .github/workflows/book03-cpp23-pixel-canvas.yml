name: Book 03 - C++23 Pixel, Coordinate Frame and SVG Contracts

on:
  push:
    branches:
      - curriculum/book03-geometry-images-pass01
    paths:
      - "Code Parts/tools/labs/book03_cpp23/**"
      - ".github/workflows/book03-cpp23-pixel-canvas.yml"
  pull_request:
    paths:
      - "Code Parts/tools/labs/book03_cpp23/**"
      - ".github/workflows/book03-cpp23-pixel-canvas.yml"
  workflow_dispatch:

jobs:
  native-cpp23:
    name: C++23 image and frame tests (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check narrative, directory and figure source contracts
        run: python3 "Code Parts/tools/labs/book03_cpp23/editorial_gate.py"
      - name: Configure pure C++23 laboratory
        run: |
          cmake -S "Code Parts/tools/labs/book03_cpp23" -B build/book03-p01 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23
      - name: Compile with strict warnings
        run: cmake --build build/book03-p01 --parallel 2
      - name: Execute independent pixel, frame and image-space contracts
        run: ctest --test-dir build/book03-p01 --output-on-failure
      - name: Generate both image demonstrations
        run: |
          build/book03-p01/book03_canvas house build/book03-p01/house.ppm
          build/book03-p01/book03_canvas lines build/book03-p01/lines.ppm
      - name: Generate and inspect native C++23 coordinate-frame drawings
        run: |
          build/book03-p01/book03_frames inspect
          build/book03-p01/book03_frames svg build/book03-p01/world-frame.svg
          build/book03-p01/book03_frames svg build/book03-p01/rotated-frame.svg 2 1 90
          printf 'origin 2 1\nangle 90\npoint 3 1\nquit\n' | build/book03-p01/book03_frames repl > build/book03-p01/repl-evidence.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns = "{http://www.w3.org/2000/svg}"
          for name in ("world-frame.svg", "rotated-frame.svg"):
              path = Path("build/book03-p01") / name
              root = ET.parse(path).getroot()
              assert root.tag == ns + "svg"
              assert root.find(ns + "title") is not None
              assert root.find(ns + "desc") is not None
              assert len(root.findall(ns + "polygon")) == 1
              print(f"{name}: valid SVG geometry document")
          repl = Path("build/book03-p01/repl-evidence.txt").read_text()
          assert "Local (3,1) m -> world (1,4) m" in repl, repl
          PY
      - name: Confirm P6 header and exact payload sizes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          header = b"P6\n320 200\n255\n"
          expected = len(header) + 320 * 200 * 3
          for name in ("house", "lines"):
              data = Path(f"build/book03-p01/{name}.ppm").read_bytes()
              assert data.startswith(header), f"{name}: invalid P6 header"
              assert len(data) == expected, f"{name}: unexpected length"
              print(f"{name}: {len(data)} bytes, valid P6 shape")
          PY
