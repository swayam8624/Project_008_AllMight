          build/book03-p01/book03_camera svg build/book03-p01/camera.svg
          build/book03-p01/book03_camera csv build/book03-p01/camera.csv
          printf 'focal 800 800\ncsv build/book03-p01/camera-zoom.csv\nreset\nmove 0 0 2\ncsv build/book03-p01/camera-moved.csv\nreset\nray 319 239\nquit\n' | build/book03-p01/book03_camera repl > build/book03-p01/camera-repl.txt
          python3 - <<'PY'
          import csv
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base=Path("build/book03-p01")
          def read(name):
              with (base/name).open(newline="") as f:
                  return {row["name"]: row for row in csv.DictReader(f)}
          nominal=read("camera.csv")
          zoom=read("camera-zoom.csv")
          moved=read("camera-moved.csv")
          assert len(nominal)==len(zoom)==len(moved)==7
          for name,row in nominal.items():
              x,y,z=(float(row[k]) for k in ("X_world","Y_world","Z_world"))
              for data,depth,f in ((nominal,-z,400),(zoom,-z,800),(moved,2-z,400)):
                  p=data[name]
                  assert abs(float(p["axial_depth"])-depth)<1e-10
                  u,v=320+f*x/depth,240-f*y/depth
                  assert abs(float(p["u"])-u)<1e-10
                  assert abs(float(p["v"])-v)<1e-10
                  assert int(p["inside"])==int(0<=u<640 and 0<=v<480)
                  direction=(x,y,-depth)
                  length=math.sqrt(sum(q*q for q in direction))
                  for k,q in zip(("ray_x","ray_y","ray_z"),direction):
                      assert abs(float(p[k])-q/length)<1e-10
          assert abs(float(nominal["roof"]["v"])-32)<1e-10
          assert abs(float(nominal["base-left"]["u"])-240)<1e-10
          assert "ray " in (base/"camera-repl.txt").read_text()
          root=ET.parse(base/"camera.svg").getroot()
          ns="{http://www.w3.org/2000/svg}"
          assert root.find(ns+"title") is not None
          assert root.find(ns+"desc") is not None
          assert len(root.findall(ns+"circle"))==7
          print("P13: calibrated projections, zoom versus camera motion, rays and actual SVG samples verified")
          PY
      - name: Verify P14 homogeneous projection and controlled depth storage study
        run: |
          build/book03-p01/book03_projection inspect > build/book03-p01/projection-report.txt
          build/book03-p01/book03_projection csv build/book03-p01/depth-storage.csv
          build/book03-p01/book03_projection svg build/book03-p01/depth-curves.svg
          printf 'reverse\ninspect\npoint 0 0 -0.5\ninspect\ndepth 0.1 0\northo\nquit\n' | build/book03-p01/book03_projection repl > build/book03-p01/projection-repl.txt
          python3 - <<'PY'
          import csv
          import math
          import struct
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base=Path("build/book03-p01")
          report=(base/"projection-report.txt").read_text()
          def check_screen(report, expected):
              line=next(line for line in report.splitlines() if line.startswith("screen "))
              xy,depth=line.removeprefix("screen ").split(" depth=")
              values=[*map(float,xy.split(",")),float(depth)]
              assert all(abs(a-b)<1e-10 for a,b in zip(values,expected))
          check_screen(report,(420,140,0.84375))
          repl=(base/"projection-repl.txt").read_text()
          check_screen(repl,(420,140,0.15625))
          assert "Rejected by clip membership" in repl
          assert "orthographic needs finite far" in repl
          with (base/"depth-storage.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==964
          for row in rows:
              d=float(row["axial"])
              reverse=row["order"]=="reverse"
              q=0.1/d if reverse else 1-0.1/d
              stored=(struct.unpack("f",struct.pack("f",q))[0]
                  if row["storage"]=="float32"
                  else math.floor(q*16777215+0.5)/16777215)
              assert abs(float(row["stored"])-stored)<1e-14
              if stored==(0 if reverse else 1):
                  assert row["status"]=="infinity"
              else:
                  recovered=0.1/stored if reverse else 0.1/(1-stored)
                  assert row["status"]=="finite"
                  assert math.isclose(float(row["reconstructed"]),recovered,rel_tol=1e-12)
          last={(r["order"],r["storage"]):float(r["abs_error"]) for r in rows[-4:]}
          assert last["forward","float32"]>1000
          assert last["reverse","float32"]<0.01
          root=ET.parse(base/"depth-curves.svg").getroot()
          ns="{http://www.w3.org/2000/svg}"
          assert root.find(ns+"title") is not None
          assert len(root.findall(ns+"polyline"))==2
          print("P14: analytic clip trace, depth orders, storage quantization and inverse-depth witnesses")
          PY
      - name: Verify P15 stereo disparity, reconstruction and uncertainty
        run: |
          build/book03-p01/book03_stereo inspect > build/book03-p01/stereo-report.txt
          build/book03-p01/book03_stereo csv build/book03-p01/stereo-depth.csv
          build/book03-p01/book03_stereo svg build/book03-p01/stereo.svg
          printf 'noise -20\ninspect\nnoise 0\nbaseline 0.05\ninspect\ncsv build/book03-p01/stereo-small-baseline.csv\nquit\n' | build/book03-p01/book03_stereo repl > build/book03-p01/stereo-repl.txt
          python3 - <<'PY'
          import csv
          import math
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base=Path("build/book03-p01")
          def estimates(report):
              return [tuple(map(float,line.split(" gap=")[0].removeprefix("estimate ").split(",")))
                      for line in report.splitlines() if line.startswith("estimate ")]
          def close(a,b):
              assert len(a)==len(b)
              assert all(math.isclose(x,y,rel_tol=1e-9,abs_tol=1e-9) for x,y in zip(a,b))
          close(estimates((base/"stereo-report.txt").read_text())[0],(1,1,-4))
          false,nominal=estimates((base/"stereo-repl.txt").read_text())
          close(false,(0.5,0.5,-2))
          close(nominal,(1,1,-4))
          for file,baseline in (("stereo-depth.csv",0.2),("stereo-small-baseline.csv",0.05)):
              with (base/file).open(newline="") as f:
                  rows=list(csv.DictReader(f))
              assert len(rows)==101
              for i,r in enumerate(rows):
                  z=1+0.19*i
                  delta=400*baseline/z
                  close(tuple(float(r[k]) for k in ("depth","disparity","sigma_depth","low_depth","high_depth")),
                        (z,delta,z*z*0.25/(400*baseline),400*baseline/(delta+0.25),400*baseline/(delta-0.25)))
          ns="{http://www.w3.org/2000/svg}"
          root=ET.parse(base/"stereo.svg").getroot()
          assert root.find(ns+"title") is not None
          assert len(root.findall(ns+"circle"))==10
          assert len(root.findall(ns+"line"))==12
          print("P15: exact and false-match reconstruction, baseline change, uncertainty and stereo export contracts")
          PY
