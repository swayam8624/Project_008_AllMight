name: Book 03 - C++23 Geometry, Procedural and Asset Trust Contracts

on:
  push:
    branches:
      - curriculum/book03-geometry-images-pass01
    paths:
      - "Code Parts/tools/labs/book03_cpp23/**"
      - "Notes/Book Production/Seven-Book Curriculum/Book03/**"
      - ".github/workflows/book03-cpp23-pixel-canvas.yml"
  pull_request:
    paths:
      - "Code Parts/tools/labs/book03_cpp23/**"
      - "Notes/Book Production/Seven-Book Curriculum/Book03/**"
      - ".github/workflows/book03-cpp23-pixel-canvas.yml"
  workflow_dispatch:

jobs:
  native-cpp23:
    name: C++23 fifteen cumulative geometry laboratories (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check narrative, directory and figure source contracts
        run: python3 "Code Parts/tools/labs/book03_cpp23/editorial_gate.py"
      - name: Configure pure C++23 laboratory
        run: |
          cmake -S "Code Parts/tools/labs/book03_cpp23" -B build/book03-p01 -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_STANDARD=23
      - name: Compile with strict warnings
        run: cmake --build build/book03-p01 --parallel 2
      - name: Execute sixteen CTests across fifteen C++23 geometry laboratories
        run: ctest --test-dir build/book03-p01 --output-on-failure
      - name: Generate both image demonstrations
        run: |
          build/book03-p01/book03_canvas house build/book03-p01/house.ppm
          build/book03-p01/book03_canvas lines build/book03-p01/lines.ppm
      - name: Generate and inspect native C++23 coordinate-frame drawings
        run: |
          build/book03-p01/book03_frames inspect
          build/book03-p01/book03_frames svg build/book03-p01/world-frame.svg
          build/book03-p01/book03_frames svg build/book03-p01/rotated-frame.svg 2 1 90
          printf 'origin 2 1\nangle 90\npoint 3 1\nquit\n' | build/book03-p01/book03_frames repl > build/book03-p01/repl-evidence.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          ns = "{http://www.w3.org/2000/svg}"
          for name in ("world-frame.svg", "rotated-frame.svg"):
              path = Path("build/book03-p01") / name
              root = ET.parse(path).getroot()
              assert root.tag == ns + "svg"
              assert root.find(ns + "title") is not None
              assert root.find(ns + "desc") is not None
              assert len(root.findall(ns + "polygon")) == 1
              print(f"{name}: valid SVG geometry document")
          repl = Path("build/book03-p01/repl-evidence.txt").read_text()
          assert "Local (3,1) m -> world (1,4) m" in repl, repl
          PY
      - name: Generate a barycentric PPM and inspect triangle SVG
        run: |
          build/book03-p01/book03_triangles inspect > build/book03-p01/triangle-inspect.txt
          build/book03-p01/book03_triangles ppm build/book03-p01/triangle-gradient.ppm
          build/book03-p01/book03_triangles svg build/book03-p01/triangle.svg
          printf 'area\npoint 1.5 1\nsave build/book03-p01/current-triangle.svg\npoint 5 3\nquit\n' | build/book03-p01/book03_triangles repl > build/book03-p01/triangle-repl.txt
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          p = Path("build/book03-p01")
          header = b"P6\n640 420\n255\n"
          raw = (p / "triangle-gradient.ppm").read_bytes()
          assert raw.startswith(header)
          assert len(raw) == len(header) + 640 * 420 * 3
          root = ET.parse(p / "triangle.svg").getroot()
          ns = "{http://www.w3.org/2000/svg}"
          assert root.tag == ns + "svg"
          assert root.find(ns + "title") is not None
          assert root.find(ns + "desc") is not None
          assert len(root.findall(ns + "polygon")) == 1
          current = ET.parse(p / "current-triangle.svg").getroot()
          assert current.tag == ns + "svg"
          assert current.find(ns + "title") is not None
          assert current.find(ns + "desc") is not None
          assert len(current.findall(ns + "polygon")) == 1
          evidence = (p / "triangle-inspect.txt").read_text()
          assert "Signed twice-area = 24.000000000000" in evidence
          assert "0.500000000000,0.250000000000,0.250000000000" in evidence
          assert "interior" in evidence
          transcript = (p / "triangle-repl.txt").read_text()
          assert "exterior" in transcript and "interior" in transcript
          print("Triangle PPM dimensions, SVG structure, numeric and REPL contracts: passed")
          PY
      - name: Verify affine transform geometry and generated teaching plates
        run: |
          build/book03-p01/book03_transforms inspect > build/book03-p01/affine-inspect.txt
          build/book03-p01/book03_transforms svg build/book03-p01/transformed-house.svg
          build/book03-p01/book03_transforms ppm build/book03-p01/transformed-house.ppm
          build/book03-p01/book03_transforms order build/book03-p01/transform-order.svg > build/book03-p01/transform-order.txt
          printf 'rotate 90\ntranslate 2 0\npoint 1 0\nsvg build/book03-p01/repl-affine.svg\nquit\n' | build/book03-p01/book03_transforms repl > build/book03-p01/affine-repl.txt
          python3 - <<'PY'
          import math
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base = Path("build/book03-p01")
          nsv = "{http://www.w3.org/2000/svg}"
          for name in ("transformed-house.svg", "transform-order.svg", "repl-affine.svg"):
              root = ET.parse(base / name).getroot()
              assert root.tag == nsv + "svg"
              assert root.find(nsv + "title") is not None
              assert root.find(nsv + "desc") is not None
              assert len(root.findall(nsv + "polygon")) >= (2 if name != "transform-order.svg" else 0)
          payload = (base / "transformed-house.ppm").read_bytes()
          header = b"P6\n840 580\n255\n"
          assert payload.startswith(header)
          assert len(payload) == len(header) + 840 * 580 * 3
          assert len(set(payload[len(header):])) >= 3
          inspect = (base / "affine-inspect.txt").read_text()
          assert "determinant=" in inspect and "inverse round-trip" in inspect
          text = (base / "affine-repl.txt").read_text()
          m = re.search(r"Local \(1\.00000000,0\.00000000\) -> world \(([-+\d.]+),([-+\d.]+)\)", text)
          assert m, text
          assert math.isclose(float(m.group(1)),2.0,abs_tol=1e-7)
          assert math.isclose(float(m.group(2)),1.0,abs_tol=1e-7)
          print("Affine P04 REPL, PPM, SVG and numeric contracts inspected")
          PY
      - name: Verify exact binary64 predicate report and honest diagnosis
        run: |
          build/book03-p01/book03_precision inspect > build/book03-p01/predicate-inspect.txt
          build/book03-p01/book03_precision csv build/book03-p01/predicate-cases.csv
          build/book03-p01/book03_precision svg build/book03-p01/predicate-cases.svg
          build/book03-p01/book03_precision point 0 0 10000000000000000 10000000000000002 10000000000000002 10000000000000004 > build/book03-p01/predicate-point.txt
          printf 'triangle 0 0 10000000000000000 10000000000000002 10000000000000002 10000000000000004\ninspect\nsvg build/book03-p01/predicate-repl.svg\nquit\n' | build/book03-p01/book03_precision repl > build/book03-p01/predicate-repl.txt
          python3 - <<'PY'
          import csv
          import math
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root = Path("build/book03-p01")
          with (root / "predicate-cases.csv").open(newline="", encoding="utf-8") as f:
              rows = {r["case"]: r for r in csv.DictReader(f)}
          assert len(rows) == 6
          cancellation = rows["Product cancellation"]
          assert cancellation["exact_sign"] == "-1"
          assert float(cancellation["naive_determinant"]) == 0.0
          assert cancellation["exact_path"] == "binary64-dyadic"
          underflow = rows["Subnormal underflow"]
          assert underflow["exact_sign"] == "1"
          assert float(underflow["naive_determinant"]) == 0.0
          assert rows["Product overflow"]["exact_sign"] == "1"
          assert not math.isfinite(float(rows["Product overflow"]["naive_determinant"]))
          assert rows["Input rounding"]["exact_sign"] == "0"
          assert rows["Simple reference"]["exact_path"] == "bounded-integer"
          ns = "{http://www.w3.org/2000/svg}"
          for name in ("predicate-cases.svg", "predicate-repl.svg"):
              svg = ET.parse(root / name).getroot()
              assert svg.tag == ns + "svg"
              assert svg.find(ns + "title") is not None
              assert svg.find(ns + "desc") is not None
          for name in ("predicate-point.txt", "predicate-repl.txt"):
              data = (root / name).read_text()
              assert "negative (-1)" in data and "Naive binary64 determinant = 0" in data
          print("P05: exact sign, lost naive sign, underflow, overflow, CSV and SVG verified")
          PY
      - name: Check 3D spatial ray-plane, sphere and SVG / CSV contracts
        run: |
          build/book03-p01/book03_space inspect > build/book03-p01/spatial-inspect.txt
          build/book03-p01/book03_space svg build/book03-p01/space-3d.svg
          build/book03-p01/book03_space csv build/book03-p01/space-hits.csv
          printf 'ray 1 3 2 0 -1 0\ninspect\nsvg build/book03-p01/space-custom.svg\nquit\n' | build/book03-p01/book03_space repl > build/book03-p01/spatial-repl.txt
          python3 - <<'PY'
          import csv
          import math
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base = Path("build/book03-p01")
          ns = "{http://www.w3.org/2000/svg}"
          for name in ("space-3d.svg", "space-custom.svg"):
              root = ET.parse(base / name).getroot()
              assert root.tag == ns + "svg"
              assert root.find(ns + "title") is not None
              assert root.find(ns + "desc") is not None
              assert len(root.findall(ns + "line")) >= 15
              assert len(root.findall(ns + "circle")) >= 3
          with (base / "space-hits.csv").open(newline="", encoding="utf-8") as file:
              rows = {row["primitive"]: row for row in csv.DictReader(file)}
          assert set(rows) == {"ground", "sphere"}
          assert rows["ground"]["status"] == "forward-hit"
          assert rows["ground"]["has_hit"] == "1"
          assert math.isclose(float(rows["ground"]["metres"]), 4.0, abs_tol=1e-12)
          assert math.isclose(float(rows["ground"]["y"]), 0.0, abs_tol=1e-12)
          assert rows["sphere"]["status"] == "miss"
          assert rows["sphere"]["has_hit"] == "0"
          default = (base / "spatial-inspect.txt").read_text()
          assert "Ground Y=0: forward-hit" in default
          assert "Front roof-panel normal" in default
          custom = (base / "spatial-repl.txt").read_text()
          assert "Ground Y=0: forward-hit" in custom
          assert "t = 3.000000000 metres" in custom
          assert "hit = (1.000000000,0.000000000,2.000000000)" in custom
          print("P06: signed geometry, 3D source visualization and ray CSV contracts verified")
          PY
      - name: Verify indexed mesh manifold and source-generated artifacts
        run: |
          build/book03-p01/book03_mesh inspect house > build/book03-p01/mesh-house.txt
          build/book03-p01/book03_mesh inspect seam > build/book03-p01/mesh-seam.txt
          build/book03-p01/book03_mesh inspect bowtie > build/book03-p01/mesh-bowtie.txt
          build/book03-p01/book03_mesh inspect nonmanifold > build/book03-p01/mesh-nonmanifold.txt
          build/book03-p01/book03_mesh csv build/book03-p01/mesh-house.csv house
          build/book03-p01/book03_mesh svg build/book03-p01/mesh-house.svg house
          printf 'fixture seam\ninspect\nsvg build/book03-p01/mesh-seam.svg\ncsv build/book03-p01/mesh-seam.csv\nquit\n' | build/book03-p01/book03_mesh repl > build/book03-p01/mesh-repl.txt
          python3 - <<'PY'
          import csv
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base = Path("build/book03-p01")
          ns = "{http://www.w3.org/2000/svg}"
          for name in ("mesh-house.svg", "mesh-seam.svg"):
              root = ET.parse(base/name).getroot()
              assert root.tag == ns+"svg"
              assert root.find(ns+"title") is not None
              assert root.find(ns+"desc") is not None
              assert len(root.findall(ns+"polygon")) >= 2
              assert len(root.findall(ns+"line")) >= 6
          with (base/"mesh-house.csv").open(newline="",encoding="utf-8") as f:
              edges=list(csv.DictReader(f))
          assert len(edges)==24
          assert all(row["classification"]=="consistent-interior" and row["incidence"]=="2" for row in edges)
          with (base/"mesh-seam.csv").open(newline="",encoding="utf-8") as f:
              seam=list(csv.DictReader(f))
          assert len(seam)==6 and all(row["classification"]=="boundary" for row in seam)
          house=(base/"mesh-house.txt").read_text()
          assert "positions=10 referenced=10 faces=16 edges=24" in house
          assert "Euler V-E+F=2" in house
          assert "boundary=0 consistent-interior=24 winding-conflict=0 nonmanifold=0" in house
          assert "closed-orientable-edge-candidate=yes" in house
          seam_text=(base/"mesh-seam.txt").read_text()
          assert "positions=7 referenced=6 faces=2 edges=6" in seam_text
          assert "face-edge-components=2" in seam_text
          assert "coincident-position-groups=3" in seam_text
          bow=(base/"mesh-bowtie.txt").read_text()
          assert "disconnected-vertex-fans=1" in bow
          non=(base/"mesh-nonmanifold.txt").read_text()
          assert "nonmanifold=1" in non
          repl=(base/"mesh-repl.txt").read_text()
          assert "Selected seam" in repl
          assert "face-edge-components=2" in repl
          print("P07: closed house incidence, seam, bow tie, nonmanifold, live REPL, SVG and CSV verified")
          PY
      - name: Validate P08 cubic curves, adaptive samples and indexed patch artifacts
        run: |
          build/book03-p01/book03_curves inspect > build/book03-p01/curve-inspect.txt
          build/book03-p01/book03_curves svg build/book03-p01/garden-curves.svg
          build/book03-p01/book03_curves csv build/book03-p01/garden-samples.csv
          build/book03-p01/book03_curves obj build/book03-p01/garden-patch.obj
          printf 'control 1 -2 3 0\ntolerance 0.015\ninspect\nsvg build/book03-p01/curve-repl.svg\npatch-control 1 1 -0.666667 4 -0.666667\nobj build/book03-p01/curve-repl.obj\nquit\n' | build/book03-p01/book03_curves repl > build/book03-p01/curve-repl.txt
          python3 - <<'PY'
          import csv
          from pathlib import Path
          import xml.etree.ElementTree as ET
          base=Path("build/book03-p01")
          nsv="{http://www.w3.org/2000/svg}"
          for name in ("garden-curves.svg", "curve-repl.svg"):
              root=ET.parse(base/name).getroot()
              assert root.tag==nsv+"svg"
              assert root.find(nsv+"title") is not None
              assert root.find(nsv+"desc") is not None
              assert len(root.findall(nsv+"polygon"))==288
              assert len(root.findall(nsv+"polyline"))>=1
              assert len(root.findall(nsv+"circle"))>=4
          with (base/"garden-samples.csv").open(newline="", encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)>=4
          ts=[float(row["t"]) for row in rows]
          assert ts[0]==0.0 and ts[-1]==1.0
          assert all(0<=a<b<=1 for a,b in zip(ts,ts[1:]))
          for name in ("garden-patch.obj","curve-repl.obj"):
              obj=(base/name).read_text(encoding="utf-8").splitlines()
              verts=[line for line in obj if line.startswith("v ")]
              faces=[line for line in obj if line.startswith("f ")]
              assert len(verts)==169 and len(faces)==288
              assert all(
                  1<=int(id)<=169
                  for face in faces
                  for id in face.split()[1:])
          report=(base/"curve-inspect.txt").read_text(encoding="utf-8")
          assert "Cubic Bézier, de Casteljau" in report
          assert "Patch mesh: V=169 E=456 F=288 boundary=48 chi=1" in report
          assert "Tessellation floating-policy met=yes" in report
          repl=(base/"curve-repl.txt").read_text(encoding="utf-8")
          assert "Updated control 1" in repl
          assert "Tolerance=0.015" in repl
          assert "P(0.5)=(0.00000000,1.87500000,0.00000000)" in repl
          assert "Updated patch-control 1,1" in repl
          print("P08: source-generated SVG/CSV/OBJ, control editing and indexed patch checks verified")
          PY
      - name: Verify P09 procedural terrain, closed primitives and implicit edge cache
        run: |
          build/book03-p01/book03_world inspect terrain > build/book03-p01/world-terrain.txt
          build/book03-p01/book03_world inspect cylinder > build/book03-p01/world-cylinder.txt
          build/book03-p01/book03_world inspect sphere > build/book03-p01/world-sphere.txt
          build/book03-p01/book03_world inspect implicit > build/book03-p01/world-implicit.txt
          build/book03-p01/book03_world svg build/book03-p01/world-terrain.svg terrain
          build/book03-p01/book03_world svg build/book03-p01/world-sphere.svg sphere
          build/book03-p01/book03_world svg build/book03-p01/world-implicit.svg implicit
          build/book03-p01/book03_world obj build/book03-p01/world-terrain.obj terrain
          build/book03-p01/book03_world obj build/book03-p01/world-cylinder.obj cylinder
          build/book03-p01/book03_world obj build/book03-p01/world-sphere.obj sphere
          build/book03-p01/book03_world obj build/book03-p01/world-implicit.obj implicit
          build/book03-p01/book03_world csv build/book03-p01/world-points.csv terrain
          printf 'shape cylinder\nradius 0.8\ninspect\nshape implicit\nresolution 9\ninspect\nobj build/book03-p01/world-repl-implicit.obj\nquit\n' | build/book03-p01/book03_world repl > build/book03-p01/world-repl.txt
          python3 - <<'PY'
          import csv
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base=Path("build/book03-p01")
          ns="{http://www.w3.org/2000/svg}"
          fixtures={
              "terrain":(169,288,456,48,1),
              "cylinder":(26,48,72,0,2),
              "sphere":(62,120,180,0,2)
          }
          for name,(vertices,faces,edges,boundary,chi) in fixtures.items():
              body=(base/f"world-{name}.txt").read_text(encoding="utf-8")
              assert f"shape={name}" in body
              assert f"positions={vertices} referenced={vertices} faces={faces} edges={edges}" in body
              assert f"Euler V-E+F={chi}" in body
              assert f"boundary={boundary}" in body
              assert "winding-conflict=0 nonmanifold=0" in body
              assert "disconnected-vertex-fans=0" in body
          implicit=(base/"world-implicit.txt").read_text()
          assert "shape=implicit" in implicit
          assert "Euler V-E+F=2" in implicit
          assert "boundary=0" in implicit
          assert "winding-conflict=0 nonmanifold=0" in implicit
          assert "closed-orientable-edge-candidate=yes" in implicit
          m=re.search(r"global cached edge crossings=(\d+)",implicit)
          assert m,implicit
          implicit_cached=int(m.group(1))
          assert implicit_cached>100
          for name in ("world-terrain.svg","world-sphere.svg","world-implicit.svg"):
              root=ET.parse(base/name).getroot()
              assert root.tag==ns+"svg"
              assert root.find(ns+"title") is not None
              assert root.find(ns+"desc") is not None
              assert len(root.findall(ns+"polygon"))>30
              assert len(root.findall(ns+"line"))>30
          for name,(v,f,*_) in fixtures.items():
              obj=(base/f"world-{name}.obj").read_text().splitlines()
              vertices=[row for row in obj if row.startswith("v ")]
              faces=[row for row in obj if row.startswith("f ")]
              assert len(vertices)==v and len(faces)==f
              assert all(1<=int(idx)<=v for face in faces for idx in face.split()[1:])
          obj=(base/"world-implicit.obj").read_text().splitlines()
          assert len([row for row in obj if row.startswith("v ")])==implicit_cached
          faces=[row for row in obj if row.startswith("f ")]
          assert len(faces)>100
          assert all(1<=int(idx)<=implicit_cached for face in faces for idx in face.split()[1:])
          with (base/"world-points.csv").open(newline="",encoding="utf-8") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==169
          assert [int(row["id"]) for row in rows]==list(range(169))
          repl=(base/"world-repl.txt").read_text()
          assert "Updated shape=cylinder" in repl
          assert "Updated radius=0.8" in repl
          assert "Updated shape=implicit" in repl
          assert "Updated resolution=9" in repl
          assert "Euler V-E+F=2" in repl
          assert (base/"world-repl-implicit.obj").is_file()
          print("P09: analytic generator topologies, current fixture exports and grid-edge cached isosurface inspected")
          PY
      - name: Verify P10 OBJ face tuples, imported geometry and glTF bounds witness
        run: |
          build/book03-p01/book03_assets demo seam > build/book03-p01/asset-seam.txt
          build/book03-p01/book03_assets demo broken > build/book03-p01/asset-broken.txt
          build/book03-p01/book03_assets demo repeated > build/book03-p01/asset-repeated.txt
          build/book03-p01/book03_assets layout > build/book03-p01/asset-gltf-layout.txt
          cat > build/book03-p01/asset-seam.obj <<'OBJ'
          # two triangles; four position IDs, six distinct UV/normal tuples
          v 0 0 0
          v 1 0 0
          v 1 1 0
          v 0 1 0
          vt 0 0
          vt 1 0
          vt 1 1
          vt 0.2 0
          vt 0.9 0.9
          vt 0.2 1
          vn 0 0 1
          vn 0 0 -1
          f 1/1/1 2/2/1 3/3/1
          f 1/4/2 3/5/2 4/6/2
          OBJ
          build/book03-p01/book03_assets inspect build/book03-p01/asset-seam.obj > build/book03-p01/asset-file-inspect.txt
          build/book03-p01/book03_assets svg build/book03-p01/asset-seam.obj build/book03-p01/asset-seam.svg
          build/book03-p01/book03_assets gpu build/book03-p01/asset-seam.obj build/book03-p01/asset-gpu.csv
          printf 'demo broken\ninspect\ndemo seam\ninspect\nsvg build/book03-p01/asset-repl.svg\ngpu build/book03-p01/asset-repl.csv\nquit\n' | build/book03-p01/book03_assets repl > build/book03-p01/asset-repl.txt
          python3 - <<'PY'
          import csv
          import xml.etree.ElementTree as ET
          from pathlib import Path
          base=Path("build/book03-p01")
          seam=(base/"asset-seam.txt").read_text(encoding="utf-8")
          broken=(base/"asset-broken.txt").read_text(encoding="utf-8")
          repeated=(base/"asset-repeated.txt").read_text(encoding="utf-8")
          file_report=(base/"asset-file-inspect.txt").read_text(encoding="utf-8")
          assert "Position vertices=4 rendering-tuple vertices=6 triangular faces=2" in seam
          assert "Indexed V=4 E=5 F=2 Euler=1" in seam
          assert "Boundary=4 consistent-interior=1 winding-conflict=0 nonmanifold=0" in seam
          assert "winding-conflict=1" in broken
          assert "AUDIT FAILED:" in broken
          assert "repeated-index-faces=1" in repeated
          assert "AUDIT FAILED:" in repeated
          assert "Position vertices=4 rendering-tuple vertices=6" in file_report
          gltf=(base/"asset-gltf-layout.txt").read_text()
          assert "first byte=24" in gltf and "after last byte=132" in gltf
          namespace="{http://www.w3.org/2000/svg}"
          for name in ("asset-seam.svg","asset-repl.svg"):
              root=ET.parse(base/name).getroot()
              assert root.tag==namespace+"svg"
              assert root.find(namespace+"title") is not None
              assert root.find(namespace+"desc") is not None
              assert len(root.findall(namespace+"polygon"))==2
              assert len(root.findall(namespace+"line"))==5
          for name in ("asset-gpu.csv","asset-repl.csv"):
