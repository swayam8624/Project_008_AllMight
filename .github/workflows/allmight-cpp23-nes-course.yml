name: AllMight C++23 NES teaching labs

on:
  push:
    branches:
      - curriculum/cpp23-nes-project-pass01
    paths:
      - ".github/workflows/allmight-cpp23-nes-course.yml"
      - "tools/labs/**"
      - "tools/tests/test_cpp23_project_inserts.py"
      - "tools/apply_cpp23_project_inserts.py"
      - "Supplementary/C++23 Project Labs/**"
      - "Book Production/Seven-Book Curriculum/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gcc-cpp23-and-insertion:
    name: GCC C++23 and manuscript preservation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler versions
        run: |
          g++ --version | head -n 1
          cmake --version | head -n 1
          python3 --version
      - name: Configure the standalone NES course (no LaTeX)
        run: |
          cmake -S "Book Production/Seven-Book Curriculum/Book01" -B build/nes-ci-gcc \
            -DCMAKE_CXX_COMPILER=g++ -DCMAKE_BUILD_TYPE=Debug
      - name: Build C++23 labs
        run: cmake --build build/nes-ci-gcc --parallel 2
      - name: Run every cumulative NES regression
        run: ctest --test-dir build/nes-ci-gcc --output-on-failure
      - name: Test that manuscript inserts are idempotent and never delete source
        run: python3 -m unittest discover -s tools/tests -p 'test_cpp23_project_inserts.py' -v
      - name: Dry-run existing manuscript without changing it
        run: python3 tools/apply_cpp23_project_inserts.py --check
      - name: Ensure no manuscript files were edited
        run: |
          git diff --exit-code -- "Continuous Notes/"
          git diff --check

  clang-cpp23:
    name: Clang C++23
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show compiler version
        run: clang++ --version | head -n 1
      - name: Configure C++23 exercises (no LaTeX)
        run: |
          cmake -S "Book Production/Seven-Book Curriculum/Book01" -B build/nes-ci-clang \
            -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug
      - name: Build C++23 labs
        run: cmake --build build/nes-ci-clang --parallel 2
      - name: Run cumulative NES regression suite
        run: ctest --test-dir build/nes-ci-clang --output-on-failure
