name: Book Two C++23 and editorial checks
on:
  push:
    branches: ["curriculum/book02-mathematics-refinement-pass01"]
    paths:
      - "tools/labs/book02_cpp23/**"
      - "Book Production/AllMight Codex/LaTeX/Assets/Book02/**"
      - "Book Production/AllMight Codex/LaTeX/Tools/book02_release_candidates.py"
      - ".github/workflows/book02-cpp23-native-and-editorial.yml"
  workflow_dispatch:
jobs:
  native-mathematics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure C++23 project
        run: cmake -S tools/labs/book02_cpp23 -B build/book02-cpp23 -DCMAKE_BUILD_TYPE=Release
      - name: Compile native C++23 source
        run: cmake --build build/book02-cpp23 --parallel 2
      - name: Run mathematical and export checks
        run: ctest --test-dir build/book02-cpp23 --output-on-failure
      - name: Check Book Two source and typography invariants
        run: python3 tools/labs/book02_cpp23/editorial_gate.py
