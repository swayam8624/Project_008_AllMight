name: Bible foundations final pass

# Validate the committed reading surface. Authoring patches never publish from CI.
on:
  push:
    branches: [main, allmight/closure-and-narrative-20261112]
    paths:
      - 'Continuous Notes/**'
      - 'tools/labs/**'
      - 'tools/patches/**'
      - 'tools/note_integrity.py'
      - 'tools/check_continuous_code_sync.py'
      - 'tools/check_patch_idempotence.py'
      - '.github/workflows/bible-foundations-final-pass.yml'
  pull_request:
    paths:
      - 'Continuous Notes/**'
      - 'tools/labs/**'
      - 'tools/patches/**'
      - 'tools/note_integrity.py'
      - 'tools/check_continuous_code_sync.py'
      - 'tools/check_patch_idempotence.py'
      - '.github/workflows/bible-foundations-final-pass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-committed-teaching:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete code and comments inside the books
        run: python3 tools/check_continuous_code_sync.py
      - name: Check authoring patches without modifying the checkout
        run: python3 tools/check_patch_idempotence.py
      - name: Compile and run foundations witnesses
        run: |
          set -euxo pipefail
          for lab in temporary_lifetime_lab se3_exp_log_lab; do
            c++ -std=c++20 -Wall -Wextra -Wpedantic -Werror "tools/labs/$lab.cpp" -o "$RUNNER_TEMP/$lab"
            "$RUNNER_TEMP/$lab"
          done
          python3 tools/labs/research_inference_lab.py
