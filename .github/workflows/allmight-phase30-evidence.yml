name: Phase 30 host-neutral production evidence checks

on:
  push:
    branches: [main]
    paths:
      - "tools/production_evidence.py"
      - "tools/tests/test_production_evidence.py"
      - ".github/workflows/allmight-phase30-evidence.yml"
  pull_request:
    paths:
      - "tools/production_evidence.py"
      - "tools/tests/test_production_evidence.py"
      - ".github/workflows/allmight-phase30-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python contract modules
        run: python -m py_compile tools/production_evidence.py tools/tests/test_production_evidence.py
      - name: Check deterministic publish, unsafe inputs, hashes and metrics
        run: python -m unittest -v tools.tests.test_production_evidence
