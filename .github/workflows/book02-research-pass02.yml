name: Book Two - Research Reproduction and Numerical Parity

on:
  push:
    branches:
      - curriculum/book02-mathematics-refinement-pass01
    paths:
      - 'tools/labs/book02_papers_geometry.py'
      - 'tools/labs/test_book02_papers_geometry.py'
      - 'tools/labs/book02_papers_numeric.py'
      - 'tools/labs/test_book02_papers_numeric.py'
      - 'tools/labs/book02_papers_sampling.py'
      - 'tools/labs/test_book02_papers_sampling.py'
      - 'tools/labs/book02_papers_cpp23.cpp'
      - 'Book Production/AllMight Codex/LaTeX/Assets/Book02/**'
      - 'Book Production/AllMight Codex/LaTeX/Tools/book02_visuals.py'
      - '.github/workflows/book02-research-pass02.yml'
  workflow_dispatch:

concurrency:
  group: book02-pass2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  reference-paper-witnesses:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout actual book branch
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific references
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==2.2.6 scipy==1.15.3
      - name: Compile scripts
        run: |
          python -m py_compile tools/labs/book02_papers_geometry.py tools/labs/test_book02_papers_geometry.py
          python -m py_compile tools/labs/book02_papers_numeric.py tools/labs/test_book02_papers_numeric.py
          python -m py_compile tools/labs/book02_papers_sampling.py tools/labs/test_book02_papers_sampling.py
      - name: Mathematical paper witnesses and SciPy comparisons
        working-directory: tools/labs
        run: python -m unittest -v test_book02_papers_geometry test_book02_papers_numeric test_book02_papers_sampling
      - name: Compile and run standalone C++23 mathematics witness
        run: |
          g++ -std=c++23 -O2 -Wall -Wextra -Werror -pedantic tools/labs/book02_papers_cpp23.cpp -o /tmp/book02_papers_cpp23
          /tmp/book02_papers_cpp23
      - name: Verify numerical checks under optimized Python
        working-directory: tools/labs
        run: python -O -m unittest -v test_book02_papers_geometry test_book02_papers_numeric test_book02_papers_sampling
