name: Book Two - EPUB Semantic Publication Parity

on:
  push:
    branches:
      - curriculum/book02-mathematics-refinement-pass01
    paths:
      - 'Book Production/AllMight Codex/LaTeX/Tools/book02_epub_supplements.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/book02_mathml_preflight.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/book02_source_preflight.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/book02_release_candidates.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/build.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/test_book02_font_assets.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/book02_original_source_lock.json'
      - 'Book Production/AllMight Codex/LaTeX/Tools/test_book02_epub_supplements.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/test_book02_epub_proof_export.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/build_epubs.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/book02_svg_id_repair.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/test_book02_svg_id_repair.py'
      - 'Book Production/AllMight Codex/LaTeX/Tools/book02_visuals.py'
      - 'Book Production/AllMight Codex/LaTeX/Assets/Book02/**'
      - 'tools/labs/book02_analytical_epub_figures.py'
      - 'tools/labs/book02_visual_atlas.py'
      - 'tools/labs/book02_build_viewer.py'
      - '.github/workflows/book02-publication-pass04.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book02-pass04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-epub-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned numerical and plotting libraries
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.5 pypdf==6.0.0
      - name: Install official Pandoc 3.14
        run: |
          curl -fL --retry 3 -o /tmp/pandoc.tar.gz https://github.com/jgm/pandoc/releases/download/3.14/pandoc-3.14-linux-amd64.tar.gz
          mkdir -p /tmp/pandoc-bin
          tar -xzf /tmp/pandoc.tar.gz -C /tmp/pandoc-bin
          echo "/tmp/pandoc-bin/pandoc-3.14/bin" >> "$GITHUB_PATH"
      - name: Verify every original Book Two chapter is byte-identical to locked source
        working-directory: 'Book Production/AllMight Codex/LaTeX/Tools'
        run: python book02_source_preflight.py --output "${{ runner.temp }}/book02-source-preflight.json"
      - name: Run full semantic-source and image tests
        working-directory: 'Book Production/AllMight Codex/LaTeX/Tools'
        run: |
          python -m py_compile book02_epub_supplements.py test_book02_epub_supplements.py build_epubs.py book02_release_candidates.py book02_mathml_preflight.py test_book02_font_assets.py book02_svg_id_repair.py test_book02_svg_id_repair.py
          pandoc --version | head -n 1
          python -m unittest -v test_book02_epub_supplements test_book02_font_assets test_book02_svg_id_repair
      - name: Check every supplemental math expression converts to native MathML
        working-directory: 'Book Production/AllMight Codex/LaTeX/Tools'
        run: |
          python book02_mathml_preflight.py --output "${{ runner.temp }}/book02-supplement-mathml.json"
      - name: Install official EPUBCheck 5.4.0
        run: |
          curl -fL --retry 3 -o /tmp/epubcheck.zip https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip
          mkdir -p /tmp/epubcheck
          unzip -q /tmp/epubcheck.zip -d /tmp/epubcheck
          find /tmp/epubcheck -name epubcheck.jar -print
      - name: Validate actual reflowable EPUB package with EPUBCheck
        working-directory: 'Book Production/AllMight Codex/LaTeX/Tools'
        run: |
          # The unittest temp fixture is deleted at teardown. Re-export the
          # semantic proof into the GitHub Actions artifact directory.
          python test_book02_epub_proof_export.py --output "${{ runner.temp }}/Book02-Additive-EPUB-Proof.epub"
          java -jar "$(find /tmp/epubcheck -name epubcheck.jar | head -1)" "${{ runner.temp }}/Book02-Additive-EPUB-Proof.epub"
      - name: Export source fragments for independent LuaLaTeX print proof
        uses: actions/upload-artifact@v4
        with:
          name: book02-pass04-latex-source-proof
          path: 'Book Production/AllMight Codex/LaTeX/Assets/Book02/*.tex'
          retention-days: 30
          if-no-files-found: error
      - name: Publish semantically validated proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: book02-pass04-semantic-epub-proof
          path: ${{ runner.temp }}/Book02-Additive-EPUB-Proof.epub
          retention-days: 30
          if-no-files-found: error
