name: C++20 reference laboratory regression

on:
  push:
    branches: [main]
    paths:
      - "tools/labs/**"
      - "tools/modules/**"
      - "tools/m018/**"
      - ".github/workflows/allmight-cpp20-labs.yml"
  pull_request:
    paths:
      - "tools/labs/**"
      - "tools/modules/**"
      - "tools/m018/**"
      - ".github/workflows/allmight-cpp20-labs.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile-and-run:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GCC sanitizer checks
            compiler: g++
            flags: "-O1 -g -fsanitize=address,undefined -fno-omit-frame-pointer"
          - name: Clang strict checks
            compiler: clang++
            flags: "-O1"
          - name: GCC release checks
            compiler: g++
            flags: "-O2 -DNDEBUG"

    steps:
      - uses: actions/checkout@v4

      - name: Compile and execute every standalone lab
        shell: bash
        env:
          CXX: ${{ matrix.compiler }}
          EXTRA_FLAGS: ${{ matrix.flags }}
        run: |
          set -Eeuo pipefail
          mapfile -t labs < <(find tools/labs -maxdepth 1 -type f -name '*_lab.cpp' | sort)
          if (( ${#labs[@]} == 0 )); then
            echo "No C++20 labs found" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/allmight-labs"
          for source in "${labs[@]}"; do
            name="$(basename "${source%.cpp}")"
            echo "::group::${name} ($CXX)"
            "$CXX" -std=c++20 -Wall -Wextra -Wpedantic -Werror \
              $EXTRA_FLAGS "$source" -o "$RUNNER_TEMP/allmight-labs/$name"
            "$RUNNER_TEMP/allmight-labs/$name"
            echo "::endgroup::"
          done

  module-boundary:
    name: GCC modules, header unit, and C ABI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build C++20 module graph and execute C/C++ consumers
        shell: bash
        run: bash tools/modules/build_module_lab.sh

  m018-compilation-boundaries:
    name: M018 PIMPL, typed handles, scalar and expression labs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build distinct translation units; validate checks in release and sanitizer modes
        run: bash tools/m018/build_m018_lab.sh
