name: Book 03 - Complete reader preparation and proof

on:
  push:
    branches:
      - curriculum/book03-geometry-images-pass01
    paths:
      - "Notes/Book Production/Seven-Book Curriculum/Book03/**"
      - "Code Parts/tools/book03_prepare_reader.py"
      - "Code Parts/tools/book03_editorial.py"
      - "Code Parts/tools/book03_proof_qa.py"
      - ".github/workflows/book03-publication-proof.yml"
  workflow_dispatch:
    inputs:
      compile_proof:
        description: "Also compile the complete PDF and EPUB proofs (no release promotion)"
        type: boolean
        default: false

concurrency:
  group: book03-proof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  reader:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install publication preparation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc python3-cairosvg python3-pil
          pandoc --version
      - name: Install optional complete proof compiler
        if: github.event_name == 'push' || inputs.compile_proof
        run: |
          sudo apt-get install -y texlive-luatex texlive-latex-extra texlive-fonts-recommended texlive-science fonts-texgyre fonts-texgyre-math fonts-dejavu fonts-stix fontconfig poppler-utils default-jre-headless
          curl -fL --retry 3 https://github.com/w3c/epubcheck/releases/download/v5.4.0/epubcheck-5.4.0.zip -o "$RUNNER_TEMP/epubcheck-5.4.0.zip"
          echo "33350c61038e71dfb3d45a76aed04bf5481e6d5500cb780f6e98db8bbd15a28c  $RUNNER_TEMP/epubcheck-5.4.0.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/epubcheck-5.4.0.zip" -d "$RUNNER_TEMP"
          mkdir -p "$RUNNER_TEMP/book03-bin"
          printf '%s\n' '#!/bin/sh' 'exec java -jar "$RUNNER_TEMP/epubcheck-5.4.0/epubcheck.jar" "$@"' > "$RUNNER_TEMP/book03-bin/epubcheck"
          chmod +x "$RUNNER_TEMP/book03-bin/epubcheck"
          echo "$RUNNER_TEMP/book03-bin" >> "$GITHUB_PATH"
      - name: Prepare every chapter, figure and shared source AST
        run: |
          args=()
          if [[ "${{ github.event_name == 'push' || inputs.compile_proof }}" == "true" ]]; then
            args+=(--build)
          fi
          /usr/bin/python3 "Code Parts/tools/book03_prepare_reader.py" "${args[@]}"
      - name: Audit actual print and ebook files, render chapter-opening samples
        if: github.event_name == 'push' || inputs.compile_proof
        run: /usr/bin/python3 "Code Parts/tools/book03_proof_qa.py" "Code Parts/build/book03-reader-proof"
      - name: Retain source proof and contact sheets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: book03-reader-proof
          path: |
            Code Parts/build/book03-reader-proof/
          if-no-files-found: warn
          retention-days: 14
