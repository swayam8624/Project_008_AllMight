name: Continuous volume executable source agreement

on:
  push:
    branches: [main]
    paths:
      - 'Notes/Continuous Notes/**'
      - 'Notes/Chapter Edition/**'
      - 'Code Parts/tools/chapter_plans/**'
      - 'Code Parts/tools/build_chapter_edition.py'
      - 'Code Parts/tools/tests/test_chapter_edition.py'
      - 'Code Parts/tools/labs/**'
      - 'Code Parts/tools/check_continuous_code_sync.py'
      - 'Code Parts/tools/note_integrity.py'
      - 'Code Parts/tools/check_vault_links.py'
      - 'Code Parts/tools/tests/test_note_integrity.py'
      - 'Code Parts/tools/check_book_completion.py'
      - 'Code Parts/tools/book_completion/**'
      - 'Code Parts/tools/tests/test_book_completion.py'
      - 'Notes/Concepts/**'
      - 'Notes/Supplementary/**'
      - 'Notes/Visual Recall/**'
      - 'README.md'
      - 'Code Parts/tools/m018/check_note_examples.py'
      - '.github/workflows/continuous-volume-sync.yml'
  pull_request:
    paths:
      - 'Notes/Continuous Notes/**'
      - 'Notes/Chapter Edition/**'
      - 'Code Parts/tools/chapter_plans/**'
      - 'Code Parts/tools/build_chapter_edition.py'
      - 'Code Parts/tools/tests/test_chapter_edition.py'
      - 'Code Parts/tools/labs/**'
      - 'Code Parts/tools/check_continuous_code_sync.py'
      - 'Code Parts/tools/note_integrity.py'
      - 'Code Parts/tools/check_vault_links.py'
      - 'Code Parts/tools/tests/test_note_integrity.py'
      - 'Code Parts/tools/check_book_completion.py'
      - 'Code Parts/tools/book_completion/**'
      - 'Code Parts/tools/tests/test_book_completion.py'
      - 'Notes/Concepts/**'
      - 'Notes/Supplementary/**'
      - 'Notes/Visual Recall/**'
      - 'README.md'
      - 'Code Parts/tools/m018/check_note_examples.py'
      - '.github/workflows/continuous-volume-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  embedded-code-and-delimiters:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Compare declared embedded C++ labs and formatting boundaries
        run: python3 "Code Parts/tools/check_continuous_code_sync.py"
      - name: Regression-test Markdown, source identity and wiki target checks
        run: python3 -m unittest discover -s "Code Parts/tools/tests" -p test_note_integrity.py
      - name: Verify complete chapter reading copies
        run: |
          python3 -m unittest discover -s "Code Parts/tools/tests" -p test_chapter_edition.py
          python3 "Code Parts/tools/build_chapter_edition.py" --check
      - name: Verify note, heading and figure navigation
        run: python3 "Code Parts/tools/check_vault_links.py"
      - name: Compile selected examples from the canonical engine volume
        run: python3 "Code Parts/tools/m018/check_note_examples.py" --compiler g++
      - name: Validate canonical numbering and evidence boundaries
        run: |
          python3 -m unittest discover -s "Code Parts/tools/tests" -p test_book_completion.py
          python3 "Code Parts/tools/check_book_completion.py"
      - name: Run bounded scalar and import-transaction witnesses
        run: |
          set -euo pipefail
          for lab in gaussian_training_step_lab planar_joint_rows_lab shader_import_lab gpu_budget_precision_lab; do
            python3 ""Code Parts/tools/labs/"$lab.py"
            python3 -O ""Code Parts/tools/labs/"$lab.py"
          done
          for lab in packed_arithmetic_lab collision_filter_event_lab gpu_structure_reference_lab; do
            c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Wpedantic -Werror ""Code Parts/tools/labs/"$lab.cpp" -o "$RUNNER_TEMP/$lab"
            "$RUNNER_TEMP/$lab"
          done
      - name: Reproduce the exact sparse-set excerpt and unsupported-type counterexample
        run: python3 "Code Parts/tools/labs/ecs_sparse_set_exception_check.py"
