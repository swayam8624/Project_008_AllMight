name: Bible engine final pass

# Validate the committed reading surface. Authoring patches never publish from CI.
on:
  push:
    branches: [main, allmight/closure-and-narrative-20261112]
    paths:
      - 'Continuous Notes/**'
      - 'tools/labs/**'
      - 'tools/patches/**'
      - 'tools/note_integrity.py'
      - 'tools/check_continuous_code_sync.py'
      - 'tools/check_patch_idempotence.py'
      - '.github/workflows/bible-engine-final-pass.yml'
  pull_request:
    paths:
      - 'Continuous Notes/**'
      - 'tools/labs/**'
      - 'tools/patches/**'
      - 'tools/note_integrity.py'
      - 'tools/check_continuous_code_sync.py'
      - 'tools/check_patch_idempotence.py'
      - '.github/workflows/bible-engine-final-pass.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-committed-teaching:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify complete code and comments inside the books
        run: python3 tools/check_continuous_code_sync.py
      - name: Check authoring patches without modifying the checkout
        run: python3 tools/check_patch_idempotence.py
      - name: Compile and run engine witnesses
        run: |
          set -euxo pipefail
          for lab in rollback_netcode_lab audio_voice_mixer_lab ai_decision_models_lab scene_persistence_lab; do
            c++ -std=c++20 -O2 -DNDEBUG -Wall -Wextra -Wpedantic -Werror "tools/labs/$lab.cpp" -o "$RUNNER_TEMP/$lab"
            "$RUNNER_TEMP/$lab"
          done
