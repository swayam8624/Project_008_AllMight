name: Book Two - Visual Research Atlas

on:
  push:
    branches:
      - curriculum/book02-mathematics-refinement-pass01
    paths:
      - 'Code Parts/tools/labs/book02_visual_atlas.py'
      - 'Code Parts/tools/labs/test_book02_visual_atlas.py'
      - 'Code Parts/tools/labs/book02_build_viewer.py'
      - 'Code Parts/tools/labs/book02_atlas_viewer_template.html'
      - 'Code Parts/tools/labs/book02_papers_*.py'
      - 'Notes/Book Production/AllMight Codex/LaTeX/Assets/Book02/28-*.tex'
      - 'Notes/Book Production/AllMight Codex/LaTeX/Assets/Book02/29-*.tex'
      - 'Notes/Book Production/AllMight Codex/LaTeX/Assets/Book02/30-*.tex'
      - 'Notes/Book Production/AllMight Codex/LaTeX/Assets/Book02/31-*.tex'
      - 'Notes/Book Production/AllMight Codex/LaTeX/Assets/Book02/32-*.tex'
      - 'Notes/Book Production/AllMight Codex/LaTeX/Assets/Book02/33-*.tex'
      - 'Notes/Book Production/AllMight Codex/LaTeX/Assets/Book02/34-*.tex'
      - 'Notes/Book Production/AllMight Codex/LaTeX/Tools/book02_visuals.py'
      - 'Notes/Book Production/AllMight Codex/LaTeX/Tools/build.py'
      - '.github/workflows/book02-visual-atlas-pass03.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: book02-visual-atlas-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scientific-figure-reproduction:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout original mathematical source branch
        uses: actions/checkout@v4
      - name: Python 3.12 and pinned numerical libraries
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install scientific renderer
        run: |
          python -m pip install numpy==2.2.6 scipy==1.15.3 matplotlib==3.10.5
      - name: Validate source and figure generator syntax
        run: |
          python -m py_compile "Code Parts/tools/labs/book02_visual_atlas.py" "Code Parts/tools/labs/test_book02_visual_atlas.py" "Code Parts/tools/labs/book02_build_viewer.py"
          python -m py_compile 'Notes/Book Production/AllMight Codex/LaTeX/Tools/book02_visuals.py'
      - name: Run original data and rich publication figure tests
        working-directory: "Code Parts/tools/labs"
        run: python -m unittest -v test_book02_visual_atlas
      - name: Re-render all seven research plates from pinned source
        run: python "Code Parts/tools/labs/book02_visual_atlas.py" --output "${{ runner.temp }}/book02-visual-atlas"
      - name: Verify exported PDF and SVG assets, data and manifest
        run: |
          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("${{ runner.temp }}/book02-visual-atlas")
          manifest = json.loads((root/"manifest.json").read_text())
          assert len(manifest["figures"]) == 7
          assert sum(x["rows"] for x in manifest["figures"]) > 1000
          for obj in manifest["figures"]:
              for name in obj["files"].values():
                  p = root/name
                  assert p.is_file() and p.stat().st_size > 1000, p
              assert (root/obj["data"]).is_file()
          print("BOOK02_VISUAL_ATLAS: VERIFIED",len(manifest["figures"]))
          PY
      - name: Verify offline HTML experiment controls and standalone JavaScript syntax
        run: |
          python - <<'PY'
          import json, pathlib, re
          root = pathlib.Path("${{ runner.temp }}/book02-visual-atlas")
          html = (root/"Numerical-Geometry-Atlas.html").read_text(encoding="utf-8")
          assert "__ATLAS_DATA__" not in html
          assert "https://" not in html and "http://" not in html
          assert "<script src=" not in html
          block = re.search(r"<script id=\"atlas-json\" type=\"application/json\">(.*?)</script>", html, re.S)
          assert block is not None
          obj = json.loads(block.group(1))
          assert len(obj["tables"]) == 7
          scripts = re.findall(r"<script>(.*?)</script>", html, re.S)
          assert len(scripts) == 1
          (root/"_viewer_syntax_check.js").write_text(scripts[0], encoding="utf-8")
          PY
          node --check "${{ runner.temp }}/book02-visual-atlas/_viewer_syntax_check.js"
      - name: Upload complete print and EPUB compatible figure assets
        uses: actions/upload-artifact@v4
        with:
          name: book02-pass03-figure-atlas
          path: ${{ runner.temp }}/book02-visual-atlas/
          retention-days: 30
          if-no-files-found: error
