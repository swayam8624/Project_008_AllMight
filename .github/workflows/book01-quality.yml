name: Book 1 source and companion quality

on:
  push:
    branches:
      - curriculum/cpp23-nes-project-pass01
    paths:
      - ".github/workflows/book01-quality.yml"
      - "tools/book01_*.py"
      - "tools/test_book01_*.py"
      - "tools/build_book01_expanded_reader.py"
      - "tools/apply_cpp23_project_inserts.py"
      - "Book Production/Seven-Book Curriculum/Book01/**"
      - "Chapter Edition/01 - Computing Foundations/**"
      - "Continuous Notes/Computing Foundations - From Bits to C++ and Systems APIs.md"
  workflow_dispatch:

jobs:
  verify-source-and-code:
    name: Verify source preservation, typesetting preparation and C++23 labs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact source revision
        uses: actions/checkout@v4
      - name: Install Python and Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc
          python3 --version
          pandoc --version | head -n 2
      - name: Check Python syntax and editorial regression tests
        run: |
          python3 -m py_compile \
            tools/book01_render_support.py \
            tools/book01_publication_edit.py \
            tools/book01_index.py \
            tools/book01_learning_gates.py \
            tools/book01_pdf_proof.py \
            tools/build_book01_expanded_reader.py \
            tools/test_book01_render_support.py \
            tools/test_book01_publication_edit.py
          python3 tools/test_book01_render_support.py
          python3 tools/test_book01_publication_edit.py
      - name: Verify source preservation and compile-ready LaTeX preparation
        run: |
          python3 tools/build_book01_expanded_reader.py --check
          python3 tools/build_book01_expanded_reader.py --prepare
          python3 tools/build_book01_expanded_reader.py --verify-prepared
      - name: Build and test standalone C++23 companion examples
        run: |
          cmake -S "Book Production/Seven-Book Curriculum/Book01/Companion" \
                -B build/book01-companion -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/book01-companion --parallel 2
          ctest --test-dir build/book01-companion --output-on-failure
