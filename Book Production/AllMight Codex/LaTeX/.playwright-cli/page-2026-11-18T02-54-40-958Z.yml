      - listitem [ref=e161]:
        - paragraph [ref=e162]:
          - strong [ref=e163]:
            - link "The rendering equation and light transport (Light Transport and Image Synthesis, Part 1, Ch. 2)" [ref=e164] [cursor=pointer]:
              - /url: ch319.xhtml#id_03-visual-computing-i-ch007-the-rendering-equation-and-light-transport
          - text: — Outgoing radiance is emitted light plus visible reflected incoming radiance integrated over a hemisphere. Since incoming radiance comes from other surfaces, transport is coupled. A renderer makes this executable with visibility, BRDF, light, and accumulation. See
