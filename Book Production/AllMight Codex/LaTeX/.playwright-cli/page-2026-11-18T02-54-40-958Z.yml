      - listitem [ref=e151]:
        - paragraph [ref=e152]:
          - strong [ref=e153]:
            - link "Reflectance, BRDFs, and shading (Geometry, Cameras, and Image Formation, Part 1, Ch. 11)" [ref=e154] [cursor=pointer]:
