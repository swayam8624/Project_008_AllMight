            - generic [ref=e108]: X
            - generic [ref=e109]: /
            - generic [ref=e111]: Z
          - text: couples image scale to depth. Vanishing points constrain parallel directions; calibration estimates internal parameters and pose from known geometry. Orthographic projection is useful when depth variation is negligible or should not affect measured scale.
          - strong [ref=e112]: "Ask:"
          - text: Why can three orthogonal vanishing directions still leave a mirror-related calibration solution?
      - listitem [ref=e113]:
        - paragraph [ref=e114]:
          - strong [ref=e115]:
            - link "Sampling continuous signals and image formation (Geometry, Cameras, and Image Formation, Part 1, Ch. 10)" [ref=e116] [cursor=pointer]:
              - /url: ch305.xhtml#id_03-visual-computing-i-ch003-sampling-continuous-signals-and-image-formation
          - text: — Sampling records finite values of a continuous signal. Frequencies above half the sample rate can alias to a lower pattern; prefilter before reducing resolution. Pixel-area averaging is already a weak low-pass filter. See
          - link "Figure U3 (Geometry, Cameras, and Image Formation, Part 1, Ch. 10)" [ref=e117] [cursor=pointer]:
            - /url: ch305.xhtml#id_03-visual-computing-i-ch003-figure-u3---two-signals-can-share-the-same-samples
          - text: .
          - strong [ref=e118]: "Ask:"
          - text: How can two different sinusoids produce identical samples on one grid?
      - listitem [ref=e119]:
        - paragraph [ref=e120]:
          - strong [ref=e121]:
            - link "Image sampling, filtering, and efficient reconstruction (Geometry, Cameras, and Image Formation, Part 1, Ch. 11)" [ref=e122] [cursor=pointer]:
              - /url: ch310.xhtml#id_03-visual-computing-i-ch004-image-sampling-filtering-and-efficient-reconstruction
          - text: — Reconstruction filters trade alias suppression, blur, and ringing. A texture Jacobian maps a pixel footprint into texture space; mipmaps suit near-isotropic footprints, anisotropic filters suit elongated ones. Integral images turn any axis-aligned box sum into four table reads after one cumulative pass.
          - strong [ref=e123]: "Ask:"
          - text: Why does an integral image not make an arbitrary convolution constant-time?
      - listitem [ref=e124]:
        - paragraph [ref=e125]:
          - strong [ref=e126]:
            - link "Color perception, encoding, and display (Geometry, Cameras, and Image Formation, Part 1, Ch. 11)" [ref=e127] [cursor=pointer]:
              - /url: ch310.xhtml#id_03-visual-computing-i-ch004-color-perception-encoding-and-display
          - text: "— Cone responses compress a spectrum into three values, so distinct spectra can be metamers. Display codes are often nonlinear: decode to linear light before averaging or compositing, then encode for display. Gamut bounds which responses a device can reproduce."
          - strong [ref=e128]: "Ask:"
          - text: Why does encoded midpoint 0.5 represent roughly 0.22 linear intensity under gamma 2.2?
      - listitem [ref=e129]:
        - paragraph [ref=e130]:
          - strong [ref=e131]:
            - link "Light measurement and radiometry (Geometry, Cameras, and Image Formation, Part 1, Ch. 11)" [ref=e132] [cursor=pointer]:
              - /url: ch310.xhtml#id_03-visual-computing-i-ch004-light-measurement-and-radiometry
