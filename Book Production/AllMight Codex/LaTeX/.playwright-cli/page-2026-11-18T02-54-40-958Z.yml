          - strong [ref=e289]:
            - link "Shape from shading and reflectance (Vision, XR, and Playable Worlds, Part 1, Ch. 3)" [ref=e290] [cursor=pointer]:
              - /url: ch540.xhtml#id_04-visual-computing-ii-ch032-shape-from-shading-and-reflectance
          - text: — A single shading image gives a nonlinear relation among surface normal, reflectance, and illumination; integration into height requires boundary conditions and extra assumptions.
          - strong [ref=e291]: "Ask:"
          - text: Why does a locally valid normal field fail to guarantee one globally consistent surface?
      - listitem [ref=e292]:
