          - text: — Two views constrain rays and relative pose; triangulation recovers structure up to gauge freedoms such as global scale. Critical surfaces make the geometry ill-conditioned.
          - strong [ref=e280]: "Ask:"
          - text: Why can perfect image correspondences still leave metric scale unknown?
