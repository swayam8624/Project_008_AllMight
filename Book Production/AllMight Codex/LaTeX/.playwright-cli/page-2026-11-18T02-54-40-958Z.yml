  - generic [ref=e28]:
    - heading "Thirty-five retrieval briefs" [level=3] [ref=e29]
    - paragraph [ref=e30]: Each brief gives a mechanism to recall, the condition that matters, and a concrete question to use when reopening that section. The links target the matching chapter in the main note.
