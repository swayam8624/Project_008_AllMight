              - /url: ch540.xhtml#id_04-visual-computing-ii-ch032-surface-orientation-from-illumination
          - text: — Photometric stereo uses several known light directions to solve for scaled normal from brightness measurements. The lighting matrix must span the components being estimated. See
          - link "Figure U4 (Vision, XR, and Playable Worlds, Part 1, Ch. 3)" [ref=e285] [cursor=pointer]:
