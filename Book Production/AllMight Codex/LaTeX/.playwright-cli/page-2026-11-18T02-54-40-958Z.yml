      - listitem [ref=e195]:
        - paragraph [ref=e196]:
          - strong [ref=e197]:
            - link "Rasterization, coverage, and depth (Mathematics for Visual Computing, Part 2, Ch. 16)" [ref=e198] [cursor=pointer]:
              - /url: ch277.xhtml#id_03-visual-computing-i-ch012-rasterization-coverage-and-depth
          - text: — Rasterization tests projected primitives at pixel sample locations, interpolates attributes, then depth-tests. Exact edge coverage is an area integral; multisampling estimates it with subpixel tests. Perspective-correct interpolation compensates for the projection divide.
          - strong [ref=e199]: "Ask:"
          - text: What artifact appears if a checkerboard floor is linearly interpolated in screen space?
      - listitem [ref=e200]:
        - paragraph [ref=e201]:
          - strong [ref=e202]:
            - link "Textures and surface detail (Light Transport and Image Synthesis, Part 1, Ch. 8)" [ref=e203] [cursor=pointer]:
              - /url: ch333.xhtml#id_03-visual-computing-i-ch019-textures-and-surface-detail
          - text: — Texture is a signal over surface coordinates. Charts introduce seams and distortion; filtering must follow how that domain projects into each pixel.
          - strong [ref=e204]: "Ask:"
          - text: Why can one square mip level overblur a floor receding toward the horizon?
      - listitem [ref=e205]:
        - paragraph [ref=e206]:
          - strong [ref=e207]:
            - link "Visibility queries and ray intersections (Spatial Worlds, Engine State, and Simulation, Part 1, Ch. 9)" [ref=e208] [cursor=pointer]:
              - /url: ch383.xhtml#id_04-visual-computing-ii-ch028-visibility-queries-and-ray-intersections-1
          - text: — A ray query asks which geometry intersects a path from an origin; hit parameters, barycentric coordinates, and surface orientation answer different parts of the intersection contract.
          - strong [ref=e209]: "Ask:"
          - text: What additional bound distinguishes a ray from a finite line segment?
      - listitem [ref=e210]:
        - paragraph [ref=e211]:
          - strong [ref=e212]:
            - link "Acceleration structures and robust queries (Spatial Worlds, Engine State, and Simulation, Part 1, Ch. 10)" [ref=e213] [cursor=pointer]:
              - /url: ch385.xhtml#id_04-visual-computing-ii-ch029-acceleration-structures-and-robust-queries-1
          - text: — A BVH groups geometry in nested bounds. Traversal skips a node only when its bound cannot intersect the query, so bounds must conservatively contain descendants. Robust predicates matter near tangencies and degenerate geometry.
          - strong [ref=e214]: "Ask:"
          - text: What correctness failure follows from rounding a bound inward?
      - listitem [ref=e215]:
        - paragraph [ref=e216]:
          - strong [ref=e217]:
            - link "Scene graphs and articulated geometry (Spatial Worlds, Engine State, and Simulation, Part 1, Ch. 10)" [ref=e218] [cursor=pointer]:
              - /url: ch385.xhtml#id_04-visual-computing-ii-ch029-scene-graphs-and-articulated-geometry
          - text: — A node’s world transform composes parent and local transforms; skinning blends posed bone candidates using per-vertex weights. Linear blends can collapse volume when averaging opposing rotations.
          - strong [ref=e219]: "Ask:"
          - text: Why does applying the inverse bind transform preserve a vertex when current pose equals rest pose?
      - listitem [ref=e220]:
        - paragraph [ref=e221]:
          - strong [ref=e222]:
            - link "Animation curves and motion paths (Spatial Worlds, Engine State, and Simulation, Part 1, Ch. 10)" [ref=e223] [cursor=pointer]:
              - /url: ch385.xhtml#id_04-visual-computing-ii-ch029-animation-curves-and-motion-paths
          - text: — A moving camera needs position and orientation, plus a valid up direction. Smooth position does not guarantee smooth orientation; rotation interpolation and time parameterization are separate choices.
          - strong [ref=e224]: "Ask:"
          - text: What makes the camera frame singular when view and up vectors align?
      - listitem [ref=e225]:
        - paragraph [ref=e226]:
          - strong [ref=e227]:
            - link "Dynamics, forces, and numerical integration (Spatial Worlds, Engine State, and Simulation, Part 1, Ch. 10)" [ref=e228] [cursor=pointer]:
              - /url: ch385.xhtml#id_04-visual-computing-ii-ch029-dynamics-forces-and-numerical-integration
          - text: — Dynamics evolves state from forces or interaction rules; an integrator approximates continuous time with steps. Large steps can inject energy or destabilize springs and cloth.
          - strong [ref=e229]: "Ask:"
          - text: Why can explicit Euler make a spring oscillation grow even when the physical model conserves energy?
      - listitem [ref=e230]:
        - paragraph [ref=e231]:
          - strong [ref=e232]:
            - link "Optimization, constraints, and inverse kinematics (Spatial Worlds, Engine State, and Simulation, Part 1, Ch. 10)" [ref=e233] [cursor=pointer]:
              - /url: ch385.xhtml#id_04-visual-computing-ii-ch029-optimization-constraints-and-inverse-kinematics
          - text: — Define variables, objective, constraints, and derivatives before solving. IK linearizes forward kinematics with a Jacobian; feasibility and conditioning govern whether a target is reachable and stable.
          - strong [ref=e234]: "Ask:"
          - text: What changes when the end-effector Jacobian loses rank?
      - listitem [ref=e235]:
        - paragraph [ref=e236]:
          - strong [ref=e237]:
            - link "PDEs, fields, and discrete solvers (Spatial Worlds, Engine State, and Simulation, Part 1, Ch. 11)" [ref=e238] [cursor=pointer]:
              - /url: ch386.xhtml#id_04-visual-computing-ii-ch030-pdes-fields-and-discrete-solvers
          - text: — A PDE, spatial discretization, and boundary conditions together define a numerical problem. Choosing a mesh or basis changes the system matrix; boundary data is part of the model.
          - strong [ref=e239]: "Ask:"
          - text: Why can two solvers using the same interior equation produce different solutions at the boundary?
      - listitem [ref=e240]:
        - paragraph [ref=e241]:
          - strong [ref=e242]:
            - link "Optical flow and motion from images (Spatial Worlds, Engine State, and Simulation, Part 1, Ch. 11)" [ref=e243] [cursor=pointer]:
              - /url: ch386.xhtml#id_04-visual-computing-ii-ch030-optical-flow-and-motion-from-images
          - text: — Brightness constancy yields one equation,
          - math [ref=e244]:
