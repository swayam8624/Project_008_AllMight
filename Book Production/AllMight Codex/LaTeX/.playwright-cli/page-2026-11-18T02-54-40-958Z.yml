              - /url: ch540.xhtml#id_04-visual-computing-ii-ch032-surface-descriptions-and-gaussian-images
          - text: — A Gaussian image maps surface area to normal directions. Its directional mass distribution summarizes orientation and curvature patterns but can be shared by geometrically different surfaces.
          - strong [ref=e296]: "Ask:"
          - text: Why does the zero-centroid condition hold for a closed surface, and what does it rule out?
      - listitem [ref=e297]:
        - paragraph [ref=e298]:
          - strong [ref=e299]:
            - link "Photographic composition, history, and communication (Vision, XR, and Playable Worlds, Part 1, Ch. 4)" [ref=e300] [cursor=pointer]:
              - /url: ch541.xhtml#id_04-visual-computing-ii-ch034-photographic-composition-history-and-communication
          - text: — Viewpoint, crop, sequence, and caption shape how a photograph functions as evidence or argument. A recorded scene is selected and framed, not a neutral inventory.
          - strong [ref=e301]: "Ask:"
          - text: What does a wide frame reveal that a close crop hides in the same documentary image?
      - listitem [ref=e302]:
        - paragraph [ref=e303]:
          - strong [ref=e304]:
            - link "Photographic workflow and integrated decisions (Vision, XR, and Playable Worlds, Part 1, Ch. 4)" [ref=e305] [cursor=pointer]:
