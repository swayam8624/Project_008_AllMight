          - text: ", for two flow components. A local aperture therefore leaves motion along an edge ambiguous."
          - strong [ref=e260]: "Ask:"
          - text: What does a single straight edge constrain well, and which motion component remains unobserved?
      - listitem [ref=e261]:
        - paragraph [ref=e262]:
          - strong [ref=e263]:
            - link "Edges, contours, and subpixel localization (Spatial Worlds, Engine State, and Simulation, Part 1, Ch. 11)" [ref=e264] [cursor=pointer]:
              - /url: ch386.xhtml#id_04-visual-computing-ii-ch030-edges-contours-and-subpixel-localization
          - text: — Blur spreads an ideal edge; fitting a response profile can estimate its center between pixels. Hough voting accumulates weak local evidence into a global line or shape hypothesis.
          - strong [ref=e265]: "Ask:"
          - text: Why can an edge’s subpixel estimate shift when the blur model is wrong?
      - listitem [ref=e266]:
        - paragraph [ref=e267]:
          - strong [ref=e268]:
            - link "Recognition, templates, and industrial matching (Spatial Worlds, Engine State, and Simulation, Part 1, Ch. 11)" [ref=e269] [cursor=pointer]:
              - /url: ch386.xhtml#id_04-visual-computing-ii-ch030-recognition-templates-and-industrial-matching
          - text: — Template matching searches over pose and transformation with a score chosen for expected noise and deformation. Coarse-to-fine search reduces cost; thresholds set tolerance, not truth.
          - strong [ref=e270]: "Ask:"
          - text: Why should an edge alignment score treat normal displacement differently from tangent displacement?
      - listitem [ref=e271]:
        - paragraph [ref=e272]:
          - strong [ref=e273]:
            - link "Pose estimation, transforms, and robust fitting (Vision, XR, and Playable Worlds, Part 1, Ch. 3)" [ref=e274] [cursor=pointer]:
              - /url: ch540.xhtml#id_04-visual-computing-ii-ch032-pose-estimation-transforms-and-robust-fitting
          - text: — Estimate rigid pose from correspondences, enforce a proper rotation, and use robust fitting when outliers contaminate matches. RANSAC trial count depends on inlier rate and sample size.
          - strong [ref=e275]: "Ask:"
          - text: Why does lowering the assumed inlier fraction sharply increase the number of RANSAC trials?
      - listitem [ref=e276]:
        - paragraph [ref=e277]:
