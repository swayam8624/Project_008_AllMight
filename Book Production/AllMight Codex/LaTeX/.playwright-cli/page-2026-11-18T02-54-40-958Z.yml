      - listitem [ref=e79]:
        - paragraph [ref=e80]:
          - strong [ref=e81]:
            - link "Surfaces, patches, topology, and parameterization (Geometry, Cameras, and Image Formation, Part 1, Ch. 9)" [ref=e82] [cursor=pointer]:
              - /url: ch296.xhtml#id_03-visual-computing-i-ch002-surfaces-patches-topology-and-parameterization
          - text: — A chart maps a parameter domain onto a surface; its partial derivatives span the tangent plane. A chart can distort or become singular even if the surface itself is regular.
          - strong [ref=e83]: "Ask:"
          - text: What condition on the two tangent vectors makes a parameterization lose a local direction?
      - listitem [ref=e84]:
        - paragraph [ref=e85]:
          - strong [ref=e86]:
            - link "Meshes, connectivity, and geometry processing (Geometry, Cameras, and Image Formation, Part 1, Ch. 9)" [ref=e87] [cursor=pointer]:
              - /url: ch296.xhtml#id_03-visual-computing-i-ch002-meshes-connectivity-and-geometry-processing
          - text: — A mesh stores geometry plus adjacency. Half-edges encode directed edge pairs and make face and vertex neighborhoods traversable. Edits must preserve required topology and orientation. See
          - link "Figure U2 (Geometry, Cameras, and Image Formation, Part 1, Ch. 9)" [ref=e88] [cursor=pointer]:
            - /url: ch296.xhtml#id_03-visual-computing-i-ch002-figure-u2---a-half-edge-separates-face-traversal-from-edge-traversal
          - text: .
          - strong [ref=e89]: "Ask:"
          - text: After an edge flip, which adjacent face can become inverted if the new diagonal is geometrically invalid?
      - listitem [ref=e90]:
        - paragraph [ref=e91]:
          - strong [ref=e92]:
            - link "Lens optics, focus, and image formation (Geometry, Cameras, and Image Formation, Part 1, Ch. 10)" [ref=e93] [cursor=pointer]:
              - /url: ch305.xhtml#id_03-visual-computing-i-ch003-lens-optics-focus-and-image-formation
          - text: — A thin lens maps object distance to image distance; defocus spreads a point into a blur circle. Acceptable focus depends on the blur tolerance and output scale, not a universal depth-of-field boundary. The added derivation estimates a focus interval of about 2.34–4.19 m for its stated setup.
          - strong [ref=e94]: "Ask:"
          - text: Which chosen circle-of-confusion threshold changes that interval?
      - listitem [ref=e95]:
        - paragraph [ref=e96]:
          - strong [ref=e97]:
            - link "Exposure, sensors, and dynamic range (Geometry, Cameras, and Image Formation, Part 1, Ch. 10)" [ref=e98] [cursor=pointer]:
              - /url: ch305.xhtml#id_03-visual-computing-i-ch003-exposure-sensors-and-dynamic-range
          - text: — Exposure controls collected photons through aperture, shutter time, and sensitivity; equivalent brightness does not imply equivalent motion blur, depth of field, noise, or highlight headroom. Sensor readout and saturation add limits.
          - strong [ref=e99]: "Ask:"
          - text: If shutter time is halved and aperture widened one stop, what changes besides image brightness?
      - listitem [ref=e100]:
        - paragraph [ref=e101]:
          - strong [ref=e102]:
            - link "Cameras, projection, and calibration (Geometry, Cameras, and Image Formation, Part 1, Ch. 10)" [ref=e103] [cursor=pointer]:
              - /url: ch305.xhtml#id_03-visual-computing-i-ch003-cameras-projection-and-calibration
          - text: — Pinhole projection
          - math [ref=e104]:
