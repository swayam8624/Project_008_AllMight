<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Two interpolation laws for two different quantities</title><desc id="desc">Smooth surface attributes use reciprocal-w normalized weights while NDC depth is already divided and is interpolated with screen weights. The worked centroid yields UV (2/7,1/7) and forward depth 85/114.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="40" font-family="sans-serif" font-size="23" fill="#294e58" font-weight="600">Two interpolation laws for two different quantities</text><rect x="25" y="82" width="505" height="410" rx="12" fill="#edf3ef"/><rect x="550" y="82" width="505" height="410" rx="12" fill="#edf3ef"/><text x="45" y="121" font-family="sans-serif" font-size="19" fill="#345c65" >Smooth surface attribute</text><text x="45" y="175" font-family="sans-serif" font-size="17" fill="#345c65" >Compute β from λ/w</text><text x="45" y="222" font-family="sans-serif" font-size="23" fill="#287b68" >a = Σ βᵢ aᵢ</text><text x="45" y="277" font-family="sans-serif" font-size="15" fill="#345c65" >Examples: world position, UV</text><text x="45" y="304" font-family="sans-serif" font-size="15" fill="#345c65" >and interpolated normal vector.</text><text x="45" y="368" font-family="sans-serif" font-size="18" fill="#345c65" >Centroid UV = (2/7, 1/7)</text><text x="45" y="416" font-family="sans-serif" font-size="14" fill="#345c65" >Normalize a shading normal again.</text><text x="570" y="121" font-family="sans-serif" font-size="19" fill="#345c65" >Already divided NDC depth</text><text x="570" y="175" font-family="sans-serif" font-size="17" fill="#345c65" >Keep screen weights λ</text><text x="570" y="222" font-family="sans-serif" font-size="23" fill="#287b68" >q = Σ λᵢ (zᵢ/wᵢ)</text><text x="570" y="277" font-family="sans-serif" font-size="15" fill="#345c65" >Do not apply reciprocal-w</text><text x="570" y="304" font-family="sans-serif" font-size="15" fill="#345c65" >normalization a second time.</text><text x="570" y="368" font-family="sans-serif" font-size="18" fill="#345c65" >Centroid q = 85/114</text><text x="570" y="416" font-family="sans-serif" font-size="14" fill="#345c65" >Near=1, far=20, forward depth.</text><text x="30" y="531" font-family="sans-serif" font-size="13" fill="#345c65" >Both formulas follow from the same homogeneous-coordinate identity, but they represent different quantities.</text></svg>