<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Bounded Newton inversion</title><desc id="desc">A conservative domain bound precedes residual evaluation, the two-by-two Newton solve, and a damped step. Convergence and failure are distinct statuses.</desc><rect width="1080" height="560" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Bounded Newton inversion</text><rect x="25" y="80" width="1030" height="410" rx="8" fill="#edf3ef"/><rect x="45" y="130" width="230" height="115" rx="8" fill="#f9faf7"/><text x="59" y="167" font-family="sans-serif" font-size="17" fill="#345c65">Validate model</text><text x="59" y="204" font-family="sans-serif" font-size="14" fill="#345c65">Bound B &lt; 0.9</text><text x="279" y="190" font-family="sans-serif" font-size="18" fill="#345c65">→</text><rect x="295" y="130" width="230" height="115" rx="8" fill="#f9faf7"/><text x="309" y="167" font-family="sans-serif" font-size="17" fill="#345c65">Evaluate</text><text x="309" y="204" font-family="sans-serif" font-size="14" fill="#345c65">Residual D(p) − m</text><text x="529" y="190" font-family="sans-serif" font-size="18" fill="#345c65">→</text><rect x="545" y="130" width="230" height="115" rx="8" fill="#f9faf7"/><text x="559" y="167" font-family="sans-serif" font-size="17" fill="#345c65">Solve 2×2 system</text><text x="559" y="204" font-family="sans-serif" font-size="14" fill="#345c65">Newton direction</text><text x="779" y="190" font-family="sans-serif" font-size="18" fill="#345c65">→</text><rect x="795" y="130" width="230" height="115" rx="8" fill="#f9faf7"/><text x="809" y="167" font-family="sans-serif" font-size="17" fill="#345c65">Damp step</text><text x="809" y="204" font-family="sans-serif" font-size="14" fill="#345c65">Inside disk + less error</text><line x1="930" y1="250" x2="930" y2="285" stroke="#518b7a" stroke-width="2" /><line x1="930" y1="285" x2="410" y2="285" stroke="#518b7a" stroke-width="2" /><line x1="410" y1="285" x2="410" y2="250" stroke="#518b7a" stroke-width="2" /><text x="625" y="277" font-family="sans-serif" font-size="14" fill="#345c65">Repeat if needed</text><rect x="45" y="325" width="470" height="115" rx="8" fill="#d1e6da"/><text x="65" y="362" font-family="sans-serif" font-size="19" fill="#345c65">Converged</text><text x="65" y="398" font-family="sans-serif" font-size="16" fill="#345c65">Return point + residual + iteration count</text><rect x="535" y="325" width="500" height="115" rx="8" fill="#ebe4d8"/><text x="555" y="362" font-family="sans-serif" font-size="18" fill="#345c65">Uncertified / no progress / iteration limit</text><text x="555" y="398" font-family="sans-serif" font-size="15" fill="#345c65">Report failure; do not invent a recovered ray.</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">The residual tolerance is not a physical calibration error bound; a unique preimage requires a valid model domain.</text></svg>