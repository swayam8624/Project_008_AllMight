<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>An ablation must preserve the question</title><desc>A common input set feeds both baseline and modified pipelines. Their surviving support and numerical errors are compared before interpreting measured cost.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">An ablation must preserve the question</text><rect x="40" y="108" width="136" height="110" rx="3" fill="#f0f5f8" stroke="#c3d9e2"/><text x="108" y="145" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Common</text><text x="108" y="168" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">input</text><line x1="181" y1="163" x2="191" y2="163" stroke="#087fa0" stroke-width="2"/><polyline points="181.99552897647322,167.3496553411123 191,163 181.99552897647322,158.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><text x="108" y="248" font-size="13" text-anchor="middle" fill="#657c90">same seeds</text><rect x="196" y="108" width="136" height="110" rx="3" fill="#e4f3f7" stroke="#c3d9e2"/><text x="264" y="145" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Baseline +</text><text x="264" y="168" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">variant</text><line x1="337" y1="163" x2="347" y2="163" stroke="#087fa0" stroke-width="2"/><polyline points="337.9955289764732,167.3496553411123 347,163 337.9955289764732,158.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><text x="264" y="248" font-size="13" text-anchor="middle" fill="#657c90">one change</text><rect x="352" y="108" width="136" height="110" rx="3" fill="#f0f5f8" stroke="#c3d9e2"/><text x="420" y="145" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Output</text><text x="420" y="168" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">support</text><line x1="493" y1="163" x2="503" y2="163" stroke="#087fa0" stroke-width="2"/><polyline points="493.9955289764732,167.3496553411123 503,163 493.9955289764732,158.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><text x="420" y="248" font-size="13" text-anchor="middle" fill="#657c90">missing count</text><rect x="508" y="108" width="136" height="110" rx="3" fill="#e4f3f7" stroke="#c3d9e2"/><text x="576" y="145" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Independent</text><text x="576" y="168" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">error</text><line x1="649" y1="163" x2="659" y2="163" stroke="#087fa0" stroke-width="2"/><polyline points="649.9955289764732,167.3496553411123 659,163 649.9955289764732,158.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><text x="576" y="248" font-size="13" text-anchor="middle" fill="#657c90">same metric</text><rect x="664" y="108" width="136" height="110" rx="3" fill="#f0f5f8" stroke="#c3d9e2"/><text x="732" y="145" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Paired</text><text x="732" y="168" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">timing</text><text x="732" y="248" font-size="13" text-anchor="middle" fill="#657c90">same boundary</text></g></svg>
