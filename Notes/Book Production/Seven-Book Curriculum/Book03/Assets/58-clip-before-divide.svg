<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Clip in homogeneous coordinates before division</title><desc id="desc">The left clip plane x+w=0 intersects a constant-w segment A to B at lambda one half. The rejected portion is red dashed and surviving portion green. Cone cross-section is illustrative.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#284e58" font-weight="600">Clip in homogeneous coordinates before division</text><rect x="25" y="80" width="670" height="410" rx="12" fill="#edf3ef"/><rect x="714" y="80" width="341" height="410" rx="12" fill="#edf3ef"/><polygon points="360,435 100,175 620,175" fill="#d8eade"/><line x1="360" y1="435" x2="100" y2="175" stroke="#458a76" stroke-width="3" /><line x1="360" y1="435" x2="620" y2="175" stroke="#458a76" stroke-width="3" /><line x1="100" y1="175" x2="620" y2="175" stroke="#9db7aa" stroke-width="1" /><line x1="100" y1="305" x2="230" y2="305" stroke="#b35f4e" stroke-width="4" stroke-dasharray="6 5"/><line x1="230" y1="305" x2="360" y2="305" stroke="#347e6b" stroke-width="4" /><circle cx="100" cy="305" r="6" fill="#b35f4e" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="230" cy="305" r="6" fill="#507ca8" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="360" cy="305" r="6" fill="#347e6b" stroke="#fbfaf7" stroke-width="1.5"/><text x="91" y="290" font-family="sans-serif" font-size="16" fill="#355d65" >A</text><text x="225" y="290" font-family="sans-serif" font-size="16" fill="#355d65" >I</text><text x="368" y="290" font-family="sans-serif" font-size="16" fill="#355d65" >B</text><text x="365" y="452" font-family="sans-serif" font-size="13" fill="#355d65" >w=0</text><text x="143" y="220" font-family="sans-serif" font-size="14" fill="#355d65" >x = −w</text><text x="500" y="220" font-family="sans-serif" font-size="14" fill="#355d65" >x = +w</text><text x="733" y="119" font-family="sans-serif" font-size="17" fill="#355d65" >Left plane: g = x + w</text><text x="733" y="166" font-family="sans-serif" font-size="15" fill="#355d65" >A = (−2, 0, 0.5, 1)</text><text x="733" y="195" font-family="sans-serif" font-size="15" fill="#355d65" >B = (0, 0, 0.5, 1)</text><text x="733" y="243" font-family="sans-serif" font-size="15" fill="#355d65" >g(A) = −1; g(B) = 1</text><text x="733" y="294" font-family="sans-serif" font-size="19" fill="#2b7e69" >λ = 0.5</text><text x="733" y="331" font-family="sans-serif" font-size="15" fill="#355d65" >I = (−1, 0, 0.5, 1)</text><text x="733" y="391" font-family="sans-serif" font-size="14" fill="#355d65" >Only the surviving portion</text><text x="733" y="416" font-family="sans-serif" font-size="14" fill="#355d65" >continues to division.</text><text x="28" y="528" font-family="sans-serif" font-size="13" fill="#355d65" >Cross-section in x and w with y=0 and z=0.5 on the segment. Remaining clip planes must also be checked.</text></svg>