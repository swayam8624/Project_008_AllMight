<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">World-preserving reparenting</title><desc id="desc">Tree B remains at world X negative one. Originally its parent is at negative three and local X is two. After reparenting to platform at positive three, local X becomes negative four.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="40" font-family="sans-serif" font-size="24" fill="#294e58" font-weight='600'>Keep the tree in the same world position</text><text x="35" y="102" font-family="sans-serif" font-size="17" fill="#355c64" >Before: parent = garden</text><line x1="95" y1="220" x2="985" y2="220" stroke="#a6b6b0" stroke-width="2" /><line x1="140" y1="214" x2="140" y2="226" stroke="#a6b6b0" stroke-width="1" /><text x="132" y="245" font-family="sans-serif" font-size="12" fill="#355c64" >-4</text><line x1="240" y1="214" x2="240" y2="226" stroke="#a6b6b0" stroke-width="1" /><text x="232" y="245" font-family="sans-serif" font-size="12" fill="#355c64" >-3</text><line x1="340" y1="214" x2="340" y2="226" stroke="#a6b6b0" stroke-width="1" /><text x="332" y="245" font-family="sans-serif" font-size="12" fill="#355c64" >-2</text><line x1="440" y1="214" x2="440" y2="226" stroke="#a6b6b0" stroke-width="1" /><text x="432" y="245" font-family="sans-serif" font-size="12" fill="#355c64" >-1</text><line x1="540" y1="214" x2="540" y2="226" stroke="#a6b6b0" stroke-width="1" /><text x="532" y="245" font-family="sans-serif" font-size="12" fill="#355c64" >0</text><line x1="640" y1="214" x2="640" y2="226" stroke="#a6b6b0" stroke-width="1" /><text x="632" y="245" font-family="sans-serif" font-size="12" fill="#355c64" >1</text><line x1="740" y1="214" x2="740" y2="226" stroke="#a6b6b0" stroke-width="1" /><text x="732" y="245" font-family="sans-serif" font-size="12" fill="#355c64" >2</text><line x1="840" y1="214" x2="840" y2="226" stroke="#a6b6b0" stroke-width="1" /><text x="832" y="245" font-family="sans-serif" font-size="12" fill="#355c64" >3</text><line x1="940" y1="214" x2="940" y2="226" stroke="#a6b6b0" stroke-width="1" /><text x="932" y="245" font-family="sans-serif" font-size="12" fill="#355c64" >4</text><line x1="240" y1="208" x2="440" y2="208" stroke="#b87b4f" stroke-width="4" /><polygon points="435.68,202 444.32,202 444.32,174 435.68,174" fill="#b68c65" stroke="#775b43"/><polygon points="420.8,179.6 459.2,179.6 440,132" fill="#86b8a2" stroke="#397f70" stroke-width="2"/><text x="210" y="191" font-family="sans-serif" font-size="13" fill="#355c64" >parent</text><text x="452" y="141" font-family="sans-serif" font-size="13" fill="#355c64" >world X = -1</text><text x="790" y="156" font-family="sans-serif" font-size="17" fill="#355c64" >local X = 2</text><text x="35" y="312" font-family="sans-serif" font-size="17" fill="#355c64" >After: parent = platform</text><line x1="95" y1="430" x2="985" y2="430" stroke="#a6b6b0" stroke-width="2" /><line x1="140" y1="424" x2="140" y2="436" stroke="#a6b6b0" stroke-width="1" /><text x="132" y="455" font-family="sans-serif" font-size="12" fill="#355c64" >-4</text><line x1="240" y1="424" x2="240" y2="436" stroke="#a6b6b0" stroke-width="1" /><text x="232" y="455" font-family="sans-serif" font-size="12" fill="#355c64" >-3</text><line x1="340" y1="424" x2="340" y2="436" stroke="#a6b6b0" stroke-width="1" /><text x="332" y="455" font-family="sans-serif" font-size="12" fill="#355c64" >-2</text><line x1="440" y1="424" x2="440" y2="436" stroke="#a6b6b0" stroke-width="1" /><text x="432" y="455" font-family="sans-serif" font-size="12" fill="#355c64" >-1</text><line x1="540" y1="424" x2="540" y2="436" stroke="#a6b6b0" stroke-width="1" /><text x="532" y="455" font-family="sans-serif" font-size="12" fill="#355c64" >0</text><line x1="640" y1="424" x2="640" y2="436" stroke="#a6b6b0" stroke-width="1" /><text x="632" y="455" font-family="sans-serif" font-size="12" fill="#355c64" >1</text><line x1="740" y1="424" x2="740" y2="436" stroke="#a6b6b0" stroke-width="1" /><text x="732" y="455" font-family="sans-serif" font-size="12" fill="#355c64" >2</text><line x1="840" y1="424" x2="840" y2="436" stroke="#a6b6b0" stroke-width="1" /><text x="832" y="455" font-family="sans-serif" font-size="12" fill="#355c64" >3</text><line x1="940" y1="424" x2="940" y2="436" stroke="#a6b6b0" stroke-width="1" /><text x="932" y="455" font-family="sans-serif" font-size="12" fill="#355c64" >4</text><line x1="840" y1="418" x2="440" y2="418" stroke="#b87b4f" stroke-width="4" /><polygon points="435.68,412 444.32,412 444.32,384 435.68,384" fill="#b68c65" stroke="#775b43"/><polygon points="420.8,389.6 459.2,389.6 440,342" fill="#86b8a2" stroke="#397f70" stroke-width="2"/><text x="810" y="401" font-family="sans-serif" font-size="13" fill="#355c64" >parent</text><text x="452" y="351" font-family="sans-serif" font-size="13" fill="#355c64" >world X = -1</text><text x="790" y="366" font-family="sans-serif" font-size="17" fill="#355c64" >local X = -4</text><text x="30" y="531" font-family="sans-serif" font-size="15" fill="#355c64" >Lnew = inverse(Wparent) × Wchild. The world pose stays fixed.</text></svg>