<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="510" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">Triangle edges and their perpendicular 3D cross product</title>
<desc id="desc">In a right-handed XY plane, edges (2,0,0) and (0,2,0) cross to (0,0,4), giving an upward Z unit normal. Reversing the order reverses the normal; the unsigned triangle area remains two square metres.</desc>
<rect width="960" height="510" rx="18" fill="#fbfaf6"/>
<text x="35" y="38" font-size="23" fill="#264753" font-family="sans-serif" font-weight="600">Two edges make a perpendicular direction</text>
<text x="35" y="60" font-size="14" fill="#647f85" font-family="sans-serif">A=(0,0,0), B=(2,0,0), C=(0,2,0); cross(B-A,C-A)=(0,0,4)</text><polygon points="280,390 480,430 280,190" fill="#c5e5d9" stroke="#287d70" stroke-width="3"/><circle cx="280" cy="390" r="7" fill="#247d70" stroke="white" stroke-width="2"/><text x="292" y="382" font-size="17" font-family="sans-serif" fill="#2e555e">A</text><circle cx="480" cy="430" r="7" fill="#247d70" stroke="white" stroke-width="2"/><text x="492" y="422" font-size="17" font-family="sans-serif" fill="#2e555e">B</text><circle cx="280" cy="190" r="7" fill="#247d70" stroke="white" stroke-width="2"/><text x="292" y="182" font-size="17" font-family="sans-serif" fill="#2e555e">C</text><line x1="346.66666666666663" y1="336.66666666666663" x2="247.66666666666663" y2="408.66666666666663" stroke="#be6c46" stroke-width="5" stroke-linecap="round" /><circle cx="247.66666666666663" cy="408.66666666666663" r="6" fill="#be6c46"/><text x="227.66666666666663" y="388.66666666666663" font-family="sans-serif" font-size="16" fill="#a55c3f">+normal (+Z)</text><rect x="610" y="130" width="318" height="295" rx="12" fill="#edf2ef"/>
<text x="627" y="164" font-size="17" fill="#32505c" font-family="sans-serif" font-weight="600">A triangle has a facing</text>
<text x="627" y="212" font-family="monospace" font-size="15" fill="#345d65">B-A = (2,0,0)</text>
<text x="627" y="244" font-family="monospace" font-size="15" fill="#345d65">C-A = (0,2,0)</text>
<text x="627" y="286" font-family="monospace" font-size="15" fill="#187b69">Cross = (0,0,4)</text>
<text x="627" y="319" font-family="sans-serif" font-size="15" fill="#365c62">Triangle area = 2 m²</text>
<text x="627" y="358" font-family="sans-serif" font-size="13" fill="#65787d">Reverse B and C:</text>
<text x="627" y="380" font-family="sans-serif" font-size="13" fill="#a56449">normal becomes (0,0,-1)</text>
<text x="40" y="486" font-family="sans-serif" font-size="13" fill="#687d81">The face stays in the same plane, but its ordered orientation changes the normal direction.</text>
</svg>
