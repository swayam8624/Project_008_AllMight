<text x="749" y="136" font-family="sans-serif" font-size="17" font-weight="600" fill="#345763">A model, not a photo</text>
<text x="749" y="181" font-family="sans-serif" font-size="14" fill="#52737a">Walls have height.</text>
<text x="749" y="210" font-family="sans-serif" font-size="14" fill="#52737a">The roof has a ridge.</text>
<text x="749" y="239" font-family="sans-serif" font-size="14" fill="#52737a">The ball has depth.</text>
<text x="749" y="287" font-family="sans-serif" font-size="14" fill="#52737a">Straight edges stay straight.</text>
<text x="749" y="317" font-family="sans-serif" font-size="14" fill="#52737a">No perspective divide.</text>
<text x="749" y="347" font-family="sans-serif" font-size="14" fill="#52737a">No hidden-depth test.</text>
<text x="749" y="395" font-family="sans-serif" font-size="13" fill="#1c7869">All geometry has XYZ.</text>
<text x="33" y="572" font-family="sans-serif" font-size="13" fill="#698084">The diagram preserves the numeric 3D model. The later camera will explain how three-dimensional depth becomes an image.</text>
</svg>
