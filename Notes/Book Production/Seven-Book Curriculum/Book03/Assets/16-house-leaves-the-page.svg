<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="600" viewBox="0 0 1010 600" role="img" aria-labelledby="title desc">
<title id="title">A 3D house model drawn using an explicit oblique projection</title>
<desc id="desc">A right-handed 3D house has a floor rectangle, vertical walls from Y=0 to Y=2, and a roof ridge at Y=3. A nearby ball is centered at (2,1,0). The page uses a labelled linear parallel oblique mapping from XYZ metres to pixels; there is no perspective, occlusion solution or claim of a physical photograph.</desc>
<rect width="1010" height="600" rx="18" fill="#fbfaf6"/>
<text x="34" y="38" font-family="sans-serif" font-size="24" font-weight="600" fill="#254653">The paper house has a front, back and a roof ridge</text>
<text x="34" y="60" font-family="sans-serif" font-size="13" fill="#677f85">3D geometry projected with a fixed parallel map: u = 445 + 52x - 30z ; v = 365 + 20x - 55y + 18z</text>
