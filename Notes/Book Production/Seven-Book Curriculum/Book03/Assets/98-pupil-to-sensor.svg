<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">The aperture maps to a sensor footprint</title><desc id="desc">The signed linear pupil scale is positive before convergence, zero at convergence and negative after convergence. Schematic discs show the resulting footprint.</desc><rect width="1080" height="560" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">The aperture maps to a sensor footprint</text><rect x="25" y="80" width="1030" height="410" rx="8" fill="#edf3ef"/><text x="90" y="130" font-family="sans-serif" font-size="18" fill="#345c65">Sensor before convergence</text><circle cx="180" cy="290" r="90" fill="#d1e6da" stroke="#347e6b" stroke-width="2"/><circle cx="270" cy="290" r="4" fill="#b47850"/><circle cx="257.9422863405995" cy="335" r="4" fill="#347e6b"/><circle cx="225" cy="367.9422863405995" r="4" fill="#347e6b"/><circle cx="180" cy="380" r="4" fill="#347e6b"/><circle cx="135.00000000000003" cy="367.9422863405995" r="4" fill="#347e6b"/><circle cx="102.05771365940052" cy="335" r="4" fill="#347e6b"/><circle cx="90" cy="290" r="4" fill="#347e6b"/><circle cx="102.0577136594005" cy="245.00000000000003" r="4" fill="#347e6b"/><circle cx="134.99999999999994" cy="212.05771365940055" r="4" fill="#347e6b"/><circle cx="179.99999999999997" cy="200" r="4" fill="#347e6b"/><circle cx="225" cy="212.05771365940052" r="4" fill="#347e6b"/><circle cx="257.9422863405995" cy="244.99999999999994" r="4" fill="#347e6b"/><circle cx="180" cy="290" r="5" fill="#294e58"/><text x="90" y="435" font-family="sans-serif" font-size="14" fill="#345c65">Signed scale positive</text><text x="400" y="130" font-family="sans-serif" font-size="18" fill="#345c65">At focus</text><circle cx="490" cy="290" r="4" fill="#b47850"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="4" fill="#347e6b"/><circle cx="490" cy="290" r="5" fill="#294e58"/><text x="400" y="435" font-family="sans-serif" font-size="14" fill="#345c65">All pupil rays coincide</text><text x="700" y="130" font-family="sans-serif" font-size="18" fill="#345c65">Sensor after convergence</text><circle cx="790" cy="290" r="60" fill="#d1e6da" stroke="#347e6b" stroke-width="2"/><circle cx="850" cy="290" r="4" fill="#b47850"/><circle cx="841.9615242270663" cy="320" r="4" fill="#347e6b"/><circle cx="820" cy="341.9615242270663" r="4" fill="#347e6b"/><circle cx="790" cy="350" r="4" fill="#347e6b"/><circle cx="760" cy="341.9615242270663" r="4" fill="#347e6b"/><circle cx="738.0384757729337" cy="320" r="4" fill="#347e6b"/><circle cx="730" cy="290" r="4" fill="#347e6b"/><circle cx="738.0384757729337" cy="260" r="4" fill="#347e6b"/><circle cx="760" cy="238.03847577293368" r="4" fill="#347e6b"/><circle cx="790" cy="230" r="4" fill="#347e6b"/><circle cx="820" cy="238.03847577293368" r="4" fill="#347e6b"/><circle cx="841.9615242270663" cy="260" r="4" fill="#347e6b"/><circle cx="790" cy="290" r="5" fill="#294e58"/><text x="700" y="435" font-family="sans-serif" font-size="14" fill="#345c65">Signed scale negative</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">Circular pupil scales about the chief-ray image. Before convergence: positive scale; after convergence: negative scale.</text></svg>