<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Perspective depth endpoint conventions</title><desc id="desc">Forward maps near to zero and far to one; reversed maps near to one and far to zero. Infinite far endpoints are limits.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#284e58" font-weight="600">Perspective depth endpoint conventions</text><rect x="25" y="80" width="1030" height="410" rx="12" fill="#edf3ef"/><text x="45" y="144" font-family="sans-serif" font-size="17" fill="#355d65" >Finite forward</text><line x1="335" y1="132" x2="920" y2="132" stroke="#7eaaa0" stroke-width="3" /><circle cx="335" cy="132" r="7" fill="#397c70" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="920" cy="132" r="7" fill="#397c70" stroke="#fbfaf7" stroke-width="1.5"/><text x="310" y="117" font-family="sans-serif" font-size="13" fill="#355d65" >near n</text><text x="890" y="117" font-family="sans-serif" font-size="13" fill="#355d65" >far f</text><text x="326" y="161" font-family="sans-serif" font-size="15" fill="#355d65" >0</text><text x="914" y="161" font-family="sans-serif" font-size="15" fill="#355d65" >1</text><text x="520" y="120" font-family="sans-serif" font-size="14" fill="#355d65" >q = f(1 − n/d)/(f − n)</text><text x="45" y="235" font-family="sans-serif" font-size="17" fill="#355d65" >Finite reversed</text><line x1="335" y1="223" x2="920" y2="223" stroke="#7eaaa0" stroke-width="3" /><circle cx="335" cy="223" r="7" fill="#397c70" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="920" cy="223" r="7" fill="#397c70" stroke="#fbfaf7" stroke-width="1.5"/><text x="310" y="208" font-family="sans-serif" font-size="13" fill="#355d65" >near n</text><text x="890" y="208" font-family="sans-serif" font-size="13" fill="#355d65" >far f</text><text x="326" y="252" font-family="sans-serif" font-size="15" fill="#355d65" >1</text><text x="914" y="252" font-family="sans-serif" font-size="15" fill="#355d65" >0</text><text x="520" y="211" font-family="sans-serif" font-size="14" fill="#355d65" >q = 1 − qF</text><text x="45" y="326" font-family="sans-serif" font-size="17" fill="#355d65" >Infinite forward</text><line x1="335" y1="314" x2="920" y2="314" stroke="#7eaaa0" stroke-width="3" /><circle cx="335" cy="314" r="7" fill="#397c70" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="920" cy="314" r="7" fill="#397c70" stroke="#fbfaf7" stroke-width="1.5"/><text x="310" y="299" font-family="sans-serif" font-size="13" fill="#355d65" >near n</text><text x="890" y="299" font-family="sans-serif" font-size="13" fill="#355d65" >∞</text><text x="326" y="343" font-family="sans-serif" font-size="15" fill="#355d65" >0</text><text x="914" y="343" font-family="sans-serif" font-size="15" fill="#355d65" >1</text><text x="520" y="302" font-family="sans-serif" font-size="14" fill="#355d65" >q = 1 − n/d</text><text x="45" y="417" font-family="sans-serif" font-size="17" fill="#355d65" >Infinite reversed</text><line x1="335" y1="405" x2="920" y2="405" stroke="#7eaaa0" stroke-width="3" /><circle cx="335" cy="405" r="7" fill="#397c70" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="920" cy="405" r="7" fill="#397c70" stroke="#fbfaf7" stroke-width="1.5"/><text x="310" y="390" font-family="sans-serif" font-size="13" fill="#355d65" >near n</text><text x="890" y="390" font-family="sans-serif" font-size="13" fill="#355d65" >∞</text><text x="326" y="434" font-family="sans-serif" font-size="15" fill="#355d65" >1</text><text x="914" y="434" font-family="sans-serif" font-size="15" fill="#355d65" >0</text><text x="520" y="393" font-family="sans-serif" font-size="14" fill="#355d65" >q = n/d</text><text x="28" y="528" font-family="sans-serif" font-size="13" fill="#355d65" >Infinity is a limiting endpoint, not a finite reconstructed point. Reverse depth also requires a matching test and clear value.</text></svg>