<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Different candidate depths, one stored value</title><desc id="desc">Two binary64 candidate values 0.5 and 0.5000000001 round to the same binary32 value. The selected tie policy determines which ID survives.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Different candidate depths, one stored value</text><rect x="25" y="80" width="1030" height="416" rx="10" fill="#edf3ef"/><text x="55" y="126" font-family="sans-serif" font-size="18" fill="#345c65">Incoming binary64 depths</text><text x="55" y="186" font-family="sans-serif" font-size="22" fill="#345c65">0.5  (ID 9)</text><text x="55" y="240" font-family="sans-serif" font-size="22" fill="#345c65">0.5000000001  (ID 3)</text><line x1="335" y1="180" x2="500" y2="225" stroke="#557eaa" stroke-width="3" /><line x1="335" y1="235" x2="500" y2="225" stroke="#557eaa" stroke-width="3" /><rect x="500" y="150" width="235" height="150" rx="10" fill="#d2e6da"/><text x="520" y="191" font-family="sans-serif" font-size="18" fill="#345c65">Binary32</text><text x="520" y="240" font-family="sans-serif" font-size="23" fill="#345c65">0.5 = 0.5</text><text x="760" y="151" font-family="sans-serif" font-size="18" fill="#345c65">Equal stored depths</text><text x="760" y="202" font-family="sans-serif" font-size="16" fill="#345c65">KeepFirst → ID 9</text><text x="760" y="243" font-family="sans-serif" font-size="16" fill="#345c65">KeepLast → ID 3</text><text x="760" y="285" font-family="sans-serif" font-size="16" fill="#345c65">LowestID → ID 3</text><text x="55" y="387" font-family="sans-serif" font-size="18" fill="#345c65">A deterministic tie policy selects an ID; it cannot recover lost physical depth precision.</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">Illustrated submission order: ID 9 then ID 3. No claim that both candidates are physically coincident.</text></svg>