<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="530" viewBox="0 0 1020 530" role="img" aria-labelledby="title desc">
<title id="title">Two ways a triangle mesh can fail manifold topology</title>
<desc id="desc">Left panel: three triangles all use the same indexed undirected edge between vertices A and B; incidence is three and it is a nonmanifold edge. Right panel: two triangles with index triples (0,1,2) and (0,3,4) share only vertex 0; no edge has excess incidence, but the central vertex contains two separate incident face fans and is nonmanifold. The panel geometry is schematic and the orientation signs are not a certification.</desc>
<rect width="1020" height="530" rx="17" fill="#fbfaf6"/>
<text x="33" y="39" font-family="sans-serif" font-size="23" font-weight="600" fill="#284956">Two faults that need two different checks</text>
<text x="33" y="62" font-family="sans-serif" font-size="14" fill="#6a7c82">A valid surface needs more than a plausible picture and a few edge counts.</text>
<rect x="27" y="91" width="469" height="367" rx="12" fill="#f2edf5"/>
<rect x="517" y="91" width="473" height="367" rx="12" fill="#eaf2ee"/>
<g font-family="sans-serif" font-weight="600" font-size="18" fill="#365763">
<text x="47" y="126">Three faces along one edge</text>
<text x="538" y="126">Two fans at one vertex</text>
</g>
<!-- Shared horizontal edge AB, with three separate triangular face uses -->
<polygon points="135,325 387,325 249,158" fill="#c7dccc" stroke="#659980" stroke-width="2"/>
<polygon points="135,325 387,325 249,423" fill="#e4cbb7" stroke="#b27b59" stroke-width="2"/>
<polygon points="135,325 387,325 324,224" fill="#d7c4e6" fill-opacity=".78" stroke="#9468ad" stroke-width="2"/>
<line x1="135" y1="325" x2="387" y2="325" stroke="#8757a4" stroke-width="8" stroke-linecap="round"/>
<circle cx="135" cy="325" r="8" fill="#8757a4"/>
<circle cx="387" cy="325" r="8" fill="#8757a4"/>
<g font-family="sans-serif" font-size="14" fill="#754d8a">
<text x="118" y="350">A</text><text x="395" y="347">B</text>
<text x="180" y="306">3 incident faces</text>
</g>
<!-- Right: two disjoint face fans sharing only index 0 -->
<polygon points="733,318 573,389 602,189" fill="#bbdfd2" stroke="#397f70" stroke-width="3"/>
<polygon points="733,318 892,389 867,189" fill="#ebcbb5" stroke="#b77451" stroke-width="3"/>
<circle cx="733" cy="318" r="10" fill="#9a5968" stroke="white" stroke-width="2"/>
<g font-family="sans-serif" font-size="14" fill="#426069">
<text x="744" y="314">vertex 0</text>
<text x="586" y="225">fan 1</text><text x="858" y="225">fan 2</text>
<text x="584" y="423">F0 = (0,1,2)</text>
<text x="809" y="423">F1 = (0,3,4)</text>
</g>
<g font-family="monospace" font-size="14" fill="#4a6170">
<text x="43" y="445">edge incidence = 3</text>
<text x="535" y="445">all edge incidences ≤ 2</text>
</g>
<rect x="30" y="475" width="961" height="39" rx="9" fill="#e7f0ee"/>
<text x="45" y="500" font-family="sans-serif" font-size="14" fill="#395e64">Edge nonmanifoldness and vertex-fan nonmanifoldness are distinct diagnostic facts.</text>
</svg>