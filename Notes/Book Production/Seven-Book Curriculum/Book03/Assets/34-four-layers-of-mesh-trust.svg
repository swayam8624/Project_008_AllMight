<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1085" height="549" viewBox="0 0 1085 549" role="img" aria-labelledby="title desc">
<title id="title">Four layers of mesh trust from syntax to intended use</title>
<desc id="desc">Four independent checks shown as columns: bounded grammar and finite tokens, references into correct data streams or glTF bytes, triangle topology and orientation, and application geometry semantics such as units and normals. A successful earlier stage does not imply later correctness.</desc>
<rect width="1085" height="549" rx="16" fill="#fbfaf7"/>
<text x="30" y="41" font-family="sans-serif" font-size="24" fill="#2b4e5b" font-weight="600">A loaded file is not yet a trustworthy mesh</text><text x="30" y="64" font-family="sans-serif" font-size="13" fill="#697e84" >Four independent levels of assurance; each can pass while a later one fails</text><rect x="22" y="109" width="249" height="333" rx="12" fill="#edf3ee"/><text x="39" y="145" font-family="sans-serif" font-size="18" fill="#2e5862" font-weight="600">1. Syntax</text><text x="39" y="202" font-family="sans-serif" font-size="14" fill="#4b6870" >Finite numbers</text><text x="39" y="233" font-family="sans-serif" font-size="14" fill="#4b6870" >Recognized grammar</text><text x="39" y="264" font-family="sans-serif" font-size="14" fill="#4b6870" >Bounded source lines</text><line x1="39" y1="296" x2="252" y2="296" stroke="#abc4b8" stroke-width="1.5" /><text x="39" y="325" font-family="sans-serif" font-size="14" fill="#9d694e" font-weight="600">Valid token</text><text x="39" y="372" font-family="sans-serif" font-size="13" fill="#a46d57" >Still zero-area</text><rect x="291" y="109" width="249" height="333" rx="12" fill="#e9f0ee"/><text x="308" y="145" font-family="sans-serif" font-size="18" fill="#2e5862" font-weight="600">2. References</text><text x="308" y="202" font-family="sans-serif" font-size="14" fill="#4b6870" >Stream-specific IDs</text><text x="308" y="233" font-family="sans-serif" font-size="14" fill="#4b6870" >Buffer offsets</text><text x="308" y="264" font-family="sans-serif" font-size="14" fill="#4b6870" >Counts and strides</text><line x1="308" y1="296" x2="521" y2="296" stroke="#abc4b8" stroke-width="1.5" /><text x="308" y="325" font-family="sans-serif" font-size="14" fill="#9d694e" font-weight="600">Valid number</text><text x="308" y="372" font-family="sans-serif" font-size="13" fill="#a46d57" >Still out of range</text><rect x="560" y="109" width="249" height="333" rx="12" fill="#edf3ee"/><text x="577" y="145" font-family="sans-serif" font-size="18" fill="#2e5862" font-weight="600">3. Topology</text><text x="577" y="202" font-family="sans-serif" font-size="14" fill="#4b6870" >Shared edge direction</text><text x="577" y="233" font-family="sans-serif" font-size="14" fill="#4b6870" >Boundary and fans</text><text x="577" y="264" font-family="sans-serif" font-size="14" fill="#4b6870" >Degenerate faces</text><line x1="577" y1="296" x2="790" y2="296" stroke="#abc4b8" stroke-width="1.5" /><text x="577" y="325" font-family="sans-serif" font-size="14" fill="#9d694e" font-weight="600">Connected?</text><text x="577" y="372" font-family="sans-serif" font-size="13" fill="#a46d57" >Still inside-out</text><rect x="829" y="109" width="249" height="333" rx="12" fill="#e9f0ee"/><text x="846" y="145" font-family="sans-serif" font-size="18" fill="#2e5862" font-weight="600">4. Intended use</text><text x="846" y="202" font-family="sans-serif" font-size="14" fill="#4b6870" >Units and scale</text><text x="846" y="233" font-family="sans-serif" font-size="14" fill="#4b6870" >Normals and seams</text><text x="846" y="264" font-family="sans-serif" font-size="14" fill="#4b6870" >Physical embedding</text><line x1="846" y1="296" x2="1059" y2="296" stroke="#abc4b8" stroke-width="1.5" /><text x="846" y="325" font-family="sans-serif" font-size="14" fill="#9d694e" font-weight="600">Safe for this job?</text><text x="846" y="372" font-family="sans-serif" font-size="13" fill="#a46d57" >Still wrong scale</text><rect x="29" y="462" width="1027" height="64" rx="12" fill="#e7efea"/><text x="47" y="486" font-family="sans-serif" font-size="14" fill="#3b6168" >The parser validates grammar; the auditor evaluates connectivity; the application chooses required geometry semantics.</text><text x="47" y="510" font-family="sans-serif" font-size="13" fill="#6b8084" >No single Boolean can establish all four contracts.</text>
</svg>