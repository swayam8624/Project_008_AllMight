<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Separate computation, orchestration and evidence</title><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Separate computation, orchestration and evidence</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#167b90"/></marker></defs><rect x="300" y="80" width="240" height="65" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="420" y="105" text-anchor="middle" font-weight="bold">studio.hpp</text><text x="420" y="127" text-anchor="middle" font-size="12">Core algorithms and contracts</text><rect x="55" y="220" width="185" height="65" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="147.5" y="245" text-anchor="middle" font-weight="bold">CLI</text><text x="147.5" y="267" text-anchor="middle" font-size="12">Export artifacts</text><rect x="325" y="220" width="185" height="65" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="417.5" y="245" text-anchor="middle" font-weight="bold">CTest</text><text x="417.5" y="267" text-anchor="middle" font-size="12">Independent pixel oracle</text><rect x="595" y="220" width="185" height="65" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="687.5" y="245" text-anchor="middle" font-weight="bold">Future GUI</text><text x="687.5" y="267" text-anchor="middle" font-size="12">Reuse the same core</text><path d="M380 145L147 220" stroke="#167b90" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M420 145L417 220" stroke="#167b90" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M460 145L687 220" stroke="#167b90" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="147" y="324" text-anchor="middle">PPM · OBJ · CSV</text><text x="417" y="324" text-anchor="middle">Geometry · depth · color</text><text x="687" y="324" text-anchor="middle">Not implemented</text><text x="420" y="382" text-anchor="middle">Presentation never becomes the numerical authority.</text></g></svg>
