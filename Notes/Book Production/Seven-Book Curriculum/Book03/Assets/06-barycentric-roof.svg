<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="920" height="575" viewBox="0 0 920 575" role="img" aria-labelledby="title desc">
<title id="title">Barycentric weights express a point within a triangle</title>
<desc id="desc">The right triangle A=(0,0), B=(6,0), C=(0,4) has counterclockwise winding and signed twice-area 24. An interior point P=(1.5,1) has weights one-half at A, one-quarter at B and one-quarter at C. Its point is reconstructed by the affine combination 0.5A+0.25B+0.25C. An exterior point Q=(5,3) is marked outside the triangle.</desc>
<rect width="920" height="575" fill="#fbfaf6" rx="18"/>
<text x="36" y="38" font-size="23" font-family="sans-serif" fill="#233847" font-weight="600">Three corners, one place</text>
<text x="36" y="61" font-size="13" font-family="sans-serif" fill="#687780">Barycentric weights belong to vertices, and always sum to one</text>
<g stroke="#e5eae6" stroke-width="1">
<path d="M150 80 V480 M235 80 V480 M320 80 V480 M405 80 V480 M490 80 V480 M575 80 V480 M660 80 V480"/>
<path d="M95 110 H725 M95 195 H725 M95 280 H725 M95 365 H725 M95 450 H725"/>
</g>
<path d="M95 450 H716" stroke="#8fa5a9" stroke-width="2"/>
<path d="M150 485 V79" stroke="#8fa5a9" stroke-width="2"/>
<polygon points="150,450 660,450 150,110" fill="#d9ece7" stroke="#277c73" stroke-width="3.5"/>
<polygon points="277.5,365 660,450 150,110" fill="#c5dbef" fill-opacity="0.62" stroke="none"/>
<polygon points="150,450 277.5,365 150,110" fill="#f8d5ac" fill-opacity="0.64" stroke="none"/>
<polygon points="150,450 660,450 277.5,365" fill="#d0e8cb" fill-opacity="0.67" stroke="none"/>
<path d="M150 450 L660 450 L150 110 Z" fill="none" stroke="#277c73" stroke-width="3.5"/>
<circle cx="150" cy="450" r="8" fill="#be7650" stroke="#fff" stroke-width="2"/>
<circle cx="660" cy="450" r="8" fill="#318d64" stroke="#fff" stroke-width="2"/>
<circle cx="150" cy="110" r="8" fill="#468bb4" stroke="#fff" stroke-width="2"/>
<circle cx="277.5" cy="365" r="8" fill="#283e57" stroke="#fff" stroke-width="2"/>
<circle cx="575" cy="195" r="7" fill="#af744c" stroke="#fff" stroke-width="2"/>
<g font-size="16" font-family="sans-serif" fill="#294355">
<text x="160" y="470">A = (0,0)</text>
<text x="662" y="471">B = (6,0)</text>
<text x="164" y="102">C = (0,4)</text>
<text x="290" y="350" font-weight="600">P = (1.5,1)</text>
<text x="590" y="185" fill="#a76942">Q = (5,3)</text>
<text x="590" y="204" fill="#a76942" font-size="13">outside</text>
</g>
<rect x="735" y="95" width="164" height="211" rx="10" fill="#edf3f2"/>
<text x="747" y="121" font-size="15" font-family="sans-serif" fill="#344f5b" font-weight="600">Weights at P</text>
<g font-family="monospace" font-size="15" fill="#314f5e">
<text x="748" y="160">A: 0.50</text>
<text x="748" y="191">B: 0.25</text>
<text x="748" y="222">C: 0.25</text>
<text x="748" y="261">Sum = 1.00</text>
<text x="748" y="285">Area = 12</text>
</g>
<rect x="32" y="502" width="865" height="49" rx="10" fill="#eaf3ef"/>
<text x="51" y="522" font-size="15" fill="#294c54" font-family="monospace">0.50 × (0,0) + 0.25 × (6,0) + 0.25 × (0,4)</text>
<text x="51" y="541" font-size="13" fill="#51776d" font-family="sans-serif">The affine sum reconstructs the interior point (1.5,1). The order A, B, C matters.</text>
</svg>
