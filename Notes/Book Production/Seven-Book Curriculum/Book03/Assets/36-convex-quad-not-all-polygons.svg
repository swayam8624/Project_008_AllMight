<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1085" height="555" viewBox="0 0 1085 555" role="img" aria-labelledby="title desc">
<title id="title">Convex planar quad versus concave and warped polygon ingestion</title>
<desc id="desc">Three panels compare an ordinary strictly convex planar four-corner polygon which may be split into triangles (0,1,2) and (0,2,3), an intentionally concave quad which would need careful triangulation rather than a fixed fan, and a warped quad which is not sufficiently coplanar under a declared tolerance. P10 accepts the first and rejects the other two rather than inventing geometry.</desc>
<rect width="1085" height="555" rx="16" fill="#fbfaf7"/>
<text x="29" y="40" font-family="sans-serif" font-size="23" fill="#284e58" font-weight="600">A quad is a promise about its boundary</text><text x="29" y="63" font-family="sans-serif" font-size="13" fill="#677e83" >The first can use a diagonal fan. The second and third need a different policy or explicit rejection.</text><rect x="24" y="96" width="328" height="363" rx="12" fill="#edf3ef"/><text x="36" y="129" font-family="sans-serif" font-size="17" fill="#355a65" font-weight="600">Strictly convex and planar</text><rect x="378" y="96" width="328" height="363" rx="12" fill="#eef1f1"/><text x="390" y="129" font-family="sans-serif" font-size="17" fill="#355a65" font-weight="600">Concave: diagonal escapes</text><rect x="733" y="96" width="328" height="363" rx="12" fill="#edf3ef"/><text x="745" y="129" font-family="sans-serif" font-size="17" fill="#355a65" font-weight="600">Warped: not one plane</text><polygon points="92,369 276,369 278,188 91,190" fill="#c4e0d0" fill-opacity=".67" stroke="#418b79" stroke-width="3"/><line x1="92" y1="369" x2="278" y2="188" stroke="#327d70" stroke-width="3.5" /><circle cx="92" cy="369" r="5" fill="#348677"/><text x="98" y="361" font-family="sans-serif" font-size="13" fill="#315b66" >0</text><circle cx="276" cy="369" r="5" fill="#348677"/><text x="282" y="361" font-family="sans-serif" font-size="13" fill="#315b66" >1</text><circle cx="278" cy="188" r="5" fill="#348677"/><text x="284" y="180" font-family="sans-serif" font-size="13" fill="#315b66" >2</text><circle cx="91" cy="190" r="5" fill="#348677"/><text x="97" y="182" font-family="sans-serif" font-size="13" fill="#315b66" >3</text><polygon points="428,363 650,357 512,281 455,182" fill="#e4d9cd" fill-opacity=".67" stroke="#bd8060" stroke-width="3"/><line x1="428" y1="363" x2="512" y2="281" stroke="#b84f50" stroke-width="3.5" stroke-dasharray="7 5"/><circle cx="428" cy="363" r="5" fill="#b77955"/><text x="434" y="355" font-family="sans-serif" font-size="13" fill="#315b66" >0</text><circle cx="650" cy="357" r="5" fill="#b77955"/><text x="656" y="349" font-family="sans-serif" font-size="13" fill="#315b66" >1</text><circle cx="512" cy="281" r="5" fill="#b77955"/><text x="518" y="273" font-family="sans-serif" font-size="13" fill="#315b66" >2</text><circle cx="455" cy="182" r="5" fill="#b77955"/><text x="461" y="174" font-family="sans-serif" font-size="13" fill="#315b66" >3</text><polygon points="776,366 999,358 988,180 792,200" fill="#e4d9cd" fill-opacity=".67" stroke="#bd8060" stroke-width="3"/><line x1="776" y1="366" x2="988" y2="180" stroke="#b84f50" stroke-width="3.5" stroke-dasharray="7 5"/><circle cx="776" cy="366" r="5" fill="#b77955"/><text x="782" y="358" font-family="sans-serif" font-size="13" fill="#315b66" >0</text><circle cx="999" cy="358" r="5" fill="#b77955"/><text x="1005" y="350" font-family="sans-serif" font-size="13" fill="#315b66" >1</text><circle cx="988" cy="180" r="5" fill="#b77955"/><text x="994" y="172" font-family="sans-serif" font-size="13" fill="#315b66" >2</text><circle cx="792" cy="200" r="5" fill="#b77955"/><text x="798" y="192" font-family="sans-serif" font-size="13" fill="#315b66" >3</text><text x="41" y="421" font-family="sans-serif" font-size="14" fill="#277c6b" >Accepted: 2 triangles</text><text x="394" y="421" font-family="sans-serif" font-size="13" fill="#a16751" >Rejected: no simple convex fan</text><text x="750" y="421" font-family="sans-serif" font-size="13" fill="#a16751" >Rejected: fourth point</text><text x="750" y="441" font-family="sans-serif" font-size="12" fill="#a16751" >off the first triangle plane</text><rect x="27" y="485" width="1034" height="51" rx="12" fill="#e7f0e9"/><text x="44" y="516" font-family="sans-serif" font-size="14" fill="#3f6269" >Ear clipping needs a simple planar polygon and careful predicates; fan triangulation is not universal.</text>
</svg>