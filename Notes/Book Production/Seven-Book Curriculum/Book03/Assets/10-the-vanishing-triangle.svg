<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="980" height="535" viewBox="0 0 980 535" role="img" aria-labelledby="title desc">
<title id="title">A represented triangle with an exact negative area becomes falsely collinear in naive binary64 arithmetic</title>
<desc id="desc">Two evidence panels compare the exact determinant and the naive rounded binary64 result for A=(0,0), B=(N,N+2) and C=(N+2,N+4), with N=10^16. All six input numbers are representable. Algebra gives exact signed twice-area -4, but floating-point products round to the same huge value and naive subtraction gives zero. The needle-thin geometric triangle is deliberately NOT TO SCALE.</desc>
<rect width="980" height="535" fill="#fbfaf7" rx="20"/>
<text x="36" y="38" fill="#223a47" font-family="sans-serif" font-weight="600" font-size="24">The triangle that disappears in arithmetic</text>
<text x="36" y="62" fill="#6a7980" font-family="sans-serif" font-size="14">Not to scale — numerical structure matters more than the drawing's thickness</text>
<rect x="30" y="88" width="442" height="356" rx="12" fill="#edf4f0" stroke="#d4e5df"/>
<rect x="492" y="88" width="458" height="356" rx="12" fill="#f5eeeb" stroke="#e5d8cf"/>
<text x="48" y="118" font-family="sans-serif" font-weight="600" fill="#29695f" font-size="18">Exact arithmetic of the stored inputs</text>
<text x="509" y="118" font-family="sans-serif" font-weight="600" fill="#9d593c" font-size="18">Two rounded products</text>
<g font-family="monospace" font-size="16" fill="#2a4d58">
<text x="48" y="161">A = (0, 0)</text>
<text x="48" y="188">B = (N, N + 2)</text>
<text x="48" y="215">C = (N + 2, N + 4)</text>
<text x="48" y="251">N = 10¹⁶</text>
</g>
<path d="M85 360 L407 304 L395 313 Z" fill="#98cfc1" stroke="#23796c" stroke-width="2"/>
<circle cx="85" cy="360" r="5" fill="#257f70"/><circle cx="407" cy="304" r="5" fill="#257f70"/><circle cx="395" cy="313" r="5" fill="#257f70"/>
<g font-family="monospace" font-size="15" fill="#385e61">
<text x="48" y="398">N(N+4) − (N+2)²</text>
<text x="48" y="422" fill="#16715f" font-weight="600">= −4  (clockwise)</text>
</g>
<g font-family="monospace" font-size="15" fill="#53636c">
<text x="510" y="163">term 1 = round[ N × (N+4) ]</text>
<text x="510" y="194">term 2 = round[ (N+2) × (N+2) ]</text>
</g>
<rect x="516" y="234" width="400" height="70" rx="10" fill="#fffaf5"/>
<text x="533" y="263" font-size="17" font-family="sans-serif" fill="#955b42">Both products become the same</text>
<text x="533" y="289" font-size="16" font-family="sans-serif" fill="#955b42">representable binary64 number.</text>
<text x="513" y="364" font-family="monospace" font-size="19" fill="#a45138" font-weight="600">term 1 − term 2 = 0</text>
<text x="513" y="396" font-family="sans-serif" font-size="13" fill="#68737b">The sign has been lost after rounding.</text>
<rect x="32" y="461" width="916" height="55" rx="11" fill="#e9f2f0"/>
<text x="50" y="484" fill="#315a60" font-size="16" font-family="sans-serif">The input triangle did not vanish. The four-unit difference vanished in the rounded products.</text>
<text x="50" y="505" fill="#58767a" font-size="12" font-family="sans-serif">Exact sign of represented coordinates: negative. Naive sign: zero. Area magnitude is not a reliable double here.</text>
</svg>