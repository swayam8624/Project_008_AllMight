<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">The epipolar plane constrains corresponding measurements</title><desc id="desc">The two camera centers and a common point define an epipolar plane containing both observation rays. Its image-plane intersections are epipolar lines. A coplanarity constraint alone cannot select the physical match.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="29" y="40" font-family="sans-serif" font-size="23" fill="#294e58">The epipolar plane constrains corresponding measurements</text><rect x="25" y="82" width="680" height="407" rx="12" fill="#edf3ef"/><rect x="725" y="82" width="330" height="407" rx="12" fill="#edf3ef"/><polygon points="130,410 515,420 315,100" fill="#c9e2d3" stroke="#69a18d" stroke-width="2"/><polygon points="133,277 269,262 298,330 162,345" fill="#b9cde3" fill-opacity=".6" stroke="#557fa7"/><polygon points="374,273 505,286 533,354 402,341" fill="#b9cde3" fill-opacity=".6" stroke="#557fa7"/><line x1="130" y1="410" x2="315" y2="100" stroke="#357d6e" stroke-width="3" /><line x1="515" y1="420" x2="315" y2="100" stroke="#b47850" stroke-width="3" /><line x1="130" y1="410" x2="515" y2="420" stroke="#527ea7" stroke-width="3" /><line x1="152" y1="320" x2="282" y2="305" stroke="#546fa4" stroke-width="3" /><line x1="389" y1="318" x2="519" y2="331" stroke="#546fa4" stroke-width="3" /><circle cx="130" cy="410" r="6" fill="#367f6e" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="515" cy="420" r="6" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="315" cy="100" r="6" fill="#367f6e" stroke="#fbfaf7" stroke-width="1.5"/><text x="90" y="442" font-family="sans-serif" font-size="14" fill="#365e65">C_L</text><text x="525" y="445" font-family="sans-serif" font-size="14" fill="#365e65">C_R</text><text x="327" y="104" font-family="sans-serif" font-size="14" fill="#365e65">P</text><text x="240" y="384" font-family="sans-serif" font-size="14" fill="#365e65">epipolar plane</text><text x="743" y="124" font-family="sans-serif" font-size="18" fill="#365e65">Coplanar directions</text><text x="743" y="180" font-family="sans-serif" font-size="20" fill="#365e65">b · (u × v) = 0</text><text x="743" y="237" font-family="sans-serif" font-size="19" fill="#365e65">E = [t]× R</text><text x="743" y="290" font-family="sans-serif" font-size="17" fill="#365e65">F = K_R⁻ᵀ E K_L⁻¹</text><text x="743" y="350" font-family="sans-serif" font-size="15" fill="#365e65">A necessary constraint,</text><text x="743" y="375" font-family="sans-serif" font-size="15" fill="#365e65">not proof of a true match.</text><text x="29" y="531" font-family="sans-serif" font-size="13" fill="#365e65">Schematic oblique plane and image-plane intersections. Epipoles may be at infinity.</text></svg>