<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>What changes when a patch moves?</title><desc>Flat, edge and corner neighbourhoods have different displacement costs. The contours illustrate the structure tensor rather than measured image data.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">What changes when a patch moves?</text><rect x="55" y="75" width="190" height="130" fill="#e2eaf0" stroke="#536b8b"/><rect x="125" y="115" width="50" height="50" fill="none" stroke="#c88033" stroke-width="2"/><text x="150" y="228" text-anchor="middle" font-weight="bold">Flat</text><path d="M75 305h150 M150 250v110" stroke="#8b9ba5" stroke-width="1"/><text x="150" y="385" text-anchor="middle">Little change</text><rect x="320" y="75" width="190" height="130" fill="#e2eaf0" stroke="#536b8b"/><rect x="415" y="75" width="95" height="130" fill="#153149"/><rect x="390" y="115" width="50" height="50" fill="none" stroke="#c88033" stroke-width="2"/><text x="415" y="228" text-anchor="middle" font-weight="bold">Edge</text><path d="M340 305h150 M415 250v110" stroke="#8b9ba5" stroke-width="1"/><path d="M389 255v100 M441 255v100" stroke="#167b90" stroke-width="2"/><text x="415" y="385" text-anchor="middle">One strong direction</text><rect x="585" y="75" width="190" height="130" fill="#e2eaf0" stroke="#536b8b"/><rect x="680" y="75" width="95" height="65" fill="#153149"/><rect x="655" y="115" width="50" height="50" fill="none" stroke="#c88033" stroke-width="2"/><text x="680" y="228" text-anchor="middle" font-weight="bold">Corner</text><path d="M605 305h150 M680 250v110" stroke="#8b9ba5" stroke-width="1"/><ellipse cx="680" cy="305" rx="33" ry="29" fill="none" stroke="#167b90" stroke-width="2"/><text x="680" y="385" text-anchor="middle">Two strong directions</text></g></svg>
