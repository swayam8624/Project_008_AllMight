<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>Averaging restores the correct light</title><desc>An alternating linear signal gives phase-dependent point samples of zero or one, while the exact two-texel average is one half for each output sample.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">Averaging restores the correct light</text><text x="70" y="80" font-size="17" text-anchor="start" fill="#153149">Source texels: linear-light values</text><rect x="70" y="95" width="83" height="48" rx="3" fill="#273441" stroke="#657c90"/><text x="111" y="125" font-size="16" text-anchor="middle" fill="#fff">0</text><rect x="155" y="95" width="83" height="48" rx="3" fill="#f9f9f9" stroke="#657c90"/><text x="196" y="125" font-size="16" text-anchor="middle" fill="#153149">1</text><rect x="240" y="95" width="83" height="48" rx="3" fill="#273441" stroke="#657c90"/><text x="281" y="125" font-size="16" text-anchor="middle" fill="#fff">0</text><rect x="325" y="95" width="83" height="48" rx="3" fill="#f9f9f9" stroke="#657c90"/><text x="366" y="125" font-size="16" text-anchor="middle" fill="#153149">1</text><rect x="410" y="95" width="83" height="48" rx="3" fill="#273441" stroke="#657c90"/><text x="451" y="125" font-size="16" text-anchor="middle" fill="#fff">0</text><rect x="495" y="95" width="83" height="48" rx="3" fill="#f9f9f9" stroke="#657c90"/><text x="536" y="125" font-size="16" text-anchor="middle" fill="#153149">1</text><rect x="580" y="95" width="83" height="48" rx="3" fill="#273441" stroke="#657c90"/><text x="621" y="125" font-size="16" text-anchor="middle" fill="#fff">0</text><rect x="665" y="95" width="83" height="48" rx="3" fill="#f9f9f9" stroke="#657c90"/><text x="706" y="125" font-size="16" text-anchor="middle" fill="#153149">1</text><rect x="70" y="180" width="168" height="50" rx="3" fill="#88939b" stroke="#657c90"/><text x="154" y="211" font-size="17" text-anchor="middle" fill="#fff">0.5</text><rect x="240" y="180" width="168" height="50" rx="3" fill="#88939b" stroke="#657c90"/><text x="324" y="211" font-size="17" text-anchor="middle" fill="#fff">0.5</text><rect x="410" y="180" width="168" height="50" rx="3" fill="#88939b" stroke="#657c90"/><text x="494" y="211" font-size="17" text-anchor="middle" fill="#fff">0.5</text><rect x="580" y="180" width="168" height="50" rx="3" fill="#88939b" stroke="#657c90"/><text x="664" y="211" font-size="17" text-anchor="middle" fill="#fff">0.5</text><text x="70" y="166" font-size="16" text-anchor="start" fill="#153149">Two-texel integration</text><text x="70" y="285" font-size="16" text-anchor="start" fill="#153149">Point sampling, phase 0: 0  0  0  0</text><text x="70" y="315" font-size="16" text-anchor="start" fill="#153149">Point sampling, phase 1: 1  1  1  1</text></g></svg>
