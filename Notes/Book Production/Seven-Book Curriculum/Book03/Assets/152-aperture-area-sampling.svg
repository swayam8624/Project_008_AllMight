<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>Uniform radius is not uniform area</title><desc>Equal-width radial bands have areas proportional to 1, 3, 5 and 7. Equal probabilities per band overrepresent the central region; uniform-area sampling gives probabilities proportional to band area.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">Uniform radius is not uniform area</text><circle cx="210" cy="195" r="124" fill="#adcfd7" stroke="#fff" stroke-width="2"/><circle cx="210" cy="195" r="93" fill="#d9ebef" stroke="#fff" stroke-width="2"/><circle cx="210" cy="195" r="62" fill="#adcfd7" stroke="#fff" stroke-width="2"/><circle cx="210" cy="195" r="31" fill="#d9ebef" stroke="#fff" stroke-width="2"/><line x1="210" y1="195" x2="334" y2="195" stroke="#153149" stroke-width="2"/><text x="272" y="187" font-size="15" text-anchor="middle" fill="#153149">R</text><text x="410" y="100" font-size="19" text-anchor="start" fill="#153149" font-weight="bold">Ring area fractions</text><text x="410" y="140" font-size="17" text-anchor="start" fill="#153149">Band 1: 1/16</text><rect x="560" y="121" width="23" height="24" rx="3" fill="#087fa0" stroke="none"/><text x="410" y="178" font-size="17" text-anchor="start" fill="#153149">Band 2: 3/16</text><rect x="560" y="159" width="69" height="24" rx="3" fill="#087fa0" stroke="none"/><text x="410" y="216" font-size="17" text-anchor="start" fill="#153149">Band 3: 5/16</text><rect x="560" y="197" width="115" height="24" rx="3" fill="#087fa0" stroke="none"/><text x="410" y="254" font-size="17" text-anchor="start" fill="#153149">Band 4: 7/16</text><rect x="560" y="235" width="161" height="24" rx="3" fill="#087fa0" stroke="none"/><text x="410" y="320" font-size="18" text-anchor="start" fill="#153149" font-weight="bold">Correct radius = R √U</text></g></svg>
