<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" role="img" aria-labelledby="title desc">
<title id="title">Four curve join cases: disconnected, positional C0, geometric G1 and parametric C2</title>
<desc id="desc">Four schematic curve junctions distinguish a gap (not C0), a positional join with a corner (C0 only), positively aligned tangent directions of unequal magnitude (G1 but not C1), and a straight join whose positions, first and second derivatives match (C2).</desc>
<rect width="1000" height="535" rx="18" fill="#fbfaf7"/>
<text x="30" y="39" font-family="sans-serif" font-size="23" fill="#294953" font-weight="600">Touching, turning, aligning and matching derivatives</text><text x="30" y="62" font-family="sans-serif" font-size="14" fill="#667f83" >Four join conditions; colored arrows indicate the endpoint tangent directions</text><rect x="30" y="91" width="238" height="352" rx="11" fill="#eef3ef"/><text x="42" y="123" font-family="sans-serif" font-size="16" fill="#9e5b45" font-weight="600">Not C⁰: a gap</text><line x1="53" y1="275" x2="149" y2="275" stroke="#287d6c" stroke-width="4" stroke-linecap="round"/><line x1="174" y1="245" x2="242" y2="245" stroke="#b27553" stroke-width="4"/><circle cx="149" cy="275" r="5" fill="#287d6c"/><circle cx="174" cy="245" r="5" fill="#b27553"/><text x="44" y="366" font-family="sans-serif" font-size="12" fill="#58747d" >Positions differ</text><text x="44" y="389" font-family="sans-serif" font-size="12" fill="#9d654f" >No continuity</text><rect x="279" y="91" width="238" height="352" rx="11" fill="#eef1f3"/><text x="291" y="123" font-family="sans-serif" font-size="16" fill="#345a67" font-weight="600">C⁰: a corner</text><line x1="302" y1="275" x2="398" y2="275" stroke="#287d6c" stroke-width="4" stroke-linecap="round"/><line x1="398" y1="275" x2="408" y2="170" stroke="#b27553" stroke-width="4"/><text x="293" y="366" font-family="sans-serif" font-size="12" fill="#58747d" >Same point, new direction</text><text x="293" y="389" font-family="sans-serif" font-size="12" fill="#9d654f" >C⁰ only</text><rect x="528" y="91" width="238" height="352" rx="11" fill="#eef3ef"/><text x="540" y="123" font-family="sans-serif" font-size="16" fill="#345a67" font-weight="600">G¹, not C¹</text><line x1="551" y1="275" x2="647" y2="275" stroke="#287d6c" stroke-width="4" stroke-linecap="round"/><line x1="647" y1="275" x2="742" y2="275" stroke="#b27553" stroke-width="4"/><line x1="647" y1="255" x2="703" y2="255" stroke="#a75e44" stroke-width="3"/><path d="M 703 255 l -10 -6 l 0 12 Z" fill="#a75e44"/><text x="542" y="366" font-family="sans-serif" font-size="12" fill="#58747d" >Same direction, speed changes</text><text x="542" y="389" font-family="sans-serif" font-size="12" fill="#9d654f" >G¹ not C¹</text><rect x="777" y="91" width="238" height="352" rx="11" fill="#eef1f3"/><text x="789" y="123" font-family="sans-serif" font-size="16" fill="#345a67" font-weight="600">C²: a smooth join</text><line x1="800" y1="275" x2="896" y2="275" stroke="#287d6c" stroke-width="4" stroke-linecap="round"/><line x1="896" y1="275" x2="991" y2="275" stroke="#b27553" stroke-width="4"/><line x1="896" y1="255" x2="928" y2="255" stroke="#a75e44" stroke-width="3"/><path d="M 928 255 l -10 -6 l 0 12 Z" fill="#a75e44"/><text x="791" y="366" font-family="sans-serif" font-size="12" fill="#58747d" >Same point and derivatives</text><text x="791" y="389" font-family="sans-serif" font-size="12" fill="#227b6a" >C⁰, C¹ and C²</text><rect x="32" y="463" width="941" height="52" rx="10" fill="#e7f0ed"/><text x="48" y="486" font-family="sans-serif" font-size="14" fill="#315963" >G¹ requires a positive aligned tangent direction; C¹ requires equal parameter derivatives.</text><text x="48" y="507" font-family="sans-serif" font-size="12" fill="#6a7d81" >These are explanatory diagrams, not measured curvature plots.</text>
</svg>
