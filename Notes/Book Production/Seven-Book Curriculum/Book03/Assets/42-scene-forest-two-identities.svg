<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Seven-node forest with one geometry asset</title><desc id="desc">Garden and platform roots each have two tree children. Tree E is a separate root. All five tree nodes reference asset zero. Parent links and geometry references are distinct.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="40" font-family="sans-serif" font-size="23" fill="#294e58" font-weight='600'>Hierarchy edges and asset references mean different things</text><line x1="142" y1="157" x2="137" y2="250" stroke="#397e71" stroke-width="3" /><line x1="142" y1="157" x2="317" y2="250" stroke="#397e71" stroke-width="3" /><line x1="512" y1="157" x2="502" y2="250" stroke="#397e71" stroke-width="3" /><line x1="512" y1="157" x2="682" y2="250" stroke="#397e71" stroke-width="3" /><line x1="137" y1="302" x2="540" y2="430" stroke="#b88b63" stroke-width="1.7" stroke-dasharray="6 5"/><line x1="317" y1="302" x2="540" y2="430" stroke="#b88b63" stroke-width="1.7" stroke-dasharray="6 5"/><line x1="502" y1="302" x2="540" y2="430" stroke="#b88b63" stroke-width="1.7" stroke-dasharray="6 5"/><line x1="682" y1="302" x2="540" y2="430" stroke="#b88b63" stroke-width="1.7" stroke-dasharray="6 5"/><line x1="892" y1="302" x2="540" y2="430" stroke="#b88b63" stroke-width="1.7" stroke-dasharray="6 5"/><rect x="65" y="105" width="155" height="52" rx="12" fill="#edf3ef"/><text x="77" y="137" font-family="sans-serif" font-size="15" fill="#355c64" >0 Garden</text><rect x="435" y="105" width="155" height="52" rx="12" fill="#edf3ef"/><text x="447" y="137" font-family="sans-serif" font-size="15" fill="#355c64" >1 Platform</text><rect x="60" y="250" width="155" height="52" rx="12" fill="#edf3ef"/><text x="72" y="282" font-family="sans-serif" font-size="15" fill="#355c64" >2 Tree A</text><rect x="240" y="250" width="155" height="52" rx="12" fill="#edf3ef"/><text x="252" y="282" font-family="sans-serif" font-size="15" fill="#355c64" >3 Tree B</text><rect x="425" y="250" width="155" height="52" rx="12" fill="#edf3ef"/><text x="437" y="282" font-family="sans-serif" font-size="15" fill="#355c64" >4 Tree C</text><rect x="605" y="250" width="155" height="52" rx="12" fill="#edf3ef"/><text x="617" y="282" font-family="sans-serif" font-size="15" fill="#355c64" >5 Tree D</text><rect x="815" y="250" width="155" height="52" rx="12" fill="#edf3ef"/><text x="827" y="282" font-family="sans-serif" font-size="15" fill="#355c64" >6 Tree E</text><rect x="421" y="430" width="238" height="72" rx="12" fill="#e8e0ce"/><text x="438" y="474" font-family="sans-serif" font-size="17" fill="#355c64" >Asset 0: shared mesh</text><text x="30" y="540" font-family="sans-serif" font-size="13" fill="#355c64" >Solid: parent frame. Dashed: reference to reusable geometry.</text></svg>