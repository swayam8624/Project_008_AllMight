<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>Correlation creates a weak parameter direction</title><desc>The strong eigenvalue is 1 plus correlation, and the weak eigenvalue is 1 minus correlation. At correlation 0.99 the weak eigenvalue falls to 0.01.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">Correlation creates a weak parameter direction</text><line x1="105" y1="95" x2="105" y2="300" stroke="#657c90" stroke-width="2"/><line x1="105" y1="300" x2="695" y2="300" stroke="#657c90" stroke-width="2"/><line x1="105" y1="300" x2="105" y2="306" stroke="#657c90" stroke-width="2"/><text x="105" y="323" font-size="13" text-anchor="middle" fill="#153149">0</text><line x1="252.5" y1="300" x2="252.5" y2="306" stroke="#657c90" stroke-width="2"/><text x="252.5" y="323" font-size="13" text-anchor="middle" fill="#153149">0.25</text><line x1="400" y1="300" x2="400" y2="306" stroke="#657c90" stroke-width="2"/><text x="400" y="323" font-size="13" text-anchor="middle" fill="#153149">0.5</text><line x1="547.5" y1="300" x2="547.5" y2="306" stroke="#657c90" stroke-width="2"/><text x="547.5" y="323" font-size="13" text-anchor="middle" fill="#153149">0.75</text><line x1="695" y1="300" x2="695" y2="306" stroke="#657c90" stroke-width="2"/><text x="695" y="323" font-size="13" text-anchor="middle" fill="#153149">1</text><line x1="105" y1="300" x2="695" y2="300" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="304" font-size="13" text-anchor="end" fill="#153149">0</text><line x1="105" y1="248.75" x2="695" y2="248.75" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="252.75" font-size="13" text-anchor="end" fill="#153149">0.5</text><line x1="105" y1="197.5" x2="695" y2="197.5" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="201.5" font-size="13" text-anchor="end" fill="#153149">1</text><line x1="105" y1="146.25" x2="695" y2="146.25" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="150.25" font-size="13" text-anchor="end" fill="#153149">1.5</text><line x1="105" y1="95" x2="695" y2="95" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="99" font-size="13" text-anchor="end" fill="#153149">2</text><text x="400" y="353" font-size="15" text-anchor="middle" fill="#153149">Correlation between normalized columns</text><text x="105" y="80" font-size="14" text-anchor="start" fill="#153149">Normal-matrix eigenvalue</text><polyline points="105,197.5 400,146.25 689.1,96.025" fill="none" stroke="#087fa0" stroke-width="2.8" stroke-linejoin="round"/><line x1="115" y1="52" x2="136" y2="52" stroke="#087fa0" stroke-width="3"/><text x="142" y="57" font-size="13" text-anchor="start" fill="#153149">Strong</text><polyline points="105,197.5 400,248.75 689.1,298.975" fill="none" stroke="#ac7428" stroke-width="2.8" stroke-linejoin="round"/><circle cx="105" cy="197.5" r="4" fill="#ac7428"/><circle cx="400" cy="248.75" r="4" fill="#ac7428"/><circle cx="689.1" cy="298.975" r="4" fill="#ac7428"/><line x1="255" y1="52" x2="276" y2="52" stroke="#ac7428" stroke-width="3"/><text x="282" y="57" font-size="13" text-anchor="start" fill="#153149">Weak</text></g></svg>
