<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Intersection vertices preserve source-corner provenance</title><desc id="desc">The original triangle corners have unit source weights. The two left-plane intersections carry midpoint weights and raw UV values obtained from the original edge interpolation, preserving attribute discontinuities.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Intersection vertices preserve source-corner provenance</text><rect x="25" y="80" width="1030" height="415" rx="10" fill="#edf3ef"/><text x="55" y="122" font-family="sans-serif" font-size="17" fill="#345c65">Corner</text><text x="330" y="122" font-family="sans-serif" font-size="17" fill="#345c65">Source weights γ</text><text x="730" y="122" font-family="sans-serif" font-size="17" fill="#345c65">Raw UV</text><rect x="45" y="139" width="990" height="48" rx="10" fill="#f9faf7"/><text x="55" y="170" font-family="sans-serif" font-size="18" fill="#345c65">A</text><text x="330" y="170" font-family="sans-serif" font-size="18" fill="#345c65">(1,0,0)</text><text x="730" y="170" font-family="sans-serif" font-size="18" fill="#345c65">(0,0)</text><rect x="45" y="200" width="990" height="48" rx="10" fill="#f9faf7"/><text x="55" y="231" font-family="sans-serif" font-size="18" fill="#345c65">B</text><text x="330" y="231" font-family="sans-serif" font-size="18" fill="#345c65">(0,1,0)</text><text x="730" y="231" font-family="sans-serif" font-size="18" fill="#345c65">(1,0)</text><rect x="45" y="261" width="990" height="48" rx="10" fill="#f9faf7"/><text x="55" y="292" font-family="sans-serif" font-size="18" fill="#345c65">C</text><text x="330" y="292" font-family="sans-serif" font-size="18" fill="#345c65">(0,0,1)</text><text x="730" y="292" font-family="sans-serif" font-size="18" fill="#345c65">(0,1)</text><rect x="45" y="322" width="990" height="48" rx="10" fill="#cde5d6"/><text x="55" y="353" font-family="sans-serif" font-size="18" fill="#345c65">I on AB</text><text x="330" y="353" font-family="sans-serif" font-size="18" fill="#345c65">(1/2,1/2,0)</text><text x="730" y="353" font-family="sans-serif" font-size="18" fill="#345c65">(1/2,0)</text><rect x="45" y="383" width="990" height="48" rx="10" fill="#cde5d6"/><text x="55" y="414" font-family="sans-serif" font-size="18" fill="#345c65">J on AC</text><text x="330" y="414" font-family="sans-serif" font-size="18" fill="#345c65">(1/2,0,1/2)</text><text x="730" y="414" font-family="sans-serif" font-size="18" fill="#345c65">(0,1/2)</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">A generated corner carries weighted provenance, not a fabricated original rendering ID. Normal vectors are not renormalized here.</text></svg>