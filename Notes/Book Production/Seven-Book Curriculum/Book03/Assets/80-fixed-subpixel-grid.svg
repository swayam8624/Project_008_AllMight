03" cy="223.52" r="7" fill="#b47850"/><circle cx="333" cy="239" r="7" fill="#377f6b"/><line x1="352.84000000000003" y1="223.52" x2="333" y2="239" stroke="#507da7" stroke-width="2.5" /><text x="364.84000000000003" y="211.52" font-family="sans-serif" font-size="15" fill="#345c65">original vertex</text><text x="208" y="263" font-family="sans-serif" font-size="15" fill="#345c65">snapped vertex</text><text x="715" y="120" font-family="sans-serif" font-size="18" fill="#345c65">256 steps per pixel</text><text x="715" y="175" font-family="sans-serif" font-size="19" fill="#345c65">X = round(256 x)</text><text x="715" y="211" font-family="sans-serif" font-size="19" fill="#345c65">Y = round(256 y)</text><text x="715" y="283" font-family="sans-serif" font-size="16" fill="#345c65">Sample center:</text><text x="715" y="318" font-family="sans-serif" font-size="16" fill="#345c65">(256 i + 128, 256 j + 128)</text><text x="715" y="382" font-family="sans-serif" font-size="16" fill="#345c65">Exact integer edge tests</text><text x="715" y="411" font-family="sans-serif" font-size="16" fill="#345c65">after geometric snapping.</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">Magnified local lattice, not a full pixel. Each vertex can move by up to half a subpixel per coordinate.</text></svg>