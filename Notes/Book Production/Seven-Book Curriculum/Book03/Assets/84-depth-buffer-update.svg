<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">A depth record is updated per sample</title><desc id="desc">An empty sample accepts surface two at depth 0.75. Surface one at depth 0.25 then wins the forward comparison, replacing both depth and ID.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">A depth record is updated per sample</text><rect x="25" y="90" width="330" height="315" rx="10" fill="#edf3ef"/><text x="45" y="128" font-family="sans-serif" font-size="19" fill="#345c65">Empty sample</text><text x="45" y="179" font-family="sans-serif" font-size="16" fill="#345c65">No winner yet</text><rect x="60" y="225" width="260" height="130" rx="10" fill="#f2f0e7"/><text x="80" y="296" font-family="sans-serif" font-size="24" fill="#345c65">∅</text><rect x="375" y="90" width="330" height="315" rx="10" fill="#edf3ef"/><text x="395" y="128" font-family="sans-serif" font-size="19" fill="#345c65">Submit surface 2</text><text x="395" y="179" font-family="sans-serif" font-size="16" fill="#345c65">q = 0.75; ID = 2</text><rect x="410" y="225" width="260" height="130" rx="10" fill="#e7c9aa"/><text x="430" y="296" font-family="sans-serif" font-size="24" fill="#345c65">Stored: 2</text><rect x="725" y="90" width="330" height="315" rx="10" fill="#edf3ef"/><text x="745" y="128" font-family="sans-serif" font-size="19" fill="#345c65">Submit surface 1</text><text x="745" y="179" font-family="sans-serif" font-size="16" fill="#345c65">q = 0.25; ID = 1</text><rect x="760" y="225" width="260" height="130" rx="10" fill="#a8d7c4"/><text x="780" y="296" font-family="sans-serif" font-size="24" fill="#345c65">Stored: 1</text><text x="357" y="257" font-family="sans-serif" font-size="22" fill="#345c65">→</text><text x="707" y="257" font-family="sans-serif" font-size="22" fill="#345c65">→</text><text x="28" y="450" font-family="sans-serif" font-size="19" fill="#345c65">Forward comparison: 0.25 < 0.75. Depth and ID are replaced together.</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">An explicit empty state accepts either endpoint; this is a reference policy, not a hardware clear sentinel.</text></svg>