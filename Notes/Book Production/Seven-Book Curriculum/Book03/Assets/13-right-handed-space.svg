<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="990" height="580" viewBox="0 0 990 580" role="img" aria-labelledby="title desc">
<title id="title">Three right-handed 3D coordinate axes and a world point</title>
<desc id="desc">World X points right, Y points upward, Z points toward the viewer in a parallel oblique drawing. An example point at (2,1,2) metres is marked. No camera perspective is implied.</desc>
<rect width="990" height="580" rx="18" fill="#fbfaf6"/>
<text x="35" y="39" font-family="sans-serif" font-size="23" font-weight="600" fill="#264653">The third direction makes a world</text>
<text x="35" y="62" font-family="sans-serif" font-size="14" fill="#637d81">Right-handed frame: world +X right, +Y up, +Z toward the viewer</text>
<rect x="26" y="90" width="690" height="420" rx="13" fill="#f1f5f2"/>
<g stroke="#d6e3de" stroke-width="1"><line x1="220" y1="186" x2="-110" y2="414" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="315" y1="211" x2="-15" y2="439" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="410" y1="236" x2="80" y2="464" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="505" y1="261" x2="175" y2="489" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="600" y1="286" x2="270" y2="514" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="695" y1="311" x2="365" y2="539" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="790" y1="336" x2="460" y2="564" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="220" y1="186" x2="790" y2="336" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="165" y1="224" x2="735" y2="374" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="110" y1="262" x2="680" y2="412" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="55" y1="300" x2="625" y2="450" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="0" y1="338" x2="570" y2="488" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="-55" y1="376" x2="515" y2="526" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /><line x1="-110" y1="414" x2="460" y2="564" stroke="#dce6e1" stroke-width="1" stroke-linecap="round" /></g><line x1="340" y1="375" x2="587" y2="440" stroke="#b66e4c" stroke-width="4" stroke-linecap="round" /><text x="599" y="433" font-size="16" font-family="sans-serif" fill="#b66e4c" font-weight="600">+X</text><line x1="340" y1="375" x2="340" y2="105" stroke="#3c84a3" stroke-width="4" stroke-linecap="round" /><text x="352" y="98" font-size="16" font-family="sans-serif" fill="#3c84a3" font-weight="600">+Y</text><line x1="340" y1="375" x2="191.5" y2="477.6" stroke="#2d8c71" stroke-width="4" stroke-linecap="round" /><text x="203.5" y="470.6" font-size="16" font-family="sans-serif" fill="#2d8c71" font-weight="600">+Z</text><circle cx="420" cy="401" r="9" fill="#253f5a" stroke="white" stroke-width="2"/><text x="434" y="388" font-family="sans-serif" font-size="15" fill="#253f5a">P = (2,1,2) m</text><rect x="738" y="107" width="225" height="260" rx="11" fill="#ebf1ee"/><text x="754" y="137" font-size="17" font-weight="600" fill="#315260" font-family="sans-serif">Three independent axes</text><text x="754" y="174" font-size="14" fill="#a66246" font-family="sans-serif">X: left and right</text><text x="754" y="204" font-size="14" fill="#327e9d" font-family="sans-serif">Y: up and down</text><text x="754" y="234" font-size="14" fill="#2b826b" font-family="sans-serif">Z: depth</text><text x="754" y="286" font-size="13" fill="#536d75" font-family="sans-serif">The point lives in 3D.</text><text x="754" y="310" font-size="13" fill="#536d75" font-family="sans-serif">This page is a</text><text x="754" y="329" font-size="13" fill="#536d75" font-family="sans-serif">parallel illustration,</text><text x="754" y="348" font-size="13" fill="#536d75" font-family="sans-serif">not a camera.</text><text x="34" y="554" font-family="sans-serif" font-size="13" fill="#667a81">The three coordinate numbers measure distances along the declared world directions.</text>
</svg>
