<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Improved reprojection is not always improved 3D</title><desc>At one-pixel coordinate noise, refinement decreases mean reprojection RMS but increases mean three-dimensional RMS. Separate labeled zoomed axes show the actual magnitudes; the data are means of twenty synthetic trials.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Improved reprojection is not always improved 3D</text><text x="230" y="85" text-anchor="middle" font-weight="bold">Pixel RMS (pixels)</text><text x="630" y="85" text-anchor="middle" font-weight="bold">3D RMS (baseline units)</text><path d="M100 120V300H360 M500 120V300H760" stroke="#536b8b" fill="none"/><g stroke="#d0dce2"><path d="M100 120H360 M100 180H360 M100 240H360 M500 120H760 M500 180H760 M500 240H760"/></g><g font-size="12" text-anchor="end"><text x="92" y="124">1.0119</text><text x="92" y="184">1.0116</text><text x="92" y="244">1.0113</text><text x="92" y="304">1.0110</text><text x="492" y="124">0.0840</text><text x="492" y="184">0.0838</text><text x="492" y="244">0.0836</text><text x="492" y="304">0.0834</text></g><path d="M165 178.00148L295 246.5234 M565 197.398578L695 152.209788" stroke="#167b90" stroke-width="2.5" fill="none"/><g fill="#fff" stroke="#167b90" stroke-width="2.5"><circle cx="165" cy="178.00148" r="6"/><circle cx="295" cy="246.5234" r="6"/><circle cx="565" cy="197.398578" r="6"/><circle cx="695" cy="152.209788" r="6"/></g><g font-size="13" text-anchor="middle"><text x="165" y="162">1.011610</text><text x="295" y="267">1.011267</text><text x="565" y="218">0.083742</text><text x="695" y="137">0.083893</text><text x="165" y="325">Initial</text><text x="295" y="325">Refined</text><text x="565" y="325">Initial</text><text x="695" y="325">Refined</text></g><text x="420" y="367" text-anchor="middle">Both vertical axes are zoomed; compare values, not line slopes.</text><text x="420" y="389" text-anchor="middle" font-size="13">Twenty synthetic trials at one-pixel coordinate noise.</text></g></svg>
