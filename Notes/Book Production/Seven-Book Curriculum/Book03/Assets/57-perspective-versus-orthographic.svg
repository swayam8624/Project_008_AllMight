<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Perspective versus orthographic projection</title><desc id="desc">Perspective rays share one center; orthographic projection rays are parallel. The diagram compares transverse image widths schematically.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#284e58" font-weight="600">Perspective versus orthographic projection</text><rect x="25" y="80" width="505" height="415" rx="12" fill="#edf3ef"/><text x="40" y="114" font-family="sans-serif" font-size="18" fill="#355d65" >Perspective: convergent rays</text><line x1="65" y1="300" x2="502" y2="300" stroke="#b0c2bb" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="200" y1="155" x2="200" y2="430" stroke="#507da7" stroke-width="3" /><line x1="445" y1="190" x2="445" y2="410" stroke="#508e7b" stroke-width="4" /><circle cx="80" cy="300" r="7" fill="#344e55" stroke="#fbfaf7" stroke-width="1.5"/><line x1="80" y1="300" x2="445" y2="190" stroke="#ba815c" stroke-width="3" /><line x1="80" y1="300" x2="445" y2="410" stroke="#ba815c" stroke-width="3" /><line x1="200" y1="263.83561643835617" x2="200" y2="336.16438356164383" stroke="#b47951" stroke-width="5" /><text x="165" y="450" font-family="sans-serif" font-size="12" fill="#355d65" >image plane</text><text x="408" y="435" font-family="sans-serif" font-size="12" fill="#355d65" >object</text><text x="40" y="477" font-family="sans-serif" font-size="14" fill="#355d65" >w = d; divide XY by depth</text><rect x="550" y="80" width="505" height="415" rx="12" fill="#edf3ef"/><text x="565" y="114" font-family="sans-serif" font-size="18" fill="#355d65" >Orthographic: parallel rays</text><line x1="590" y1="300" x2="1027" y2="300" stroke="#b0c2bb" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="725" y1="155" x2="725" y2="430" stroke="#507da7" stroke-width="3" /><line x1="970" y1="190" x2="970" y2="410" stroke="#508e7b" stroke-width="4" /><line x1="605" y1="190" x2="970" y2="190" stroke="#ba815c" stroke-width="3" /><line x1="605" y1="410" x2="970" y2="410" stroke="#ba815c" stroke-width="3" /><line x1="725" y1="190" x2="725" y2="410" stroke="#b47951" stroke-width="5" /><text x="690" y="450" font-family="sans-serif" font-size="12" fill="#355d65" >image plane</text><text x="933" y="435" font-family="sans-serif" font-size="12" fill="#355d65" >object</text><text x="565" y="477" font-family="sans-serif" font-size="14" fill="#355d65" >w = 1; XY independent of depth</text><text x="28" y="529" font-family="sans-serif" font-size="13" fill="#355d65" >Equal transverse object size in both panels; the orthographic image does not shrink with depth.</text></svg>