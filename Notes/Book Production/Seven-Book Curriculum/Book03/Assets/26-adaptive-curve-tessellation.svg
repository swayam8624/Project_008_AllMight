<svg xmlns="http://www.w3.org/2000/svg" width="1030" height="580" viewBox="0 0 1030 580" role="img" aria-labelledby="title desc">
<title id="title">Adaptive Bézier chord tessellation handles both an arch and a loop with coincident endpoints</title>
<desc id="desc">An arch and a loop whose start equals end are tessellated by recursively splitting when the maximum control point to chord-segment distance exceeds 0.045 world units in an illustrative double arithmetic computation. Every subdivision draws genuine geometry from de Casteljau controls; a degenerate endpoint chord does not erase the loop. These are illustrative results, not certified Hausdorff measurements.</desc>
<rect width="1030" height="580" rx="18" fill="#fbfaf7"/>
