<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Incremental edge evaluation</title><desc id="desc">A grid of illustrative edge values decreases by four horizontally and increases by eight vertically, demonstrating constant affine increments.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Incremental edge evaluation</text><rect x="25" y="80" width="650" height="415" rx="10" fill="#edf3ef"/><rect x="695" y="80" width="360" height="415" rx="10" fill="#edf3ef"/><rect x="80" y="123" width="115" height="64" rx="10" fill="#cde5d6"/><text x="120" y="162" font-family="sans-serif" font-size="22" fill="#345c65">12</text><text x="198" y="162" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><text x="117" y="204" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="220" y="123" width="115" height="64" rx="10" fill="#cde5d6"/><text x="260" y="162" font-family="sans-serif" font-size="22" fill="#345c65">8</text><text x="338" y="162" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><text x="257" y="204" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="360" y="123" width="115" height="64" rx="10" fill="#cde5d6"/><text x="400" y="162" font-family="sans-serif" font-size="22" fill="#345c65">4</text><text x="478" y="162" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><text x="397" y="204" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="500" y="123" width="115" height="64" rx="10" fill="#ead8bf"/><text x="540" y="162" font-family="sans-serif" font-size="22" fill="#345c65">0</text><text x="537" y="204" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="80" y="211" width="115" height="64" rx="10" fill="#cde5d6"/><text x="120" y="250" font-family="sans-serif" font-size="22" fill="#345c65">20</text><text x="198" y="250" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><text x="117" y="292" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="220" y="211" width="115" height="64" rx="10" fill="#cde5d6"/><text x="260" y="250" font-family="sans-serif" font-size="22" fill="#345c65">16</text><text x="338" y="250" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><text x="257" y="292" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="360" y="211" width="115" height="64" rx="10" fill="#cde5d6"/><text x="400" y="250" font-family="sans-serif" font-size="22" fill="#345c65">12</text><text x="478" y="250" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><text x="397" y="292" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="500" y="211" width="115" height="64" rx="10" fill="#cde5d6"/><text x="540" y="250" font-family="sans-serif" font-size="22" fill="#345c65">8</text><text x="537" y="292" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="80" y="299" width="115" height="64" rx="10" fill="#cde5d6"/><text x="120" y="338" font-family="sans-serif" font-size="22" fill="#345c65">28</text><text x="198" y="338" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><text x="117" y="380" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="220" y="299" width="115" height="64" rx="10" fill="#cde5d6"/><text x="260" y="338" font-family="sans-serif" font-size="22" fill="#345c65">24</text><text x="338" y="338" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><text x="257" y="380" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="360" y="299" width="115" height="64" rx="10" fill="#cde5d6"/><text x="400" y="338" font-family="sans-serif" font-size="22" fill="#345c65">20</text><text x="478" y="338" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><text x="397" y="380" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="500" y="299" width="115" height="64" rx="10" fill="#cde5d6"/><text x="540" y="338" font-family="sans-serif" font-size="22" fill="#345c65">16</text><text x="537" y="380" font-family="sans-serif" font-size="14" fill="#345c65">+8</text><rect x="80" y="387" width="115" height="64" rx="10" fill="#cde5d6"/><text x="120" y="426" font-family="sans-serif" font-size="22" fill="#345c65">36</text><text x="198" y="426" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><rect x="220" y="387" width="115" height="64" rx="10" fill="#cde5d6"/><text x="260" y="426" font-family="sans-serif" font-size="22" fill="#345c65">32</text><text x="338" y="426" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><rect x="360" y="387" width="115" height="64" rx="10" fill="#cde5d6"/><text x="400" y="426" font-family="sans-serif" font-size="22" fill="#345c65">28</text><text x="478" y="426" font-family="sans-serif" font-size="14" fill="#345c65">−4</text><rect x="500" y="387" width="115" height="64" rx="10" fill="#cde5d6"/><text x="540" y="426" font-family="sans-serif" font-size="22" fill="#345c65">24</text><text x="715" y="120" font-family="sans-serif" font-size="18" fill="#345c65">Affine edge function</text><text x="715" y="180" font-family="sans-serif" font-size="16" fill="#345c65">E(x+S,y) = E(x,y) + Δx</text><text x="715" y="224" font-family="sans-serif" font-size="16" fill="#345c65">E(x,y+S) = E(x,y) + Δy</text><text x="715" y="293" font-family="sans-serif" font-size="18" fill="#345c65">Δx = −(By−Ay) S</text><text x="715" y="334" font-family="sans-serif" font-size="18" fill="#345c65">Δy = (Bx−Ax) S</text><text x="715" y="403" font-family="sans-serif" font-size="14" fill="#345c65">Illustrated increments: −4, +8.</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">Integer edge values can be incremented across the bounding box without recalculating each determinant.</text></svg>