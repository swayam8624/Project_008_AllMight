<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>A chain of explicit coordinate contracts</title><desc>The integrated studio maps optical mesh coordinates to tracks, reconstructs points, adapts them to renderer inputs and encodes an image. Ground truth is retained separately.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">A chain of explicit coordinate contracts</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#167b90"/></marker></defs><rect x="55" y="95" width="185" height="65" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="147.5" y="120" text-anchor="middle" font-weight="bold">Fixture mesh</text><text x="147.5" y="142" text-anchor="middle" font-size="12">Optical metres, indices</text><rect x="325" y="95" width="185" height="65" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="417.5" y="120" text-anchor="middle" font-weight="bold">Projection</text><text x="417.5" y="142" text-anchor="middle" font-size="12">K, known poses</text><rect x="595" y="95" width="185" height="65" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="687.5" y="120" text-anchor="middle" font-weight="bold">Tracks</text><text x="687.5" y="142" text-anchor="middle" font-size="12">Pixel-edge coordinates</text><path d="M240 127L325 127" stroke="#167b90" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M510 127L595 127" stroke="#167b90" stroke-width="2" fill="none" marker-end="url(#a)"/><rect x="595" y="245" width="185" height="65" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="687.5" y="270" text-anchor="middle" font-weight="bold">Reconstruction</text><text x="687.5" y="292" text-anchor="middle" font-size="12">Triangulate and refine</text><rect x="325" y="245" width="185" height="65" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="417.5" y="270" text-anchor="middle" font-weight="bold">Render adapter</text><text x="417.5" y="292" text-anchor="middle" font-size="12">Screen, q, clip w</text><rect x="55" y="245" width="185" height="65" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="147.5" y="270" text-anchor="middle" font-weight="bold">Image</text><text x="147.5" y="292" text-anchor="middle" font-size="12">Linear RGB → encoded PPM</text><path d="M687 160L687 245" stroke="#167b90" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M595 277L510 277" stroke="#167b90" stroke-width="2" fill="none" marker-end="url(#a)"/><path d="M325 277L240 277" stroke="#167b90" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="420" y="380" text-anchor="middle">Original geometry is retained separately for validation.</text></g></svg>
