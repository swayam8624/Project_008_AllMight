<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Intrinsics map direction to a continuous image address</title><desc id="desc">The default 640 by 480 image with principal point (320,240), focal scales 400 and zero skew projects optical point (1,-1,4) at (420,140). A magnified pixel grid marks centers at half-integer coordinates.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="41" font-family="sans-serif" font-size="23" fill="#284e58" font-weight="600">Intrinsics map direction to a continuous image address</text><rect x="25" y="82" width="700" height="407" rx="12" fill="#edf3ef"/><rect x="743" y="82" width="312" height="407" rx="12" fill="#edf3ef"/><rect x="65" y="110" width="460.79999999999995" height="345.59999999999997" fill="#fdfdfb" stroke="#668982" stroke-width="2"/><line x1="122.6" y1="110" x2="122.6" y2="455.59999999999997" stroke="#e3ebe6" stroke-width="1" /><line x1="180.2" y1="110" x2="180.2" y2="455.59999999999997" stroke="#e3ebe6" stroke-width="1" /><line x1="237.79999999999998" y1="110" x2="237.79999999999998" y2="455.59999999999997" stroke="#e3ebe6" stroke-width="1" /><line x1="295.4" y1="110" x2="295.4" y2="455.59999999999997" stroke="#e3ebe6" stroke-width="1" /><line x1="353" y1="110" x2="353" y2="455.59999999999997" stroke="#e3ebe6" stroke-width="1" /><line x1="410.59999999999997" y1="110" x2="410.59999999999997" y2="455.59999999999997" stroke="#e3ebe6" stroke-width="1" /><line x1="468.2" y1="110" x2="468.2" y2="455.59999999999997" stroke="#e3ebe6" stroke-width="1" /><line x1="65" y1="167.6" x2="525.8" y2="167.6" stroke="#e3ebe6" stroke-width="1" /><line x1="65" y1="225.2" x2="525.8" y2="225.2" stroke="#e3ebe6" stroke-width="1" /><line x1="65" y1="282.79999999999995" x2="525.8" y2="282.79999999999995" stroke="#e3ebe6" stroke-width="1" /><line x1="65" y1="340.4" x2="525.8" y2="340.4" stroke="#e3ebe6" stroke-width="1" /><line x1="65" y1="398" x2="525.8" y2="398" stroke="#e3ebe6" stroke-width="1" /><line x1="65" y1="282.79999999999995" x2="525.8" y2="282.79999999999995" stroke="#9eb7ad" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="295.4" y1="110" x2="295.4" y2="455.59999999999997" stroke="#9eb7ad" stroke-width="1.5" stroke-dasharray="5 5"/><line x1="295.4" y1="282.79999999999995" x2="367.4" y2="282.79999999999995" stroke="#b47a53" stroke-width="2" /><line x1="367.4" y1="282.79999999999995" x2="367.4" y2="210.8" stroke="#b47a53" stroke-width="2" /><circle cx="295.4" cy="282.79999999999995" r="6" fill="#507da7" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="367.4" cy="210.8" r="6" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="204.39999999999998" y="302.79999999999995" font-family="sans-serif" font-size="13" fill="#355d65" >(320,240)</text><text x="376.4" y="203.8" font-family="sans-serif" font-size="14" fill="#355d65" >(420,140)</text><text x="65" y="101" font-family="sans-serif" font-size="14" fill="#355d65" >(0,0)</text><text x="533.8" y="115" font-family="sans-serif" font-size="14" fill="#355d65" >u →</text><text x="39" y="447.59999999999997" font-family="sans-serif" font-size="14" fill="#355d65" >v ↓</text><text x="745" y="116" font-family="sans-serif" font-size="18" fill="#355d65" >K: 640 × 480</text><text x="760" y="164" font-family="sans-serif" font-size="16" fill="#355d65" >fₓ = fᵧ = 400 px</text><text x="760" y="195" font-family="sans-serif" font-size="16" fill="#355d65" >c = (320,240)</text><text x="760" y="249" font-family="sans-serif" font-size="16" fill="#355d65" >Pₒ = (1,−1,4) m</text><text x="760" y="283" font-family="sans-serif" font-size="19" fill="#287b68" >u = 420; v = 140</text><rect x="777" y="345" width="45" height="45" fill="#fdfdfb" stroke="#a0b5ae"/><circle cx="799.5" cy="367.5" r="3" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><rect x="822" y="345" width="45" height="45" fill="#fdfdfb" stroke="#a0b5ae"/><circle cx="844.5" cy="367.5" r="3" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><rect x="867" y="345" width="45" height="45" fill="#fdfdfb" stroke="#a0b5ae"/><circle cx="889.5" cy="367.5" r="3" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><rect x="912" y="345" width="45" height="45" fill="#fdfdfb" stroke="#a0b5ae"/><circle cx="934.5" cy="367.5" r="3" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><rect x="777" y="390" width="45" height="45" fill="#fdfdfb" stroke="#a0b5ae"/><circle cx="799.5" cy="412.5" r="3" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><rect x="822" y="390" width="45" height="45" fill="#fdfdfb" stroke="#a0b5ae"/><circle cx="844.5" cy="412.5" r="3" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><rect x="867" y="390" width="45" height="45" fill="#fdfdfb" stroke="#a0b5ae"/><circle cx="889.5" cy="412.5" r="3" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><rect x="912" y="390" width="45" height="45" fill="#fdfdfb" stroke="#a0b5ae"/><circle cx="934.5" cy="412.5" r="3" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="760" y="335" font-family="sans-serif" font-size="12" fill="#355d65" >Magnified pixel-center convention</text><text x="760" y="458" font-family="sans-serif" font-size="13" fill="#355d65" >Centers at (i+½,j+½)</text><text x="30" y="528" font-family="sans-serif" font-size="13" fill="#355d65" >The projected point is continuous. Pixel centers are separate sample locations, and image membership is not visibility.</text></svg>