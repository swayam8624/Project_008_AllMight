<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">World, graphics camera and optical coordinate frames</title><desc id="desc">Three oblique coordinate-frame diagrams distinguish the world frame, right/up/back graphics local axes, and right/down/forward optical axes. Graphics local minus Z is forward; optical plus Z is forward.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="41" font-family="sans-serif" font-size="23" fill="#284e58" font-weight="600">World, graphics camera and optical coordinate frames</text><rect x="25" y="90" width="330" height="385" rx="12" fill="#edf3ef"/><rect x="375" y="90" width="330" height="385" rx="12" fill="#edf3ef"/><rect x="725" y="90" width="330" height="385" rx="12" fill="#edf3ef"/><text x="40" y="126" font-family="sans-serif" font-size="18" fill="#355d65" >World frame</text><line x1="170" y1="275" x2="256" y2="275" stroke="#b46c4f" stroke-width="4" /><circle cx="256" cy="275" r="5" fill="#b46c4f" stroke="#fbfaf7" stroke-width="1.5"/><text x="264" y="266" font-family="sans-serif" font-size="15" fill="#b46c4f" >X</text><line x1="170" y1="275" x2="170" y2="189" stroke="#38806b" stroke-width="4" /><circle cx="170" cy="189" r="5" fill="#38806b" stroke="#fbfaf7" stroke-width="1.5"/><text x="178" y="180" font-family="sans-serif" font-size="15" fill="#38806b" >Y</text><line x1="170" y1="275" x2="128.72" y2="300.8" stroke="#507ca8" stroke-width="4" /><circle cx="128.72" cy="300.8" r="5" fill="#507ca8" stroke="#fbfaf7" stroke-width="1.5"/><text x="136.72" y="291.8" font-family="sans-serif" font-size="15" fill="#507ca8" >Z</text><circle cx="170" cy="275" r="5" fill="#344e55" stroke="#fbfaf7" stroke-width="1.5"/><text x="40" y="418" font-family="sans-serif" font-size="16" fill="#355d65" >Camera pose: (R,C)</text><text x="390" y="126" font-family="sans-serif" font-size="18" fill="#355d65" >Graphics camera-local</text><line x1="525" y1="275" x2="611" y2="275" stroke="#b46c4f" stroke-width="4" /><circle cx="611" cy="275" r="5" fill="#b46c4f" stroke="#fbfaf7" stroke-width="1.5"/><text x="619" y="266" font-family="sans-serif" font-size="15" fill="#b46c4f" >x</text><line x1="525" y1="275" x2="525" y2="189" stroke="#38806b" stroke-width="4" /><circle cx="525" cy="189" r="5" fill="#38806b" stroke="#fbfaf7" stroke-width="1.5"/><text x="533" y="180" font-family="sans-serif" font-size="15" fill="#38806b" >y</text><line x1="525" y1="275" x2="483.72" y2="300.8" stroke="#507ca8" stroke-width="4" /><circle cx="483.72" cy="300.8" r="5" fill="#507ca8" stroke="#fbfaf7" stroke-width="1.5"/><text x="491.72" y="291.8" font-family="sans-serif" font-size="15" fill="#507ca8" >z</text><circle cx="525" cy="275" r="5" fill="#344e55" stroke="#fbfaf7" stroke-width="1.5"/><line x1="525" y1="275" x2="566.28" y2="249.2" stroke="#a77948" stroke-width="3" stroke-dasharray="6 5"/><text x="567" y="239" font-family="sans-serif" font-size="13" fill="#355d65" >forward −z</text><text x="390" y="418" font-family="sans-serif" font-size="16" fill="#355d65" >p = Rᵀ(P − C)</text><text x="740" y="126" font-family="sans-serif" font-size="18" fill="#355d65" >Optical frame</text><line x1="875" y1="275" x2="961" y2="275" stroke="#b46c4f" stroke-width="4" /><circle cx="961" cy="275" r="5" fill="#b46c4f" stroke="#fbfaf7" stroke-width="1.5"/><text x="969" y="266" font-family="sans-serif" font-size="15" fill="#b46c4f" >X</text><line x1="875" y1="275" x2="875" y2="361" stroke="#38806b" stroke-width="4" /><circle cx="875" cy="361" r="5" fill="#38806b" stroke="#fbfaf7" stroke-width="1.5"/><text x="883" y="352" font-family="sans-serif" font-size="15" fill="#38806b" >Y</text><line x1="875" y1="275" x2="916.28" y2="249.2" stroke="#507ca8" stroke-width="4" /><circle cx="916.28" cy="249.2" r="5" fill="#507ca8" stroke="#fbfaf7" stroke-width="1.5"/><text x="924.28" y="240.2" font-family="sans-serif" font-size="15" fill="#507ca8" >Z</text><circle cx="875" cy="275" r="5" fill="#344e55" stroke="#fbfaf7" stroke-width="1.5"/><text x="740" y="418" font-family="sans-serif" font-size="16" fill="#355d65" >Pₒ = (pₓ, −pᵧ, −p𝓏)</text><text x="30" y="529" font-family="sans-serif" font-size="14" fill="#355d65" >Camera-to-world is the pose. World-to-camera is its inverse. Flipping two axes retains right-handedness.</text></svg>