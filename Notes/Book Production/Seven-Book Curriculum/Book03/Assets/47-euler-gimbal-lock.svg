<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Fixed XYZ Euler gimbal lock</title><desc id="desc">The triples (30,90,20) and (50,90,40) degrees give the same rotation because the matrix depends on x minus z at positive lock.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="29" y="40" font-family="sans-serif" font-size="23" fill="#284e58">Fixed XYZ Euler gimbal lock</text><rect x="25" y="95" width="500" height="390" rx="12" fill="#edf3ef"/><rect x="546" y="95" width="509" height="390" rx="12" fill="#edf3ef"/><text x="43" y="133" font-family="sans-serif" font-size="18" fill="#355d65">Two different fixed-XYZ triples</text><text x="43" y="192" font-family="sans-serif" font-size="18" fill="#355d65">x = 30°, y = 90°, z = 20°</text><text x="43" y="237" font-family="sans-serif" font-size="18" fill="#355d65">x = 50°, y = 90°, z = 40°</text><text x="43" y="299" font-family="sans-serif" font-size="20" fill="#287b67">Both: x−z = 10°</text><text x="43" y="360" font-family="sans-serif" font-size="15" fill="#355d65">The coordinate chart is singular.</text><text x="562" y="133" font-family="sans-serif" font-size="18" fill="#355d65">Same rotated basis</text><line x1="800" y1="303" x2="848" y2="274" stroke="#b46c4f" stroke-width="4" /><circle cx="848" cy="274" r="5" fill="#b46c4f" stroke="#fbfaf7" stroke-width="1.5"/><text x="856" y="266" font-family="sans-serif" font-size="15" fill="#b46c4f">X</text><line x1="800" y1="303" x2="817.364817766693" y2="204.5192246987792" stroke="#38806b" stroke-width="4" /><circle cx="817.364817766693" cy="204.5192246987792" r="5" fill="#38806b" stroke="#fbfaf7" stroke-width="1.5"/><text x="825.364817766693" y="196.5192246987792" font-family="sans-serif" font-size="15" fill="#38806b">Y</text><line x1="800" y1="303" x2="898.4807753012208" y2="320.364817766693" stroke="#507ca8" stroke-width="4" /><circle cx="898.4807753012208" cy="320.364817766693" r="5" fill="#507ca8" stroke="#fbfaf7" stroke-width="1.5"/><text x="906.4807753012208" y="312.364817766693" font-family="sans-serif" font-size="15" fill="#507ca8">Z</text><circle cx="800" cy="303" r="4" fill="#536a70" stroke="#fbfaf7" stroke-width="1.5"/><text x="562" y="447" font-family="sans-serif" font-size="14" fill="#355d65">One representative: (10°,90°,0°)</text><text x="29" y="529" font-family="sans-serif" font-size="13" fill="#355d65">At y = −90°, the coupled angle is x+z instead. Near lock, recovered angles can be ill-conditioned.</text></svg>