<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Orthonormal basis and determinant parity</title><desc id="desc">Identity, a positive quarter turn about Z, and reflection of X. All preserve dot products. Only the reflection has determinant negative one.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="29" y="40" font-family="sans-serif" font-size="23" fill="#284e58">Orthonormal basis and determinant parity</text><rect x="25" y="92" width="330" height="388" rx="12" fill="#edf3ef"/><text x="39" y="125" font-family="sans-serif" font-size="18" fill="#355d65">Original frame</text><line x1="186" y1="300" x2="286" y2="300" stroke="#b46c4f" stroke-width="4" /><circle cx="286" cy="300" r="5" fill="#b46c4f" stroke="#fbfaf7" stroke-width="1.5"/><text x="294" y="292" font-family="sans-serif" font-size="15" fill="#b46c4f">X</text><line x1="186" y1="300" x2="186" y2="200" stroke="#38806b" stroke-width="4" /><circle cx="186" cy="200" r="5" fill="#38806b" stroke="#fbfaf7" stroke-width="1.5"/><text x="194" y="192" font-family="sans-serif" font-size="15" fill="#38806b">Y</text><line x1="186" y1="300" x2="138" y2="329" stroke="#507ca8" stroke-width="4" /><circle cx="138" cy="329" r="5" fill="#507ca8" stroke="#fbfaf7" stroke-width="1.5"/><text x="146" y="321" font-family="sans-serif" font-size="15" fill="#507ca8">Z</text><circle cx="186" cy="300" r="4" fill="#536a70" stroke="#fbfaf7" stroke-width="1.5"/><text x="39" y="448" font-family="sans-serif" font-size="15" fill="#287c68">RᵀR = I; det = +1</text><rect x="376" y="92" width="330" height="388" rx="12" fill="#edf3ef"/><text x="390" y="125" font-family="sans-serif" font-size="18" fill="#355d65">Proper rotation</text><line x1="537" y1="300" x2="537" y2="200" stroke="#b46c4f" stroke-width="4" /><circle cx="537" cy="200" r="5" fill="#b46c4f" stroke="#fbfaf7" stroke-width="1.5"/><text x="545" y="192" font-family="sans-serif" font-size="15" fill="#b46c4f">X</text><line x1="537" y1="300" x2="437" y2="300" stroke="#38806b" stroke-width="4" /><circle cx="437" cy="300" r="5" fill="#38806b" stroke="#fbfaf7" stroke-width="1.5"/><text x="445" y="292" font-family="sans-serif" font-size="15" fill="#38806b">Y</text><line x1="537" y1="300" x2="489" y2="329" stroke="#507ca8" stroke-width="4" /><circle cx="489" cy="329" r="5" fill="#507ca8" stroke="#fbfaf7" stroke-width="1.5"/><text x="497" y="321" font-family="sans-serif" font-size="15" fill="#507ca8">Z</text><circle cx="537" cy="300" r="4" fill="#536a70" stroke="#fbfaf7" stroke-width="1.5"/><text x="390" y="448" font-family="sans-serif" font-size="15" fill="#287c68">RᵀR = I; det = +1</text><rect x="727" y="92" width="330" height="388" rx="12" fill="#edf3ef"/><text x="741" y="125" font-family="sans-serif" font-size="18" fill="#355d65">Reflection</text><line x1="888" y1="300" x2="788" y2="300" stroke="#b46c4f" stroke-width="4" /><circle cx="788" cy="300" r="5" fill="#b46c4f" stroke="#fbfaf7" stroke-width="1.5"/><text x="796" y="292" font-family="sans-serif" font-size="15" fill="#b46c4f">X</text><line x1="888" y1="300" x2="888" y2="200" stroke="#38806b" stroke-width="4" /><circle cx="888" cy="200" r="5" fill="#38806b" stroke="#fbfaf7" stroke-width="1.5"/><text x="896" y="192" font-family="sans-serif" font-size="15" fill="#38806b">Y</text><line x1="888" y1="300" x2="840" y2="329" stroke="#507ca8" stroke-width="4" /><circle cx="840" cy="329" r="5" fill="#507ca8" stroke="#fbfaf7" stroke-width="1.5"/><text x="848" y="321" font-family="sans-serif" font-size="15" fill="#507ca8">Z</text><circle cx="888" cy="300" r="4" fill="#536a70" stroke="#fbfaf7" stroke-width="1.5"/><text x="741" y="448" font-family="sans-serif" font-size="15" fill="#aa6350">RᵀR = I; det = −1</text><text x="29" y="529" font-family="sans-serif" font-size="14" fill="#355d65">Oblique projection of three-dimensional bases. Reflection preserves lengths, but reverses handedness.</text></svg>