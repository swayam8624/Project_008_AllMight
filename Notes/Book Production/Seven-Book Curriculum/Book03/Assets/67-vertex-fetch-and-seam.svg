<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">One geometric corner, two rendering records</title><desc id="desc">An indexed quad has four positions and two triangles. A UV seam at position zero creates a fifth rendering tuple; two entries retain the same geometric position but different UVs.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="40" font-family="sans-serif" font-size="23" fill="#294e58" font-weight="600">One geometric corner, two rendering records</text><rect x="25" y="80" width="445" height="410" rx="12" fill="#edf3ef"/><rect x="490" y="80" width="565" height="410" rx="12" fill="#edf3ef"/><text x="43" y="120" font-family="sans-serif" font-size="18" fill="#345c65" >Logical mesh: four positions</text><text x="509" y="120" font-family="sans-serif" font-size="18" fill="#345c65" >Rendering mesh: five full tuples</text><polygon points="90,370 360,370 360,166" fill="#d6e8de" stroke="#397e6c" stroke-width="2.5"/><polygon points="90,370 360,166 90,166" fill="#e8decd" stroke="#a77b54" stroke-width="2.5"/><circle cx="90" cy="370" r="6" fill="#377f6b" stroke="#fbfaf7" stroke-width="1.5"/><text x="100" y="360" font-family="sans-serif" font-size="14" fill="#345c65" >p0</text><circle cx="360" cy="370" r="6" fill="#377f6b" stroke="#fbfaf7" stroke-width="1.5"/><text x="370" y="360" font-family="sans-serif" font-size="14" fill="#345c65" >p1</text><circle cx="360" cy="166" r="6" fill="#377f6b" stroke="#fbfaf7" stroke-width="1.5"/><text x="370" y="156" font-family="sans-serif" font-size="14" fill="#345c65" >p2</text><circle cx="90" cy="166" r="6" fill="#377f6b" stroke="#fbfaf7" stroke-width="1.5"/><text x="100" y="156" font-family="sans-serif" font-size="14" fill="#345c65" >p3</text><text x="519" y="167" font-family="sans-serif" font-size="14" fill="#345c65" >Tuple ID</text><text x="671" y="167" font-family="sans-serif" font-size="14" fill="#345c65" >Position</text><text x="815" y="167" font-family="sans-serif" font-size="14" fill="#345c65" >UV</text><rect x="510" y="174" width="523" height="35" rx="12" fill="#e8decd"/><text x="519" y="198" font-family="sans-serif" font-size="15" fill="#345c65" >ID 0</text><text x="671" y="198" font-family="sans-serif" font-size="15" fill="#345c65" >p0</text><text x="815" y="198" font-family="sans-serif" font-size="15" fill="#345c65" >(0,0)</text><rect x="510" y="218" width="523" height="35" rx="12" fill="#f9fbf8"/><text x="519" y="242" font-family="sans-serif" font-size="15" fill="#345c65" >ID 1</text><text x="671" y="242" font-family="sans-serif" font-size="15" fill="#345c65" >p1</text><text x="815" y="242" font-family="sans-serif" font-size="15" fill="#345c65" >(1,0)</text><rect x="510" y="262" width="523" height="35" rx="12" fill="#f9fbf8"/><text x="519" y="286" font-family="sans-serif" font-size="15" fill="#345c65" >ID 2</text><text x="671" y="286" font-family="sans-serif" font-size="15" fill="#345c65" >p2</text><text x="815" y="286" font-family="sans-serif" font-size="15" fill="#345c65" >(1,1)</text><rect x="510" y="306" width="523" height="35" rx="12" fill="#e8decd"/><text x="519" y="330" font-family="sans-serif" font-size="15" fill="#345c65" >ID 3</text><text x="671" y="330" font-family="sans-serif" font-size="15" fill="#345c65" >p0</text><text x="815" y="330" font-family="sans-serif" font-size="15" fill="#345c65" >(0.2,0.2)</text><rect x="510" y="350" width="523" height="35" rx="12" fill="#f9fbf8"/><text x="519" y="374" font-family="sans-serif" font-size="15" fill="#345c65" >ID 4</text><text x="671" y="374" font-family="sans-serif" font-size="15" fill="#345c65" >p3</text><text x="815" y="374" font-family="sans-serif" font-size="15" fill="#345c65" >(0,1)</text><text x="42" y="436" font-family="sans-serif" font-size="15" fill="#345c65" >Faces share p0 and p2.</text><text x="510" y="453" font-family="sans-serif" font-size="16" fill="#345c65" >Triangles: (0,1,2) and (3,2,4)</text><text x="30" y="530" font-family="sans-serif" font-size="14" fill="#345c65" >Two UV addresses at p0 require two rendering IDs; logical topology is unchanged.</text></svg>