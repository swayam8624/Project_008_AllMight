<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Constant angular increments in fixed-axis SLERP</title><desc id="desc">The rotated X basis traces a unit-circle arc. Samples at t=0,0.25,0.5,0.75,1 have physical angles 0,30,60,90,120 degrees.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="29" y="40" font-family="sans-serif" font-size="23" fill="#284e58">Constant angular increments in fixed-axis SLERP</text><rect x="25" y="92" width="535" height="390" rx="12" fill="#edf3ef"/><rect x="579" y="92" width="475" height="390" rx="12" fill="#edf3ef"/><circle cx="285" cy="300" r="160" fill="none" stroke="#c3d4ca" stroke-width="1.5"/><path d="M 445 300 A 160 160 0 0 0 205.00000000000003 161.4359353944898" fill="none" stroke="#388674" stroke-width="4"/><line x1="285" y1="300" x2="445" y2="300" stroke="#83ae9e" stroke-width="1.6" /><circle cx="445" cy="300" r="5" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="453" y="293" font-family="sans-serif" font-size="13" fill="#355d65">0°</text><text x="594" y="182" font-family="sans-serif" font-size="15" fill="#355d65">t=0     angle 0°</text><line x1="285" y1="300" x2="423.5640646055102" y2="220" stroke="#83ae9e" stroke-width="1.6" /><circle cx="423.5640646055102" cy="220" r="5" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="431.5640646055102" y="213" font-family="sans-serif" font-size="13" fill="#355d65">30°</text><text x="594" y="222" font-family="sans-serif" font-size="15" fill="#355d65">t=0.25     angle 30°</text><line x1="285" y1="300" x2="365" y2="161.43593539448983" stroke="#83ae9e" stroke-width="1.6" /><circle cx="365" cy="161.43593539448983" r="5" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="373" y="154.43593539448983" font-family="sans-serif" font-size="13" fill="#355d65">60°</text><text x="594" y="262" font-family="sans-serif" font-size="15" fill="#355d65">t=0.5     angle 60°</text><line x1="285" y1="300" x2="285" y2="140" stroke="#83ae9e" stroke-width="1.6" /><circle cx="285" cy="140" r="5" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="293" y="133" font-family="sans-serif" font-size="13" fill="#355d65">90°</text><text x="594" y="302" font-family="sans-serif" font-size="15" fill="#355d65">t=0.75     angle 90°</text><line x1="285" y1="300" x2="205.00000000000003" y2="161.4359353944898" stroke="#83ae9e" stroke-width="1.6" /><circle cx="205.00000000000003" cy="161.4359353944898" r="5" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="213.00000000000003" y="154.4359353944898" font-family="sans-serif" font-size="13" fill="#355d65">120°</text><text x="594" y="342" font-family="sans-serif" font-size="15" fill="#355d65">t=1     angle 120°</text><text x="594" y="131" font-family="sans-serif" font-size="17" fill="#355d65">Five samples, four equal intervals</text><text x="594" y="416" font-family="sans-serif" font-size="16" fill="#355d65">Unit radius at every sample.</text><text x="29" y="529" font-family="sans-serif" font-size="13" fill="#355d65">Analytic reference: identity to a 120° physical rotation about Z.</text></svg>