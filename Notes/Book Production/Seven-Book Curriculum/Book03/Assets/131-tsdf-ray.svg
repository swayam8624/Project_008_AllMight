<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>A depth observation does not see behind the surface</title><desc>A measured depth divides a ray into the camera-facing region, a negative truncation band and unseen space. Missing depth produces no update.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">A depth observation does not see behind the surface</text><rect x="100" y="130" width="390" height="95" fill="#dceef1"/><rect x="490" y="130" width="95" height="95" fill="#f0dec7"/><rect x="585" y="130" width="180" height="95" fill="#e1e5e8"/><path d="M100 177H765" stroke="#153149" stroke-width="2"/><circle cx="100" cy="177" r="6" fill="#153149"/><path d="M490 115V245" stroke="#a66420" stroke-width="3"/><text x="100" y="110" text-anchor="middle">Camera</text><text x="490" y="100" text-anchor="middle">Return D</text><text x="265" y="259" text-anchor="middle">Positive / front</text><text x="538" y="259" text-anchor="middle">Negative band</text><text x="675" y="259" text-anchor="middle">No update</text><text x="585" y="290" text-anchor="middle">D + μ</text><text x="420" y="363" text-anchor="middle">Missing depth: no update anywhere along the column.</text></g></svg>
