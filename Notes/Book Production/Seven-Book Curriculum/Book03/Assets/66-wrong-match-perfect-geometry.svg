<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">A wrong correspondence can have perfect geometry</title><desc id="desc">A single left ray admits two different positive-depth intersections with right rays. The correct disparity is 20 pixels and depth four metres. The false correspondence has disparity 40 and depth two metres, with equally consistent ideal reprojection.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="29" y="40" font-family="sans-serif" font-size="23" fill="#294e58">A wrong correspondence can have perfect geometry</text><rect x="25" y="82" width="680" height="407" rx="12" fill="#edf3ef"/><rect x="725" y="82" width="330" height="407" rx="12" fill="#edf3ef"/><line x1="100" y1="440" x2="280" y2="120" stroke="#507ca8" stroke-width="4" /><line x1="390" y1="440" x2="280" y2="120" stroke="#387e6b" stroke-width="3" /><line x1="390" y1="440" x2="190" y2="280" stroke="#b47850" stroke-width="3" /><circle cx="100" cy="440" r="6" fill="#507ca8" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="390" cy="440" r="6" fill="#367f6e" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="280" cy="120" r="6" fill="#367f6e" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="190" cy="280" r="6" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><text x="55" y="466" font-family="sans-serif" font-size="14" fill="#365e65">left center</text><text x="345" y="466" font-family="sans-serif" font-size="14" fill="#365e65">right center</text><text x="292" y="111" font-family="sans-serif" font-size="15" fill="#365e65">true match</text><text x="198" y="268" font-family="sans-serif" font-size="15" fill="#a2694c">false match</text><text x="743" y="124" font-family="sans-serif" font-size="16" fill="#365e65">Same left: (420,140)</text><text x="743" y="183" font-family="sans-serif" font-size="15" fill="#365e65">Right true: (400,140)</text><text x="743" y="218" font-family="sans-serif" font-size="17" fill="#365e65">δ=20 → Z=4</text><text x="743" y="277" font-family="sans-serif" font-size="15" fill="#365e65">Right false: (380,140)</text><text x="743" y="312" font-family="sans-serif" font-size="17" fill="#a2694c">δ=40 → Z=2</text><text x="743" y="372" font-family="sans-serif" font-size="15" fill="#365e65">Both can have zero</text><text x="743" y="399" font-family="sans-serif" font-size="15" fill="#365e65">ideal reprojection error.</text><text x="29" y="531" font-family="sans-serif" font-size="13" fill="#365e65">Both reconstructions lie on the same left ray. Geometry alone cannot tell which match is correct.</text></svg>