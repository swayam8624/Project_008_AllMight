<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">The covered-sample contract</title><desc id="desc">Unbiased screen weights are used for linear depth and reciprocal-w UV. The checker shader produces a linear color, and only a passing depth comparison updates the winner and color.</desc><rect width="1080" height="560" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">The covered-sample contract</text><rect x="25" y="80" width="500" height="410" rx="10" fill="#edf3ef"/><rect x="550" y="80" width="505" height="410" rx="10" fill="#edf3ef"/><text x="45" y="120" font-family="sans-serif" font-size="19" fill="#345c65">One covered sample</text><text x="45" y="182" font-family="sans-serif" font-size="16" fill="#345c65">Three unbiased screen weights λ</text><text x="45" y="236" font-family="sans-serif" font-size="22" fill="#287b68">Depth: q = Σ λᵢ qᵢ</text><text x="45" y="294" font-family="sans-serif" font-size="19" fill="#345c65">UV: Σ λᵢ UVᵢ/wᵢ ÷ Σ λᵢ/wᵢ</text><text x="45" y="352" font-family="sans-serif" font-size="17" fill="#345c65">Checker: floor(8u) + floor(8v)</text><text x="45" y="415" font-family="sans-serif" font-size="16" fill="#345c65">Pure diagnostic shader</text><text x="570" y="120" font-family="sans-serif" font-size="19" fill="#345c65">One winner record</text><rect x="570" y="150" width="465" height="87" rx="10" fill="#fafaf6"/><text x="590" y="185" font-family="sans-serif" font-size="18" fill="#345c65">Compare represented depth + ID</text><text x="590" y="215" font-family="sans-serif" font-size="15" fill="#345c65">Forward: less; reverse: greater</text><rect x="570" y="252" width="465" height="87" rx="10" fill="#cae4d4"/><text x="590" y="287" font-family="sans-serif" font-size="18" fill="#345c65">Pass: replace depth AND colour</text><text x="590" y="317" font-family="sans-serif" font-size="15" fill="#345c65">Fail: neither record changes</text><text x="570" y="407" font-family="sans-serif" font-size="18" fill="#345c65">Encode linear RGB at output</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">No duplicate coverage rule, no perspective correction of already divided depth, no colour write from a losing fragment.</text></svg>