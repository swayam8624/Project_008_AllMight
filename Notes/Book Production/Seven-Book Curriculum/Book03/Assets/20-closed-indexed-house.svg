<g font-family="monospace" font-size="18" fill="#345e66">
<text x="737" y="190">Positions V = 10</text>
<text x="737" y="231">Faces     F = 16</text>
<text x="737" y="272">Edges     E = 24</text>
<text x="737" y="320">3F = 2E = 48</text>
<text x="737" y="363">χ = V − E + F</text>
<text x="737" y="394" font-weight="600" fill="#177969">χ = 2</text>
