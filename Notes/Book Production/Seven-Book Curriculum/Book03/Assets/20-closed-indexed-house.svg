<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="595" viewBox="0 0 1040 595" role="img" aria-labelledby="title desc">
<title id="title">A closed indexed triangular house and its exact face-edge incidence count</title>
<desc id="desc">A genuinely indexed 3D house uses floor corners, wall-top corners and two roof ridge vertices: 10 indexed positions, 16 triangular faces and 24 unique undirected edges. All 24 edges have exactly two opposite directed uses. The cell Euler characteristic is 10-24+16=2. This parallel oblique drawing does not prove global non-self-intersection or physically correct outward normals.</desc>
<rect width="1040" height="595" fill="#fbfaf6" rx="18"/>
<text x="30" y="38" font-size="24" font-family="sans-serif" font-weight="600" fill="#284650">The house is now one indexed triangular surface</text>
<text x="30" y="61" font-size="13" font-family="sans-serif" fill="#637d82">Ten actual world positions; sixteen ordered faces; the 24 distinct edge keys each have two opposite uses</text>
