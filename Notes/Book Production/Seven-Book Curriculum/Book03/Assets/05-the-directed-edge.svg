<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="840" height="525" viewBox="0 0 840 525" role="img" aria-labelledby="title desc">
<title id="title">A directed edge separates the left and right sides of a plane</title>
<desc id="desc">The horizontal edge A=(0,0) to B=(6,0) points right along positive X. P=(2,3) is above it and left of the directed arrow, with determinant plus 18. Q=(2,-3) is below and right of the arrow, with determinant minus 18. Y points up, and coordinates are in consistent Cartesian units.</desc>
<defs>
<marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#314f65"/></marker>
</defs>
<rect width="840" height="525" fill="#fbfaf6" rx="18"/>
<text x="38" y="37" font-size="23" font-family="sans-serif" fill="#203747" font-weight="600">Which side of the arrow?</text>
<text x="38" y="58" font-size="13" font-family="sans-serif" fill="#607581">Sign of (B − A) × (P − A) in a Cartesian +Y-up frame</text>
<g stroke="#e4e9e7" stroke-width="1">
<path d="M140 70 V472 M205 70 V472 M270 70 V472 M335 70 V472 M400 70 V472 M465 70 V472 M530 70 V472 M595 70 V472 M660 70 V472"/>
<path d="M85 65 H665 M85 130 H665 M85 195 H665 M85 260 H665 M85 325 H665 M85 390 H665 M85 455 H665"/>
</g>
<path d="M85 260 H686" stroke="#9ba7ac" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M140 470 V80" stroke="#9ba7ac" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M140 260 H530" stroke="#314f65" stroke-width="4" marker-end="url(#arrow)"/>
<circle cx="140" cy="260" r="7" fill="#314f65" stroke="#fff" stroke-width="2"/>
<circle cx="530" cy="260" r="7" fill="#314f65" stroke="#fff" stroke-width="2"/>
<circle cx="270" cy="65" r="8" fill="#187969" stroke="#fff" stroke-width="2"/>
<circle cx="270" cy="455" r="8" fill="#be7650" stroke="#fff" stroke-width="2"/>
<path d="M140 260 L270 65" stroke="#187969" stroke-width="2.5" stroke-dasharray="6 6"/>
<path d="M140 260 L270 455" stroke="#be7650" stroke-width="2.5" stroke-dasharray="6 6"/>
<text x="151" y="285" font-size="15" font-family="sans-serif" fill="#314f65">A = (0,0)</text>
<text x="521" y="284" font-size="15" font-family="sans-serif" fill="#314f65">B = (6,0)</text>
<text x="284" y="77" font-size="16" font-family="sans-serif" fill="#176658" font-weight="600">P = (2,3)</text>
<text x="284" y="451" font-size="16" font-family="sans-serif" fill="#ad6242" font-weight="600">Q = (2,−3)</text>
<text x="645" y="244" font-size="13" font-family="sans-serif" fill="#526d7c">+X</text>
<text x="151" y="91" font-size="13" font-family="sans-serif" fill="#526d7c">+Y</text>
<rect x="594" y="108" width="211" height="83" fill="#e7f2ec" rx="10"/>
<text x="607" y="133" font-size="15" font-family="sans-serif" fill="#176658" font-weight="600">Left of A → B</text>
<text x="607" y="158" font-size="15" font-family="monospace" fill="#176658">orient(A,B,P) = +18</text>
<rect x="594" y="325" width="211" height="83" fill="#f7ede7" rx="10"/>
<text x="607" y="350" font-size="15" font-family="sans-serif" fill="#ad6242" font-weight="600">Right of A → B</text>
<text x="607" y="376" font-size="15" font-family="monospace" fill="#ad6242">orient(A,B,Q) = −18</text>
<text x="40" y="501" font-size="13" font-family="sans-serif" fill="#6c7d82">Swap A and B: both signs reverse. The physical points stay where they are.</text>
</svg>
