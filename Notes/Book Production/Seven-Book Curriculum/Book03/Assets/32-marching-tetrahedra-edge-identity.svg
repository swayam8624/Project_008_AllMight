<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="565" viewBox="0 0 1090 565" role="img" aria-labelledby="title desc">
<title id="title">Marching tetrahedra shares one intersection vertex for every crossed lattice edge</title>
<desc id="desc">Two schematic tetrahedra share a global lattice edge whose endpoint IDs are 17 and 42 with sampled scalar field values -0.2 and +0.3. Linear interpolation locates the zero at 40 percent along the edge. Both tetrahedra use canonical edge key (17,42) to reuse the same output vertex ID, preventing a coordinate-coincident but topologically disconnected seam. Exact-zero sampled lattice vertices require a separate globally consistent policy.</desc>
<rect width="1090" height="565" rx="18" fill="#fbfaf6"/>
<text x="29.00" y="39.00" font-family="sans-serif" font-size="23" fill="#274e57" font-weight="600">An invisible surface becomes shared, indexed crossings</text><text x="29.00" y="62.00" font-family="sans-serif" font-size="13" fill="#648086" >Marching tetrahedra: classify signs, interpolate on crossing edges, cache by GLOBAL lattice-edge IDs</text><rect x="22" y="89" width="725" height="419" rx="12" fill="#edf3ef"/><polygon points="230.00,345.00 515.00,345.00 328.00,165.00" fill="#b9dbcc" fill-opacity=".52" stroke="#74a896" stroke-width="2"/><polygon points="230.00,345.00 515.00,345.00 360.00,452.00" fill="#e5cdbd" fill-opacity=".35" stroke="#bd8c68" stroke-width="2"/><polygon points="230.00,345.00 515.00,345.00 456.00,178.00" fill="#c7d9e9" fill-opacity=".43" stroke="#82a4be" stroke-width="2"/><line x1="230.00" y1="345.00" x2="328.00" y2="165.00" stroke="#83ad9f" stroke-width="1.7" /><line x1="515.00" y1="345.00" x2="328.00" y2="165.00" stroke="#83ad9f" stroke-width="1.7" /><line x1="230.00" y1="345.00" x2="360.00" y2="452.00" stroke="#83ad9f" stroke-width="1.7" /><line x1="515.00" y1="345.00" x2="360.00" y2="452.00" stroke="#83ad9f" stroke-width="1.7" /><line x1="230.00" y1="345.00" x2="456.00" y2="178.00" stroke="#83ad9f" stroke-width="1.7" /><line x1="515.00" y1="345.00" x2="456.00" y2="178.00" stroke="#83ad9f" stroke-width="1.7" /><line x1="230.00" y1="345.00" x2="515.00" y2="345.00" stroke="#497a8f" stroke-width="6" /><circle cx="230.00" cy="345.00" r="9" fill="#af6e4d" stroke="#fbfaf6" stroke-width="1.4"/><circle cx="515.00" cy="345.00" r="9" fill="#416f9b" stroke="#fbfaf6" stroke-width="1.4"/><circle cx="344.00" cy="345.00" r="11" fill="#24846b" stroke="#fbfaf6" stroke-width="1.4"/><text x="152.00" y="374.00" font-family="sans-serif" font-size="15" fill="#aa654a" >A: f=-0.2</text><text x="497.00" y="374.00" font-family="sans-serif" font-size="15" fill="#3d739e" >B: f=+0.3</text><text x="308.00" y="321.00" font-family="sans-serif" font-size="15" fill="#247f6e" >zero at t=0.4</text><text x="161.00" y="167.00" font-family="sans-serif" font-size="15" fill="#435f68" >Two tetrahedra share edge AB</text><rect x="765" y="104" width="298" height="387" rx="12" fill="#e8f1eb"/><text x="783.00" y="135.00" font-family="sans-serif" font-size="17" fill="#355b65" font-weight="600">One edge → one vertex</text><text x="782.00" y="187.00" font-family="sans-serif" font-size="14" fill="#3b5c68" >A ID: 17</text><text x="782.00" y="213.00" font-family="sans-serif" font-size="14" fill="#3b5c68" >B ID: 42</text><text x="782.00" y="249.00" font-family="sans-serif" font-size="14" fill="#3b5c68" >Key=min/max → (17,42)</text><text x="782.00" y="286.00" font-family="sans-serif" font-size="13" fill="#3b5c68" >t=-0.2/(-0.2−0.3)</text><text x="782.00" y="312.00" font-family="sans-serif" font-size="16" fill="#267e69" >t = 0.4</text><text x="782.00" y="365.00" font-family="sans-serif" font-size="13" fill="#3b5c68" >Same edge visited again?</text><text x="782.00" y="388.00" font-family="sans-serif" font-size="13" fill="#267e69" >Reuse output vertex ID</text><text x="782.00" y="431.00" font-family="sans-serif" font-size="12" fill="#3b5c68" >Exact-zero samples need</text><text x="782.00" y="448.00" font-family="sans-serif" font-size="12" fill="#3b5c68" >a separate tie policy</text><text x="30.00" y="534.00" font-family="sans-serif" font-size="13" fill="#637c82" >The interpolated zero belongs to the LINEAR field along the edge, not necessarily the exact analytic zero of a nonlinear SDF.</text>
</svg>