<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Pinhole perspective from similar triangles</title><desc id="desc">A point at depth Z and transverse displacement X lies on a ray from the origin. The virtual image plane at depth f intersects the ray at fX/Z. The numerical triangles have a common scale and ratio.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="41" font-family="sans-serif" font-size="23" fill="#284e58" font-weight="600">Pinhole perspective from similar triangles</text><rect x="25" y="82" width="700" height="405" rx="12" fill="#edf3ef"/><rect x="743" y="82" width="312" height="405" rx="12" fill="#edf3ef"/><polygon points="105,410 665,410 665,130" fill="#d5e8de" opacity=".7"/><polygon points="105,410 245,410 245,340" fill="#89b7a4" opacity=".6"/><line x1="105" y1="410" x2="690" y2="410" stroke="#788e91" stroke-width="2" /><line x1="105" y1="410" x2="665" y2="130" stroke="#a66c50" stroke-width="3" /><line x1="245" y1="410" x2="245" y2="165" stroke="#507da7" stroke-width="2.5" /><line x1="665" y1="410" x2="665" y2="130" stroke="#367e6d" stroke-width="2.5" /><circle cx="105" cy="410" r="6" fill="#344e55" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="245" cy="340" r="6" fill="#507da7" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="665" cy="130" r="6" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="64" y="442" font-family="sans-serif" font-size="14" fill="#355d65" >pinhole O</text><text x="254" y="330" font-family="sans-serif" font-size="14" fill="#355d65" >image point</text><text x="536" y="117" font-family="sans-serif" font-size="14" fill="#355d65" >world point (X,Z)</text><text x="256" y="398" font-family="sans-serif" font-size="14" fill="#355d65" >xₛ</text><text x="675" y="270" font-family="sans-serif" font-size="14" fill="#355d65" >X</text><text x="160" y="435" font-family="sans-serif" font-size="14" fill="#355d65" >f</text><text x="425" y="435" font-family="sans-serif" font-size="14" fill="#355d65" >Z</text><text x="256" y="180" font-family="sans-serif" font-size="14" fill="#507da7" >virtual plane</text><text x="760" y="122" font-family="sans-serif" font-size="17" fill="#355d65" >One ray, two triangles</text><text x="760" y="185" font-family="sans-serif" font-size="21" fill="#355d65" >xₛ / f = X / Z</text><text x="760" y="235" font-family="sans-serif" font-size="22" fill="#287b68" >xₛ = f X / Z</text><text x="760" y="294" font-family="sans-serif" font-size="14" fill="#355d65" >Example: X=4, Z=8, f=2</text><text x="760" y="326" font-family="sans-serif" font-size="19" fill="#355d65" >xₛ=1</text><text x="760" y="390" font-family="sans-serif" font-size="14" fill="#355d65" >Both triangles share</text><text x="760" y="415" font-family="sans-serif" font-size="14" fill="#355d65" >the angle at the opening.</text><text x="30" y="529" font-family="sans-serif" font-size="13" fill="#355d65" >A virtual plane in front preserves the drawing orientation; a physical sheet behind the opening produces an inverted image.</text></svg>