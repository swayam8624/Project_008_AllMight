<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Quaternion double cover and short arc</title><desc id="desc">A great-circle slice shows q0, q1 at sixty degrees, and negative q1 at 240 degrees. The last two represent the same physical orientation.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="29" y="40" font-family="sans-serif" font-size="23" fill="#284e58">Quaternion double cover and short arc</text><rect x="25" y="92" width="520" height="392" rx="12" fill="#edf3ef"/><rect x="566" y="92" width="489" height="392" rx="12" fill="#edf3ef"/><circle cx="300" cy="295" r="165" fill="none" stroke="#b3c7bd" stroke-width="2"/><line x1="465" y1="295" x2="135" y2="295" stroke="#a7b8b0" stroke-width="1" /><line x1="382.5" y1="152.10580837556762" x2="217.49999999999994" y2="437.8941916244323" stroke="#b78a65" stroke-width="1.5" stroke-dasharray="6 5"/><path d="M 465 295 A 165 165 0 0 0 382.5 152.10580837556762" fill="none" stroke="#367e6d" stroke-width="5"/><circle cx="465" cy="295" r="7" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="382.5" cy="152.10580837556762" r="7" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="217.49999999999994" cy="437.8941916244323" r="7" fill="#b57854" stroke="#fbfaf7" stroke-width="1.5"/><text x="434" y="320" font-family="sans-serif" font-size="15" fill="#355d65">q₀</text><text x="394.5" y="144.10580837556762" font-family="sans-serif" font-size="15" fill="#355d65">q₁</text><text x="177.49999999999994" y="461.8941916244323" font-family="sans-serif" font-size="15" fill="#355d65">−q₁</text><text x="582" y="132" font-family="sans-serif" font-size="19" fill="#355d65">Double cover</text><text x="582" y="183" font-family="sans-serif" font-size="15" fill="#355d65">q and −q act identically on vectors.</text><text x="582" y="231" font-family="sans-serif" font-size="15" fill="#355d65">Choose endpoint sign before SLERP.</text><text x="582" y="276" font-family="sans-serif" font-size="15" fill="#355d65">If q₀ · q₁ is negative, negate q₁.</text><text x="582" y="329" font-family="sans-serif" font-size="14" fill="#355d65">60° in quaternion space</text><text x="582" y="357" font-family="sans-serif" font-size="14" fill="#355d65">corresponds to a 120° physical turn.</text><text x="29" y="529" font-family="sans-serif" font-size="13" fill="#355d65">Schematic great-circle slice of S³, not a literal picture of four-dimensional space.</text></svg>