<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1110" height="605" viewBox="0 0 1110 605" role="img" aria-labelledby="title desc">
<title id="title">Comparison of four procedural representations and expected indexed topology contracts</title>
<desc id="desc">Four conceptual source-controlled drawings compare sampled heightfield, capped cylinder, latitude-longitude UV sphere and extracted implicit sphere. The heightfield is an open topological disk of Euler characteristic one, while correctly generated capped cylinder and UV sphere are closed genus-zero shells of Euler two. Implicit sphere closure is a validation target, not an automatic proof. The implicit inset is explicitly a concept icon, not measured C++ output.</desc>
<rect width="1110" height="605" rx="18" fill="#fbfaf6"/>
