<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Outside vertex still contributes to the primitive</title><desc id="desc">One triangle vertex is outside a clipping plane. The original three clip tuples and varying payloads are needed to generate two edge-plane intersections and preserve the surviving polygon. This is a schematic, not a P16 clipping result.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="40" font-family="sans-serif" font-size="23" fill="#294e58" font-weight="600">Outside vertex still contributes to the primitive</text><rect x="25" y="82" width="660" height="408" rx="12" fill="#edf3ef"/><rect x="708" y="82" width="347" height="408" rx="12" fill="#edf3ef"/><polygon points="90,390 590,370 350,108" fill="#e9d9cc" stroke="#b47850" stroke-width="2.5"/><polygon points="90,390 590,370 434.2748091603054,200 265.177304964539,200" fill="#cee6d8" stroke="#387f6d" stroke-width="2.5"/><line x1="47" y1="200" x2="663" y2="200" stroke="#507da7" stroke-width="3" stroke-dasharray="7 5"/><circle cx="90" cy="390" r="6" fill="#377f6b" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="590" cy="370" r="6" fill="#377f6b" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="350" cy="108" r="7" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="265.177304964539" cy="200" r="6" fill="#507da7" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="434.2748091603054" cy="200" r="6" fill="#507da7" stroke="#fbfaf7" stroke-width="1.5"/><text x="362" y="105" font-family="sans-serif" font-size="16" fill="#a46a48" >C: outside</text><text x="52" y="187" font-family="sans-serif" font-size="14" fill="#507da7" >clip boundary</text><text x="78" y="420" font-family="sans-serif" font-size="15" fill="#345c65" >A</text><text x="590" y="400" font-family="sans-serif" font-size="15" fill="#345c65" >B</text><text x="728" y="123" font-family="sans-serif" font-size="18" fill="#345c65" >Keep the original triangle</text><text x="728" y="180" font-family="sans-serif" font-size="15" fill="#345c65" >A, B, C: raw clip tuples</text><text x="728" y="212" font-family="sans-serif" font-size="15" fill="#345c65" >and raw varying values</text><text x="728" y="273" font-family="sans-serif" font-size="16" fill="#345c65" >Generate I and J at</text><text x="728" y="299" font-family="sans-serif" font-size="16" fill="#345c65" >edge-plane intersections.</text><text x="728" y="361" font-family="sans-serif" font-size="15" fill="#345c65" >Surviving polygon is green.</text><text x="728" y="417" font-family="sans-serif" font-size="16" fill="#287b68" >Divide only after clipping.</text><text x="30" y="530" font-family="sans-serif" font-size="13" fill="#345c65" >Conceptual clip-space cross-section; P16 retains vertices, P17 constructs the surviving polygon.</text></svg>