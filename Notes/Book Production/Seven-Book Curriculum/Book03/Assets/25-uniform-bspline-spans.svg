<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1010" height="550" viewBox="0 0 1010 550" role="img" aria-labelledby="title desc">
<title id="title">Two adjacent uniform cubic B-spline spans with a smooth shared knot</title>
<desc id="desc">Five 2D control points Q0..Q4 define two overlapping local nonrational uniform cubic B-spline spans. The first uses Q0..Q3 and second Q1..Q4; their positions and first/second derivatives meet at the shared simple uniform knot. The curves need not pass through the outer control points.</desc>
<rect width="1010" height="550" rx="18" fill="#fbfaf7"/>
