<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Why a flat target loses a dimension</title><desc>A planar target cannot determine a general 3D projective camera; the spatial fixture has three depth layers. Constrained planar multi-view calibration is a separate problem.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Why a flat target loses a dimension</text><path d="M92 310L286 310L362 151L168 151Z" fill="#e3f2f5" stroke="#167b90"/><circle cx="110" cy="292" r="4" fill="#167b90"/><circle cx="122" cy="264" r="4" fill="#167b90"/><circle cx="134" cy="236" r="4" fill="#167b90"/><circle cx="146" cy="208" r="4" fill="#167b90"/><circle cx="158" cy="180" r="4" fill="#167b90"/><circle cx="149" cy="292" r="4" fill="#167b90"/><circle cx="161" cy="264" r="4" fill="#167b90"/><circle cx="173" cy="236" r="4" fill="#167b90"/><circle cx="185" cy="208" r="4" fill="#167b90"/><circle cx="197" cy="180" r="4" fill="#167b90"/><circle cx="188" cy="292" r="4" fill="#167b90"/><circle cx="200" cy="264" r="4" fill="#167b90"/><circle cx="212" cy="236" r="4" fill="#167b90"/><circle cx="224" cy="208" r="4" fill="#167b90"/><circle cx="236" cy="180" r="4" fill="#167b90"/><circle cx="227" cy="292" r="4" fill="#167b90"/><circle cx="239" cy="264" r="4" fill="#167b90"/><circle cx="251" cy="236" r="4" fill="#167b90"/><circle cx="263" cy="208" r="4" fill="#167b90"/><circle cx="275" cy="180" r="4" fill="#167b90"/><circle cx="266" cy="292" r="4" fill="#167b90"/><circle cx="278" cy="264" r="4" fill="#167b90"/><circle cx="290" cy="236" r="4" fill="#167b90"/><circle cx="302" cy="208" r="4" fill="#167b90"/><circle cx="314" cy="180" r="4" fill="#167b90"/><text x="215" y="100" text-anchor="middle" font-weight="bold">One plane: Z = 0</text><text x="215" y="347" text-anchor="middle">Third column of P is invisible</text><circle cx="487" cy="295