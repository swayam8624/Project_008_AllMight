<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="525" viewBox="0 0 1050 525" role="img" aria-labelledby="title desc">
<title id="title">Circle comparison: parametric coordinates, implicit zero set and indexed polygon</title>
<desc id="desc">Three side-by-side representations of a unit circle: parametrization C(theta)=(r cos theta,r sin theta), implicit zero relation x squared plus y squared minus r squared equals zero, and twelve polygon samples connected by shared indexed vertices. The polygon is not the exact smooth circle.</desc>
<rect width="1050" height="525" rx="18" fill="#fbfaf6"/>
<text x="31" y="40" font-family="sans-serif" font-size="24" fill="#294e58" font-weight="600">Three descriptions. One intended circle.</text><text x="31" y="63" font-family="sans-serif" font-size="13" fill="#66828a" >Generate points  •  classify a level set  •  store a finite indexed approximation</text><rect x="28" y="93" width="316" height="369" rx="12" fill="#edf3ee"/><text x="41" y="127" font-family="sans-serif" font-size="18" fill="#345b66" font-weight="600">Parametric map</text><rect x="365" y="93" width="316" height="369" rx="12" fill="#eef0f2"/><text x="378" y="127" font-family="sans-serif" font-size="18" fill="#345b66" font-weight="600">Implicit zero level set</text><rect x="703" y="93" width="316" height="369" rx="12" fill="#edf3ee"/><text x="716" y="127" font-family="sans-serif" font-size="18" fill="#345b66" font-weight="600">Indexed polygon</text><circle cx="179" cy="265" r="105" fill="none" stroke="#2c877a" stroke-width="4"/><line x1="179" y1="265" x2="253" y2="190" stroke="#aa7457" stroke-width="3"/><circle cx="253.00" cy="190.00" r="6" fill="#b96e48" stroke="#fafaf7" stroke-width="1.4"/><text x="42" y="431" font-family="sans-serif" font-size="15" fill="#32676c" >C(t)=(r cos t, r sin t)</text><circle cx="516" cy="265" r="93" fill="none" stroke="#c6d6d0" stroke-width="1.8"/><circle cx="516" cy="265" r="100" fill="none" stroke="#acc5bd" stroke-width="1.8"/><circle cx="516" cy="265" r="107" fill="none" stroke="#c6d6d0" stroke-width="1.8"/><circle cx="516" cy="265" r="114" fill="none" stroke="#acc5bd" stroke-width="1.8"/><circle cx="516" cy="265" r="121" fill="none" stroke="#c6d6d0" stroke-width="1.8"/><circle cx="516" cy="265" r="105" fill="none" stroke="#2f8074" stroke-width="4"/><circle cx="516.00" cy="265.00" r="4" fill="#aa744f" stroke="#fafaf7" stroke-width="1.4"/><text x="378" y="431" font-family="sans-serif" font-size="14" fill="#32676c" >F(x,y)=x²+y²−r²=0</text><polygon points="959.00,265.00 944.93,317.50 906.50,355.93 854.00,370.00 801.50,355.93 763.07,317.50 749.00,265.00 763.07,212.50 801.50,174.07 854.00,160.00 906.50,174.07 944.93,212.50" fill="#c3dfd4" fill-opacity=".48" stroke="#2c8574" stroke-width="3"/><circle cx="959.00" cy="265.00" r="4" fill="#b47250" stroke="#fafaf7" stroke-width="1.4"/><circle cx="944.93" cy="317.50" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><circle cx="906.50" cy="355.93" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><circle cx="854.00" cy="370.00" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><circle cx="801.50" cy="355.93" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><circle cx="763.07" cy="317.50" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><circle cx="749.00" cy="265.00" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><circle cx="763.07" cy="212.50" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><circle cx="801.50" cy="174.07" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><circle cx="854.00" cy="160.00" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><circle cx="906.50" cy="174.07" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><circle cx="944.93" cy="212.50" r="4" fill="#357c73" stroke="#fafaf7" stroke-width="1.4"/><text x="716" y="431" font-family="sans-serif" font-size="14" fill="#32676c" >12 points, 12 indexed edges</text><text x="30" y="502" font-family="sans-serif" font-size="13" fill="#687f86" >The mathematical circle is smooth; the stored 12-sided polygon is a particular finite approximation.</text>
</svg>