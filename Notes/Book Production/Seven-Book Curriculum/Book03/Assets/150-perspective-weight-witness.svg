<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>Screen weights are not surface weights</title><desc>Paired horizontal bars contrast the screen barycentric weights with perspective-correct weights for the numerical triangle witness. The latter reconstruct the original viewing ray.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">Screen weights are not surface weights</text><text x="180" y="76" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Screen weights</text><text x="580" y="76" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Perspective weights</text><text x="60" y="125" font-size="15" text-anchor="start" fill="#153149">A</text><rect x="90" y="108" width="62.4" height="29" rx="3" fill="#ac7428" stroke="none"/><text x="162.4" y="126" font-size="15" text-anchor="start" fill="#153149">0.240</text><text x="60" y="189" font-size="15" text-anchor="start" fill="#153149">B</text><rect x="90" y="172" width="65" height="29" rx="3" fill="#ac7428" stroke="none"/><text x="165" y="190" font-size="15" text-anchor="start" fill="#153149">0.250</text><text x="60" y="253" font-size="15" text-anchor="start" fill="#153149">C</text><rect x="90" y="236" width="132.6" height="29" rx="3" fill="#ac7428" stroke="none"/><text x="232.6" y="254" font-size="15" text-anchor="start" fill="#153149">0.510</text><text x="460" y="125" font-size="15" text-anchor="start" fill="#153149">A</text><rect x="490" y="108" width="83.75838900000001" height="29" rx="3" fill="#087fa0" stroke="none"/><text x="583.758389" y="126" font-size="15" text-anchor="start" fill="#153149">0.322</text><text x="460" y="189" font-size="15" text-anchor="start" fill="#153149">B</text><rect x="490" y="172" width="87.2483222" height="29" rx="3" fill="#087fa0" stroke="none"/><text x="587.2483222" y="190" font-size="15" text-anchor="start" fill="#153149">0.336</text><text x="460" y="253" font-size="15" text-anchor="start" fill="#153149">C</text><rect x="490" y="236" width="88.9932888" height="29" rx="3" fill="#087fa0" stroke="none"/><text x="588.9932888" y="254" font-size="15" text-anchor="start" fill="#153149">0.342</text><text x="420" y="337" font-size="14" text-anchor="middle" fill="#153149">Both sum to one; only the perspective weights interpolate the optical point.</text></g></svg>
