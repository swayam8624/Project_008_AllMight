<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Four different questions, four different kinds of evidence</title><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Four different questions, four different kinds of evidence</text><rect x="50" y="80" width="360" height="120" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="68" y="112" font-weight="bold" font-size="18">Verification</text><text x="68" y="141" font-size="14">Does the code obey its contract?</text><text x="68" y="168" fill="#536b8b" font-size="13">Independent oracle</text><rect x="430" y="80" width="360" height="120" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="448" y="112" font-weight="bold" font-size="18">Validation</text><text x="448" y="141" font-size="14">Does the model fit the intended world?</text><text x="448" y="168" fill="#536b8b" font-size="13">Physical reference or domain check</text><rect x="50" y="225" width="360" height="120" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="68" y="257" font-weight="bold" font-size="18">Accuracy</text><text x="68" y="286" font-size="14">How large is the error, in what units?</text><text x="68" y="313" fill="#536b8b" font-size="13">Declared metric and tolerance</text><rect x="430" y="225" width="360" height="120" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="448" y="257" font-weight="bold" font-size="18">Performance</text><text x="448" y="286" font-size="14">How much resource does the task consume?</text><text x="448" y="313" fill="#536b8b" font-size="13">Matched workload and timing boundary</text><text x="420" y="385" text-anchor="middle">A passing check in one category does not prove the others.</text></g></svg>
