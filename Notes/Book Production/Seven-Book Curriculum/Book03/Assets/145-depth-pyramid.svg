<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>The depth hierarchy keeps a conservative bound</title><desc>Four leaf maxima 0.35, 0.55, 0.75, and 1.00 feed a root maximum of 1.00. A candidate depth of 0.58 can reject only the first two leaves under strict forward depth.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">The depth hierarchy keeps a conservative bound</text><rect x="330" y="68" width="180" height="62" rx="3" fill="#e4f3f7" stroke="#c3d9e2"/><text x="420" y="105" font-size="18" text-anchor="middle" fill="#153149" font-weight="bold">root max = 1.00</text><line x1="420" y1="130" x2="145" y2="205" stroke="#657c90" stroke-width="1.5"/><rect x="65" y="205" width="160" height="62" rx="3" fill="#c5e6ec" stroke="#c3d9e2"/><text x="145" y="232" font-size="20" text-anchor="middle" fill="#153149" font-weight="bold">0.35</text><text x="145" y="253" font-size="14" text-anchor="middle" fill="#153149">reject</text><line x1="420" y1="130" x2="330" y2="205" stroke="#657c90" stroke-width="1.5"/><rect x="250" y="205" width="160" height="62" rx="3" fill="#c5e6ec" stroke="#c3d9e2"/><text x="330" y="232" font-size="20" text-anchor="middle" fill="#153149" font-weight="bold">0.55</text><text x="330" y="253" font-size="14" text-anchor="middle" fill="#153149">reject</text><line x1="420" y1="130" x2="515" y2="205" stroke="#657c90" stroke-width="1.5"/><rect x="435" y="205" width="160" height="62" rx="3" fill="#fae6c5" stroke="#c3d9e2"/><text x="515" y="232" font-size="20" text-anchor="middle" fill="#153149" font-weight="bold">0.75</text><text x="515" y="253" font-size="14" text-anchor="middle" fill="#153149">inspect</text><line x1="420" y1="130" x2="700" y2="205" stroke="#657c90" stroke-width="1.5"/><rect x="620" y="205" width="160" height="62" rx="3" fill="#fae6c5" stroke="#c3d9e2"/><text x="700" y="232" font-size="20" text-anchor="middle" fill="#153149" font-weight="bold">1.00</text><text x="700" y="253" font-size="14" text-anchor="middle" fill="#153149">inspect</text><text x="420" y="324" font-size="16" text-anchor="middle" fill="#153149">Candidate lower bound = 0.58; forward depth, strict less-than.</text></g></svg>
