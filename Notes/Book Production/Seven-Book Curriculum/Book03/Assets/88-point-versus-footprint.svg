<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Point samples versus footprint integration</title><desc id="desc">A narrow stripe misses the point sample locations, but contributes to the integral of a pixel footprint.</desc><rect width="1080" height="560" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Point samples versus footprint integration</text><rect x="25" y="80" width="1030" height="410" rx="8" fill="#edf3ef"/><text x="45" y="130" font-family="sans-serif" font-size="19" fill="#345c65">Point measurement</text><rect x="365" y="150" width="124" height="100" rx="8" fill="#d7e2db"/><circle cx="427" cy="200" r="5" fill="#347e6b"/><rect x="491" y="150" width="124" height="100" rx="8" fill="#d7e2db"/><circle cx="553" cy="200" r="5" fill="#347e6b"/><rect x="617" y="150" width="124" height="100" rx="8" fill="#d7e2db"/><circle cx="679" cy="200" r="5" fill="#347e6b"/><rect x="743" y="150" width="124" height="100" rx="8" fill="#d7e2db"/><circle cx="805" cy="200" r="5" fill="#347e6b"/><rect x="869" y="150" width="124" height="100" rx="8" fill="#d7e2db"/><circle cx="931" cy="200" r="5" fill="#347e6b"/><rect x="638" y="150" width="25" height="100" fill="#b47850"/><text x="45" y="185" font-family="sans-serif" font-size="16" fill="#345c65">A narrow stripe falls between centers.</text><text x="45" y="213" font-family="sans-serif" font-size="16" fill="#345c65">All centers can miss the stripe.</text><text x="45" y="315" font-family="sans-serif" font-size="19" fill="#345c65">Unit-footprint measurement</text><rect x="365" y="335" width="124" height="100" rx="8" fill="#d7e2db"/><rect x="370" y="340" width="114" height="90" rx="8" fill="#d7e2db"/><rect x="491" y="335" width="124" height="100" rx="8" fill="#d7e2db"/><rect x="496" y="340" width="114" height="90" rx="8" fill="#d7e2db"/><rect x="617" y="335" width="124" height="100" rx="8" fill="#d7e2db"/><rect x="622" y="340" width="114" height="90" rx="8" fill="#a4bfb0"/><rect x="743" y="335" width="124" height="100" rx="8" fill="#d7e2db"/><rect x="748" y="340" width="114" height="90" rx="8" fill="#d7e2db"/><rect x="869" y="335" width="124" height="100" rx="8" fill="#d7e2db"/><rect x="874" y="340" width="114" height="90" rx="8" fill="#d7e2db"/><rect x="638" y="335" width="25" height="100" fill="#b47850"/><text x="45" y="370" font-family="sans-serif" font-size="16" fill="#345c65">Integrate over the interval.</text><text x="45" y="398" font-family="sans-serif" font-size="16" fill="#345c65">Nonzero contribution survives.</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">Schematic: the stripe occupies part of pixel 2 but misses every sample center. Box averages preserve its fractional contribution.</text></svg>