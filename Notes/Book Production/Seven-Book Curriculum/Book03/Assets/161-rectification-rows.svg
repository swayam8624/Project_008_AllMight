<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>Rectification aligns epipolar rows</title><desc>Two image planes show corresponding points on a common horizontal row after rectification. Their horizontal separation is disparity, not a proof that the correspondence is correct.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">Rectification aligns epipolar rows</text><rect x="95" y="78" width="290" height="230" rx="3" fill="#f1f6f8" stroke="#657c90"/><line x1="95" y1="108" x2="385" y2="108" stroke="#c6dbe3" stroke-width="1"/><line x1="95" y1="142" x2="385" y2="142" stroke="#c6dbe3" stroke-width="1"/><line x1="95" y1="176" x2="385" y2="176" stroke="#c6dbe3" stroke-width="1"/><line x1="95" y1="210" x2="385" y2="210" stroke="#c6dbe3" stroke-width="1"/><line x1="95" y1="244" x2="385" y2="244" stroke="#c6dbe3" stroke-width="1"/><line x1="95" y1="278" x2="385" y2="278" stroke="#c6dbe3" stroke-width="1"/><rect x="455" y="78" width="290" height="230" rx="3" fill="#f1f6f8" stroke="#657c90"/><line x1="455" y1="108" x2="745" y2="108" stroke="#c6dbe3" stroke-width="1"/><line x1="455" y1="142" x2="745" y2="142" stroke="#c6dbe3" stroke-width="1"/><line x1="455" y1="176" x2="745" y2="176" stroke="#c6dbe3" stroke-width="1"/><line x1="455" y1="210" x2="745" y2="210" stroke="#c6dbe3" stroke-width="1"/><line x1="455" y1="244" x2="745" y2="244" stroke="#c6dbe3" stroke-width="1"/><line x1="455" y1="278" x2="745" y2="278" stroke="#c6dbe3" stroke-width="1"/><line x1="95" y1="176" x2="745" y2="176" stroke="#087fa0" stroke-width="2" stroke-dasharray="6 4"/><circle cx="280" cy="176" r="8" fill="#ac7428"/><circle cx="585" cy="176" r="8" fill="#ac7428"/><text x="240" y="330" font-size="17" text-anchor="middle" fill="#153149">Left view</text><text x="600" y="330" font-size="17" text-anchor="middle" fill="#153149">Right view</text><text x="420" y="150" font-size="15" text-anchor="middle" fill="#087fa0" font-weight="bold">Same ideal row</text></g></svg>
