<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="990" height="510" viewBox="0 0 990 510" role="img" aria-labelledby="title desc">
<title id="title">Ray and plane: forward, parallel and behind-origin outcomes</title>
<desc id="desc">Three clear cases for ray-plane intersections. A downward ray starting three metres above Y=0 hits at t=3; a horizontal ray above the plane is parallel; an upward ray from the same height has a line intersection at t=-3, behind the ray, so no forward hit.</desc>
<rect width="990" height="510" rx="18" fill="#fbfaf6"/>
<text x="34" y="40" font-family="sans-serif" font-size="23" font-weight="600" fill="#254452">Three different conversations with the same ground</text>
<text x="34" y="61" font-family="sans-serif" font-size="13" fill="#637c82">The horizontal ground line represents an infinite plane Y=0; ray direction is the colored arrow</text><rect x="28" y="92" width="300" height="318" rx="12" fill="#eff3ef" stroke="#dae5dc"/><line x1="52" y1="318" x2="304" y2="318" stroke="#2d8a76" stroke-width="4"/><text x="50" y="120" font-size="17" font-family="sans-serif" font-weight="600" fill="#355761">Hits the plane</text><text x="51" y="397" font-size="14" font-family="monospace" fill="#3d6066">t = +3 metres</text><line x1="184" y1="166" x2="184" y2="317" stroke="#af6850" stroke-width="4"/><polygon points="184,329 177,315 191,315" fill="#af6850"/><circle cx="184" cy="318" r="7" fill="#257a6b" stroke="#fff" stroke-width="2"/><text x="197" y="300" font-family="sans-serif" font-size="14" fill="#266d60">P=(1,0,2)</text><rect x="348" y="92" width="300" height="318" rx="12" fill="#eff3ef" stroke="#dae5dc"/><line x1="372" y1="318" x2="624" y2="318" stroke="#2d8a76" stroke-width="4"/><text x="370" y="120" font-size="17" font-family="sans-serif" font-weight="600" fill="#355761">Parallel to plane</text><text x="371" y="397" font-size="14" font-family="monospace" fill="#3d6066">no unique forward hit</text><line x1="408" y1="208" x2="598" y2="208" stroke="#af6850" stroke-width="4"/><polygon points="606,208 592,200 592,216" fill="#af6850"/><text x="413" y="185" font-size="14" font-family="sans-serif" fill="#a25f42">direction along plane</text><rect x="668" y="92" width="300" height="318" rx="12" fill="#eff3ef" stroke="#dae5dc"/><line x1="692" y1="318" x2="944" y2="318" stroke="#2d8a76" stroke-width="4"/><text x="690" y="120" font-size="17" font-family="sans-serif" font-weight="600" fill="#355761">Hits only behind</text><text x="691" y="397" font-size="14" font-family="monospace" fill="#3d6066">line t = -3 metres</text><line x1="824" y1="285" x2="824" y2="165" stroke="#af6850" stroke-width="4"/><polygon points="824,151 817,168 831,168" fill="#af6850"/><line x1="824" y1="285" x2="824" y2="318" stroke="#969fa1" stroke-width="2" stroke-dasharray="6 5"/><text x="834" y="255" font-size="14" font-family="sans-serif" fill="#a25f42">forward</text><rect x="32" y="427" width="928" height="49" rx="10" fill="#e8f1ef"/><text x="50" y="448" font-size="14" font-family="sans-serif" fill="#365a61">A line can intersect behind its start. A ray only accepts t at or beyond zero.</text><text x="50" y="466" font-size="12" font-family="sans-serif" fill="#607980">Near-parallel floating decisions may be uncertain; this is a schematic of the clear analytic cases.</text>
</svg>
