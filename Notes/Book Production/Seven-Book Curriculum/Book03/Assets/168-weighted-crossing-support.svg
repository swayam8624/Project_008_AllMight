<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>The zero must be supported by observations</title><desc>The guided axial fixture gives field values one, one half and minus one half at depths 0.9, 1.0 and 1.1 metres. The 1.2 metre sample has zero weight and no defined observation.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">The zero must be supported by observations</text><line x1="105" y1="95" x2="105" y2="300" stroke="#657c90" stroke-width="2"/><line x1="105" y1="300" x2="695" y2="300" stroke="#657c90" stroke-width="2"/><line x1="105" y1="300" x2="105" y2="306" stroke="#657c90" stroke-width="2"/><text x="105" y="323" font-size="13" text-anchor="middle" fill="#153149">0.9</text><line x1="301.66666666666663" y1="300" x2="301.66666666666663" y2="306" stroke="#657c90" stroke-width="2"/><text x="301.66666666666663" y="323" font-size="13" text-anchor="middle" fill="#153149">1</text><line x1="400.0000000000001" y1="300" x2="400.0000000000001" y2="306" stroke="#657c90" stroke-width="2"/><text x="400.0000000000001" y="323" font-size="13" text-anchor="middle" fill="#153149">1.05</text><line x1="498.33333333333354" y1="300" x2="498.33333333333354" y2="306" stroke="#657c90" stroke-width="2"/><text x="498.33333333333354" y="323" font-size="13" text-anchor="middle" fill="#153149">1.1</text><line x1="695" y1="300" x2="695" y2="306" stroke="#657c90" stroke-width="2"/><text x="695" y="323" font-size="13" text-anchor="middle" fill="#153149">1.2</text><line x1="105" y1="300" x2="695" y2="300" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="304" font-size="13" text-anchor="end" fill="#153149">-1</text><line x1="105" y1="248.75" x2="695" y2="248.75" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="252.75" font-size="13" text-anchor="end" fill="#153149">-0.5</text><line x1="105" y1="197.5" x2="695" y2="197.5" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="201.5" font-size="13" text-anchor="end" fill="#153149">0</text><line x1="105" y1="146.25" x2="695" y2="146.25" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="150.25" font-size="13" text-anchor="end" fill="#153149">0.5</text><line x1="105" y1="95" x2="695" y2="95" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="99" font-size="13" text-anchor="end" fill="#153149">1</text><text x="400" y="353" font-size="15" text-anchor="middle" fill="#153149">Axial depth (m); 1.2 m unknown</text><text x="105" y="80" font-size="14" text-anchor="start" fill="#153149">Supported TSDF value</text><polyline points="105,95 301.66666666666663,146.25 400.0000000000001,197.5 498.33333333333354,248.75" fill="none" stroke="#087fa0" stroke-width="2.8" stroke-linejoin="round"/><circle cx="105" cy="95" r="4" fill="#087fa0"/><circle cx="301.66666666666663" cy="146.25" r="4" fill="#087fa0"/><circle cx="400.0000000000001" cy="197.5" r="4" fill="#087fa0"/><circle cx="498.33333333333354" cy="248.75" r="4" fill="#087fa0"/><line x1="115" y1="52" x2="136" y2="52" stroke="#087fa0" stroke-width="3"/><text x="142" y="57" font-size="13" text-anchor="start" fill="#153149">Fused field</text></g></svg>
