<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>Two valid summaries answer different questions</title><desc>For the two hypothetical workloads, scene-level speedups are two and 0.909. The geometric mean is about 1.348 while the ratio of total elapsed times is about 0.914.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">Two valid summaries answer different questions</text><text x="190" y="105" font-size="15" text-anchor="end" fill="#153149">Scene A</text><rect x="205" y="88" width="500" height="25" rx="3" fill="#e8eff3" stroke="none"/><rect x="205" y="88" width="444.44444444444446" height="25" rx="3" fill="#087fa0" stroke="none"/><text x="659.4444444444445" y="105" font-size="14" text-anchor="start" fill="#153149">2.000</text><text x="190" y="150" font-size="15" text-anchor="end" fill="#153149">Scene B</text><rect x="205" y="133" width="500" height="25" rx="3" fill="#e8eff3" stroke="none"/><rect x="205" y="133" width="202.020202020202" height="25" rx="3" fill="#ac7428" stroke="none"/><text x="417.02020202020196" y="150" font-size="14" text-anchor="start" fill="#153149">0.909</text><text x="190" y="195" font-size="15" text-anchor="end" fill="#153149">Geometric mean</text><rect x="205" y="178" width="500" height="25" rx="3" fill="#e8eff3" stroke="none"/><rect x="205" y="178" width="299.6443833169965" height="25" rx="3" fill="#087fa0" stroke="none"/><text x="514.6443833169965" y="195" font-size="14" text-anchor="start" fill="#153149">1.348</text><text x="190" y="240" font-size="15" text-anchor="end" fill="#153149">Elapsed-sum ratio</text><rect x="205" y="223" width="500" height="25" rx="3" fill="#e8eff3" stroke="none"/><rect x="205" y="223" width="203.11714429361487" height="25" rx="3" fill="#ac7428" stroke="none"/><text x="418.11714429361484" y="240" font-size="14" text-anchor="start" fill="#153149">0.914</text></g></svg>
