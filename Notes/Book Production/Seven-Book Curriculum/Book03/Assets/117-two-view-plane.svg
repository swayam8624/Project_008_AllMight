<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>One plane connects two views</title><desc>Two rays and the baseline define an epipolar plane. Its ideal image-plane intersections are epipolar lines; the drawing is schematic.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">One plane connects two views</text><path d="M120 320L695 320L425 75Z" fill="#d9eef2" stroke="#167b90" stroke-width="2"/><path d="M120 320L425 75L695 320" fill="none" stroke="#167b90" stroke-width="3"/><path d="M120 320H695" stroke="#a66420" stroke-width="3"/><path d="M208 205L330 215L330 300L208 290Z M520 215L642 205L642 290L520 300Z" fill="#fff" fill-opacity=".8" stroke="#536b8b" stroke-width="2"/><path d="M208 247L330 220 M520 220L642 247" stroke="#c88033" stroke-width="3"/><circle cx="120" cy="320" r="6" fill="#153149"/><circle cx="695" cy="320" r="6" fill="#153149"/><circle cx="425" cy="75" r="6" fill="#c88033"/><text x="440" y="76">Scene point X</text><text x="120" y="346" text-anchor="middle">C1</text><text x="695" y="346" text-anchor="middle">C2</text><text x="420" y="346" text-anchor="middle">Baseline</text><text x="420" y="390" text-anchor="middle">The orange lines indicate the epipolar-plane intersections.</text></g></svg>
