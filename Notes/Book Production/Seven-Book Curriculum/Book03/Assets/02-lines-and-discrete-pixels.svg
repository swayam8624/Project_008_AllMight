<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="760" height="550" viewBox="0 0 760 550" role="img" aria-labelledby="title desc">
<title id="title">A continuous line compared with seven discrete colored pixel samples</title>
<desc id="desc">A seven-by-five grid. A thin continuous reference line passes between centers (0.5,0.5) and (6.5,4.5). Seven teal pixel cells are selected by the chapter's integer line algorithm: (0,0), (1,1), (2,1), (3,2), (4,3), (5,3), and (6,4). The staircase of cells approximates a continuous line.</desc>
<rect width="760" height="550" fill="#fbfaf6" rx="18"/>
<text x="40" y="32" font-size="20" font-family="sans-serif" fill="#23384b" font-weight="600">A straight idea becomes little steps</text>
<text x="40" y="51" font-size="12" font-family="sans-serif" fill="#647482">A line in continuous space and the samples chosen by one integer raster rule</text>
<g transform="translate(92 83)">
  <rect width="560" height="400" fill="#f1f5f3"/>
  <g fill="#b8ded5" stroke="#197e71" stroke-width="1">
    <rect x="0" y="0" width="80" height="80"/>
    <rect x="80" y="80" width="80" height="80"/>
    <rect x="160" y="80" width="80" height="80"/>
    <rect x="240" y="160" width="80" height="80"/>
    <rect x="320" y="240" width="80" height="80"/>
    <rect x="400" y="240" width="80" height="80"/>
    <rect x="480" y="320" width="80" height="80"/>
  </g>
  <g stroke="#a8b7bc" stroke-width="1">
    <path d="M0 0 V400 M80 0 V400 M160 0 V400 M240 0 V400 M320 0 V400 M400 0 V400 M480 0 V400 M560 0 V400"/>
    <path d="M0 0 H560 M0 80 H560 M0 160 H560 M0 240 H560 M0 320 H560 M0 400 H560"/>
  </g>
  <path d="M40 40 L520 360" fill="none" stroke="#c8743a" stroke-width="3.5" stroke-linecap="round" stroke-dasharray="10 7"/>
  <g fill="#115f59" stroke="#fff" stroke-width="2">
    <circle cx="40" cy="40" r="6"/><circle cx="120" cy="120" r="6"/>
    <circle cx="200" cy="120" r="6"/><circle cx="280" cy="200" r="6"/>
    <circle cx="360" cy="280" r="6"/><circle cx="440" cy="280" r="6"/>
    <circle cx="520" cy="360" r="6"/>
  </g>
  <g font-family="monospace" fill="#3f505a" font-size="14">
    <text x="6" y="25">(0,0)</text><text x="479" y="390">(6,4)</text>
  </g>
</g>
<g font-size="13" font-family="sans-serif" fill="#526673">
  <rect x="43" y="503" width="18" height="16" fill="#b8ded5" stroke="#197e71"/>
  <text x="70" y="516">selected stored pixel</text>
  <path d="M260 511 H300" stroke="#c8743a" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="310" y="516">continuous geometric reference</text>
</g>
</svg>
