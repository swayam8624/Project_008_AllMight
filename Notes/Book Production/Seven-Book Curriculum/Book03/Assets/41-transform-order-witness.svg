<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Transform order numerical witness</title><desc id="desc">The point (1,2,3) scaled by (2,3,4), rotated ninety degrees about Y, and translated by (4,0,0) reaches (16,6,-2). Scaling then translating then rotating gives (12,6,-6).</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="40" font-family="sans-serif" font-size="24" fill="#294e58" font-weight='600'>Transform order changes the answer</text><text x="30" y="120" font-family="sans-serif" font-size="18" fill="#355c64" >TRS: scale, rotate, translate</text><rect x="30" y="138" width="235" height="112" rx="12" fill="#edf3ef"/><text x="45" y="201" font-family="sans-serif" font-size="17" fill="#355c64" >p = (1,2,3)</text><line x1="266" y1="194" x2="288" y2="194" stroke="#aa815a" stroke-width="3" /><rect x="290" y="138" width="235" height="112" rx="12" fill="#edf3ef"/><text x="305" y="201" font-family="sans-serif" font-size="17" fill="#355c64" >S: (2,6,12)</text><line x1="526" y1="194" x2="548" y2="194" stroke="#aa815a" stroke-width="3" /><rect x="550" y="138" width="235" height="112" rx="12" fill="#edf3ef"/><text x="565" y="201" font-family="sans-serif" font-size="17" fill="#355c64" >R: (12,6,-2)</text><line x1="786" y1="194" x2="808" y2="194" stroke="#aa815a" stroke-width="3" /><rect x="810" y="138" width="235" height="112" rx="12" fill="#dbece3"/><text x="825" y="201" font-family="sans-serif" font-size="17" fill="#355c64" >T: (16,6,-2)</text><text x="30" y="330" font-family="sans-serif" font-size="18" fill="#355c64" >RTS: scale, translate, rotate</text><rect x="30" y="348" width="235" height="112" rx="12" fill="#edf3ef"/><text x="45" y="411" font-family="sans-serif" font-size="17" fill="#355c64" >p = (1,2,3)</text><line x1="266" y1="404" x2="288" y2="404" stroke="#aa815a" stroke-width="3" /><rect x="290" y="348" width="235" height="112" rx="12" fill="#edf3ef"/><text x="305" y="411" font-family="sans-serif" font-size="17" fill="#355c64" >S: (2,6,12)</text><line x1="526" y1="404" x2="548" y2="404" stroke="#aa815a" stroke-width="3" /><rect x="550" y="348" width="235" height="112" rx="12" fill="#edf3ef"/><text x="565" y="411" font-family="sans-serif" font-size="17" fill="#355c64" >T: (6,6,12)</text><line x1="786" y1="404" x2="808" y2="404" stroke="#aa815a" stroke-width="3" /><rect x="810" y="348" width="235" height="112" rx="12" fill="#dbece3"/><text x="825" y="411" font-family="sans-serif" font-size="17" fill="#355c64" >R: (12,6,-6)</text><text x="30" y="520" font-family="sans-serif" font-size="14" fill="#355c64" >Column-vector convention: the rightmost matrix acts first.</text></svg>