<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Six coordinate contracts from object to window</title><desc id="desc">Six ordered stages: model, view, projection, clip classification or primitive clipping, perspective division, viewport. Rasterization is separate.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#284e58" font-weight="600">Six coordinate contracts from object to window</text><rect x="25" y="90" width="328" height="164" rx="12" fill="#edf3ef"/><text x="41" y="125" font-family="sans-serif" font-size="18" fill="#2e655e" >1. Model</text><text x="41" y="169" font-family="sans-serif" font-size="16" fill="#355d65" >Object → world</text><text x="41" y="214" font-family="sans-serif" font-size="16" fill="#355d65" >M p</text><line x1="354" y1="170" x2="375" y2="170" stroke="#b98761" stroke-width="3" /><rect x="376" y="90" width="328" height="164" rx="12" fill="#edf3ef"/><text x="392" y="125" font-family="sans-serif" font-size="18" fill="#2e655e" >2. View</text><text x="392" y="169" font-family="sans-serif" font-size="16" fill="#355d65" >World → camera</text><text x="392" y="214" font-family="sans-serif" font-size="16" fill="#355d65" >V M p</text><line x1="705" y1="170" x2="726" y2="170" stroke="#b98761" stroke-width="3" /><rect x="727" y="90" width="328" height="164" rx="12" fill="#edf3ef"/><text x="743" y="125" font-family="sans-serif" font-size="18" fill="#2e655e" >3. Projection</text><text x="743" y="169" font-family="sans-serif" font-size="16" fill="#355d65" >Camera → clip</text><text x="743" y="214" font-family="sans-serif" font-size="16" fill="#355d65" >P V M p</text><rect x="25" y="295" width="328" height="164" rx="12" fill="#edf3ef"/><text x="41" y="330" font-family="sans-serif" font-size="18" fill="#2e655e" >4. Clip</text><text x="41" y="374" font-family="sans-serif" font-size="16" fill="#355d65" >Six half-spaces</text><text x="41" y="419" font-family="sans-serif" font-size="16" fill="#355d65" >positive w</text><line x1="354" y1="375" x2="375" y2="375" stroke="#b98761" stroke-width="3" /><rect x="376" y="295" width="328" height="164" rx="12" fill="#edf3ef"/><text x="392" y="330" font-family="sans-serif" font-size="18" fill="#2e655e" >5. Divide</text><text x="392" y="374" font-family="sans-serif" font-size="16" fill="#355d65" >Clip → NDC</text><text x="392" y="419" font-family="sans-serif" font-size="16" fill="#355d65" >(x/w,y/w,z/w)</text><line x1="705" y1="375" x2="726" y2="375" stroke="#b98761" stroke-width="3" /><rect x="727" y="295" width="328" height="164" rx="12" fill="#edf3ef"/><text x="743" y="330" font-family="sans-serif" font-size="18" fill="#2e655e" >6. Viewport</text><text x="743" y="374" font-family="sans-serif" font-size="16" fill="#355d65" >NDC → window</text><text x="743" y="419" font-family="sans-serif" font-size="16" fill="#355d65" >(u,v,depth)</text><line x1="1040" y1="255" x2="1040" y2="275" stroke="#b98761" stroke-width="2" /><line x1="1040" y1="275" x2="15" y2="275" stroke="#b98761" stroke-width="2" /><line x1="15" y1="275" x2="15" y2="375" stroke="#b98761" stroke-width="2" /><line x1="15" y1="375" x2="25" y2="375" stroke="#b98761" stroke-width="2" /><text x="28" y="528" font-family="sans-serif" font-size="13" fill="#355d65" >Column vectors; graphics local −Z forward; zero-to-one NDC depth; top-left viewport. Rasterization follows.</text></svg>