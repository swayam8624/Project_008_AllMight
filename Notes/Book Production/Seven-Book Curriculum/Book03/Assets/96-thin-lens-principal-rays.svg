<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Three principal rays, one real image</title><desc id="desc">A 20 mm high object at 150 mm from a 50 mm thin lens forms a negative 10 mm high image at 75 mm.</desc><rect width="1080" height="560" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Three principal rays, one real image</text><rect x="25" y="80" width="1030" height="410" rx="8" fill="#edf3ef"/><line x1="65" y1="285" x2="1015" y2="285" stroke="#819c94" stroke-width="1.4" /><line x1="640" y1="110" x2="640" y2="460" stroke="#547da5" stroke-width="4" /><circle cx="485" cy="285" r="5" fill="#547da5"/><text x="478" y="310" font-family="sans-serif" font-size="15" fill="#345c65">F</text><circle cx="795" cy="285" r="5" fill="#547da5"/><text x="788" y="310" font-family="sans-serif" font-size="15" fill="#345c65">F′</text><line x1="175" y1="285" x2="175" y2="223" stroke="#b47850" stroke-width="2.8" /><line x1="872.5" y1="285" x2="872.5" y2="316" stroke="#347e6b" stroke-width="2.8" /><line x1="175" y1="223" x2="640" y2="223" stroke="#347e6b" stroke-width="2.8" /><line x1="640" y1="223" x2="872.5" y2="316" stroke="#347e6b" stroke-width="2.8" /><line x1="175" y1="223" x2="872.5" y2="316" stroke="#b47850" stroke-width="2.8" /><line x1="175" y1="223" x2="640" y2="316" stroke="#547da5" stroke-width="2.8" /><line x1="640" y1="316" x2="872.5" y2="316" stroke="#547da5" stroke-width="2.8" /><text x="105" y="160" font-family="sans-serif" font-size="16" fill="#345c65">Object: 20 mm</text><text x="850" y="347" font-family="sans-serif" font-size="16" fill="#345c65">Image: −10 mm</text><text x="380" y="450" font-family="sans-serif" font-size="16" fill="#345c65">z = 150 mm</text><text x="700" y="450" font-family="sans-serif" font-size="16" fill="#345c65">v = 75 mm</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">Same millimetre scale on both axes. Thin lens f=50 mm; all three principal rays meet at the inverted image.</text></svg>