<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="460" viewBox="0 0 940 460" role="img" aria-labelledby="title desc">
<title id="title">Rotate then translate and translate then rotate yield different results</title>
<desc id="desc">A source point P=(1,0) metres is transformed twice. In the left panel, rotation by 90 degrees counterclockwise followed by translation (2,0) yields (2,1). In the right panel, translation (2,0) followed by the same rotation yields (0,3). Both panels use the same world origin and axis scale; column vector matrix products apply their rightmost factor first.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#6a8694"/></marker></defs>
<rect width="940" height="460" rx="18" fill="#fbfaf6"/>
<text x="35" y="37" font-size="24" font-family="sans-serif" font-weight="600" fill="#294754">Order changes the destination</text>
<text x="35" y="60" font-size="13" font-family="sans-serif" fill="#657b82">Both begin with P=(1,0) metres; the rightmost matrix acts first</text>
<rect x="34" y="86" width="422" height="345" rx="12" fill="#eef3ef"/>
<rect x="484" y="86" width="422" height="345" rx="12" fill="#eef3ef"/>
<g font-family="sans-serif" font-size="18" font-weight="600" fill="#3d5861">
<text x="55" y="119">Rotate → Translate</text>
<text x="504" y="119">Translate → Rotate</text>
</g>
<!-- origin left (180,324), 1 metre = 65px; origin right (635,324) -->
<g stroke="#a9bac0" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M81 324 H420"/><path d="M180 390 V155"/>
<path d="M540 324 H875"/><path d="M635 390 V155"/>
</g>
<g stroke="#c5d0d0" stroke-dasharray="7 6" stroke-width="2" fill="none">
<path d="M245 324 L310 259"/>
<path d="M700 324 L635 129"/>
</g>
<!-- Source P -->
<circle cx="245" cy="324" r="7" fill="#6d8791" stroke="white" stroke-width="2"/>
<circle cx="700" cy="324" r="7" fill="#6d8791" stroke="white" stroke-width="2"/>
<g font-size="14" font-family="sans-serif" fill="#59747f">
<text x="257" y="342">P=(1,0)</text><text x="712" y="342">P=(1,0)</text>
</g>
<!-- Output (2,1) left -->
<circle cx="310" cy="259" r="9" fill="#247b6d" stroke="white" stroke-width="2"/>
<text x="323" y="254" font-family="sans-serif" font-weight="600" font-size="17" fill="#1c6e61">(2,1)</text>
<!-- Output (0,3) right -->
<circle cx="635" cy="129" r="9" fill="#b16b47" stroke="white" stroke-width="2"/>
<text x="650" y="139" font-family="sans-serif" font-weight="600" font-size="17" fill="#a26041">(0,3)</text>
<g font-family="monospace" font-size="15" fill="#395c65">
<text x="54" y="389">T(2,0) · R(90°) · P</text>
<text x="504" y="389">R(90°) · T(2,0) · P</text>
</g>
<text x="53" y="446" font-size="13" font-family="sans-serif" fill="#627982">The point did not change. Only the instruction order did.</text>
</svg>