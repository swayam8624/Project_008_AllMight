<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Noisy skew rays and their closest midpoint</title><desc id="desc">For the left ray from origin along negative Z and the right ray from (1,1,0) toward (0,1,-4), closest points are separated by one metre. Their midpoint is (0,0.5,-4); ranges are 4 and square root of 17 metres.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="29" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Noisy skew rays and their closest midpoint</text><rect x="25" y="82" width="680" height="407" rx="12" fill="#edf3ef"/><rect x="725" y="82" width="330" height="407" rx="12" fill="#edf3ef"/><line x1="230" y1="440" x2="230" y2="165" stroke="#387e6b" stroke-width="4" /><line x1="620" y1="435" x2="410" y2="210" stroke="#b47850" stroke-width="4" /><line x1="230" y1="165" x2="410" y2="210" stroke="#507ca8" stroke-width="3" stroke-dasharray="6 4"/><circle cx="230" cy="440" r="6" fill="#367f6e" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="620" cy="435" r="6" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="230" cy="165" r="6" fill="#367f6e" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="410" cy="210" r="6" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="320" cy="187.5" r="7" fill="#507ca8" stroke="#fbfaf7" stroke-width="1.5"/><text x="185" y="464" font-family="sans-serif" font-size="14" fill="#365e65">left center</text><text x="570" y="463" font-family="sans-serif" font-size="14" fill="#365e65">right center</text><text x="175" y="145" font-family="sans-serif" font-size="14" fill="#365e65">A=(0,0,−4)</text><text x="420" y="202" font-family="sans-serif" font-size="14" fill="#365e65">B=(0,1,−4)</text><text x="275" y="225" font-family="sans-serif" font-size="14" fill="#365e65">midpoint</text><text x="743" y="125" font-family="sans-serif" font-size="18" fill="#365e65">Metric closest points</text><text x="743" y="178" font-family="sans-serif" font-size="17" fill="#365e65">s = 4 m</text><text x="743" y="220" font-family="sans-serif" font-size="17" fill="#365e65">t = √17 m</text><text x="743" y="268" font-family="sans-serif" font-size="19" fill="#365e65">gap = 1 m</text><text x="743" y="318" font-family="sans-serif" font-size="18" fill="#365e65">P̂ = (0,0.5,−4)</text><text x="743" y="387" font-family="sans-serif" font-size="14" fill="#365e65">Not a pixel-error optimizer.</text><text x="29" y="531" font-family="sans-serif" font-size="13" fill="#365e65">Illustrative projection of a 3D skew-ray example; the numeric coordinates define its exact geometry.</text></svg>