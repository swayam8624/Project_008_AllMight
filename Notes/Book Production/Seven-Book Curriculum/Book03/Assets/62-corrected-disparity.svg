<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Principal-point correction preserves disparity</title><desc id="desc">The left offset from its principal point is 100 pixels in both examples. The right offset is 80 pixels with either principal point 320 or 300. Corrected disparity remains 20 pixels.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="29" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Principal-point correction preserves disparity</text><rect x="25" y="82" width="505" height="407" rx="12" fill="#edf3ef"/><text x="40" y="117" font-family="sans-serif" font-size="18" fill="#365e65">Equal principal points</text><line x1="60" y1="220" x2="485" y2="220" stroke="#aac0b7" stroke-width="2" /><circle cx="160" cy="220" r="6" fill="#507da7" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="410" cy="220" r="6" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><line x1="160" y1="202" x2="410" y2="202" stroke="#367e6d" stroke-width="3" /><text x="148" y="248" font-family="sans-serif" font-size="12" fill="#365e65">320</text><text x="398" y="248" font-family="sans-serif" font-size="12" fill="#365e65">420</text><text x="40" y="168" font-family="sans-serif" font-size="15" fill="#365e65">Left image</text><text x="40" y="268" font-family="sans-serif" font-size="13" fill="#365e65">Offset: 100 px</text><line x1="60" y1="345" x2="485" y2="345" stroke="#aac0b7" stroke-width="2" /><circle cx="160" cy="345" r="6" fill="#507da7" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="360" cy="345" r="6" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><line x1="160" y1="327" x2="360" y2="327" stroke="#367e6d" stroke-width="3" /><text x="148" y="373" font-family="sans-serif" font-size="12" fill="#365e65">320</text><text x="348" y="373" font-family="sans-serif" font-size="12" fill="#365e65">400</text><text x="40" y="293" font-family="sans-serif" font-size="15" fill="#365e65">Right image</text><text x="40" y="393" font-family="sans-serif" font-size="13" fill="#365e65">Offset: 80 px</text><text x="40" y="461" font-family="sans-serif" font-size="16" fill="#287d69">Raw 20 px; corrected 20 px</text><rect x="550" y="82" width="505" height="407" rx="12" fill="#edf3ef"/><text x="565" y="117" font-family="sans-serif" font-size="18" fill="#365e65">Shifted right principal point</text><line x1="585" y1="220" x2="1010" y2="220" stroke="#aac0b7" stroke-width="2" /><circle cx="685" cy="220" r="6" fill="#507da7" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="935" cy="220" r="6" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><line x1="685" y1="202" x2="935" y2="202" stroke="#367e6d" stroke-width="3" /><text x="673" y="248" font-family="sans-serif" font-size="12" fill="#365e65">320</text><text x="923" y="248" font-family="sans-serif" font-size="12" fill="#365e65">420</text><text x="565" y="168" font-family="sans-serif" font-size="15" fill="#365e65">Left image</text><text x="565" y="268" font-family="sans-serif" font-size="13" fill="#365e65">Offset: 100 px</text><line x1="585" y1="345" x2="1010" y2="345" stroke="#aac0b7" stroke-width="2" /><circle cx="635" cy="345" r="6" fill="#507da7" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="835" cy="345" r="6" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><line x1="635" y1="327" x2="835" y2="327" stroke="#367e6d" stroke-width="3" /><text x="623" y="373" font-family="sans-serif" font-size="12" fill="#365e65">300</text><text x="823" y="373" font-family="sans-serif" font-size="12" fill="#365e65">380</text><text x="565" y="293" font-family="sans-serif" font-size="15" fill="#365e65">Right image</text><text x="565" y="393" font-family="sans-serif" font-size="13" fill="#365e65">Offset: 80 px</text><text x="565" y="461" font-family="sans-serif" font-size="16" fill="#287d69">Raw 40 px; corrected 20 px</text><text x="29" y="531" font-family="sans-serif" font-size="14" fill="#365e65">Subtract each image's own principal point before comparing horizontal offsets.</text></svg>