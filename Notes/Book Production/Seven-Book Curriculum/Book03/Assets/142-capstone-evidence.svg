<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>A claim is only as inspectable as its evidence chain</title><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">A claim is only as inspectable as its evidence chain</text><rect x="55" y="90" width="210" height="70" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="160" y="119" text-anchor="middle" font-weight="bold">1. Define claim</text><text x="160" y="140" text-anchor="middle" font-size="12">Hypothesis</text><rect x="315" y="90" width="210" height="70" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="420" y="119" text-anchor="middle" font-weight="bold">2. Declare domain</text><text x="420" y="140" text-anchor="middle" font-size="12">Units and assumptions</text><rect x="575" y="90" width="210" height="70" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="680" y="119" text-anchor="middle" font-weight="bold">3. Run experiment</text><text x="680" y="140" text-anchor="middle" font-size="12">Source, seed and config</text><rect x="55" y="240" width="210" height="70" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="160" y="269" text-anchor="middle" font-weight="bold">4. Retain raw output</text><text x="160" y="290" text-anchor="middle" font-size="12">Counts and failures</text><rect x="315" y="240" width="210" height="70" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="420" y="269" text-anchor="middle" font-weight="bold">5. Verify and aggregate</text><text x="420" y="290" text-anchor="middle" font-size="12">Independent checks</text><rect x="575" y="240" width="210" height="70" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="680" y="269" text-anchor="middle" font-weight="bold">6. Report limitations</text><text x="680" y="290" text-anchor="middle" font-size="12">No unsupported inference</text><path d="M265 125H315 M525 125H575 M680 160V195H160V240 M265 275H315 M525 275H575" fill="none" stroke="#167b90" stroke-width="2" stroke-dasharray="5 3"/><text x="420" y="385" text-anchor="middle">Keep the traceable artifacts with the conclusion.</text></g></svg>
