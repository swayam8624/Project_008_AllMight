<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Four directed polygon edge cases</title><desc id="desc">For each ordered edge, clipping emits the ending vertex if inside and an intersection on a crossing. The four cases preserve the cyclic order of the surviving polygon.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Four directed polygon edge cases</text><rect x="25" y="80" width="505" height="188" rx="10" fill="#edf3ef"/><rect x="40" y="185" width="475" height="67" fill="#d5e7dc"/><line x1="40" y1="185" x2="515" y2="185" stroke="#507ca8" stroke-width="2" /><line x1="90" y1="233" x2="450" y2="233" stroke="#b47850" stroke-width="3" /><circle cx="90" cy="233" r="5" fill="#377f6b"/><circle cx="450" cy="233" r="5" fill="#377f6b"/><text x="80" y="223" font-family="sans-serif" font-size="13" fill="#345c65">A</text><text x="458" y="225" font-family="sans-serif" font-size="13" fill="#345c65">B</text><line x1="90" y1="233" x2="450" y2="233" stroke="#377f6b" stroke-width="4" /><text x="40" y="104" font-family="sans-serif" font-size="16" fill="#345c65">Inside → inside: B</text><rect x="550" y="80" width="505" height="188" rx="10" fill="#edf3ef"/><rect x="565" y="185" width="475" height="67" fill="#d5e7dc"/><line x1="565" y1="185" x2="1040" y2="185" stroke="#507ca8" stroke-width="2" /><line x1="615" y1="233" x2="975" y2="137" stroke="#b47850" stroke-width="3" /><circle cx="615" cy="233" r="5" fill="#377f6b"/><circle cx="975" cy="137" r="5" fill="#377f6b"/><text x="605" y="223" font-family="sans-serif" font-size="13" fill="#345c65">A</text><text x="983" y="129" font-family="sans-serif" font-size="13" fill="#345c65">B</text><circle cx="795" cy="185" r="6" fill="#507ca8"/><text x="803" y="178" font-family="sans-serif" font-size="13" fill="#345c65">I</text><line x1="615" y1="233" x2="795" y2="185" stroke="#377f6b" stroke-width="4" /><text x="565" y="104" font-family="sans-serif" font-size="16" fill="#345c65">Inside → outside: I</text><rect x="25" y="285" width="505" height="188" rx="10" fill="#edf3ef"/><rect x="40" y="390" width="475" height="67" fill="#d5e7dc"/><line x1="40" y1="390" x2="515" y2="390" stroke="#507ca8" stroke-width="2" /><line x1="90" y1="342" x2="450" y2="438" stroke="#b47850" stroke-width="3" /><circle cx="90" cy="342" r="5" fill="#377f6b"/><circle cx="450" cy="438" r="5" fill="#377f6b"/><text x="80" y="332" font-family="sans-serif" font-size="13" fill="#345c65">A</text><text x="458" y="430" font-family="sans-serif" font-size="13" fill="#345c65">B</text><circle cx="270" cy="390" r="6" fill="#507ca8"/><text x="278" y="383" font-family="sans-serif" font-size="13" fill="#345c65">I</text><line x1="270" y1="390" x2="450" y2="438" stroke="#377f6b" stroke-width="4" /><text x="40" y="309" font-family="sans-serif" font-size="16" fill="#345c65">Outside → inside: I, B</text><rect x="550" y="285" width="505" height="188" rx="10" fill="#edf3ef"/><rect x="565" y="390" width="475" height="67" fill="#d5e7dc"/><line x1="565" y1="390" x2="1040" y2="390" stroke="#507ca8" stroke-width="2" /><line x1="615" y1="342" x2="975" y2="342" stroke="#b47850" stroke-width="3" /><circle cx="615" cy="342" r="5" fill="#377f6b"/><circle cx="975" cy="342" r="5" fill="#377f6b"/><text x="605" y="332" font-family="sans-serif" font-size="13" fill="#345c65">A</text><text x="983" y="334" font-family="sans-serif" font-size="13" fill="#345c65">B</text><text x="565" y="309" font-family="sans-serif" font-size="16" fill="#345c65">Outside → outside: nothing</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">Green is the accepted half-space. This is the conventional B-emission table; the implementation uses a cyclic A-emission variant.</text></svg>