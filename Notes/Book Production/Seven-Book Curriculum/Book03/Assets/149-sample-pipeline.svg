<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>One sample, five independently testable stages</title><desc>The single triangle witness is followed from optical coordinates through projected barycentrics, reciprocal-w, depth, and the final color encoding decision.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">One sample, five independently testable stages</text><rect x="40" y="108" width="136" height="110" rx="3" fill="#f0f5f8" stroke="#c3d9e2"/><text x="108" y="145" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Optical</text><text x="108" y="168" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">vertices</text><line x1="181" y1="163" x2="191" y2="163" stroke="#087fa0" stroke-width="2"/><polyline points="181.99552897647322,167.3496553411123 191,163 181.99552897647322,158.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><text x="108" y="248" font-size="13" text-anchor="middle" fill="#657c90">Z = 2,2,4</text><rect x="196" y="108" width="136" height="110" rx="3" fill="#e4f3f7" stroke="#c3d9e2"/><text x="264" y="145" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Screen</text><text x="264" y="168" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">weights</text><line x1="337" y1="163" x2="347" y2="163" stroke="#087fa0" stroke-width="2"/><polyline points="337.9955289764732,167.3496553411123 347,163 337.9955289764732,158.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><text x="264" y="248" font-size="13" text-anchor="middle" fill="#657c90">0.24,0.25,0.51</text><rect x="352" y="108" width="136" height="110" rx="3" fill="#f0f5f8" stroke="#c3d9e2"/><text x="420" y="145" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Reciprocal</text><text x="420" y="168" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">w</text><line x1="493" y1="163" x2="503" y2="163" stroke="#087fa0" stroke-width="2"/><polyline points="493.9955289764732,167.3496553411123 503,163 493.9955289764732,158.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><text x="420" y="248" font-size="13" text-anchor="middle" fill="#657c90">H = 0.3725</text><rect x="508" y="108" width="136" height="110" rx="3" fill="#e4f3f7" stroke="#c3d9e2"/><text x="576" y="145" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Depth</text><text x="576" y="168" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">compare</text><line x1="649" y1="163" x2="659" y2="163" stroke="#087fa0" stroke-width="2"/><polyline points="649.9955289764732,167.3496553411123 659,163 649.9955289764732,158.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><text x="576" y="248" font-size="13" text-anchor="middle" fill="#657c90">q ≈ 0.69722</text><rect x="664" y="108" width="136" height="110" rx="3" fill="#f0f5f8" stroke="#c3d9e2"/><text x="732" y="145" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">Encode</text><text x="732" y="168" font-size="16" text-anchor="middle" fill="#153149" font-weight="bold">linear light</text><text x="732" y="248" font-size="13" text-anchor="middle" fill="#657c90">0.25 → 137</text></g></svg>
