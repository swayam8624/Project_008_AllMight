nt-family="sans-serif" font-size="16" fill="#345c65">Inclusive: upward edges,</text><text x="715" y="211" font-family="sans-serif" font-size="16" fill="#345c65">or horizontal rightward.</text><text x="715" y="280" font-family="sans-serif" font-size="16" fill="#345c65">Shared A edge: C → A</text><text x="715" y="316" font-family="sans-serif" font-size="16" fill="#345c65">Shared B edge: A → C</text><text x="715" y="380" font-family="sans-serif" font-size="18" fill="#287b68">Exactly one accepts zero.</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">Assumes a genuine partition with identical snapped shared endpoints and consistent winding normalization.</text></svg>