<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Attribute transformation routes</title><desc id="desc">Position travels through model, view and projection; normals use the inverse transpose of the model linear map and UV coordinates are carried unchanged. The raw payload stays available for clipping.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="40" font-family="sans-serif" font-size="23" fill="#294e58" font-weight="600">Attribute transformation routes</text><rect x="25" y="92" width="1030" height="125" rx="12" fill="#edf3ef"/><text x="42" y="116" font-family="sans-serif" font-size="14" fill="#287b68" font-weight="600">POSITION</text><rect x="43" y="135" width="126.57142857142858" height="55" rx="12" fill="#f9faf7"/><text x="51" y="168" font-family="sans-serif" font-size="13" fill="#345c65" >Local</text><line x1="169.57142857142858" y1="162" x2="181.57142857142858" y2="162" stroke="#b57d51" stroke-width="2" /><rect x="181.57142857142858" y="135" width="126.57142857142858" height="55" rx="12" fill="#f9faf7"/><text x="189.57142857142858" y="168" font-family="sans-serif" font-size="13" fill="#345c65" >Model</text><line x1="308.14285714285717" y1="162" x2="320.14285714285717" y2="162" stroke="#b57d51" stroke-width="2" /><rect x="320.14285714285717" y="135" width="126.57142857142858" height="55" rx="12" fill="#f9faf7"/><text x="328.14285714285717" y="168" font-family="sans-serif" font-size="13" fill="#345c65" >World</text><line x1="446.7142857142858" y1="162" x2="458.7142857142858" y2="162" stroke="#b57d51" stroke-width="2" /><rect x="458.7142857142858" y="135" width="126.57142857142858" height="55" rx="12" fill="#f9faf7"/><text x="466.7142857142858" y="168" font-family="sans-serif" font-size="13" fill="#345c65" >View</text><line x1="585.2857142857143" y1="162" x2="597.2857142857143" y2="162" stroke="#b57d51" stroke-width="2" /><rect x="597.2857142857143" y="135" width="126.57142857142858" height="55" rx="12" fill="#f9faf7"/><text x="605.2857142857143" y="168" font-family="sans-serif" font-size="13" fill="#345c65" >Camera</text><line x1="723.8571428571429" y1="162" x2="735.8571428571429" y2="162" stroke="#b57d51" stroke-width="2" /><rect x="735.8571428571429" y="135" width="126.57142857142858" height="55" rx="12" fill="#f9faf7"/><text x="743.8571428571429" y="168" font-family="sans-serif" font-size="13" fill="#345c65" >Projection</text><line x1="862.4285714285714" y1="162" x2="874.4285714285714" y2="162" stroke="#b57d51" stroke-width="2" /><rect x="874.4285714285716" y="135" width="126.57142857142858" height="55" rx="12" fill="#f9faf7"/><text x="882.4285714285716" y="168" font-family="sans-serif" font-size="13" fill="#345c65" >Clip</text><rect x="25" y="237" width="1030" height="125" rx="12" fill="#edf3ef"/><text x="42" y="261" font-family="sans-serif" font-size="14" fill="#287b68" font-weight="600">NORMAL</text><rect x="43" y="280" width="311.3333333333333" height="55" rx="12" fill="#f9faf7"/><text x="51" y="313" font-family="sans-serif" font-size="16" fill="#345c65" >Local normal</text><line x1="354.3333333333333" y1="307" x2="366.3333333333333" y2="307" stroke="#b57d51" stroke-width="2" /><rect x="366.3333333333333" y="280" width="311.3333333333333" height="55" rx="12" fill="#f9faf7"/><text x="374.3333333333333" y="313" font-family="sans-serif" font-size="16" fill="#345c65" >Inverse transpose</text><line x1="677.6666666666666" y1="307" x2="689.6666666666666" y2="307" stroke="#b57d51" stroke-width="2" /><rect x="689.6666666666666" y="280" width="311.3333333333333" height="55" rx="12" fill="#f9faf7"/><text x="697.6666666666666" y="313" font-family="sans-serif" font-size="16" fill="#345c65" >World normal</text><rect x="25" y="382" width="1030" height="125" rx="12" fill="#edf3ef"/><text x="42" y="406" font-family="sans-serif" font-size="14" fill="#287b68" font-weight="600">UV</text><rect x="43" y="425" width="311.3333333333333" height="55" rx="12" fill="#f9faf7"/><text x="51" y="458" font-family="sans-serif" font-size="16" fill="#345c65" >Local UV</text><line x1="354.3333333333333" y1="452" x2="366.3333333333333" y2="452" stroke="#b57d51" stroke-width="2" /><rect x="366.3333333333333" y="425" width="311.3333333333333" height="55" rx="12" fill="#f9faf7"/><text x="374.3333333333333" y="458" font-family="sans-serif" font-size="16" fill="#345c65" >Carry unchanged</text><line x1="677.6666666666666" y1="452" x2="689.6666666666666" y2="452" stroke="#b57d51" stroke-width="2" /><rect x="689.6666666666666" y="425" width="311.3333333333333" height="55" rx="12" fill="#f9faf7"/><text x="697.6666666666666" y="458" font-family="sans-serif" font-size="16" fill="#345c65" >Raw varying</text><text x="30" y="531" font-family="sans-serif" font-size="13" fill="#345c65" >Raw clip coordinates and attributes continue to primitive clipping, even when no screen address exists.</text></svg>