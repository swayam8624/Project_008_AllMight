<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>An old result must retain its own identity</title><desc>Snapshot A starts first, snapshot B starts later and finishes first. The late A result cannot overwrite B as if it were the current camera state.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">An old result must retain its own identity</text><text x="70" y="90" font-size="18" text-anchor="start" fill="#153149" font-weight="bold">Snapshot A</text><line x1="200" y1="87" x2="700" y2="87" stroke="#ac7428" stroke-width="2"/><polyline points="690.9955289764732,91.3496553411123 700,87 690.9955289764732,82.6503446588877" fill="none" stroke="#ac7428" stroke-width="2" stroke-linejoin="round"/><rect x="600" y="100" width="140" height="48" rx="3" fill="#fae6c5" stroke="#c3d9e2"/><text x="670" y="129" font-size="15" text-anchor="middle" fill="#153149">A finishes late</text><text x="70" y="205" font-size="18" text-anchor="start" fill="#153149" font-weight="bold">Snapshot B</text><line x1="320" y1="202" x2="545" y2="202" stroke="#087fa0" stroke-width="2"/><polyline points="535.9955289764732,206.3496553411123 545,202 535.9955289764732,197.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><rect x="475" y="215" width="160" height="48" rx="3" fill="#e4f3f7" stroke="#c3d9e2"/><text x="555" y="244" font-size="15" text-anchor="middle" fill="#153149">B accepted</text><line x1="200" y1="305" x2="740" y2="305" stroke="#657c90" stroke-width="2"/><text x="470" y="340" font-size="16" text-anchor="middle" fill="#153149">Time →</text><text x="420" y="280" font-size="15" text-anchor="middle" fill="#153149">Retain A as stale evidence; never relabel it B.</text></g></svg>
