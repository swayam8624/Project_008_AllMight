<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Shared tree geometry and five instances</title><desc id="desc">A single seven-position three-triangle tree asset is referenced by five independent instances. Different scales and reflection are shown in a placement gallery, not a literal world-space projection.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="40" font-family="sans-serif" font-size="24" fill="#294e58" font-weight='600'>One reusable mesh, five independent placements</text><rect x="25" y="80" width="260" height="402" rx="12" fill="#edf3ef"/><text x="45" y="111" font-family="sans-serif" font-size="17" fill="#355c64" >Asset 0: local geometry</text><polygon points="136.7,360 167.3,360 167.3,275 136.7,275" fill="#b68c65" stroke="#775b43"/><polygon points="84,292 220,292 152,147.5" fill="#86b8a2" stroke="#397f70" stroke-width="2"/><text x="45" y="418" font-family="sans-serif" font-size="14" fill="#355c64" >7 positions / 3 triangles</text><text x="45" y="444" font-family="sans-serif" font-size="14" fill="#287d6b" >Stored once</text><rect x="308" y="80" width="744" height="402" rx="12" fill="#edf3ef"/><text x="329" y="111" font-family="sans-serif" font-size="17" fill="#355c64" >Instance transforms: same asset ID</text><polygon points="369.74,380 390.26,380 390.26,323 369.74,323" fill="#b68c65" stroke="#775b43"/><polygon points="334.4,334.4 425.6,334.4 380,237.5" fill="#86b8a2" stroke="#397f70" stroke-width="2"/><text x="357" y="411" font-family="sans-serif" font-size="15" fill="#355c64" >A</text><text x="337" y="436" font-family="sans-serif" font-size="12" fill="#355c64" >identity</text><polygon points="515.8,380 530.2,380 530.2,340 515.8,340" fill="#b68c65" stroke="#775b43"/><polygon points="491,348 555,348 523,280" fill="#86b8a2" stroke="#397f70" stroke-width="2"/><text x="500" y="411" font-family="sans-serif" font-size="15" fill="#355c64" >B</text><text x="480" y="436" font-family="sans-serif" font-size="12" fill="#355c64" >0.7 scale</text><polygon points="655.74,380 676.26,380 676.26,323 655.74,323" fill="#b68c65" stroke="#775b43"/><polygon points="620.4,334.4 711.6,334.4 666,237.5" fill="#86b8a2" stroke="#397f70" stroke-width="2"/><text x="643" y="411" font-family="sans-serif" font-size="15" fill="#355c64" >C</text><text x="623" y="436" font-family="sans-serif" font-size="12" fill="#355c64" >identity</text><polygon points="803.96,380 814.04,380 814.04,306 803.96,306" fill="#b68c65" stroke="#775b43"/><polygon points="786.6,320.8 831.4,320.8 809,195" fill="#86b8a2" stroke="#397f70" stroke-width="2"/><text x="786" y="411" font-family="sans-serif" font-size="15" fill="#355c64" >D</text><text x="766" y="436" font-family="sans-serif" font-size="12" fill="#355c64" >tall/thin</text><polygon points="962.26,380 941.74,380 941.74,323 962.26,323" fill="#b68c65" stroke="#775b43"/><polygon points="997.6,334.4 906.4,334.4 952,237.5" fill="#86b8a2" stroke="#397f70" stroke-width="2"/><text x="929" y="411" font-family="sans-serif" font-size="15" fill="#355c64" >E</text><text x="909" y="436" font-family="sans-serif" font-size="12" fill="#355c64" >reflected</text><text x="30" y="526" font-family="sans-serif" font-size="13" fill="#355c64" >Illustrative placement gallery, not a world-space projection or performance measurement.</text></svg>