<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">One outside corner produces a clipped quadrilateral</title><desc id="desc">The constant-w reference triangle crosses the left clip plane. Its intersection vertices are I at y negative one quarter and J at y positive one quarter. A fan divides the remaining quadrilateral into two triangles.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">One outside corner produces a clipped quadrilateral</text><rect x="25" y="80" width="655" height="420" rx="10" fill="#edf3ef"/><rect x="700" y="80" width="355" height="420" rx="10" fill="#edf3ef"/><rect x="320" y="100" width="340" height="380" fill="#e3eee7"/><polygon points="55,290 585,420 585,160" fill="#e9d9cc" stroke="#b47850" stroke-width="2.5"/><polygon points="320,355 585,420 585,160 320,225" fill="#c5e1d1" stroke="#397e6c" stroke-width="2.5"/><line x1="320" y1="100" x2="320" y2="480" stroke="#507ca8" stroke-width="3" /><line x1="320" y1="355" x2="585" y2="160" stroke="#367f6b" stroke-width="2" stroke-dasharray="6 4"/><circle cx="55" cy="290" r="5" fill="#377f6b"/><text x="63" y="280" font-family="sans-serif" font-size="15" fill="#345c65">A</text><circle cx="585" cy="420" r="5" fill="#377f6b"/><text x="593" y="410" font-family="sans-serif" font-size="15" fill="#345c65">B</text><circle cx="585" cy="160" r="5" fill="#377f6b"/><text x="593" y="150" font-family="sans-serif" font-size="15" fill="#345c65">C</text><circle cx="320" cy="355" r="5" fill="#377f6b"/><text x="328" y="345" font-family="sans-serif" font-size="15" fill="#345c65">I</text><circle cx="320" cy="225" r="5" fill="#377f6b"/><text x="328" y="215" font-family="sans-serif" font-size="15" fill="#345c65">J</text><text x="720" y="122" font-family="sans-serif" font-size="18" fill="#345c65">Left-plane witness</text><text x="720" y="172" font-family="sans-serif" font-size="15" fill="#345c65">A = (−2,0,0.5,1)</text><text x="720" y="207" font-family="sans-serif" font-size="15" fill="#345c65">B = (0,−0.5,0.5,1)</text><text x="720" y="242" font-family="sans-serif" font-size="15" fill="#345c65">C = (0,0.5,0.5,1)</text><text x="720" y="310" font-family="sans-serif" font-size="15" fill="#345c65">I: x=−1, y=−0.25</text><text x="720" y="345" font-family="sans-serif" font-size="15" fill="#345c65">J: x=−1, y=0.25</text><text x="720" y="406" font-family="sans-serif" font-size="18" fill="#287b68">Fan: IBC and ICJ</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">Exact constant-w witness: one outside corner is replaced by two intersections, forming a convex quadrilateral.</text></svg>