<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>A patch can change brightness without changing identity</title><desc>Positive affine intensity changes alter raw sample values but preserve their mean-subtracted, normalized descriptor in this toy example.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">A patch can change brightness without changing identity</text><text x="60" y="83" font-weight="bold">Original p</text><text x="340" y="83" font-weight="bold">0.2 + 0.6 p</text><text x="620" y="83" font-weight="bold">Both normalized</text><path d="M60 280h205" stroke="#536b8b"/><rect x="72" y="266" width="33" height="14" fill="#167b90"/><text x="88" y="259" text-anchor="middle" font-size="12">0.10</text><rect x="119" y="238" width="33" height="42" fill="#167b90"/><text x="135" y="231" text-anchor="middle" font-size="12">0.30</text><rect x="166" y="182" width="33" height="98" fill="#167b90"/><text x="182" y="175" text-anchor="middle" font-size="12">0.70</text><rect x="213" y="154" width="33" height="126" fill="#167b90"/><text x="229" y="147" text-anchor="middle" font-size="12">0.90</text><path d="M340 280h205" stroke="#536b8b"/><rect x="352" y="243.6" width="33" height="36.4" fill="#167b90"/><text x="368" y="236.6" text-anchor="middle" font-size="12">0.26</text><rect x="399" y="226.8" width="33" height="53.2" fill="#167b90"/><text x="415" y="219.8" text-anchor="middle" font-size="12">0.38</text><rect x="446" y="193.2" width="33" height="86.8" fill="#167b90"/><text x="462" y="186.2" text-anchor="middle" font-size="12">0.62</text><rect x="493" y="176.4" width="33" height="103.6" fill="#167b90"/><text x="509" y="169.4" text-anchor="middle" font-size="12">0.74</text><path d="M620 210h205" stroke="#536b8b"/><rect x="632" y="210" width="33" height="88.54377448000001" fill="#c88033"/><text x="648" y="317.54377448" text-anchor="middle" font-size="12">-0.63</text><rect x="679" y="210" width="33" height="44.271887240000005" fill="#c88033"/><text x="695" y="273.27188724" text-anchor="middle" font-size="12">-0.32</text><rect x="726" y="165.72811276" width="33" height="44.271887240000005" fill="#c88033"/><text x="742" y="158.72811276" text-anchor="middle" font-size="12">0.32</text><rect x="773" y="121.45622551999999" width="33" height="88.54377448000001" fill="#c88033"/><text x="789" y="114.45622551999999" text-anchor="middle" font-size="12">0.63</text><text x="420" y="367" text-anchor="middle">Subtract the mean, then divide by the centered Euclidean norm.</text></g></svg>
