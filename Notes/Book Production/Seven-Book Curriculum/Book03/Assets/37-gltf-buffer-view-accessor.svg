<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="576" viewBox="0 0 1090 576" role="img" aria-labelledby="title desc">
<title id="title">glTF 2.0 bufferView and accessor byte layout worked example</title>
<desc id="desc">A 256-byte buffer contains a buffer view from byte 16 inclusive to byte 144 exclusive. An accessor starts 8 bytes into that view, so its first VEC3 FLOAT entry starts at global offset 24. With 24-byte stride and 12-byte element size, the five element starts are 24,48,72,96,120. The last ends at 132 exclusive, inside the view.</desc>
<rect width="1090" height="576" rx="16" fill="#fbfaf7"/>
<text x="28" y="41" font-family="sans-serif" font-size="24" fill="#284d59" font-weight="600">Five VEC3 FLOAT elements, two offsets, one stride</text><text x="29" y="65" font-family="sans-serif" font-size="13" fill="#647f85" >Buffer 256 bytes  •  bufferView [16,144)  •  accessor offset +8  •  stride 24  •  element size 12</text><rect x="27" y="97" width="1034" height="421" rx="12" fill="#ecf3ef"/><rect x="78" y="179" width="935" height="89" rx="4" fill="#dbe3e3"/><rect x="136.4375" y="179" width="467.5" height="89" fill="#afcfbf" fill-opacity=".73" stroke="#428574" stroke-width="2"/><rect x="165.65625" y="194" width="43.828125" height="58" fill="#357f76" stroke="#fbfaf7" stroke-width="1"/><text x="170.65625" y="228" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="600">0</text><rect x="253.3125" y="194" width="43.828125" height="58" fill="#407f9b" stroke="#fbfaf7" stroke-width="1"/><text x="258.3125" y="228" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="600">1</text><rect x="340.96875" y="194" width="43.828125" height="58" fill="#357f76" stroke="#fbfaf7" stroke-width="1"/><text x="345.96875" y="228" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="600">2</text><rect x="428.625" y="194" width="43.828125" height="58" fill="#407f9b" stroke="#fbfaf7" stroke-width="1"/><text x="433.625" y="228" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="600">3</text><rect x="516.28125" y="194" width="43.828125" height="58" fill="#357f76" stroke="#fbfaf7" stroke-width="1"/><text x="521.28125" y="228" font-family="sans-serif" font-size="14" fill="#ffffff" font-weight="600">4</text><line x1="78" y1="273" x2="78" y2="290" stroke="#6c8a89" stroke-width="1" /><text x="70" y="309" font-family="sans-serif" font-size="11" fill="#547079" >0</text><line x1="136.4375" y1="273" x2="136.4375" y2="290" stroke="#6c8a89" stroke-width="1" /><text x="128.4375" y="309" font-family="sans-serif" font-size="11" fill="#547079" >16</text><line x1="165.65625" y1="273" x2="165.65625" y2="290" stroke="#6c8a89" stroke-width="1" /><text x="157.65625" y="309" font-family="sans-serif" font-size="11" fill="#547079" >24</text><line x1="253.3125" y1="273" x2="253.3125" y2="290" stroke="#6c8a89" stroke-width="1" /><text x="245.3125" y="309" font-family="sans-serif" font-size="11" fill="#547079" >48</text><line x1="340.96875" y1="273" x2="340.96875" y2="290" stroke="#6c8a89" stroke-width="1" /><text x="332.96875" y="309" font-family="sans-serif" font-size="11" fill="#547079" >72</text><line x1="428.625" y1="273" x2="428.625" y2="290" stroke="#6c8a89" stroke-width="1" /><text x="420.625" y="309" font-family="sans-serif" font-size="11" fill="#547079" >96</text><line x1="516.28125" y1="273" x2="516.28125" y2="290" stroke="#6c8a89" stroke-width="1" /><text x="508.28125" y="309" font-family="sans-serif" font-size="11" fill="#547079" >120</text><line x1="560.109375" y1="273" x2="560.109375" y2="290" stroke="#6c8a89" stroke-width="1" /><text x="552.109375" y="309" font-family="sans-serif" font-size="11" fill="#547079" >132</text><line x1="603.9375" y1="273" x2="603.9375" y2="290" stroke="#6c8a89" stroke-width="1" /><text x="595.9375" y="309" font-family="sans-serif" font-size="11" fill="#547079" >144</text><line x1="1013" y1="273" x2="1013" y2="290" stroke="#6c8a89" stroke-width="1" /><text x="1005" y="309" font-family="sans-serif" font-size="11" fill="#547079" >256</text><text x="76" y="145" font-family="sans-serif" font-size="15" fill="#39646b" >Buffer view is a finite slice of a physical byte buffer</text><text x="79" y="345" font-family="sans-serif" font-size="15" fill="#356e70" >Positions read at byte addresses: 24, 48, 72, 96, 120</text><text x="79" y="377" font-family="sans-serif" font-size="15" fill="#356e70" >Last element uses bytes [120,132). The view ends at 144.</text><text x="79" y="413" font-family="sans-serif" font-size="14" fill="#5a757c" >Required view span: 8 + 4×24 + 12 = 116 bytes (fits within 128).</text><text x="79" y="454" font-family="sans-serif" font-size="14" fill="#a2674f" >Bounds must be checked before multiplying huge counts or adding offsets.</text><text x="31" y="552" font-family="sans-serif" font-size="13" fill="#637e84" >Interleaving means there can be padding or other attributes between one element and the next.</text>
</svg>