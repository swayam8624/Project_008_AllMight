<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="995" height="545" viewBox="0 0 995 545" role="img" aria-labelledby="title desc">
<title id="title">de Casteljau interpolation construction for one cubic Bézier midpoint</title>
<desc id="desc">Four controls P0=(0,0), P1=(0,2), P2=(2,2), P3=(2,0). At t=0.5, the first interpolation layer A is (0,1), (1,2), (2,1); the second B is (0.5,1.5), (1.5,1.5); the final point C is (1,1.5). All construction edges are shown in different colors from the actual cubic Bézier curve.</desc>
<rect width="995" height="545" rx="18" fill="#fbfaf7"/>
<text x="31" y="40" font-family="sans-serif" font-size="24" fill="#294953" font-weight="600">The midpoint is built, not guessed</text><text x="31" y="64" font-family="sans-serif" font-size="14" fill="#617b82" >de Casteljau at t = 0.5  •  P0=(0,0), P1=(0,2), P2=(2,2), P3=(2,0)</text><rect x="25" y="91" width="672" height="407" rx="12" fill="#eef4ef"/><polyline points="200.00,420.00 200.00,156.00 490.00,156.00 490.00,420.00" fill="none" stroke="#b88962" stroke-width="2" stroke-dasharray="9 6"/><polyline points="200.00,288.00 345.00,156.00 490.00,288.00" fill="none" stroke="#5896b2" stroke-width="2.7"/><polyline points="272.50,222.00 417.50,222.00" fill="none" stroke="#ae6d51" stroke-width="3"/><polyline points="200.00,420.00 200.13,410.22 200.53,400.69 201.19,391.41 202.10,382.38 203.26,373.59 204.65,365.06 206.27,356.76 208.12,348.72 210.19,340.92 212.46,333.38 214.94,326.07 217.62,319.02 220.48,312.21 223.54,305.66 226.76,299.34 230.16,293.28 233.72,287.46 237.44,281.89 241.30,276.57 245.31,271.50 249.46,266.67 253.73,262.10 258.13,257.76 262.64,253.68 267.26,249.84 271.98,246.25 276.80,242.91 281.71,239.82 286.70,236.97 291.76,234.38 296.89,232.02 302.08,229.92 307.33,228.06 312.62,226.46 317.95,225.09 323.32,223.98 328.72,223.11 334.13,222.49 339.56,222.12 345.00,222.00 350.44,222.12 355.87,222.49 361.28,223.11 366.68,223.98 372.05,225.09 377.38,226.45 382.67,228.06 387.92,229.92 393.11,232.02 398.24,234.38 403.30,236.97 408.29,239.82 413.20,242.91 418.02,246.26 422.74,249.84 427.36,253.68 431.87,257.76 436.27,262.10 440.54,266.67 444.69,271.50 448.70,276.57 452.56,281.89 456.28,287.46 459.84,293.28 463.24,299.34 466.46,305.65 469.52,312.21 472.38,319.02 475.06,326.07 477.54,333.38 479.81,340.92 481.88,348.72 483.73,356.76 485.35,365.06 486.74,373.59 487.90,382.38 488.81,391.41 489.47,400.69 489.87,410.22 490.00,420.00" fill="none" stroke="#237c6b" stroke-width="4"/><circle cx="200.00" cy="420.00" r="7" fill="#b88962" stroke="#fbfaf7" stroke-width="1.8"/><text x="210" y="410" font-family="sans-serif" font-size="14" fill="#996b49" >P0</text><circle cx="200.00" cy="156.00" r="7" fill="#b88962" stroke="#fbfaf7" stroke-width="1.8"/><text x="210" y="146" font-family="sans-serif" font-size="14" fill="#996b49" >P1</text><circle cx="490.00" cy="156.00" r="7" fill="#b88962" stroke="#fbfaf7" stroke-width="1.8"/><text x="500" y="146" font-family="sans-serif" font-size="14" fill="#996b49" >P2</text><circle cx="490.00" cy="420.00" r="7" fill="#b88962" stroke="#fbfaf7" stroke-width="1.8"/><text x="500" y="410" font-family="sans-serif" font-size="14" fill="#996b49" >P3</text><circle cx="200.00" cy="288.00" r="6" fill="#5799af" stroke="#fbfaf7" stroke-width="1.8"/><text x="210" y="306" font-family="sans-serif" font-size="12" fill="#3e7e9c" >A0</text><circle cx="345.00" cy="156.00" r="6" fill="#5799af" stroke="#fbfaf7" stroke-width="1.8"/><text x="355" y="174" font-family="sans-serif" font-size="12" fill="#3e7e9c" >A1</text><circle cx="490.00" cy="288.00" r="6" fill="#5799af" stroke="#fbfaf7" stroke-width="1.8"/><text x="500" y="306" font-family="sans-serif" font-size="12" fill="#3e7e9c" >A2</text><circle cx="272.50" cy="222.00" r="6" fill="#ad6a4f" stroke="#fbfaf7" stroke-width="1.8"/><text x="281.5" y="213" font-family="sans-serif" font-size="12" fill="#a26146" >B0</text><circle cx="417.50" cy="222.00" r="6" fill="#ad6a4f" stroke="#fbfaf7" stroke-width="1.8"/><text x="426.5" y="213" font-family="sans-serif" font-size="12" fill="#a26146" >B1</text><circle cx="345.00" cy="222.00" r="8" fill="#18886b" stroke="#fbfaf7" stroke-width="1.8"/><text x="261" y="204" font-family="sans-serif" font-size="14" fill="#207866" >C(0.5)=(1,1.5)</text><rect x="717" y="98" width="253" height="394" rx="12" fill="#e7f1ed"/><text x="734" y="135" font-family="sans-serif" font-size="17" fill="#315866" font-weight="600">Three interpolation levels</text><text x="734" y="179" font-family="sans-serif" font-size="15" fill="#345a65" >A0=(0,1)</text><text x="734" y="204" font-family="sans-serif" font-size="15" fill="#345a65" >A1=(1,2)</text><text x="734" y="229" font-family="sans-serif" font-size="15" fill="#345a65" >A2=(2,1)</text><text x="734" y="275" font-family="sans-serif" font-size="15" fill="#345a65" >B0=(0.5,1.5)</text><text x="734" y="300" font-family="sans-serif" font-size="15" fill="#345a65" >B1=(1.5,1.5)</text><text x="734" y="349" font-family="sans-serif" font-size="18" fill="#197d69" font-weight="600">C=(1,1.5)</text><text x="734" y="394" font-family="sans-serif" font-size="13" fill="#617b81" >All three levels use</text><text x="734" y="412" font-family="sans-serif" font-size="13" fill="#617b81" >the same linear blend.</text><text x="33" y="523" font-family="sans-serif" font-size="13" fill="#607b80" >The curve (green) passes through P0 and P3; its inner controls are guiding handles, not required waypoints.</text>
</svg>
