<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Zero crossings require two observed samples</title><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Zero crossings require two observed samples</text><path d="M100 160H350 M490 160H740" stroke="#536b8b" stroke-width="3"/><circle cx="100" cy="160" r="10" fill="#167b90"/><circle cx="350" cy="160" r="10" fill="#c88033"/><circle cx="490" cy="160" r="10" fill="#167b90"/><circle cx="740" cy="160" r="10" fill="#fff" stroke="#899aa7" stroke-dasharray="3 2" stroke-width="2"/><circle cx="162.5" cy="160" r="7" fill="#153149"/><text x="100" y="126" text-anchor="middle">+0.25</text><text x="350" y="126" text-anchor="middle">−0.75</text><text x="490" y="126" text-anchor="middle">+0.25</text><text x="740" y="126" text-anchor="middle">Unknown</text><text x="162" y="200" text-anchor="middle">Valid zero</text><text x="615" y="200" text-anchor="middle">No supported crossing</text><text x="225" y="275" text-anchor="middle">Both weights positive</text><text x="615" y="275" text-anchor="middle">One weight zero</text><text x="420" y="370" text-anchor="middle">An unknown stored value is not a field measurement.</text></g></svg>
