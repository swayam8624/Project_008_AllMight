<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">One image measurement, many possible depths</title><desc id="desc">In a two-dimensional camera-ray cross-section, forward points at depths 2, 4 and 8 all project to the same virtual image point. Axial depth is measured along the forward axis; ray range is the distance along the slanted ray.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="41" font-family="sans-serif" font-size="23" fill="#284e58" font-weight="600">One image measurement, many possible depths</text><rect x="25" y="82" width="700" height="405" rx="12" fill="#edf3ef"/><rect x="743" y="82" width="312" height="405" rx="12" fill="#edf3ef"/><line x1="83" y1="390" x2="700" y2="390" stroke="#829593" stroke-width="2" /><line x1="83" y1="390" x2="683" y2="150" stroke="#3b8974" stroke-width="4" /><circle cx="83" cy="390" r="6" fill="#344e55" stroke="#fbfaf7" stroke-width="1.5"/><text x="62" y="421" font-family="sans-serif" font-size="16" fill="#355d65" >C</text><line x1="203" y1="390" x2="203" y2="342" stroke="#9db4aa" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="203" cy="342" r="7" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="212" y="332" font-family="sans-serif" font-size="14" fill="#355d65" >Z=2</text><text x="195" y="414" font-family="sans-serif" font-size="13" fill="#355d65" >2</text><line x1="323" y1="390" x2="323" y2="294" stroke="#9db4aa" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="323" cy="294" r="7" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="332" y="284" font-family="sans-serif" font-size="14" fill="#355d65" >Z=4</text><text x="315" y="414" font-family="sans-serif" font-size="13" fill="#355d65" >4</text><line x1="563" y1="390" x2="563" y2="198" stroke="#9db4aa" stroke-width="1.5" stroke-dasharray="5 5"/><circle cx="563" cy="198" r="7" fill="#478d7c" stroke="#fbfaf7" stroke-width="1.5"/><text x="572" y="188" font-family="sans-serif" font-size="14" fill="#355d65" >Z=8</text><text x="555" y="414" font-family="sans-serif" font-size="13" fill="#355d65" >8</text><line x1="143" y1="205" x2="143" y2="430" stroke="#507da7" stroke-width="2" /><circle cx="143" cy="366" r="5" fill="#507da7" stroke="#fbfaf7" stroke-width="1.5"/><text x="150" y="205" font-family="sans-serif" font-size="13" fill="#507da7" >virtual plane</text><text x="350" y="429" font-family="sans-serif" font-size="14" fill="#355d65" >axial depth Z →</text><text x="760" y="122" font-family="sans-serif" font-size="18" fill="#355d65" >All points: same pixel</text><text x="760" y="175" font-family="sans-serif" font-size="16" fill="#355d65" >(X,Y,Z) = Z (xₙ,yₙ,1)</text><text x="760" y="223" font-family="sans-serif" font-size="16" fill="#355d65" >Axial depth: Z</text><text x="760" y="260" font-family="sans-serif" font-size="16" fill="#355d65" >Ray range:</text><text x="760" y="292" font-family="sans-serif" font-size="18" fill="#355d65" >ρ = Z √(1+xₙ²+yₙ²)</text><text x="760" y="363" font-family="sans-serif" font-size="14" fill="#355d65" >One additional constraint</text><text x="760" y="387" font-family="sans-serif" font-size="14" fill="#355d65" >is needed to recover depth.</text><text x="30" y="529" font-family="sans-serif" font-size="13" fill="#355d65" >Illustration: a 2D section through a ray. The same normalized direction is shared by every marked forward point.</text></svg>