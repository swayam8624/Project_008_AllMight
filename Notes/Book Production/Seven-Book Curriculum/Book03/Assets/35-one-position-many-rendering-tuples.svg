<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="551" viewBox="0 0 1080 551" role="img" aria-labelledby="title desc">
<title id="title">Four topological positions and six rendering corner tuples</title>
<desc id="desc">A square made of faces (P0,P1,P2) and (P0,P2,P3) has four geometric positions, five indexed edges, two triangles and Euler characteristic one. Different UV and normal records on the common position corners mean six distinct GPU corner tuples. The position-indexed graph remains connected.</desc>
<rect width="1080" height="551" rx="16" fill="#fbfaf7"/>
<text x="28" y="41" font-family="sans-serif" font-size="24" fill="#294e5b" font-weight="600">One geometric square, six render tuples</text><text x="29" y="65" font-family="sans-serif" font-size="13" fill="#6b8087" >Position IDs define the connected surface; full position/UV/normal tuples define the GPU vertex stream</text><rect x="24" y="91" width="501" height="403" rx="12" fill="#ecf3ef"/><rect x="544" y="91" width="513" height="403" rx="12" fill="#e9f0ef"/><polygon points="130,385 413,385 413,166 130,166" fill="#c7e0d3" fill-opacity=".55" stroke="#3b8c7c" stroke-width="3"/><line x1="130" y1="385" x2="413" y2="166" stroke="#c07856" stroke-width="4" /><circle cx="130" cy="385" r="8" fill="#357e73" stroke="#fff" stroke-width="2"/><text x="140" y="375" font-family="sans-serif" font-size="15" fill="#2d6966" font-weight="600">P0</text><circle cx="413" cy="385" r="8" fill="#357e73" stroke="#fff" stroke-width="2"/><text x="423" y="375" font-family="sans-serif" font-size="15" fill="#2d6966" font-weight="600">P1</text><circle cx="413" cy="166" r="8" fill="#357e73" stroke="#fff" stroke-width="2"/><text x="423" y="156" font-family="sans-serif" font-size="15" fill="#2d6966" font-weight="600">P2</text><circle cx="130" cy="166" r="8" fill="#357e73" stroke="#fff" stroke-width="2"/><text x="140" y="156" font-family="sans-serif" font-size="15" fill="#2d6966" font-weight="600">P3</text><text x="42" y="122" font-family="sans-serif" font-size="18" fill="#345862" font-weight="600">Geometric topology</text><text x="42" y="460" font-family="sans-serif" font-size="15" fill="#337769" >V = 4  |  E = 5  |  F = 2  |  Euler = 1</text><text x="560" y="123" font-family="sans-serif" font-size="17" fill="#355d65" font-weight="600">Renderer has separate corner tuples</text><text x="569" y="166" font-family="sans-serif" font-size="14" fill="#365966" >Face A: (P0,U0,N0)  (P1,U1,N0)</text><text x="632" y="193" font-family="sans-serif" font-size="14" fill="#365966" >(P2,U2,N0)</text><text x="569" y="239" font-family="sans-serif" font-size="14" fill="#365966" >Face B: (P0,U3,N1)  (P2,U4,N1)</text><text x="632" y="266" font-family="sans-serif" font-size="14" fill="#365966" >(P3,U5,N1)</text><line x1="576" y1="289" x2="1030" y2="289" stroke="#b5c8be" stroke-width="1.5" /><text x="568" y="328" font-family="sans-serif" font-size="13" fill="#a36e50" >P0: same position, different UV/normal</text><text x="568" y="354" font-family="sans-serif" font-size="13" fill="#a36e50" >P2: same position, different UV/normal</text><text x="568" y="413" font-family="sans-serif" font-size="17" fill="#2c7e6d" font-weight="600">GPU tuple vertices = 6</text><text x="29" y="524" font-family="sans-serif" font-size="14" fill="#617c81" >A texture seam should not secretly cut the logical mesh into disconnected topological components.</text>
</svg>