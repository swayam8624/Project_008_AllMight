<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Screen centroid versus surface barycentrics</title><desc id="desc">A projected triangle with clip w values two, four and eight has equal screen centroid weights. Reciprocal-w normalization gives surface weights four sevenths, two sevenths and one seventh; the UV becomes two sevenths, one seventh.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="40" font-family="sans-serif" font-size="23" fill="#294e58" font-weight="600">Screen centroid versus surface barycentrics</text><rect x="25" y="82" width="540" height="409" rx="12" fill="#edf3ef"/><rect x="585" y="82" width="470" height="409" rx="12" fill="#edf3ef"/><polygon points="95,382 435,382 95,152" fill="#d6e8de" stroke="#397e6c" stroke-width="2.5"/><text x="44" y="116" font-family="sans-serif" font-size="17" fill="#345c65" >Screen triangle (schematic)</text><circle cx="208.33333333333334" cy="305.3333333333333" r="7" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><text x="218.33333333333334" y="297.3333333333333" font-family="sans-serif" font-size="15" fill="#345c65" >λ = (⅓,⅓,⅓)</text><circle cx="95" cy="382" r="6" fill="#377f6b" stroke="#fbfaf7" stroke-width="1.5"/><text x="105" y="372" font-family="sans-serif" font-size="15" fill="#345c65" >w0 = 2</text><circle cx="435" cy="382" r="6" fill="#377f6b" stroke="#fbfaf7" stroke-width="1.5"/><text x="445" y="372" font-family="sans-serif" font-size="15" fill="#345c65" >w1 = 4</text><circle cx="95" cy="152" r="6" fill="#377f6b" stroke="#fbfaf7" stroke-width="1.5"/><text x="105" y="142" font-family="sans-serif" font-size="15" fill="#345c65" >w2 = 8</text><text x="44" y="455" font-family="sans-serif" font-size="16" fill="#345c65" >Screen centroid: equal λ</text><text x="606" y="119" font-family="sans-serif" font-size="18" fill="#345c65" >Recover surface weights</text><text x="607" y="192" font-family="sans-serif" font-size="17" fill="#345c65" >β0</text><rect x="651" y="174" width="320" height="25" rx="12" fill="#f9faf7"/><rect x="651" y="174" width="182.85714285714283" height="25" rx="12" fill="#6ba38e"/><text x="980" y="194" font-family="sans-serif" font-size="14" fill="#345c65" >4/7</text><text x="607" y="272" font-family="sans-serif" font-size="17" fill="#345c65" >β1</text><rect x="651" y="254" width="320" height="25" rx="12" fill="#f9faf7"/><rect x="651" y="254" width="91.42857142857142" height="25" rx="12" fill="#6ba38e"/><text x="980" y="274" font-family="sans-serif" font-size="14" fill="#345c65" >2/7</text><text x="607" y="352" font-family="sans-serif" font-size="17" fill="#345c65" >β2</text><rect x="651" y="334" width="320" height="25" rx="12" fill="#f9faf7"/><rect x="651" y="334" width="45.71428571428571" height="25" rx="12" fill="#6ba38e"/><text x="980" y="354" font-family="sans-serif" font-size="14" fill="#345c65" >1/7</text><text x="606" y="441" font-family="sans-serif" font-size="19" fill="#287b68" >UV = (2/7, 1/7)</text><text x="30" y="530" font-family="sans-serif" font-size="13" fill="#345c65" >βᵢ = (λᵢ/wᵢ) divided by the sum of all λⱼ/wⱼ. Equal screen weights are not equal surface weights.</text></svg>