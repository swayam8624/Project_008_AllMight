<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>Eliminate landmark variables, not their evidence</title><desc>The toy normal matrix has a camera block of two, two landmark diagonal blocks of two, and camera-landmark coupling one. Eliminating the landmarks leaves a scalar camera coefficient of one.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">Eliminate landmark variables, not their evidence</text><text x="220" y="74" font-size="18" text-anchor="middle" fill="#153149" font-weight="bold">Full normal matrix</text><rect x="118" y="96" width="64" height="64" rx="3" fill="#b7e1ea" stroke="#b9ccd7"/><text x="150" y="136.26" font-size="15" text-anchor="middle" fill="#153149">2</text><rect x="184" y="96" width="64" height="64" rx="3" fill="#fae6c5" stroke="#b9ccd7"/><text x="216" y="136.26" font-size="15" text-anchor="middle" fill="#153149">1</text><rect x="250" y="96" width="64" height="64" rx="3" fill="#fae6c5" stroke="#b9ccd7"/><text x="282" y="136.26" font-size="15" text-anchor="middle" fill="#153149">1</text><rect x="118" y="162" width="64" height="64" rx="3" fill="#fae6c5" stroke="#b9ccd7"/><text x="150" y="202.26" font-size="15" text-anchor="middle" fill="#153149">1</text><rect x="184" y="162" width="64" height="64" rx="3" fill="#b7e1ea" stroke="#b9ccd7"/><text x="216" y="202.26" font-size="15" text-anchor="middle" fill="#153149">2</text><rect x="250" y="162" width="64" height="64" rx="3" fill="#f0f5f8" stroke="#b9ccd7"/><text x="282" y="202.26" font-size="15" text-anchor="middle" fill="#153149">0</text><rect x="118" y="228" width="64" height="64" rx="3" fill="#fae6c5" stroke="#b9ccd7"/><text x="150" y="268.26" font-size="15" text-anchor="middle" fill="#153149">1</text><rect x="184" y="228" width="64" height="64" rx="3" fill="#f0f5f8" stroke="#b9ccd7"/><text x="216" y="268.26" font-size="15" text-anchor="middle" fill="#153149">0</text><rect x="250" y="228" width="64" height="64" rx="3" fill="#b7e1ea" stroke="#b9ccd7"/><text x="282" y="268.26" font-size="15" text-anchor="middle" fill="#153149">2</text><line x1="345" y1="190" x2="465" y2="190" stroke="#087fa0" stroke-width="2"/><polyline points="455.9955289764732,194.3496553411123 465,190 455.9955289764732,185.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><rect x="490" y="105" width="250" height="170" rx="3" fill="#e4f3f7" stroke="#c3d9e2"/><text x="615" y="144" font-size="18" text-anchor="middle" fill="#153149" font-weight="bold">Reduced camera</text><text x="615" y="185" font-size="24" text-anchor="middle" fill="#153149">2 − ½ − ½ = 1</text><text x="615" y="228" font-size="16" text-anchor="middle" fill="#153149">Back-substitute p, q</text><text x="420" y="337" font-size="15" text-anchor="middle" fill="#153149">The reduced solve preserves the full least-squares solution.</text></g></svg>
