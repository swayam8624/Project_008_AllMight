<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Cohen–Sutherland outcodes</title><desc id="desc">The nine regions around a rectangular window are encoded by independent left, right, above and below bits. A crossing segment retains only its interval inside the rectangle.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Cohen–Sutherland outcodes</text><rect x="25" y="80" width="685" height="420" rx="10" fill="#edf3ef"/><rect x="730" y="80" width="325" height="420" rx="10" fill="#edf3ef"/><rect x="55" y="100" width="155" height="90" fill="#f7f2e8" stroke="#92aaa0"/><text x="71" y="128" font-family="sans-serif" font-size="16" fill="#345c65">0101</text><rect x="210" y="100" width="300" height="90" fill="#f7f2e8" stroke="#92aaa0"/><text x="226" y="128" font-family="sans-serif" font-size="16" fill="#345c65">0100</text><rect x="510" y="100" width="170" height="90" fill="#f7f2e8" stroke="#92aaa0"/><text x="526" y="128" font-family="sans-serif" font-size="16" fill="#345c65">0110</text><rect x="55" y="190" width="155" height="200" fill="#f7f2e8" stroke="#92aaa0"/><text x="71" y="218" font-family="sans-serif" font-size="16" fill="#345c65">0001</text><rect x="210" y="190" width="300" height="200" fill="#cde5d6" stroke="#92aaa0"/><text x="226" y="218" font-family="sans-serif" font-size="16" fill="#345c65">0000</text><rect x="510" y="190" width="170" height="200" fill="#f7f2e8" stroke="#92aaa0"/><text x="526" y="218" font-family="sans-serif" font-size="16" fill="#345c65">0010</text><rect x="55" y="390" width="155" height="90" fill="#f7f2e8" stroke="#92aaa0"/><text x="71" y="418" font-family="sans-serif" font-size="16" fill="#345c65">1001</text><rect x="210" y="390" width="300" height="90" fill="#f7f2e8" stroke="#92aaa0"/><text x="226" y="418" font-family="sans-serif" font-size="16" fill="#345c65">1000</text><rect x="510" y="390" width="170" height="90" fill="#f7f2e8" stroke="#92aaa0"/><text x="526" y="418" font-family="sans-serif" font-size="16" fill="#345c65">1010</text><line x1="60" y1="290" x2="660" y2="290" stroke="#b47850" stroke-width="3" /><line x1="210" y1="290" x2="510" y2="290" stroke="#367f6b" stroke-width="5" /><circle cx="210" cy="290" r="5" fill="#377f6b"/><circle cx="510" cy="290" r="5" fill="#377f6b"/><text x="750" y="120" font-family="sans-serif" font-size="17" fill="#345c65">Four independent bits</text><text x="750" y="175" font-family="sans-serif" font-size="15" fill="#345c65">0001   left</text><text x="750" y="214" font-family="sans-serif" font-size="15" fill="#345c65">0010   right</text><text x="750" y="253" font-family="sans-serif" font-size="15" fill="#345c65">0100   above</text><text x="750" y="292" font-family="sans-serif" font-size="15" fill="#345c65">1000   below</text><text x="750" y="365" font-family="sans-serif" font-size="16" fill="#345c65">OR = 0: accept</text><text x="750" y="403" font-family="sans-serif" font-size="16" fill="#345c65">AND ≠ 0: reject</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">The brown segment is trimmed to its green portion. The window is closed; boundary points have no outside bit.</text></svg>