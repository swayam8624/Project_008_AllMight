<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Inverse-transpose normal under nonuniform scale</title><desc id="desc">Tangent (1,1,0) and normal (-1,1,0) begin perpendicular. After scaling X by two, the tangent is (2,1,0); the ordinary transformed normal (-2,1,0) has dot product -3, while the inverse-transpose normal (-0.5,1,0) has dot product zero.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="40" font-family="sans-serif" font-size="23" fill="#294e58" font-weight='600'>A normal must stay perpendicular to the transformed tangent</text><rect x="25" y="92" width="328" height="380" rx="12" fill="#edf3ef"/><text x="39" y="124" font-family="sans-serif" font-size="17" fill="#355c64" >Original</text><line x1="45" y1="337" x2="331" y2="337" stroke="#aebfba" stroke-width="1" /><line x1="185" y1="172" x2="185" y2="442" stroke="#aebfba" stroke-width="1" /><line x1="185" y1="337" x2="245" y2="277" stroke="#27816f" stroke-width="4" /><circle cx="245" cy="277" r="4" fill="#27816f"/><text x="252" y="269" font-family="sans-serif" font-size="13" fill="#27816f" >(1,1)</text><line x1="185" y1="337" x2="125" y2="277" stroke="#467ca3" stroke-width="4" /><circle cx="125" cy="277" r="4" fill="#467ca3"/><text x="132" y="269" font-family="sans-serif" font-size="13" fill="#467ca3" >(-1,1)</text><text x="39" y="443" font-family="sans-serif" font-size="16" fill="#355c64" >dot = 0</text><rect x="375" y="92" width="328" height="380" rx="12" fill="#edf3ef"/><text x="389" y="124" font-family="sans-serif" font-size="17" fill="#355c64" >Wrong: A n</text><line x1="395" y1="337" x2="681" y2="337" stroke="#aebfba" stroke-width="1" /><line x1="535" y1="172" x2="535" y2="442" stroke="#aebfba" stroke-width="1" /><line x1="535" y1="337" x2="635" y2="287" stroke="#27816f" stroke-width="4" /><circle cx="635" cy="287" r="4" fill="#27816f"/><text x="642" y="279" font-family="sans-serif" font-size="13" fill="#27816f" >(2,1)</text><line x1="535" y1="337" x2="435" y2="287" stroke="#b85a4d" stroke-width="4" /><circle cx="435" cy="287" r="4" fill="#b85a4d"/><text x="442" y="279" font-family="sans-serif" font-size="13" fill="#b85a4d" >(-2,1)</text><text x="389" y="443" font-family="sans-serif" font-size="16" fill="#355c64" >dot = -3</text><rect x="725" y="92" width="328" height="380" rx="12" fill="#edf3ef"/><text x="739" y="124" font-family="sans-serif" font-size="17" fill="#355c64" >Correct: A⁻ᵀ n</text><line x1="745" y1="337" x2="1031" y2="337" stroke="#aebfba" stroke-width="1" /><line x1="885" y1="172" x2="885" y2="442" stroke="#aebfba" stroke-width="1" /><line x1="885" y1="337" x2="985" y2="287" stroke="#27816f" stroke-width="4" /><circle cx="985" cy="287" r="4" fill="#27816f"/><text x="992" y="279" font-family="sans-serif" font-size="13" fill="#27816f" >(2,1)</text><line x1="885" y1="337" x2="860" y2="287" stroke="#467ca3" stroke-width="4" /><circle cx="860" cy="287" r="4" fill="#467ca3"/><text x="867" y="279" font-family="sans-serif" font-size="13" fill="#467ca3" >(-0.5,1)</text><text x="739" y="443" font-family="sans-serif" font-size="16" fill="#355c64" >dot = 0</text><text x="30" y="525" font-family="sans-serif" font-size="14" fill="#355c64" >XY cross-section of A = diag(2,1,3). Arrows are unnormalized.</text></svg>