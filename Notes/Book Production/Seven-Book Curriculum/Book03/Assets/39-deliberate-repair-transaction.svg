<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="546" viewBox="0 0 1080 546" role="img" aria-labelledby="title desc">
<title id="title">Five-stage intentional mesh repair contract</title>
<desc id="desc">Five stages of an auditable geometry-repair workflow: preserve original bytes and index domains, diagnose topology and geometry, choose the intended application's mesh policy, transform a copy with an explicit edit record, and revalidate both the repaired mesh and the properties that must remain unchanged. This prevents silent welding or discarded evidence during parsing.</desc>
<rect width="1080" height="546" rx="16" fill="#fbfaf7"/>
<text x="29" y="41" font-family="sans-serif" font-size="23" fill="#294e5b" font-weight="600">Repair is a deliberate transaction, not a parser side effect</text><text x="29" y="63" font-family="sans-serif" font-size="13" fill="#687e85" >Keep source evidence, name the target contract, apply one repair and verify again.</text><rect x="22" y="115" width="194" height="306" rx="12" fill="#eef4ef"/><text x="34" y="153" font-family="sans-serif" font-size="17" fill="#335b66" font-weight="600">1. Preserve</text><text x="34" y="217" font-family="sans-serif" font-size="14" fill="#365966" >Original bytes</text><text x="34" y="241" font-family="sans-serif" font-size="14" fill="#365966" >and index domains</text><line x1="35" y1="275" x2="201" y2="275" stroke="#acc5b6" stroke-width="1.5" /><text x="34" y="329" font-family="sans-serif" font-size="13" fill="#a16a50" >Never discard</text><line x1="217" y1="270" x2="232" y2="270" stroke="#b78359" stroke-width="3" /><rect x="235" y="115" width="194" height="306" rx="12" fill="#e8f0ed"/><text x="247" y="153" font-family="sans-serif" font-size="17" fill="#335b66" font-weight="600">2. Diagnose</text><text x="247" y="217" font-family="sans-serif" font-size="14" fill="#365966" >Winding, holes,</text><text x="247" y="241" font-family="sans-serif" font-size="14" fill="#365966" >fans and bounds</text><line x1="248" y1="275" x2="414" y2="275" stroke="#acc5b6" stroke-width="1.5" /><text x="247" y="329" font-family="sans-serif" font-size="13" fill="#a16a50" >Do not heal</text><line x1="430" y1="270" x2="445" y2="270" stroke="#b78359" stroke-width="3" /><rect x="448" y="115" width="194" height="306" rx="12" fill="#eef4ef"/><text x="460" y="153" font-family="sans-serif" font-size="17" fill="#335b66" font-weight="600">3. Choose policy</text><text x="460" y="217" font-family="sans-serif" font-size="14" fill="#365966" >Solid? Cloth?</text><text x="460" y="241" font-family="sans-serif" font-size="14" fill="#365966" >Rendering prop?</text><line x1="461" y1="275" x2="627" y2="275" stroke="#acc5b6" stroke-width="1.5" /><text x="460" y="329" font-family="sans-serif" font-size="13" fill="#a16a50" >User intent</text><line x1="643" y1="270" x2="658" y2="270" stroke="#b78359" stroke-width="3" /><rect x="661" y="115" width="194" height="306" rx="12" fill="#e8f0ed"/><text x="673" y="153" font-family="sans-serif" font-size="17" fill="#335b66" font-weight="600">4. Transform</text><text x="673" y="217" font-family="sans-serif" font-size="14" fill="#365966" >Explicit copy</text><text x="673" y="241" font-family="sans-serif" font-size="14" fill="#365966" >and edit record</text><line x1="674" y1="275" x2="840" y2="275" stroke="#acc5b6" stroke-width="1.5" /><text x="673" y="329" font-family="sans-serif" font-size="13" fill="#a16a50" >Show exact delta</text><line x1="856" y1="270" x2="871" y2="270" stroke="#b78359" stroke-width="3" /><rect x="874" y="115" width="194" height="306" rx="12" fill="#eef4ef"/><text x="886" y="153" font-family="sans-serif" font-size="17" fill="#335b66" font-weight="600">5. Revalidate</text><text x="886" y="217" font-family="sans-serif" font-size="14" fill="#365966" >Compare metrics</text><text x="886" y="241" font-family="sans-serif" font-size="14" fill="#365966" >and semantics</text><line x1="887" y1="275" x2="1053" y2="275" stroke="#acc5b6" stroke-width="1.5" /><text x="886" y="329" font-family="sans-serif" font-size="13" fill="#a16a50" >Repeat all tests</text><rect x="27" y="460" width="1023" height="59" rx="12" fill="#e6efe9"/><text x="42" y="485" font-family="sans-serif" font-size="14" fill="#38646a" >A successful parser can legitimately return a defective mesh together with a precise report.</text><text x="42" y="506" font-family="sans-serif" font-size="12" fill="#687f83" >An automatic weld may destroy real UV, normal or topological intent; repair needs an explicit contract.</text>
</svg>