<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Two measurements, one weighted zero</title><desc>With depth returns 1.01 and 1.03 metres, weights one and three and truncation distance 0.1 metres, the linear weighted field crosses zero at 1.025 metres. The plotted interval lies within both linear truncation bands.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Two measurements, one weighted zero</text><text x="100" y="72" font-size="13">Normalized signed distance; μ = 0.10 m</text><path d="M100 100V300H660" stroke="#536b8b" fill="none"/><g stroke="#d0dce2"><path d="M100 120H660 M100 160H660 M100 200H660 M100 240H660 M100 280H660"/></g><path d="M100 200H660" stroke="#536b8b" stroke-width="1.5"/><g font-size="12" text-anchor="end"><text x="90" y="124">+0.4</text><text x="90" y="164">+0.2</text><text x="90" y="204">0</text><text x="90" y="244">-0.2</text><text x="90" y="284">-0.4</text></g><path d="M100 140L660 300" stroke="#667e91" stroke-width="2" fill="none"/><path d="M100 100L660 260" stroke="#b3752c" stroke-width="2" stroke-dasharray="7 4" fill="none"/><path d="M100 110L660 270" stroke="#167b90" stroke-width="3.5" fill="none"/><g fill="#fff" stroke-width="2"><circle cx="310" cy="200" r="5" stroke="#667e91"/><circle cx="450" cy="200" r="5" stroke="#b3752c"/><circle cx="415" cy="200" r="6" stroke="#167b90"/></g><g font-size="12" text-anchor="middle"><text x="100" y="321">0.98</text><text x="240" y="321">1.00</text><text x="380" y="321">1.02</text><text x="520" y="321">1.04</text><text x="660" y="321">1.06</text></g><g font-size="13"><text x="679" y="132" fill="#667e91">1.01 m, w=1</text><text x="679" y="154" fill="#b3752c">1.03 m, w=3</text><text x="679" y="176" fill="#167b90">Fused field</text></g><path d="M415 207V345" stroke="#167b90" stroke-dasharray="3 4"/><text x="415" y="365" text-anchor="middle" font-weight="bold">Weighted zero: 1.025 m</text><text x="380" y="391" text-anchor="middle" font-size="13">Axial depth (metres); common linear truncation band</text></g></svg>
