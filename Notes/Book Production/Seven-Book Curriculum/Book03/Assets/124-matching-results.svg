<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Geometric verification with random outliers</title><desc>Mean precision, recall and held-out Sampson error for ten synthetic trials at each corruption level. Random false matches can still survive.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Geometric verification with random outliers</text><text x="92" y="78" font-weight="bold">Precision and recall (zoomed vertical scale)</text><path d="M93 90V200H677" fill="none" stroke="#536b8b"/><path d="M93 200H677" stroke="#cdd9df"/><text x="80" y="204" text-anchor="end" font-size="12">0.98</text><path d="M93 149.99999999999994H677" stroke="#cdd9df"/><text x="80" y="153.99999999999994" text-anchor="end" font-size="12">0.99</text><path d="M93 99.99999999999991H677" stroke="#cdd9df"/><text x="80" y="103.99999999999991" text-anchor="end" font-size="12">1.00</text><path d="M93 99.99999999999991H677" stroke="#c88033" stroke-width="2"/><path d="M93 99.99999999999991 L239 116.48350000000012 L385 112.34569999999981 L531 127.97339999999973 L677 124.59015" stroke="#167b90" stroke-width="2" fill="none"/><circle cx="93" cy="99.99999999999991" r="4" fill="#167b90"/><circle cx="239" cy="116.48350000000012" r="4" fill="#167b90"/><circle cx="385" cy="112.34569999999981" r="4" fill="#167b90"/><circle cx="531" cy="127.97339999999973" r="4" fill="#167b90"/><circle cx="677" cy="124.59015" r="4" fill="#167b90"/><text x="690" y="108" fill="#c88033" font-size="13">Recall</text><text x="690" y="139" fill="#167b90" font-size="13">Precision</text><text x="93" y="232" font-weight="bold">Held-out Sampson RMS (pixels)</text><path d="M93 245V337H677" fill="none" stroke="#536b8b"/><path d="M93 337H677" stroke="#cdd9df"/><text x="80" y="341" text-anchor="end" font-size="12">0.00</text><path d="M93 292H677" stroke="#cdd9df"/><text x="80" y="296" text-anchor="end" font-size="12">0.05</text><path d="M93 247H677" stroke="#cdd9df"/><text x="80" y="251" text-anchor="end" font-size="12">0.10</text><path d="M93 285.875176 L239 286.784977 L385 247.026334 L531 270.117328 L677 245.636779" stroke="#167b90" stroke-width="2" fill="none"/><circle cx="93" cy="285.875176" r="4" fill="#167b90"/><circle cx="239" cy="286.784977" r="4" fill="#167b90"/><circle cx="385" cy="247.026334" r="4" fill="#167b90"/><circle cx="531" cy="270.117328" r="4" fill="#167b90"/><circle cx="677" cy="245.636779" r="4" fill="#167b90"/><text x="93" y="359" text-anchor="middle">0%</text><text x="239" y="359" text-anchor="middle">10%</text><text x="385" y="359" text-anchor="middle">20%</text><text x="531" y="359" text-anchor="middle">30%</text><text x="677" y="359" text-anchor="middle">40%</text><text x="385" y="389" text-anchor="middle">Deliberately corrupted correspondences</text></g></svg>
