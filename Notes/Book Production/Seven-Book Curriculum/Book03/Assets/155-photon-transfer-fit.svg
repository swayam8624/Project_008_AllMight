<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>The slope measures conversion gain</title><desc>The analytic unsaturated temporal variance line has slope 0.5 digital units per electron and intercept 4 digital units squared. The four plotted points are model values, not camera measurements.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">The slope measures conversion gain</text><line x1="105" y1="95" x2="105" y2="300" stroke="#657c90" stroke-width="2"/><line x1="105" y1="300" x2="695" y2="300" stroke="#657c90" stroke-width="2"/><line x1="105" y1="300" x2="105" y2="306" stroke="#657c90" stroke-width="2"/><text x="105" y="323" font-size="13" text-anchor="middle" fill="#153149">0</text><line x1="252.5" y1="300" x2="252.5" y2="306" stroke="#657c90" stroke-width="2"/><text x="252.5" y="323" font-size="13" text-anchor="middle" fill="#153149">200</text><line x1="400" y1="300" x2="400" y2="306" stroke="#657c90" stroke-width="2"/><text x="400" y="323" font-size="13" text-anchor="middle" fill="#153149">400</text><line x1="547.5" y1="300" x2="547.5" y2="306" stroke="#657c90" stroke-width="2"/><text x="547.5" y="323" font-size="13" text-anchor="middle" fill="#153149">600</text><line x1="695" y1="300" x2="695" y2="306" stroke="#657c90" stroke-width="2"/><text x="695" y="323" font-size="13" text-anchor="middle" fill="#153149">800</text><line x1="105" y1="300" x2="695" y2="300" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="304" font-size="13" text-anchor="end" fill="#153149">0</text><line x1="105" y1="250" x2="695" y2="250" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="254" font-size="13" text-anchor="end" fill="#153149">100</text><line x1="105" y1="200" x2="695" y2="200" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="204" font-size="13" text-anchor="end" fill="#153149">200</text><line x1="105" y1="150" x2="695" y2="150" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="154" font-size="13" text-anchor="end" fill="#153149">300</text><line x1="105" y1="100" x2="695" y2="100" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="104" font-size="13" text-anchor="end" fill="#153149">400</text><text x="400" y="353" font-size="15" text-anchor="middle" fill="#153149">Black-subtracted mean (DN)</text><text x="105" y="80" font-size="14" text-anchor="start" fill="#153149">Temporal variance (DN²)</text><polyline points="114.21875,294.875 141.875,285.5 252.5,248 695,98" fill="none" stroke="#087fa0" stroke-width="2.8" stroke-linejoin="round"/><circle cx="114.21875" cy="294.875" r="4" fill="#087fa0"/><circle cx="141.875" cy="285.5" r="4" fill="#087fa0"/><circle cx="252.5" cy="248" r="4" fill="#087fa0"/><circle cx="695" cy="98" r="4" fill="#087fa0"/><line x1="115" y1="52" x2="136" y2="52" stroke="#087fa0" stroke-width="3"/><text x="142" y="57" font-size="13" text-anchor="start" fill="#153149">Ideal variance</text></g></svg>
