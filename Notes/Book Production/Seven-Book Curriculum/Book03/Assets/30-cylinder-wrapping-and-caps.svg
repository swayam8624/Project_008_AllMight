<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="590" viewBox="0 0 1090 590" role="img" aria-labelledby="title desc">
<title id="title">Capped cylinder with wrapped angular index and distinct side and cap normals</title>
<desc id="desc">A cylinder with twelve slices uses two rings of twelve indexed positions and one center for each cap. Its 26 vertices, 72 unique edges and 48 triangular faces form a closed genus-zero surface with consistent angular wrapping and Euler characteristic two. The cap and side share rim vertex identity but require different per-face-corner shading normals.</desc>
<rect width="1090" height="590" rx="18" fill="#fbfaf6"/>
<text x="29" y="40" font-family="sans-serif" font-size="23" fill="#284b55" font-weight="600">Close the cylinder by identity, not by matching positions</text><text x="29" y="63" font-family="sans-serif" font-size="13" fill="#668088" >12 slices, 2 angular rings, 2 cap centers; longitude i wraps to (i+1) mod 12</text><rect x="23" y="88" width="749" height="443" rx="13" fill="#eef3ef"/><polygon points="512.00,435.00 512.00,215.00 459.32,231.99" fill="#bcded3" fill-opacity=".44"/><polygon points="512.00,435.00 459.32,231.99 459.32,451.99" fill="#d3e8de" fill-opacity=".44"/><line x1="512" y1="435" x2="512" y2="215" stroke="#4b927f" stroke-width="2"/><line x1="512" y1="435" x2="459.3153532995459" y2="451.9903810567666" stroke="#4b927f" stroke-width="2"/><line x1="512" y1="215" x2="459.3153532995459" y2="231.99038105676658" stroke="#4b927f" stroke-width="2"/><line x1="512" y1="435" x2="459.3153532995459" y2="231.99038105676658" stroke="#9bbfb1" stroke-width="1"/><polygon points="459.32,451.99 459.32,231.99 385.38,240.41" fill="#bcded3" fill-opacity=".44"/><polygon points="459.32,451.99 385.38,240.41 385.38,460.41" fill="#d3e8de" fill-opacity=".44"/><line x1="459.3153532995459" y1="451.9903810567666" x2="459.3153532995459" y2="231.99038105676658" stroke="#4b927f" stroke-width="2"/><line x1="459.3153532995459" y1="451.9903810567666" x2="385.3782217350893" y2="460.4089653438087" stroke="#4b927f" stroke-width="2"/><line x1="459.3153532995459" y1="231.99038105676658" x2="385.3782217350893" y2="240.40896534380866" stroke="#4b927f" stroke-width="2"/><line x1="459.3153532995459" y1="451.9903810567666" x2="385.3782217350893" y2="240.40896534380866" stroke="#9bbfb1" stroke-width="1"/><polygon points="385.38,460.41 385.38,240.41 310.00,238.00" fill="#bcded3" fill-opacity=".44"/><polygon points="385.38,460.41 310.00,238.00 310.00,458.00" fill="#d3e8de" fill-opacity=".44"/><line x1="385.3782217350893" y1="460.4089653438087" x2="385.3782217350893" y2="240.40896534380866" stroke="#4b927f"