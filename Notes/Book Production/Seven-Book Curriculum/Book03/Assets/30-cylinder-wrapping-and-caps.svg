"#82ad9e" stroke-width="1.5"/><line x1="380" y1="420" x2="450" y2="382" stroke="#a5bdb1" stroke-width="1"/><line x1="380" y1="200" x2="506.6217782649107" y2="174.59103465619134" stroke="#82ad9e" stroke-width="1.5"/><line x1="380" y1="420" x2="506.6217782649107" y2="394.5910346561913" stroke="#a5bdb1" stroke-width="1"/><line x1="380" y1="200" x2="529.3153532995459" y2="193.99038105676655" stroke="#82ad9e" stroke-width="1.5"/><line x1="380" y1="420" x2="529.3153532995459" y2="413.9903810567666" stroke="#a5bdb1" stroke-width="1"/><circle cx="380.00" cy="200.00" r="7" fill="#aa6a47" stroke="#fafaf7" stroke-width="1.4"/><circle cx="380.00" cy="420.00" r="5" fill="#6e9a8b" stroke="#fafaf7" stroke-width="1.4"/><line x1="380" y1="200" x2="380" y2="127" stroke="#ba784f" stroke-width="3"/><text x="388" y="123" font-family="sans-serif" font-size="14" fill="#9c6040" >cap normal +Y</text><text x="60" y="178" font-family="sans-serif" font-size="15" fill="#397e72" >Side: radial normal</text><text x="60" y="206" font-family="sans-serif" font-size="15" fill="#ae704d" >Cap: vertical normal</text><rect x="796" y="99" width="269" height="421" rx="12" fill="#e8f1ec"/><text x="809" y="132" font-family="sans-serif" font-size="18" fill="#355a65" font-weight="600">12 angular slices</text><text x="812" y="184" font-family="sans-serif" font-size="14" fill="#345b64" >2×12+2 = 26 vertices</text><text x="812" y="220" font-family="sans-serif" font-size="14" fill="#345b64" >6×12 = 72 edges</text><text x="812" y="256" font-family="sans-serif" font-size="14" fill="#345b64" >4×12 = 48 faces</text><text x="812" y="302" font-family="sans-serif" font-size="14" fill="#277b6b" >Euler: 26−72+48 = 2</text><text x="812" y="353" font-family="sans-serif" font-size="14" fill="#345b64" >Two faces per edge</text><text x="812" y="380" font-family="sans-serif" font-size="12" fill="#345b64" >No duplicate θ=2π ring</text><text x="812" y="431" font-family="sans-serif" font-size="14" fill="#345b64" >At the cap rim:</text><text x="812" y="455" font-family="sans-serif" font-size="12" fill="#345b64" >same positions, two</text><text x="812" y="472" font-family="sans-serif" font-size="12" fill="#345b64" >shading normal choices</text><text x="32" y="563" font-family="sans-serif" font-size="13" fill="#617a7f" >Sharing topological position IDs does not force shading normals to match across the sharp side/cap crease.</text>
