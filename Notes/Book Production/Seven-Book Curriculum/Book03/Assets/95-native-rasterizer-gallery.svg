<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">The native software-renderer gallery</title><desc id="desc">Actual native output, a perspective checkerboard partly occluded by an orange triangle. The four-color image is encoded losslessly in the embedded PNG.</desc><rect width="1080" height="560" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">The native software-renderer gallery</text><rect x="25" y="80" width="620" height="420" rx="10" fill="#edf3ef"/><image x="55" y="93" width="560" height="420" image-rendering="pixelated" xlink:href="data:image/png;base64,"/><rect x="665" y="80" width="390" height="420" rx="10" fill="#edf3ef"/><text x="685" y="120" font-family="sans-serif" font-size="19" fill="#345c65">Observed C++23 output</text><text x="685" y="180" font-family="sans-serif" font-size="17" fill="#345c65">320 × 240 pixels</text><text x="685" y="224" font-family="sans-serif" font-size="17" fill="#a46a48">11,172 foreground</text><text x="685" y="266" font-family="sans-serif" font-size="17" fill="#287b68">19,047 visible checker pixels</text><text x="685" y="308" font-family="sans-serif" font-size="17" fill="#345c65">46,581 background</text><text x="685" y="379" font-family="sans-serif" font-size="16" fill="#345c65">76,531 exact oracle matches</text><text x="685" y="410" font-family="sans-serif" font-size="16" fill="#345c65">269 checker-boundary samples</text><text x="28" y="540" font-family="sans-serif" font-size="13" fill="#345c65">Native screen-space gallery, not an executed OBJ front-end render. Lossless indexed PNG embedded.</text></svg>