<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Focal distance changes field of view</title><desc id="desc">Two side-by-side centered sensor cross-sections have identical transverse spans of 200 units and focal distances 160 and 320 units. Their angular fields of view are approximately 64.0 and 34.7 degrees.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="30" y="41" font-family="sans-serif" font-size="23" fill="#284e58" font-weight="600">Focal distance changes field of view</text><rect x="25" y="85" width="505" height="401" rx="12" fill="#edf3ef"/><text x="40" y="120" font-family="sans-serif" font-size="18" fill="#355d65" >Shorter focal distance</text><polygon points="95,300 255,200 255,400" fill="#d4e6dc" opacity=".9"/><line x1="95" y1="300" x2="255" y2="200" stroke="#3b8974" stroke-width="3" /><line x1="95" y1="300" x2="255" y2="400" stroke="#3b8974" stroke-width="3" /><line x1="95" y1="300" x2="497" y2="300" stroke="#809492" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="255" y1="200" x2="255" y2="400" stroke="#507da7" stroke-width="4" /><circle cx="95" cy="300" r="6" fill="#344e55" stroke="#fbfaf7" stroke-width="1.5"/><text x="263" y="210" font-family="sans-serif" font-size="13" fill="#355d65" >sensor</text><text x="165" y="325" font-family="sans-serif" font-size="17" fill="#355d65" >f</text><text x="40" y="450" font-family="sans-serif" font-size="15" fill="#355d65" >θ = 2 atan(100/160) ≈ 64.0°</text><rect x="550" y="85" width="505" height="401" rx="12" fill="#edf3ef"/><text x="565" y="120" font-family="sans-serif" font-size="18" fill="#355d65" >Longer focal distance</text><polygon points="620,300 940,200 940,400" fill="#d4e6dc" opacity=".9"/><line x1="620" y1="300" x2="940" y2="200" stroke="#3b8974" stroke-width="3" /><line x1="620" y1="300" x2="940" y2="400" stroke="#3b8974" stroke-width="3" /><line x1="620" y1="300" x2="1022" y2="300" stroke="#809492" stroke-width="1.5" stroke-dasharray="6 5"/><line x1="940" y1="200" x2="940" y2="400" stroke="#507da7" stroke-width="4" /><circle cx="620" cy="300" r="6" fill="#344e55" stroke="#fbfaf7" stroke-width="1.5"/><text x="948" y="210" font-family="sans-serif" font-size="13" fill="#355d65" >sensor</text><text x="770" y="325" font-family="sans-serif" font-size="17" fill="#355d65" >2f</text><text x="565" y="450" font-family="sans-serif" font-size="15" fill="#355d65" >θ = 2 atan(100/320) ≈ 34.7°</text><text x="30" y="529" font-family="sans-serif" font-size="14" fill="#355d65" >Equal sensor spans; same optical center; a larger focal distance narrows the angular field of view.</text></svg>