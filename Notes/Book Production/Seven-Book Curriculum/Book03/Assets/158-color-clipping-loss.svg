<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>Clipping destroys invertibility</title><desc>With gain two, input red channels 0.6 and 0.8 both map to output one after clipping. The unclipped linear transform is invertible, but its clipped form is not.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">Clipping destroys invertibility</text><line x1="105" y1="95" x2="105" y2="300" stroke="#657c90" stroke-width="2"/><line x1="105" y1="300" x2="695" y2="300" stroke="#657c90" stroke-width="2"/><line x1="105" y1="300" x2="105" y2="306" stroke="#657c90" stroke-width="2"/><text x="105" y="323" font-size="13" text-anchor="middle" fill="#153149">0</text><line x1="252.5" y1="300" x2="252.5" y2="306" stroke="#657c90" stroke-width="2"/><text x="252.5" y="323" font-size="13" text-anchor="middle" fill="#153149">0.2</text><line x1="400" y1="300" x2="400" y2="306" stroke="#657c90" stroke-width="2"/><text x="400" y="323" font-size="13" text-anchor="middle" fill="#153149">0.4</text><line x1="547.5" y1="300" x2="547.5" y2="306" stroke="#657c90" stroke-width="2"/><text x="547.5" y="323" font-size="13" text-anchor="middle" fill="#153149">0.6</text><line x1="695" y1="300" x2="695" y2="306" stroke="#657c90" stroke-width="2"/><text x="695" y="323" font-size="13" text-anchor="middle" fill="#153149">0.8</text><line x1="105" y1="300" x2="695" y2="300" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="304" font-size="13" text-anchor="end" fill="#153149">0</text><line x1="105" y1="248.75" x2="695" y2="248.75" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="252.75" font-size="13" text-anchor="end" fill="#153149">0.4</text><line x1="105" y1="197.5" x2="695" y2="197.5" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="201.5" font-size="13" text-anchor="end" fill="#153149">0.8</text><line x1="105" y1="146.25" x2="695" y2="146.25" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="150.25" font-size="13" text-anchor="end" fill="#153149">1.2</text><line x1="105" y1="95" x2="695" y2="95" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="99" font-size="13" text-anchor="end" fill="#153149">1.6</text><text x="400" y="353" font-size="15" text-anchor="middle" fill="#153149">Input linear red</text><text x="105" y="80" font-size="14" text-anchor="start" fill="#153149">Output linear red</text><polyline points="105,300 695,95" fill="none" stroke="#087fa0" stroke-width="2.8" stroke-linejoin="round"/><line x1="115" y1="52" x2="136" y2="52" stroke="#087fa0" stroke-width="3"/><text x="142" y="57" font-size="13" text-anchor="start" fill="#153149">Gain ×2</text><polyline points="105,300 473.75,171.875 547.5,171.875 695,171.875" fill="none" stroke="#ac7428" stroke-width="2.8" stroke-linejoin="round"/><circle cx="105" cy="300" r="4" fill="#ac7428"/><circle cx="473.75" cy="171.875" r="4" fill="#ac7428"/><circle cx="547.5" cy="171.875" r="4" fill="#ac7428"/><circle cx="695" cy="171.875" r="4" fill="#ac7428"/><line x1="255" y1="52" x2="276" y2="52" stroke="#ac7428" stroke-width="3"/><text x="282" y="57" font-size="13" text-anchor="start" fill="#153149">Clipped</text></g></svg>
