<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">One renderer, explicit stage boundaries</title><desc id="desc">The intended full rasterizer connects OBJ import, model/view, clipping and viewport to the native-validated coverage, interpolation, visibility and output backend. Front-end integration remains pending.</desc><rect width="1080" height="560" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">One renderer, explicit stage boundaries</text><rect x="25" y="80" width="1030" height="190" rx="10" fill="#ebe4d8"/><rect x="25" y="285" width="1030" height="210" rx="10" fill="#dcebe2"/><text x="45" y="111" font-family="sans-serif" font-size="16" fill="#345c65">FRONT END — source adapter committed; native integration pending</text><text x="45" y="318" font-family="sans-serif" font-size="16" fill="#345c65">BACK END — exact committed native sources passed</text><rect x="45" y="143" width="230" height="105" rx="10" fill="#fafaf6"/><text x="59" y="180" font-family="sans-serif" font-size="18" fill="#345c65">OBJ import</text><text x="59" y="215" font-family="sans-serif" font-size="14" fill="#345c65">Indexed rendering tuples</text><text x="279" y="201" font-family="sans-serif" font-size="17" fill="#345c65">→</text><rect x="295" y="143" width="230" height="105" rx="10" fill="#fafaf6"/><text x="309" y="180" font-family="sans-serif" font-size="18" fill="#345c65">Model + view</text><text x="309" y="215" font-family="sans-serif" font-size="14" fill="#345c65">World and camera</text><text x="529" y="201" font-family="sans-serif" font-size="17" fill="#345c65">→</text><rect x="545" y="143" width="230" height="105" rx="10" fill="#fafaf6"/><text x="559" y="180" font-family="sans-serif" font-size="18" fill="#345c65">Projection + clip</text><text x="559" y="215" font-family="sans-serif" font-size="14" fill="#345c65">Homogeneous payload</text><text x="779" y="201" font-family="sans-serif" font-size="17" fill="#345c65">→</text><rect x="795" y="143" width="230" height="105" rx="10" fill="#fafaf6"/><text x="809" y="180" font-family="sans-serif" font-size="18" fill="#345c65">Viewport + fan</text><text x="809" y="215" font-family="sans-serif" font-size="14" fill="#345c65">Screen, q, w, UV</text><rect x="45" y="351" width="230" height="105" rx="10" fill="#fafaf6"/><text x="59" y="388" font-family="sans-serif" font-size="18" fill="#345c65">Coverage</text><text x="59" y="423" font-family="sans-serif" font-size="14" fill="#345c65">Snapped edge weights</text><text x="279" y="409" font-family="sans-serif" font-size="17" fill="#345c65">→</text><rect x="295" y="351" width="230" height="105" rx="10" fill="#fafaf6"/><text x="309" y="388" font-family="sans-serif" font-size="18" fill="#345c65">Interpolate</text><text x="309" y="423" font-family="sans-serif" font-size="14" fill="#345c65">UV and candidate depth</text><text x="529" y="409" font-family="sans-serif" font-size="17" fill="#345c65">→</text><rect x="545" y="351" width="230" height="105" rx="10" fill="#fafaf6"/><text x="559" y="388" font-family="sans-serif" font-size="18" fill="#345c65">Visibility + shade</text><text x="559" y="423" font-family="sans-serif" font-size="14" fill="#345c65">Winning linear colour</text><text x="779" y="409" font-family="sans-serif" font-size="17" fill="#345c65">→</text><rect x="795" y="351" width="230" height="105" rx="10" fill="#fafaf6"/><text x="809" y="388" font-family="sans-serif" font-size="18" fill="#345c65">Encode</text><text x="809" y="423" font-family="sans-serif" font-size="14" fill="#345c65">P6 image bytes</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">The front-end adapter and isolated backend have separate native acceptance gates.</text></svg>