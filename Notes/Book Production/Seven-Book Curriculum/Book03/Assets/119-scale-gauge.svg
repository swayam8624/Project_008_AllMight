<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Scale the world, keep the photographs</title><desc>Scaling the scene and translation by the same positive factor preserves ideal perspective directions. A known length is required for metric scale.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Scale the world, keep the photographs</text><path d="M130 275L230 135L330 275Z M475 325L625 115L775 325Z" fill="#e3f2f5" stroke="#167b90" stroke-width="2"/><path d="M130 275H330 M475 325H775" stroke="#c88033" stroke-width="3"/><circle cx="130" cy="275" r="5" fill="#153149"/><circle cx="330" cy="275" r="5" fill="#153149"/><circle cx="475" cy="325" r="5" fill="#153149"/><circle cx="775" cy="325" r="5" fill="#153149"/><circle cx="230" cy="135" r="5" fill="#c88033"/><circle cx="625" cy="115" r="5" fill="#c88033"/><text x="230" y="304" text-anchor="middle">X, t</text><text x="625" y="350" text-anchor="middle">kX, kt</text><text x="420" y="389" text-anchor="middle">Conceptual diagram: scaling preserves direction ratios, not metric distances.</text></g></svg>
