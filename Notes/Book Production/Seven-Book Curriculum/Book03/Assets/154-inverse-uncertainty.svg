<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>Undistortion stretches uncertainty unequally</title><desc>An isotropic half-pixel input uncertainty becomes an ellipse whose radial standard deviation is approximately 0.588 pixels and tangential standard deviation 0.526 pixels in the given local model.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">Undistortion stretches uncertainty unequally</text><circle cx="205" cy="188" r="75" fill="#d2e8ee" stroke="#087fa0" stroke-width="2"/><ellipse cx="600" cy="188" rx="88.24" ry="78.95" fill="#f5e4c9" stroke="#ac7428" stroke-width="2"/><line x1="310" y1="188" x2="475" y2="188" stroke="#087fa0" stroke-width="2"/><polyline points="465.9955289764732,192.3496553411123 475,188 465.9955289764732,183.6503446588877" fill="none" stroke="#087fa0" stroke-width="2" stroke-linejoin="round"/><line x1="120" y1="188" x2="290" y2="188" stroke="#657c90" stroke-width="1" stroke-dasharray="4 4"/><line x1="500" y1="188" x2="700" y2="188" stroke="#657c90" stroke-width="1" stroke-dasharray="4 4"/><text x="205" y="98" font-size="18" text-anchor="middle" fill="#153149">Distorted measurement</text><text x="600" y="98" font-size="18" text-anchor="middle" fill="#153149">Ideal-image uncertainty</text><text x="205" y="302" font-size="17" text-anchor="middle" fill="#153149">σ = 0.5 px</text><text x="600" y="302" font-size="15" text-anchor="middle" fill="#153149">radial 0.588 / tangential 0.526 px</text></g></svg>
