<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Forward and reverse depth contracts</title><desc id="desc">Forward maps near to zero and far to one and typically uses less with clear one. Reverse maps near to one and far to zero and typically uses greater with clear zero. The reference uses an explicit empty bit.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Forward and reverse depth contracts</text><rect x="25" y="80" width="505" height="416" rx="10" fill="#edf3ef"/><text x="50" y="120" font-family="sans-serif" font-size="20" fill="#345c65">Forward depth</text><line x1="90" y1="218" x2="465" y2="218" stroke="#637d78" stroke-width="3" /><circle cx="90" cy="218" r="8" fill="#31856b"/><circle cx="465" cy="218" r="8" fill="#ba7a48"/><text x="70" y="191" font-family="sans-serif" font-size="15" fill="#345c65">Near</text><text x="448" y="191" font-family="sans-serif" font-size="15" fill="#345c65">Far</text><text x="84" y="253" font-family="sans-serif" font-size="20" fill="#345c65">0</text><text x="460" y="253" font-family="sans-serif" font-size="20" fill="#345c65">1</text><text x="50" y="318" font-family="sans-serif" font-size="19" fill="#345c65">Less comparison</text><text x="50" y="361" font-family="sans-serif" font-size="18" fill="#345c65">Typical clear = 1</text><text x="50" y="425" font-family="sans-serif" font-size="16" fill="#345c65">CPU reference: explicit empty</text><rect x="550" y="80" width="505" height="416" rx="10" fill="#edf3ef"/><text x="575" y="120" font-family="sans-serif" font-size="20" fill="#345c65">Reverse-Z</text><line x1="615" y1="218" x2="990" y2="218" stroke="#637d78" stroke-width="3" /><circle cx="615" cy="218" r="8" fill="#31856b"/><circle cx="990" cy="218" r="8" fill="#ba7a48"/><text x="595" y="191" font-family="sans-serif" font-size="15" fill="#345c65">Near</text><text x="973" y="191" font-family="sans-serif" font-size="15" fill="#345c65">Far</text><text x="609" y="253" font-family="sans-serif" font-size="20" fill="#345c65">1</text><text x="985" y="253" font-family="sans-serif" font-size="20" fill="#345c65">0</text><text x="575" y="318" font-family="sans-serif" font-size="19" fill="#345c65">Greater comparison</text><text x="575" y="361" font-family="sans-serif" font-size="18" fill="#345c65">Typical clear = 0</text><text x="575" y="425" font-family="sans-serif" font-size="16" fill="#345c65">CPU reference: explicit empty</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">The same physical ordering is represented in opposite numeric directions. Projection and comparison must agree.</text></svg>