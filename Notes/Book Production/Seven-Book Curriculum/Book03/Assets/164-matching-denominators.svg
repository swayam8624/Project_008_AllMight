<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>The matching stages use different denominators</title><desc>The illustrative twenty-feature fixture retains sixteen repeated detections, twelve correct retrievals, and eleven verified true matches. Two false matches survive separately.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">The matching stages use different denominators</text><text x="190" y="105" font-size="15" text-anchor="end" fill="#153149">Visible truth</text><rect x="205" y="88" width="500" height="25" rx="3" fill="#e8eff3" stroke="none"/><rect x="205" y="88" width="500" height="25" rx="3" fill="#087fa0" stroke="none"/><text x="715" y="105" font-size="14" text-anchor="start" fill="#153149">20</text><text x="190" y="150" font-size="15" text-anchor="end" fill="#153149">Repeatable</text><rect x="205" y="133" width="500" height="25" rx="3" fill="#e8eff3" stroke="none"/><rect x="205" y="133" width="400" height="25" rx="3" fill="#ac7428" stroke="none"/><text x="615" y="150" font-size="14" text-anchor="start" fill="#153149">16</text><text x="190" y="195" font-size="15" text-anchor="end" fill="#153149">Correct retrieval</text><rect x="205" y="178" width="500" height="25" rx="3" fill="#e8eff3" stroke="none"/><rect x="205" y="178" width="300" height="25" rx="3" fill="#087fa0" stroke="none"/><text x="515" y="195" font-size="14" text-anchor="start" fill="#153149">12</text><text x="190" y="240" font-size="15" text-anchor="end" fill="#153149">Verified true</text><rect x="205" y="223" width="500" height="25" rx="3" fill="#e8eff3" stroke="none"/><rect x="205" y="223" width="275" height="25" rx="3" fill="#ac7428" stroke="none"/><text x="490" y="240" font-size="14" text-anchor="start" fill="#153149">11</text><text x="190" y="285" font-size="15" text-anchor="end" fill="#153149">Verified false</text><rect x="205" y="268" width="500" height="25" rx="3" fill="#e8eff3" stroke="none"/><rect x="205" y="268" width="50" height="25" rx="3" fill="#087fa0" stroke="none"/><text x="265" y="285" font-size="14" text-anchor="start" fill="#153149">2</text></g></svg>
