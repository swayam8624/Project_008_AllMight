<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Two surfaces exchange depth order</title><desc id="desc">The sloped depth q1=0.125+0.5u/32 crosses constant depth q2=0.375 at u=16. The nearer surface changes across the image.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Two surfaces exchange depth order</text><rect x="25" y="80" width="690" height="416" rx="10" fill="#edf3ef"/><rect x="735" y="80" width="320" height="416" rx="10" fill="#edf3ef"/><line x1="85" y1="120" x2="85" y2="460" stroke="#d4e0d8" stroke-width="1" /><text x="77" y="482" font-family="sans-serif" font-size="12" fill="#345c65">0</text><line x1="231.25" y1="120" x2="231.25" y2="460" stroke="#d4e0d8" stroke-width="1" /><text x="223.25" y="482" font-family="sans-serif" font-size="12" fill="#345c65">8</text><line x1="377.5" y1="120" x2="377.5" y2="460" stroke="#d4e0d8" stroke-width="1" /><text x="369.5" y="482" font-family="sans-serif" font-size="12" fill="#345c65">16</text><line x1="523.75" y1="120" x2="523.75" y2="460" stroke="#d4e0d8" stroke-width="1" /><text x="515.75" y="482" font-family="sans-serif" font-size="12" fill="#345c65">24</text><line x1="670" y1="120" x2="670" y2="460" stroke="#d4e0d8" stroke-width="1" /><text x="662" y="482" font-family="sans-serif" font-size="12" fill="#345c65">32</text><line x1="85" y1="460" x2="670" y2="460" stroke="#d4e0d8" stroke-width="1" /><text x="35" y="465" font-family="sans-serif" font-size="12" fill="#345c65">0</text><line x1="85" y1="403.3333333333333" x2="670" y2="403.3333333333333" stroke="#d4e0d8" stroke-width="1" /><text x="35" y="408.3333333333333" font-family="sans-serif" font-size="12" fill="#345c65">0.125</text><line x1="85" y1="346.6666666666667" x2="670" y2="346.6666666666667" stroke="#d4e0d8" stroke-width="1" /><text x="35" y="351.6666666666667" font-family="sans-serif" font-size="12" fill="#345c65">0.25</text><line x1="85" y1="290" x2="670" y2="290" stroke="#d4e0d8" stroke-width="1" /><text x="35" y="295" font-family="sans-serif" font-size="12" fill="#345c65">0.375</text><line x1="85" y1="233.33333333333334" x2="670" y2="233.33333333333334" stroke="#d4e0d8" stroke-width="1" /><text x="35" y="238.33333333333334" font-family="sans-serif" font-size="12" fill="#345c65">0.5</text><line x1="85" y1="176.66666666666669" x2="670" y2="176.66666666666669" stroke="#d4e0d8" stroke-width="1" /><text x="35" y="181.66666666666669" font-family="sans-serif" font-size="12" fill="#345c65">0.625</text><line x1="85" y1="120" x2="670" y2="120" stroke="#d4e0d8" stroke-width="1" /><text x="35" y="125" font-family="sans-serif" font-size="12" fill="#345c65">0.75</text><line x1="85" y1="403.3333333333333" x2="670" y2="176.66666666666669" stroke="#31856b" stroke-width="4" /><line x1="85" y1="290" x2="670" y2="290" stroke="#ba7a48" stroke-width="4" /><circle cx="377.5" cy="290" r="7" fill="#527da5"/><line x1="377.5" y1="120" x2="377.5" y2="460" stroke="#527da5" stroke-width="2" stroke-dasharray="5 5"/><text x="755" y="126" font-family="sans-serif" font-size="18" fill="#345c65">Forward depth q</text><text x="755" y="190" font-family="sans-serif" font-size="16" fill="#31856b">Surface 1: sloped</text><text x="755" y="230" font-family="sans-serif" font-size="16" fill="#ba7a48">Surface 2: flat</text><text x="755" y="303" font-family="sans-serif" font-size="16" fill="#345c65">u &lt; 16: surface 1</text><text x="755" y="340" font-family="sans-serif" font-size="16" fill="#345c65">u > 16: surface 2</text><text x="755" y="403" font-family="sans-serif" font-size="15" fill="#345c65">No whole-triangle</text><text x="755" y="429" font-family="sans-serif" font-size="15" fill="#345c65">draw order resolves both.</text><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">Analytic depth cross-section; smaller forward depth is nearer. Horizontal coordinate u is in pixels.</text></svg>