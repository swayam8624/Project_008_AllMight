<svg xmlns="http://www.w3.org/2000/svg" width="998" height="545" viewBox="0 0 998 545" role="img" aria-labelledby="title desc">
<title id="title">Exact geometric Bézier subdivision into two cubic segments at parameter 0.37</title>
<desc id="desc">A single cubic Bézier arch is subdivided by de Casteljau at s=0.37 into a left cubic with controls P0,p01,p012,C(s) and a right cubic with controls C(s),p123,p23,P3. Their union exactly follows the original mathematical curve; the source implementation uses binary64 rounding.</desc>
