<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Different spectra, identical responses</title><desc>Distinct synthetic spectra give equal three-channel responses under a toy instrument. These weights are illustrative, not standard-observer data.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Different spectra, identical responses</text><text x="75" y="75" font-weight="bold">Spectrum 1</text><path d="M75 95V285h290" fill="none" stroke="#153149"/><rect x="97" y="145" width="45" height="140" fill="#167b90"/><text x="119" y="305" text-anchor="middle">bin 1</text><text x="119" y="135" text-anchor="middle">2</text><rect x="162" y="145" width="45" height="140" fill="#167b90"/><text x="184" y="305" text-anchor="middle">bin 2</text><text x="184" y="135" text-anchor="middle">2</text><rect x="227" y="145" width="45" height="140" fill="#167b90"/><text x="249" y="305" text-anchor="middle">bin 3</text><text x="249" y="135" text-anchor="middle">2</text><rect x="292" y="285" width="45" height="0" fill="#167b90"/><text x="314" y="305" text-anchor="middle">bin 4</text><text x="314" y="275" text-anchor="middle">0</text><text x="220" y="345" text-anchor="middle">W p = (2, 2, 2)</text><text x="445" y="75" font-weight="bold">Spectrum 2</text><path d="M445 95V285h290" fill="none" stroke="#153149"/><rect x="467" y="215" width="45" height="70" fill="#c88033"/><text x="489" y="305" text-anchor="middle">bin 1</text><text x="489" y="205" text-anchor="middle">1</text><rect x="532" y="215" width="45" height="70" fill="#c88033"/><text x="554" y="305" text-anchor="middle">bin 2</text><text x="554" y="205" text-anchor="middle">1</text><rect x="597" y="215" width="45" height="70" fill="#c88033"/><text x="619" y="305" text-anchor="middle">bin 3</text><text x="619" y="205" text-anchor="middle">1</text><rect x="662" y="215" width="45" height="70" fill="#c88033"/><text x="684" y="305" text-anchor="middle">bin 4</text><text x="684" y="205" text-anchor="middle">1</text><text x="590" y="345" text-anchor="middle">W p = (2, 2, 2)</text><text x="420" y="387" text-anchor="middle">Illustrative four-bin instrument; not a physical spectral dataset.</text></g></svg>
