<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1090" height="592" viewBox="0 0 1090 592" role="img" aria-labelledby="title desc">
<title id="title">OBJ inspector topology witnesses for a properly shared edge and a winding conflict</title>
<desc id="desc">Two identical-looking square surface silhouettes have different directed face-index edge uses. A correct two-triangle square has opposite traversals of shared diagonal (0,2). A deliberately reversed second face traverses the diagonal in the same direction as the first, creating a winding conflict flagged by the Chapter 07 mesh inspector even though all position indices parse.</desc>
<rect width="1090" height="592" rx="16" fill="#fbfaf7"/>
<text x="28" y="41" font-family="sans-serif" font-size="23" fill="#294c56" font-weight="600">A trustworthy inspector shows where the evidence fails</text><text x="29" y="64" font-family="sans-serif" font-size="13" fill="#668088" >Two source-derived conceptual fixtures: a valid shared diagonal versus two faces using it in the same direction</text><rect x="23" y="94" width="508" height="389" rx="12" fill="#edf3ef"/><text x="38" y="130" font-family="sans-serif" font-size="18" fill="#2f796d" font-weight="600">Valid shared edge</text><polygon points="117,393 427,393 427,164 117,164" fill="#ccdfd0" fill-opacity=".51" stroke="#bf8a5b" stroke-width="3"/><line x1="117" y1="393" x2="427" y2="164" stroke="#338776" stroke-width="5" /><circle cx="117" cy="393" r="6" fill="#3b7973"/><text x="126" y="384" font-family="sans-serif" font-size="12" fill="#365966" >v0</text><circle cx="427" cy="393" r="6" fill="#3b7973"/><text x="436" y="384" font-family="sans-serif" font-size="12" fill="#365966" >v1</text><circle cx="427" cy="164" r="6" fill="#3b7973"/><text x="436" y="155" font-family="sans-serif" font-size="12" fill="#365966" >v2</text><circle cx="117" cy="164" r="6" fill="#3b7973"/><text x="126" y="155" font-family="sans-serif" font-size="12" fill="#365966" >v3</text><text x="36" y="453" font-family="sans-serif" font-size="14" fill="#2d806d" >Shared uses: 2→0, 0→2</text><rect x="553" y="94" width="508" height="389" rx="12" fill="#f1f0ed"/><text x="568" y="130" font-family="sans-serif" font-size="18" fill="#9c5a4b" font-weight="600">Winding-conflict edge</text><polygon points="647,393 957,393 957,164 647,164" fill="#ccdfd0" fill-opacity=".51" stroke="#bf8a5b" stroke-width="3"/><line x1="647" y1="393" x2="957" y2="164" stroke="#b84d52" stroke-width="5" /><circle cx="647" cy="393" r="6" fill="#3b7973"/><text x="656" y="384" font-family="sans-serif" font-size="12" fill="#365966" >v0</text><circle cx="957" cy="393" r="6" fill="#3b7973"/><text x="966" y="384" font-family="sans-serif" font-size="12" fill="#365966" >v1</text><circle cx="957" cy="164" r="6" fill="#3b7973"/><text x="966" y="155" font-family="sans-serif" font-size="12" fill="#365966" >v2</text><circle cx="647" cy="164" r="6" fill="#3b7973"/><text x="656" y="155" font-family="sans-serif" font-size="12" fill="#365966" >v3</text><text x="566" y="453" font-family="sans-serif" font-size="14" fill="#a85a4d" >Both shared uses: 2→0</text><rect x="25" y="500" width="1039" height="63" rx="12" fill="#e6f0e9"/><text x="41" y="525" font-family="sans-serif" font-size="14" fill="#3e626b" >The geometry can look identical while the directed edge-incidence report is different.</text><text x="41" y="547" font-family="sans-serif" font-size="12" fill="#6a7c84" >Do not repair by deleting the evidence before recording the original failure.</text>
</svg>