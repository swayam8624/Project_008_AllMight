<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>Calibration spread separates focal scale</title><desc>Two centered three-point designs have normalized coordinate spread differing by ten. Their focal parameter variance differs by a factor of one hundred for equal pixel noise.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">Calibration spread separates focal scale</text><text x="100" y="80" font-size="18" text-anchor="start" fill="#153149">Broad design: x = −0.5, 0, 0.5</text><line x1="90" y1="126" x2="720" y2="126" stroke="#657c90" stroke-width="2"/><circle cx="130" cy="126" r="7" fill="#087fa0"/><circle cx="405" cy="126" r="7" fill="#087fa0"/><circle cx="680" cy="126" r="7" fill="#087fa0"/><line x1="90" y1="245" x2="720" y2="245" stroke="#657c90" stroke-width="2"/><circle cx="377.5" cy="245" r="7" fill="#ac7428"/><circle cx="405" cy="245" r="7" fill="#ac7428"/><circle cx="432.5" cy="245" r="7" fill="#ac7428"/><text x="90" y="175" font-size="17" text-anchor="start" fill="#153149">Focal variance = 2 px²</text><text x="90" y="215" font-size="18" text-anchor="start" fill="#153149">Narrow design: x = −0.05, 0, 0.05</text><text x="90" y="297" font-size="17" text-anchor="start" fill="#153149">Focal variance = 200 px²</text><text x="90" y="343" font-size="15" text-anchor="start" fill="#153149">Same sample count and noise; very different information.</text></g></svg>
