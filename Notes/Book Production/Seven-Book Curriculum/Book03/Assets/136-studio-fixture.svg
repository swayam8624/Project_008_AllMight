<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>A known house facade in a 320 × 240 image</title><desc>A controlled open facade consists of a rectangular wall, triangular roof and a nearer overlapping window. Known pixel boundaries and depths define the analytic fixture.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">A known house facade in a 320 × 240 image</text><rect x="165" y="62" width="440" height="330" fill="#354048" rx="4"/><g transform="translate(165 62) scale(1.375)"><path d="M80 100L160 40L240 100Z" fill="#bc6150"/><rect x="80" y="100" width="160" height="100" fill="#d3af81"/><rect x="130" y="135" width="60" height="40" fill="#50aad3"/><path d="M80 100L240 200 M130 135L190 175" stroke="#fff" stroke-opacity=".6" stroke-dasharray="4 3"/><circle cx="80" cy="100" r="2.5" fill="#fff"/><circle cx="240" cy="100" r="2.5" fill="#fff"/><circle cx="240" cy="200" r="2.5" fill="#fff"/><circle cx="80" cy="200" r="2.5" fill="#fff"/><circle cx="160" cy="40" r="2.5" fill="#fff"/><circle cx="130" cy="135" r="2.5" fill="#fff"/><circle cx="190" cy="135" r="2.5" fill="#fff"/><circle cx="190" cy="175" r="2.5" fill="#fff"/><circle cx="130" cy="175" r="2.5" fill="#fff"/></g><text x="636" y="120" font-size="13">Roof: Z=4 m</text><text x="636" y="208" font-size="13">Wall: Z=4 m</text><text x="636" y="260" font-size="13">Window: Z=3.8 m</text><text x="42" y="345" font-size="12">Five triangles</text><text x="42" y="365" font-size="12">Nine vertices</text></g></svg>
