<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Liang–Barsky interval intersection</title><desc id="desc">A segment parameter initially ranges from zero to one. The entering left plane imposes a lower bound of one quarter and the exiting right plane imposes an upper bound of three quarters, leaving a closed interval.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="28" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Liang–Barsky interval intersection</text><rect x="25" y="80" width="1030" height="415" rx="10" fill="#edf3ef"/><line x1="100" y1="112" x2="100" y2="440" stroke="#d0dfd5" stroke-width="1" /><text x="90" y="466" font-family="sans-serif" font-size="13" fill="#345c65">0</text><line x1="320" y1="112" x2="320" y2="440" stroke="#d0dfd5" stroke-width="1" /><text x="310" y="466" font-family="sans-serif" font-size="13" fill="#345c65">0.25</text><line x1="540" y1="112" x2="540" y2="440" stroke="#d0dfd5" stroke-width="1" /><text x="530" y="466" font-family="sans-serif" font-size="13" fill="#345c65">0.5</text><line x1="760" y1="112" x2="760" y2="440" stroke="#d0dfd5" stroke-width="1" /><text x="750" y="466" font-family="sans-serif" font-size="13" fill="#345c65">0.75</text><line x1="980" y1="112" x2="980" y2="440" stroke="#d0dfd5" stroke-width="1" /><text x="970" y="466" font-family="sans-serif" font-size="13" fill="#345c65">1</text><text x="100" y="128" font-family="sans-serif" font-size="15" fill="#819b93">Original parameter interval</text><line x1="100" y1="145" x2="980" y2="145" stroke="#819b93" stroke-width="7" /><circle cx="100" cy="145" r="5" fill="#819b93"/><circle cx="980" cy="145" r="5" fill="#819b93"/><text x="100" y="213" font-family="sans-serif" font-size="15" fill="#b47850">Left plane: s ≥ 1/4</text><line x1="320" y1="230" x2="980" y2="230" stroke="#b47850" stroke-width="7" /><circle cx="320" cy="230" r="5" fill="#b47850"/><circle cx="980" cy="230" r="5" fill="#b47850"/><text x="100" y="298" font-family="sans-serif" font-size="15" fill="#507ca8">Right plane: s ≤ 3/4</text><line x1="100" y1="315" x2="760" y2="315" stroke="#507ca8" stroke-width="7" /><circle cx="100" cy="315" r="5" fill="#507ca8"/><circle cx="760" cy="315" r="5" fill="#507ca8"/><text x="100" y="383" font-family="sans-serif" font-size="15" fill="#377f6b">Intersection: [1/4,3/4]</text><line x1="320" y1="400" x2="760" y2="400" stroke="#377f6b" stroke-width="7" /><circle cx="320" cy="400" r="5" fill="#377f6b"/><circle cx="760" cy="400" r="5" fill="#377f6b"/><text x="28" y="530" font-family="sans-serif" font-size="13" fill="#345c65">For A=(-5,5), B=(15,5), the other two planes impose no additional bound. Endpoint equality is permitted.</text></svg>