<svg xmlns="http://www.w3.org/2000/svg" width="840" height="380" viewBox="0 0 840 380" role="img"><title>A saturated code gives an inequality</title><desc>For gain 0.5 and black offset 64, a maximum code of 255 is reached at 382 electrons. Larger signals map to the same output in this noiseless model.</desc><rect width="840" height="380" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149"><text x="30" y="32" font-size="23" text-anchor="start" fill="#153149" font-weight="bold">A saturated code gives an inequality</text><line x1="105" y1="95" x2="105" y2="300" stroke="#657c90" stroke-width="2"/><line x1="105" y1="300" x2="695" y2="300" stroke="#657c90" stroke-width="2"/><line x1="105" y1="300" x2="105" y2="306" stroke="#657c90" stroke-width="2"/><text x="105" y="323" font-size="13" text-anchor="middle" fill="#153149">0</text><line x1="252.5" y1="300" x2="252.5" y2="306" stroke="#657c90" stroke-width="2"/><text x="252.5" y="323" font-size="13" text-anchor="middle" fill="#153149">200</text><line x1="386.725" y1="300" x2="386.725" y2="306" stroke="#657c90" stroke-width="2"/><text x="386.725" y="323" font-size="13" text-anchor="middle" fill="#153149">382</text><line x1="547.5" y1="300" x2="547.5" y2="306" stroke="#657c90" stroke-width="2"/><text x="547.5" y="323" font-size="13" text-anchor="middle" fill="#153149">600</text><line x1="695" y1="300" x2="695" y2="306" stroke="#657c90" stroke-width="2"/><text x="695" y="323" font-size="13" text-anchor="middle" fill="#153149">800</text><line x1="105" y1="300" x2="695" y2="300" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="304" font-size="13" text-anchor="end" fill="#153149">0</text><line x1="105" y1="249.53846153846155" x2="695" y2="249.53846153846155" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="253.53846153846155" font-size="13" text-anchor="end" fill="#153149">64</text><line x1="105" y1="199.0769230769231" x2="695" y2="199.0769230769231" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="203.0769230769231" font-size="13" text-anchor="end" fill="#153149">128</text><line x1="105" y1="148.6153846153846" x2="695" y2="148.6153846153846" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="152.6153846153846" font-size="13" text-anchor="end" fill="#153149">192</text><line x1="105" y1="98.94230769230768" x2="695" y2="98.94230769230768" stroke="#dbe5ea" stroke-width="1"/><text x="96" y="102.94230769230768" font-size="13" text-anchor="end" fill="#153149">255</text><text x="400" y="353" font-size="15" text-anchor="middle" fill="#153149">Ideal signal (electrons)</text><text x="105" y="80" font-size="14" text-anchor="start" fill="#153149">Digital code (DN)</text><polyline points="105,249.53846153846155 386.725,98.94230769230768 695,98.94230769230768" fill="none" stroke="#087fa0" stroke-width="2.8" stroke-linejoin="round"/><circle cx="105" cy="249.53846153846155" r="4" fill="#087fa0"/><circle cx="386.725" cy="98.94230769230768" r="4" fill="#087fa0"/><circle cx="695" cy="98.94230769230768" r="4" fill="#087fa0"/><line x1="115" y1="52" x2="136" y2="52" stroke="#087fa0" stroke-width="3"/><text x="142" y="57" font-size="13" text-anchor="start" fill="#153149">Reported code</text></g></svg>
