<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
<title id="title">One house outline under four different affine maps</title>
<desc id="desc">Four panels show the same asymmetric paper house under identity, a translation by world (1,-0.5), a horizontal shear of factor 0.6, and reflection across the vertical y axis. The local house's vertex coordinates are unchanged. A labeled determinant indicates identity plus one, translation plus one, shear plus one, and reflection minus one. All panels use Cartesian y up, not image pixel y down.</desc>
<defs>
  <g id="house" fill="none" stroke-linejoin="round" stroke-linecap="round" stroke-width=".05">
    <polygon points="-1,0 1,0 1,1 -1,1" fill="#cfe8dd" stroke="#27786f"/>
    <polygon points="-1.15,1 -.3,2.1 1.1,1" fill="#e4bba7" stroke="#a35c49"/>
    <rect x=".25" y=".05" width=".45" height=".7" fill="#f8f5ee" stroke="#637c77" stroke-width=".035"/>
    <rect x="-.7" y=".45" width=".55" height=".38" fill="#bcd9eb" stroke="#4e879b" stroke-width=".035"/>
  </g>
</defs>
<rect width="960" height="400" fill="#fbfaf6" rx="20"/>
<text x="35" y="39" font-size="23" font-family="sans-serif" font-weight="600" fill="#284552">One house, four instructions</text>
<text x="35" y="59" font-size="13" font-family="sans-serif" fill="#677a7e">Coordinates in metres; original local corners are identical in every panel</text>
<g fill="#f0f4f0" stroke="#dce6df" stroke-width="1">
<rect x="24" y="80" width="213" height="279" rx="12"/>
<rect x="257" y="80" width="213" height="279" rx="12"/>
<rect x="490" y="80" width="213" height="279" rx="12"/>
<rect x="723" y="80" width="213" height="279" rx="12"/>
</g>
<g font-family="sans-serif" font-size="17" fill="#31535d" font-weight="600">
<text x="43" y="106">Identity</text>
<text x="276" y="106">Translate (+1, −0.5)</text>
<text x="509" y="106">Horizontal shear</text>
<text x="742" y="106">Mirror across Y</text>
</g>
<g font-family="monospace" font-size="13" fill="#687d82">
<text x="43" y="336">det = +1</text>
<text x="276" y="336">det = +1</text>
<text x="509" y="336">det = +1</text>
<text x="742" y="336">det = −1</text>
</g>
<g stroke="#b7c8cb" stroke-width="1.2">
<path d="M43 272 H216 M132 125 V315"/>
<path d="M276 272 H449 M365 125 V315"/>
<path d="M509 272 H682 M598 125 V315"/>
<path d="M742 272 H915 M831 125 V315"/>
</g>
<!-- SVG's scale(40,-40) converts the WORLD +Y-up toy units into image
     +y-down screen coordinates. Nested maps operate before this flip. -->
<g transform="translate(132 272) scale(40 -40)">
  <use href="#house"/>
</g>
<g transform="translate(365 272) scale(40 -40)">
  <g transform="translate(1 -0.5)"><use href="#house"/></g>
</g>
<g transform="translate(598 272) scale(40 -40)">
  <g transform="matrix(1 0 .6 1 0 0)"><use href="#house"/></g>
</g>
<g transform="translate(831 272) scale(40 -40)">
  <g transform="scale(-1 1)"><use href="#house"/></g>
</g>
<text x="34" y="382" font-size="13" font-family="sans-serif" fill="#63777d">Translation preserves shape. Shear preserves area, not angles. Reflection reverses winding.</text>
</svg>