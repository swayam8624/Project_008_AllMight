<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" role="img"><title>From light to a stored number</title><desc>Five stages from scene light through electrons to digital codes. Each stage has different units; losses cannot be reversed by increasing later values.</desc><rect width="840" height="400" fill="#f8fbfd"/><g font-family="sans-serif" fill="#153149" font-size="15"><text x="36" y="42" font-size="23" font-weight="bold" fill="#153149">From light to a stored number</text><rect x="25" y="126" width="142" height="115" rx="8" fill="#e2f1f5" stroke="#167b90"/><text x="96" y="165" text-anchor="middle" font-size="13" font-weight="bold">Scene radiance</text><text x="96" y="192" text-anchor="middle">W/(m² sr)</text><path d="M168 183h18m-6 -5l6 5 -6 5" fill="none" stroke="#167b90" stroke-width="2"/><rect x="188" y="126" width="142" height="115" rx="8" fill="#e2f1f5" stroke="#167b90"/><text x="259" y="165" text-anchor="middle" font-size="13" font-weight="bold">Sensor irradiance</text><text x="259" y="192" text-anchor="middle">W/m²</text><path d="M331 183h18m-6 -5l6 5 -6 5" fill="none" stroke="#167b90" stroke-width="2"/><rect x="351" y="126" width="142" height="115" rx="8" fill="#e2f1f5" stroke="#167b90"/><text x="422" y="165" text-anchor="middle" font-size="13" font-weight="bold">Incident photons</text><text x="422" y="192" text-anchor="middle">expected count</text><path d="M494 183h18m-6 -5l6 5 -6 5" fill="none" stroke="#167b90" stroke-width="2"/><rect x="514" y="126" width="142" height="115" rx="8" fill="#e2f1f5" stroke="#167b90"/><text x="585" y="165" text-anchor="middle" font-size="13" font-weight="bold">Collected charge</text><text x="585" y="192" text-anchor="middle">electrons</text><path d="M657 183h18m-6 -5l6 5 -6 5" fill="none" stroke="#167b90" stroke-width="2"/><rect x="677" y="126" width="142" height="115" rx="8" fill="#e2f1f5" stroke="#167b90"/><text x="748" y="165" text-anchor="middle" font-size="13" font-weight="bold">ADC code</text><text x="748" y="192" text-anchor="middle">DN</text><text x="420" y="285" text-anchor="middle">Lens → integrate area and time → quantum efficiency → full well, read noise, gain and ADC</text><text x="420" y="321" text-anchor="middle" fill="#536a78">Each stage has different units and can discard information.</text></g></svg>
