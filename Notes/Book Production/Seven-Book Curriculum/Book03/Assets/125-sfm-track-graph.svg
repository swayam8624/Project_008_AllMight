<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Tracks link measurements to landmarks</title><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Tracks link measurements to landmarks</text><rect x="85" y="85" width="130" height="50" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="150" y="115" text-anchor="middle">Camera 1</text><rect x="355" y="85" width="130" height="50" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="420" y="115" text-anchor="middle">Camera 2</text><rect x="625" y="85" width="130" height="50" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="690" y="115" text-anchor="middle">Camera 3</text><circle cx="230" cy="300" r="26" fill="#f4e4ce" stroke="#a66420"/><text x="230" y="305" text-anchor="middle">X1</text><circle cx="420" cy="300" r="26" fill="#f4e4ce" stroke="#a66420"/><text x="420" y="305" text-anchor="middle">X2</text><circle cx="610" cy="300" r="26" fill="#f4e4ce" stroke="#a66420"/><text x="610" y="305" text-anchor="middle">X3</text><path d="M150 135L230 274" stroke="#167b90" stroke-width="2"/><path d="M150 135L420 274" stroke="#167b90" stroke-width="2"/><path d="M420 135L230 274" stroke="#167b90" stroke-width="2"/><path d="M420 135L420 274" stroke="#167b90" stroke-width="2"/><path d="M420 135L610 274" stroke="#167b90" stroke-width="2"/><path d="M690 135L420 274" stroke="#167b90" stroke-width="2"/><path d="M690 135L610 274" stroke="#167b90" stroke-width="2"/><text x="420" y="380" text-anchor="middle">Each edge carries a measured pixel, not a new independent point.</text></g></svg>
