<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Axis-angle: rotate only the perpendicular component</title><desc id="desc">Vector (3,4,5) turns to (-4,3,5) under a positive quarter turn about Z.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="29" y="40" font-family="sans-serif" font-size="23" fill="#284e58">Axis-angle: rotate only the perpendicular component</text><rect x="24" y="92" width="670" height="389" rx="12" fill="#edf3ef"/><rect x="713" y="92" width="342" height="389" rx="12" fill="#edf3ef"/><line x1="310" y1="430" x2="310" y2="178" stroke="#7c9696" stroke-width="2" /><text x="320" y="180" font-family="sans-serif" font-size="15" fill="#355d65">axis +Z</text><line x1="310" y1="430" x2="354" y2="486" stroke="#88a99d" stroke-width="2" /><line x1="310" y1="430" x2="118" y2="472" stroke="#88a99d" stroke-width="2" /><line x1="354" y1="486" x2="354" y2="306" stroke="#9bb1a8" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="118" y1="472" x2="118" y2="292" stroke="#9bb1a8" stroke-width="1.6" stroke-dasharray="5 5"/><line x1="310" y1="430" x2="310" y2="250" stroke="#527eaa" stroke-width="4" /><line x1="310" y1="250" x2="354" y2="306" stroke="#b7794f" stroke-width="4" /><line x1="310" y1="250" x2="118" y2="292" stroke="#3b8974" stroke-width="4" /><line x1="310" y1="430" x2="354" y2="306" stroke="#b7794f" stroke-width="2" /><line x1="310" y1="430" x2="118" y2="292" stroke="#3b8974" stroke-width="2" /><circle cx="354" cy="306" r="6" fill="#b7794f" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="118" cy="292" r="6" fill="#3b8974" stroke="#fbfaf7" stroke-width="1.5"/><text x="361" y="297" font-family="sans-serif" font-size="15" fill="#355d65">v</text><text x="100" y="282" font-family="sans-serif" font-size="15" fill="#355d65">v′</text><text x="318" y="238" font-family="sans-serif" font-size="14" fill="#355d65">parallel</text><text x="732" y="133" font-family="sans-serif" font-size="18" fill="#355d65">Independent components</text><text x="732" y="183" font-family="sans-serif" font-size="15" fill="#355d65">v∥ = (0,0,5)</text><text x="732" y="217" font-family="sans-serif" font-size="15" fill="#355d65">v⊥ = (3,4,0)</text><text x="732" y="258" font-family="sans-serif" font-size="15" fill="#355d65">R v⊥ = (−4,3,0)</text><text x="732" y="304" font-family="sans-serif" font-size="17" fill="#355d65">v′ = (−4,3,5)</text><text x="732" y="356" font-family="sans-serif" font-size="14" fill="#355d65">Both squared lengths = 50</text><text x="29" y="529" font-family="sans-serif" font-size="14" fill="#355d65">The axis component stays fixed; the perpendicular component rotates by 90°.</text></svg>