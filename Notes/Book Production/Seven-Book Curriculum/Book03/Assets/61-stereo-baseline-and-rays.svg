<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc"><title id="title">Two cameras, one baseline and two rays</title><desc id="desc">Two aligned cameras have a known horizontal baseline and observe a common point. The separate image measurements give disparity twenty pixels and axial depth four metres for focal scale 400 and baseline 0.2.</desc><rect width="1080" height="560" rx="16" fill="#fbfaf7"/><text x="29" y="40" font-family="sans-serif" font-size="23" fill="#294e58">Two cameras, one baseline and two rays</text><rect x="25" y="82" width="680" height="407" rx="12" fill="#edf3ef"/><rect x="725" y="82" width="330" height="407" rx="12" fill="#edf3ef"/><line x1="185" y1="440" x2="510" y2="115" stroke="#3b8574" stroke-width="3" /><line x1="405" y1="440" x2="510" y2="115" stroke="#b47850" stroke-width="3" /><line x1="185" y1="440" x2="405" y2="440" stroke="#517da5" stroke-width="3" /><line x1="70" y1="352.25" x2="660" y2="352.25" stroke="#9eb6ad" stroke-width="2" /><line x1="185" y1="440" x2="185" y2="115" stroke="#9db6ad" stroke-width="1.4" stroke-dasharray="5 4"/><line x1="185" y1="115" x2="510" y2="115" stroke="#9db6ad" stroke-width="1.4" stroke-dasharray="5 4"/><circle cx="185" cy="440" r="6" fill="#367f6e" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="405" cy="440" r="6" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="510" cy="115" r="6" fill="#367f6e" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="272.75" cy="352.25" r="6" fill="#367f6e" stroke="#fbfaf7" stroke-width="1.5"/><circle cx="433.35" cy="352.25" r="6" fill="#b47850" stroke="#fbfaf7" stroke-width="1.5"/><text x="155" y="468" font-family="sans-serif" font-size="14" fill="#365e65">C_L</text><text x="375" y="468" font-family="sans-serif" font-size="14" fill="#365e65">C_R</text><text x="270" y="431" font-family="sans-serif" font-size="14" fill="#365e65">B</text><text x="520" y="110" font-family="sans-serif" font-size="14" fill="#365e65">P</text><text x="123" y="270" font-family="sans-serif" font-size="14" fill="#365e65">Z</text><text x="750" y="125" font-family="sans-serif" font-size="18" fill="#365e65">Aligned optical frames</text><text x="750" y="181" font-family="sans-serif" font-size="20" fill="#365e65">uL − uR = fB/Z</text><text x="750" y="233" font-family="sans-serif" font-size="15" fill="#365e65">f = 400 px; B = 0.2 m</text><text x="750" y="278" font-family="sans-serif" font-size="15" fill="#365e65">uL = 420, uR = 400</text><text x="750" y="325" font-family="sans-serif" font-size="17" fill="#365e65">δ = 20 pixels</text><text x="750" y="377" font-family="sans-serif" font-size="20" fill="#287b69">Z = 4 metres</text><text x="29" y="531" font-family="sans-serif" font-size="13" fill="#365e65">Top-view schematic, not metrically scaled. Each image has its own local origin.</text></svg>