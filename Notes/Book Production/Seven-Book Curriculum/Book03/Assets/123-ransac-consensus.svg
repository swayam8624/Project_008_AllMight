<svg xmlns="http://www.w3.org/2000/svg" width="840" height="410" viewBox="0 0 840 410" role="img"><title>Appearance proposes; geometry checks</title><desc>Appearance proposes matching features; a model estimated from samples rejects many inconsistent candidates. Incorrect matches can nevertheless pass the residual threshold.</desc><rect width="840" height="410" fill="#f8fbfd"/><g font-family="sans-serif" font-size="15" fill="#153149"><text x="32" y="38" font-size="23" font-weight="bold">Appearance proposes; geometry checks</text><rect x="65" y="72" width="100" height="250" fill="#fff" stroke="#536b8b"/><rect x="340" y="72" width="100" height="250" fill="#fff" stroke="#536b8b"/><circle cx="115" cy="105" r="5" fill="#153149"/><circle cx="390" cy="110" r="5" fill="#153149"/><path d="M115 105L390 110" stroke="#167b90" stroke-width="2"/><circle cx="115" cy="152" r="5" fill="#153149"/><circle cx="390" cy="157" r="5" fill="#153149"/><path d="M115 152L390 157" stroke="#167b90" stroke-width="2"/><circle cx="115" cy="199" r="5" fill="#153149"/><circle cx="390" cy="204" r="5" fill="#153149"/><path d="M115 199L390 204" stroke="#167b90" stroke-width="2"/><circle cx="115" cy="246" r="5" fill="#153149"/><circle cx="390" cy="251" r="5" fill="#153149"/><path d="M115 246L390 251" stroke="#167b90" stroke-width="2"/><circle cx="115" cy="293" r="5" fill="#153149"/><circle cx="390" cy="298" r="5" fill="#153149"/><path d="M115 293L390 298" stroke="#167b90" stroke-width="2"/><path d="M115 105L390 298 M115 246L390 110" stroke="#c88033" stroke-dasharray="6 4" stroke-width="2"/><path d="M465 197h70m-8 -6l8 6 -8 6" fill="none" stroke="#536b8b" stroke-width="2"/><rect x="548" y="107" width="250" height="180" rx="8" fill="#e3f2f5" stroke="#167b90"/><text x="673" y="140" text-anchor="middle" font-weight="bold">Candidate consensus</text><text x="570" y="175">1. Sample eight pairs</text><text x="570" y="204">2. Estimate F</text><text x="570" y="233">3. Score every pair</text><text x="570" y="262">4. Refit and rescore</text><text x="250" y="345" text-anchor="middle" fill="#c88033">Dashed = incorrect proposals</text><text x="420" y="387" text-anchor="middle">Schematic: model agreement does not prove identity.</text></g></svg>
