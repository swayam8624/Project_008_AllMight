          - code [ref=e92]: sizeof(char)
          - text: is one, while
          - code [ref=e93]: CHAR_BIT
          - text: tells how many bits that unit contains. The concrete file formats here require
          - code [ref=e94]: CHAR_BIT == 8
          - text: . A
          - strong [ref=e95]: word
