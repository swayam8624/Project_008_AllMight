  - paragraph [ref=e7]: "The volume begins with a saved material appearing correctly after an editor is reopened, then traces the agreements that make that possible: interpretation, representation, storage, identity, and ownership. This chapter establishes the byte-level vocabulary and numeric contracts that later chapters rely on."
  - paragraph [ref=e8]:
    - strong [ref=e9]: "By the end:"
    - text: Explain how state moves from external bytes through interpretation and representation into valid storage, and distinguish a value’s meaning from its encoding.
  - paragraph [ref=e10]:
    - strong [ref=e11]: "Recall question:"
    - text: Trace one material value from file bytes to the running renderer; at which boundary can the same bytes acquire a different meaning?
  - generic [ref=e12]:
    - heading "Computing Foundations — From Bits to C++ and Systems APIs" [level=3] [ref=e13]
    - generic [ref=e14]:
      - heading "One byte travels from a file to a running world" [level=4] [ref=e15]
      - paragraph [ref=e16]: Imagine a small editor with a metal panel in its viewport. You change the panel’s material, save the scene, close the editor, and reopen it. The surface looks the same. That simple result depends on several different agreements.
      - paragraph [ref=e17]: The scene file must encode a stable material reference. The importer must recognize the referenced source asset and produce a usable runtime artifact. The executable must contain compatible code for reading that artifact. A resource manager must keep the uploaded texture alive while the renderer uses it. The panel’s entity identifier must continue to name the intended entity even if component storage moves.
      - paragraph [ref=e18]: "We will follow this single journey through the combined foundations volume. First we establish how bits encode values and how arithmetic can change their meaning. Then we establish how a C++ program gives objects types, lifetimes, and ownership. Finally we explain how modules, APIs, builds, and persistent formats let independently developed pieces agree. The graphics and engine books use those agreements to answer their own questions: what does the scene look like, and how does the running world change?"
      - paragraph [ref=e19]:
        - text: An
        - strong [ref=e20]: agreement
        - text: here is a set of assumptions that two pieces of a system must share. Some agreements are checked by the compiler. Others are checked by a file reader, a runtime assertion, a synchronization rule, or a test. A system becomes easier to debug when each agreement has an identifiable owner and an observable failure.
      - paragraph [ref=e21]:
        - img "Diagram" [ref=e22]
      - paragraph [ref=e23]: This is why the byte story and the C++ story belong in one book. A hexadecimal dump can show the bytes of a handle, but it cannot prove the handle still names a live entity. An address can identify storage, but it cannot by itself establish that a suitable object occupies that storage. A successful function call can submit GPU work, but it does not mean that the GPU has finished reading the submitted resource.
      - generic [ref=e24]:
        - heading "Give every identifier a scope" [level=5] [ref=e25]
        - paragraph [ref=e26]:
          - text: Suppose a scene saves the integer
          - code [ref=e27]: "17"
          - text: as its material reference. During the next run, slot 17 may hold a completely different texture. The integer has survived; its meaning has not.
        - paragraph [ref=e28]:
          - text: A
          - strong [ref=e29]: persistent identifier
          - text: is intended to survive processes and saves. A
          - strong [ref=e30]: runtime handle
          - text: identifies an object inside a particular runtime’s management scheme. A
          - strong [ref=e31]: pointer
          - text: gives an address with language-level rules about what may be accessed there. A
          - strong [ref=e32]: dense index
          - text: identifies a position in a storage arrangement that may change. These are different jobs even when all four happen to use integers internally.
        - paragraph [ref=e33]: For example, the saved panel may contain a stable asset identifier. The asset database resolves that identifier to an imported artifact. The runtime cache loads the artifact and returns a generational texture handle. A rendering pass resolves that handle into a backend resource reference while enforcing the manager’s lifetime rules. The draw packet need not expose the scene’s persistent identifier or the manager’s entire internal table.
        - paragraph [ref=e34]: Here is the complete failure trace to keep in mind. An editor command records a pointer into a component vector. Another edit grows that vector. The command later dereferences its old pointer. Even if the entity itself remains alive, the pointer’s storage contract has failed. Recording an entity handle and resolving the component when the command executes can avoid that particular relocation problem. It does not solve concurrent destruction, generation wrap, or an API that returns another unprotected pointer. Each step still needs a stated validity interval.
        - paragraph [ref=e35]:
          - link "Object layout" [ref=e36] [cursor=pointer]:
            - /url: ch090.xhtml#appendix-c4ac6bb0fff8-abi-and-object-layout
          - text: helps explain how a value is represented.
          - link "Resource ownership" [ref=e37] [cursor=pointer]:
            - /url: ch061.xhtml#appendix-69739d3ab49b-raii-and-resource-handles
          - text: explains who is responsible for keeping an object usable. The engine volume extends the same reasoning to entity identity, component relocation, asset publication, and asynchronous work.
