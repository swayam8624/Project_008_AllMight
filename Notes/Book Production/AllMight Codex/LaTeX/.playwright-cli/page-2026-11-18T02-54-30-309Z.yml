        - paragraph [ref=e73]: Suppose a machine must remember whether a lamp is on. It needs two reliably distinguishable states, not necessarily the symbols “0” and “1.” A closed/open switch, a charged/discharged storage element, or two ranges of voltage can represent the distinction.
        - blockquote [ref=e74]:
          - paragraph [ref=e75]: The engineer defines which physical condition means which logical state.
        - paragraph [ref=e76]: "Now ask the same machine to remember a count. One yes/no state is not enough. Combine independent states: two bits distinguish four patterns, three distinguish eight, and eight distinguish 256. To interpret a pattern as a number or character, give it an encoding rule."
        - blockquote [ref=e77]:
          - paragraph [ref=e78]:
            - strong [ref=e79]: Encoding
            - text: is the agreed mapping from meaning to representation;
            - strong [ref=e80]: decoding
            - text: is the reverse operation.
        - paragraph [ref=e81]:
          - text: Binary is useful because broad low/high signal ranges can be distinguished despite small disturbances. It is not a claim that physics has only two possible values, or that computers cannot process decimal numbers. The digital abstraction deliberately ignores small differences within each permitted range. That tolerance is a
          - strong [ref=e82]: noise margin
          - text: ": room for a disturbance without changing the logical interpretation. Exact voltage thresholds depend on the circuit; the examples here do not prescribe a CPU’s supply voltage."
      - generic [ref=e83]:
