        - paragraph [ref=e85]:
          - text: The word
          - strong [ref=e86]: byte
          - text: grew out of early computer design, where convenient groups of bits were used for characters and transfers; it was not eternally defined as eight bits. The Computer History Museum associates the term with Werner Buchholz and describes earlier six-bit groupings as well as eight-bit usage. This history matters because a unit name can reflect an engineering convention rather than a mathematical necessity.
          - 'link "Computer History Museum: Werner Buchholz" [ref=e87] [cursor=pointer]':
            - /url: https://www.computerhistory.org/tdih/october/24/
        - paragraph [ref=e88]:
          - text: IBM’s System/360, introduced in 1964, made the eight-bit byte part of an influential compatible computer family. Compatibility meant that software could target an architectural contract across members of that family, rather than be rewritten for every new machine. Eight-bit grouping became an enduring convention, not a law saying that every useful processor operation must be eight bits wide.
          - 'link "IBM: System/360 history" [ref=e89] [cursor=pointer]':
            - /url: https://www.ibm.com/history/system-360
        - paragraph [ref=e90]:
