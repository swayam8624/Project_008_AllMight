      - paragraph [ref=f1e955]: This supplement extends the camera material. It assumes the existing convention choices for coordinates, projection, and image sampling; symbols below are local to each section. The main theme is that a camera pipeline produces more than coordinates. It also makes discrete decisions, estimates unknown parameters from incomplete evidence, and maps finite pixel regions into geometric regions.
    - generic [ref=f1e956]:
      - heading "Relationship to existing Phase 11 material" [level=4] [ref=f1e957]
      - paragraph [ref=f1e958]: "These additions attach to existing topics rather than duplicating them: robust predicates extend numerical error and clipping; calibration observability extends intrinsics/extrinsics and lens distortion; ray footprints extend screen-space ray generation and camera sampling. The TUM video index remains a lead for a later captioned study, not an evidence source here."
      - paragraph [ref=f1e959]: "Two reconstructions can fit exactly the same image measurements and still describe different 3D worlds. The reason is that cameras measure directions and relative alignments; they do not automatically provide a ruler, and an uncalibrated camera does not even provide the same Euclidean coordinate structure. A useful reconstruction method therefore begins by asking three questions: which observations are being fitted, which physical quantities are held fixed, and what transformations leave every observation unchanged?"
