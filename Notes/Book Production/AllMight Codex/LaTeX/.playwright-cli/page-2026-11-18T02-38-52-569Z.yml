      - paragraph [ref=f1e197]: The story proceeds from a model of uncertainty, through random quantities and their distributions, into moments and covariance geometry. Those laws then guide how deterministic computers generate samples, how sampling transformations change probability measures, and how weighted averages estimate rendering integrals. The final chapters ask what finite observations can establish, how to calculate their statistics stably, and how to distinguish random variation from systematic error.
