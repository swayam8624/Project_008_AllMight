        - strong [ref=f1e5806]: world
        - text: inverse inertia, while its body-space inertia remains fixed. Finally, reducing
        - code [ref=f1e5807]: h
        - text: while holding the physical scenario constant should expose numerical convergence or non-convergence—not an unexplained change of physical laws.
